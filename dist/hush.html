  'vaultSafe', 'sewer', 'gas', 'rot', 'moving', 'lab', 'mech',
];

function mapNode(id) {
  return MAPS[id] || MAPS.room;
}

// ---- src/worldgen.js ----
// Map generators for the redesigned world.
//
//   room  — the starting map: one big rectangle split by walls into rooms with
//           doorways, no corridors. Key in the middle, three far corners hold
//           the maze exit, the castle door sits on the middle of one side and
//           the meadow exit is a sound-absorbing wall.
//   maze  — narrow one-tile corridors with the occasional 3x3 / 4x4 pocket.
//
// Everything works on whole tiles; the game converts to pixels with TILE.
// (duplicate TILE removed by the bundler)

// (duplicate ri removed by the bundler)
const at = (w, x, y) => y * w + x;

function solid(grid, w, h, x, y) {
  if (x < 0 || y < 0 || x >= w || y >= h) return true;
  return grid[y * w + x] === 1;
}

function fill(grid, w, x0, y0, x1, y1, v) {
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) grid[y * w + x] = v;
  }
}

function reachable(grid, w, h, sx, sy) {
  const seen = new Uint8Array(w * h);
  const q = [sx, sy];
  seen[at(w, sx, sy)] = 1;
  while (q.length) {
    const y = q.pop();
    const x = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx;
      const ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const i = at(w, nx, ny);
      if (seen[i] || grid[i] === 1) continue;
      seen[i] = 1;
      q.push(nx, ny);
    }
  }
  return seen;
}

function floorCount(grid, w, h) {
  let n = 0;
  for (let i = 0; i < w * h; i++) if (grid[i] === 0) n++;
  return n;
}

function centerOf(r) {
  return { x: r.x + (r.w >> 1), y: r.y + (r.h >> 1) };
}

// ---------------------------------------------------------------- room map --

function splitRooms(rnd, box, depth, rooms) {
  const minW = 9;
  const minH = 7;
  const canV = box.w >= minW * 2 + 1;
  const canH = box.h >= minH * 2 + 1;
  if (depth <= 0 || (!canV && !canH)) {
    rooms.push(box);
    return;
  }
  const vertical = canV && (!canH || box.w > box.h || (box.w === box.h && rnd() < 0.5));
  if (vertical) {
    const cut = ri(rnd, minW, box.w - minW - 1);
    const wall = box.x + cut;
    rooms.push({ ...box, wallX: wall, split: 'v' });
    // the two halves are recorded by the caller through this marker
    splitRooms(rnd, { x: box.x, y: box.y, w: cut, h: box.h }, depth - 1, rooms);
    splitRooms(rnd, { x: wall + 1, y: box.y, w: box.w - cut - 1, h: box.h }, depth - 1, rooms);
  } else {
    const cut = ri(rnd, minH, box.h - minH - 1);
    const wall = box.y + cut;
    rooms.push({ ...box, wallY: wall, split: 'h' });
    splitRooms(rnd, { x: box.x, y: box.y, w: box.w, h: cut }, depth - 1, rooms);
    splitRooms(rnd, { x: box.x, y: wall + 1, w: box.w, h: box.h - cut - 1 }, depth - 1, rooms);
  }
}

/**
 * The starting map. Rooms touch each other, separated by one-tile walls with
 * two-tile doorways, so the whole rectangle is one connected space.
 */
function buildRoomMap(seed) {
  const rnd = mulberry32(seed);
  const w = 76;
  const h = 52;
  const grid = new Uint8Array(w * h);
  fill(grid, w, 0, 0, w - 1, h - 1, 1);
  fill(grid, w, 1, 1, w - 2, h - 2, 0);

  // --- 1. walls first: recursively split the big rectangle -----------------
  const boxes = [];
  const walls = [];
  const walk = (x, y, ww, hh, depth) => {
    const canV = ww >= 15;
    const canH = hh >= 13;
    if (depth <= 0 || (!canV && !canH)) {
      boxes.push({ x, y, w: ww, h: hh });
      return;
    }
    const vertical = canV && (!canH || ww > hh * 1.08 || (Math.abs(ww - hh) <= 2 && rnd() < 0.5));
    if (vertical) {
      const lo = Math.max(8, Math.round(ww * 0.34));
      const hi = Math.max(lo, Math.min(ww - 9, Math.round(ww * 0.66)));
      const cut = ri(rnd, lo, hi);
      walls.push({ x: x + cut, y, len: hh, axis: 'v' });
      for (let dy = 0; dy < hh; dy++) grid[at(w, x + cut, y + dy)] = 1;
      walk(x, y, cut, hh, depth - 1);
      walk(x + cut + 1, y, ww - cut - 1, hh, depth - 1);
    } else {
      const lo = Math.max(7, Math.round(hh * 0.34));
      const hi = Math.max(lo, Math.min(hh - 8, Math.round(hh * 0.66)));
      const cut = ri(rnd, lo, hi);
      walls.push({ x, y: y + cut, len: ww, axis: 'h' });
      for (let dx = 0; dx < ww; dx++) grid[at(w, x + dx, y + cut)] = 1;
      walk(x, y, ww, cut, depth - 1);
      walk(x, y + cut + 1, ww, hh - cut - 1, depth - 1);
    }
  };
  walk(1, 1, w - 2, h - 2, 6);

  // --- 2. then punch doorways so the wall network is one open space ---------
  for (const wl of walls) {
    if (wl.axis === 'v') {
      const y0 = wl.y + 2;
      const y1 = wl.y + wl.len - 3;
      if (y1 <= y0) continue;
      const atY = ri(rnd, y0, y1);
      const wide = rnd() < 0.25 ? 3 : 2;
      for (let dy = 0; dy < wide && atY + dy <= y1; dy++) {
        fill(grid, w, wl.x, atY + dy, wl.x, atY + dy, 0);
      }
    } else {
      const x0 = wl.x + 2;
      const x1 = wl.x + wl.len - 3;
      if (x1 <= x0) continue;
      const atX = ri(rnd, x0, x1);
      const wide = rnd() < 0.25 ? 3 : 2;
      for (let dx = 0; dx < wide && atX + dx <= x1; dx++) {
        fill(grid, w, atX + dx, wl.y, atX + dx, wl.y, 0);
      }
    }
  }

  const isFloor = (x, y) => x > 0 && y > 0 && x < w - 1 && y < h - 1 && grid[at(w, x, y)] === 0;

  // --- 3. furnishing: internal wall stubs, never allowed to seal a room -----
  const connected = () => {
    let first = -1;
    for (let i = 0; i < w * h; i++) if (grid[i] === 0) { first = i; break; }
    if (first < 0) return false;
    const seen = new Uint8Array(w * h);
    const q = [first];
    seen[first] = 1;
    let n = 0;
    while (q.length) {
      const i = q.pop();
      n++;
      const x = i % w;
      const y = (i / w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) continue;
        const j = ny * w + nx;
        if (seen[j] || grid[j] !== 0) continue;
        seen[j] = 1;
        q.push(j);
      }
    }
    let total = 0;
    for (let i = 0; i < w * h; i++) if (grid[i] === 0) total++;
    return n === total;
  };

  const decor = (box) => {
    const tiles = [];
    const kind = ri(rnd, 0, 3);
    const innerX0 = box.x + 2;
    const innerX1 = box.x + box.w - 3;
    const innerY0 = box.y + 2;
    const innerY1 = box.y + box.h - 3;
    if (innerX1 - innerX0 < 2 || innerY1 - innerY0 < 2) return tiles;
    if (kind === 0 && box.w >= 11 && box.h >= 9) {
      // a stub hanging off one wall, leaving room on both sides
      const fromTop = rnd() < 0.5;
      const len = ri(rnd, 3, Math.max(3, Math.min(6, (box.h >> 1) - 1)));
      const x = ri(rnd, innerX0 + 1, innerX1 - 1);
      for (let i = 0; i < len; i++) tiles.push([x, fromTop ? box.y + 1 + i : box.y + box.h - 2 - i]);
    } else if (kind === 1 && box.w >= 12) {
      // a free-standing partition with a gap at both ends
      const y = ri(rnd, innerY0, innerY1);
      const len = ri(rnd, 4, Math.max(4, Math.min(9, box.w - 7)));
      const x0 = ri(rnd, innerX0, innerX1 - len);
      for (let i = 0; i < len; i++) tiles.push([x0 + i, y]);
    } else if (kind === 2) {
      // short pillars
      for (let i = 0, n = ri(rnd, 2, 4); i < n; i++) {
        tiles.push([ri(rnd, innerX0, innerX1), ri(rnd, innerY0, innerY1)]);
      }
    } else {
      // an L corner inside the room
      const x = ri(rnd, innerX0 + 1, innerX1 - 3);
      const y = ri(rnd, innerY0 + 1, innerY1 - 3);
      for (let i = 0; i < 3; i++) { tiles.push([x + i, y]); tiles.push([x, y + i]); }
    }
    return tiles;
  };

  const snapshot = new Uint8Array(w * h);
  for (const box of boxes) {
    const passes = rnd() < 0.35 ? 2 : rnd() < 0.85 ? 1 : 0;
    for (let pass = 0; pass < passes; pass++) {
      snapshot.set(grid);
      const tiles = decor(box);
      let touched = false;
      for (const [x, y] of tiles) {
        if (!isFloor(x, y)) continue;
        grid[at(w, x, y)] = 1;
        touched = true;
      }
      if (!touched || !connected()) grid.set(snapshot);
    }
  }

  const spawnBox = boxes.reduce((a, b) => (a.x + a.y <= b.x + b.y ? a : b));
  const spawnC = centerOf(spawnBox);
  const mid = { x: w >> 1, y: h >> 1 };
  const keyBox = boxes.reduce((a, b) => {
    const da = Math.hypot(a.x + a.w / 2 - mid.x, a.y + a.h / 2 - mid.y);
    const db = Math.hypot(b.x + b.w / 2 - mid.x, b.y + b.h / 2 - mid.y);
    return da <= db ? a : b;
  });
  const keyC = centerOf(keyBox);

  // keep the important tiles clean, whatever the furnishing did
  const clearAround = (c, r) => {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const x = c.x + dx;
        const y = c.y + dy;
        if (x > 0 && y > 0 && x < w - 1 && y < h - 1) grid[at(w, x, y)] = 0;
      }
    }
  };
  clearAround(spawnC, 1);
  clearAround(keyC, 1);

  // Three far corners: the maze exit goes into one of them at random.
  const corners = [
    { x: 2, y: h - 3 },
    { x: w - 3, y: 2 },
    { x: w - 3, y: h - 3 },
  ];
  const pickCorner = corners[ri(rnd, 0, 2)];
  const mazeTile = { x: pickCorner.x, y: pickCorner.y };
  const mazeDoor = { x: 1, y: mazeTile.y };
  fill(grid, w, mazeDoor.x, mazeDoor.y, mazeDoor.x, mazeDoor.y, 0);
  clearAround(mazeTile, 1);

  const castleDoor = { x: w - 2, y: h >> 1 };
  const meadowDoor = { x: w >> 1, y: h - 2 };
  fill(grid, w, castleDoor.x, castleDoor.y, castleDoor.x, castleDoor.y, 0);
  fill(grid, w, meadowDoor.x, meadowDoor.y, meadowDoor.x, meadowDoor.y, 0);
  clearAround({ x: castleDoor.x - 1, y: castleDoor.y }, 1);
  clearAround({ x: meadowDoor.x, y: meadowDoor.y - 1 }, 1);

  const absorb = [];
  for (let dx = -1; dx <= 1; dx++) {
    const x = meadowDoor.x + dx;
    if (x >= 0 && x < w) absorb.push(at(w, x, h - 1));
  }

  const rooms = boxes.map((b) => {
    const c = centerOf(b);
    return { x: b.x, y: b.y, w: b.w, h: b.h, cx: c.x, cy: c.y, kind: 'room' };
  });

  // --- 4. props and enemies -------------------------------------------------
  // What sits at a spot is rolled when the player first comes near it
  // (see Game.revealLoot), so no id is chosen here.
  const loot = [];
  const taken = new Set();
  const spotIn = (box) => {
    for (let i = 0; i < 24; i++) {
      const x = ri(rnd, box.x + 1, box.x + box.w - 2);
      const y = ri(rnd, box.y + 1, box.y + box.h - 2);
      const k = y * w + x;
      if (!isFloor(x, y) || taken.has(k)) continue;
      taken.add(k);
      return { x, y };
    }
    return null;
  };
  for (const b of boxes) {
    if (rnd() > 0.42) continue;
    const p = spotIn(b);
    if (!p) continue;
    // Identity is deferred to pickup range; a spot is just a place for now.
    loot.push({ x: p.x, y: p.y });
  }

  const monsters = [];
  const far = shuffle(
    boxes.filter((b) => Math.hypot(centerOf(b).x - spawnC.x, centerOf(b).y - spawnC.y) > 12),
    rnd,
  );
  for (const b of far) {
    if (monsters.length >= 9) break;
    const c = centerOf(b);
    if (monsters.some((m) => Math.hypot(m.x - c.x, m.y - c.y) < 10)) continue;
    if (!isFloor(c.x, c.y)) {
      const p = spotIn(b);
      if (!p) continue;
      monsters.push({ x: p.x, y: p.y, type: 'hunter' });
    } else {
      monsters.push({ x: c.x, y: c.y, type: 'hunter' });
    }
  }

  const standing = (t) => grid[at(w, t.x, t.y)] === 0;
  return {
    mapId: 'room',
    w,
    h,
    tile: TILE,
    size: { w: w * TILE, h: h * TILE },
    grid,
    rooms,
    spawn: { x: spawnC.x * TILE + TILE / 2, y: spawnC.y * TILE + TILE / 2 },
    spawnTile: spawnC,
    key: { x: keyC.x * TILE + TILE / 2, y: keyC.y * TILE + TILE / 2 },
    keyTile: keyC,
    exit: { x: mazeTile.x * TILE + TILE / 2, y: mazeTile.y * TILE + TILE / 2 },
    exitTile: mazeTile,
    exits: [
      { to: 'maze', x: mazeDoor.x, y: mazeDoor.y, require: 'key', color: '127,227,212' },
      { to: 'meadow', x: meadowDoor.x, y: meadowDoor.y, require: null, color: '140,240,170', absorb: true },
      { to: 'castle', x: castleDoor.x, y: castleDoor.y, require: 'castle', color: '255,150,90' },
    ],
    absorb,
    monsters,
    loot,
    seed,
    valid: standing(spawnC) && standing(keyC) && standing(mazeTile),
  };
}

// ---------------------------------------------------------------- maze map --

/**
 * Loot for the maze: 8-10 spots strung along the walk from spawn to exit
 * instead of dropped into a handful of pockets. A spot may stand in the
 * middle of a one-tile corridor — that is a normal place to notice something.
 * What actually sits there is rolled only when the player gets close
 * (Game.revealLoot), so this function only picks the places.
 */
function mazeLoot(rnd, grid, w, h, spawnTile, exitTile, monsters) {
  const open = (x, y) => x >= 0 && y >= 0 && x < w && y < h && grid[y * w + x] === 0;
  const seen = reachable(grid, w, h, spawnTile.x, spawnTile.y);

  // Walk depth from spawn. Bands of depth keep the spots following the route
  // rather than clustering in whichever pocket happens to be widest.
  const dist = new Int32Array(w * h).fill(-1);
  dist[spawnTile.y * w + spawnTile.x] = 0;
  const queue = [spawnTile.x, spawnTile.y];
  let depth = 0;
  while (queue.length) {
    const y = queue.pop();
    const x = queue.pop();
    const d = dist[y * w + x];
    if (d > depth) depth = d;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx;
      const ny = y + dy;
      if (!open(nx, ny)) continue;
      const i = ny * w + nx;
      if (dist[i] >= 0) continue;
      dist[i] = d + 1;
      queue.push(nx, ny);
    }
  }

  // A corridor tile has at most two open neighbours (a straight run or a
  // bend); a pocket centre has three or four.
  const corridor = (x, y) => {
    let n = 0;
    if (open(x + 1, y)) n++;
    if (open(x - 1, y)) n++;
    if (open(x, y + 1)) n++;
    if (open(x, y - 1)) n++;
    return n <= 2;
  };

  const blocked = new Set((monsters || []).map((m) => m.y * w + m.x));
  const usable = (i) => seen[i] && dist[i] >= 5 && !blocked.has(i);
  const farFrom = (p, q, r) => Math.hypot(p.x - q.x, p.y - q.y) >= r;
  const spots = [];
  const taken = new Set();

  const tryPlace = (i, minGap) => {
    if (!usable(i) || taken.has(i)) return null;
    const x = i % w;
    const y = (i / w) | 0;
    if (x === exitTile.x && y === exitTile.y) return null;
    const p = { x, y };
    if (!farFrom(p, spawnTile, 5) || !farFrom(p, exitTile, 4)) return null;
    if (spots.some((s) => !farFrom(p, s, minGap))) return null;
    taken.add(i);
    spots.push(p);
    return p;
  };

  const target = ri(rnd, 8, 10);
  const CORRIDOR_MIN = 3;
  let corridors = 0;

  // 1. One spot per depth band, preferring a corridor tile most of the time
  //    so "in the middle of the path" is the common case, not the exception.
  //    The first few bands insist on corridors until the minimum is met.
  for (let band = 0; band < target; band++) {
    const lo = Math.max(2, Math.floor((depth * band) / target));
    const hi = Math.max(lo, Math.floor((depth * (band + 1)) / target));
    const pool = [];
    for (let i = 0; i < w * h; i++) {
      if (usable(i) && dist[i] >= lo && dist[i] <= hi) pool.push(i);
    }
    for (let i = pool.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const wantCorridor = corridors < CORRIDOR_MIN || rnd() < 0.6;
    // Stable sort keeps the shuffled order inside each group.
    pool.sort((a, b) => Number(corridor(a % w, (a / w) | 0) !== wantCorridor) - Number(corridor(b % w, (b / w) | 0) !== wantCorridor));
    for (const i of pool) {
      const p = tryPlace(i, 5);
      if (!p) continue;
      if (corridor(p.x, p.y)) corridors++;
      break;
    }
  }

  // 2. Bands are a guide, not a quota: widen the net until the promised
  //    8-10 spots stand. Spacing tightens a little to make room.
  if (spots.length < target) {
    const rest = [];
    for (let i = 0; i < w * h; i++) if (usable(i) && !taken.has(i)) rest.push(i);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    for (const i of rest) {
      if (spots.length >= target) break;
      tryPlace(i, 3);
    }
  }

  return spots;
}

/**
 * Narrow maze: one-tile corridors, occasional 3x3 / 4x4 pockets so it never
 * dead-ends into a single blocked tile. Exit sits diagonally opposite spawn.
 */
function buildMazeMap(seed) {
  const rnd = mulberry32(seed);
  const cw = 39;
  const ch = 25;
  const w = cw * 2 + 1;
  const h = ch * 2 + 1;
  const grid = new Uint8Array(w * h);
  fill(grid, w, 0, 0, w - 1, h - 1, 1);

  const seenCell = new Uint8Array(cw * ch);
  const stack = [[0, 0]];
  seenCell[0] = 1;
  fill(grid, w, 1, 1, 1, 1, 0);
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const dirs = shuffle([[1, 0], [-1, 0], [0, 1], [0, -1]], rnd);
    let moved = false;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx;
      const ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= cw || ny >= ch) continue;
      if (seenCell[ny * cw + nx]) continue;
      seenCell[ny * cw + nx] = 1;
      fill(grid, w, cx * 2 + 1 + dx, cy * 2 + 1 + dy, cx * 2 + 1 + dx, cy * 2 + 1 + dy, 0);
      fill(grid, w, nx * 2 + 1, ny * 2 + 1, nx * 2 + 1, ny * 2 + 1, 0);
      stack.push([nx, ny]);
      moved = true;
      break;
    }
    if (!moved) stack.pop();
  }

  // pockets: widen a handful of cells into 3x3 / 4x4 open squares
  const pockets = [];
  for (let i = 0; i < 26; i++) {
    const cx = ri(rnd, 2, cw - 3);
    const cy = ri(rnd, 2, ch - 3);
    const size = rnd() < 0.65 ? 3 : 4;
    const tx = cx * 2;
    const ty = cy * 2;
    fill(grid, w, tx - 1, ty - 1, tx + size - 2, ty + size - 2, 0);
    pockets.push({ x: tx - 1, y: ty - 1, w: size, h: size });
  }

  const spawnTile = { x: 1, y: 1 };
  const exitTile = { x: w - 2, y: h - 2 };
  // The moving-maze portal sits one cell left of the stair; make sure that
  // cell is open even when the maze carved a wall there.
  fill(grid, w, exitTile.x - 1, exitTile.y, exitTile.x - 1, exitTile.y, 0);

  const monsters = [];
  for (let i = 0; i < 5; i++) {
    let tx = 0;
    let ty = 0;
    for (let tries = 0; tries < 200; tries++) {
      tx = ri(rnd, 3, w - 4);
      ty = ri(rnd, 3, h - 4);
      if (grid[at(w, tx, ty)] === 0 && Math.hypot(tx - spawnTile.x, ty - spawnTile.y) > 18) break;
    }
    if (grid[at(w, tx, ty)] === 0) monsters.push({ x: tx, y: ty, type: 'lurker' });
  }

  return {
    mapId: 'maze',
    w,
    h,
    tile: TILE,
    size: { w: w * TILE, h: h * TILE },
    grid,
    rooms: pockets,
    spawn: { x: spawnTile.x * TILE + TILE / 2, y: spawnTile.y * TILE + TILE / 2 },
    spawnTile,
    key: null,
    exit: { x: exitTile.x * TILE + TILE / 2, y: exitTile.y * TILE + TILE / 2 },
    exitTile,
    exits: [
      { to: 'room', x: 0, y: 0, require: null, color: '127,227,212', silent: true },
      // The diagonal corner already holds the stair; put the moving-maze
      // portal on the open cell beside it so both stay usable.
      { to: 'moving', x: exitTile.x - 1, y: exitTile.y, require: null, color: '200,160,255', silent: true },
    ],
    absorb: [],
    monsters,
    loot: mazeLoot(rnd, grid, w, h, spawnTile, exitTile, monsters),
    seed,
  };
}

// -------------------------------------------------------------- moving map --
//
// Nine 25x25 rooms laid out on a 3x3 grid, each with two floor plans. Every
// twenty seconds five of the nine rooms swap plans and the maze re-forms under
// the player. The rooms share their one-tile borders, so a door on a shared
// border lines up no matter which plan either side is showing.

const MOVING = {
  N: 3,
  PITCH: 24,
  BLOCK: 25,
  W: 73,
  H: 73,
  PERIOD: 20,
  FIRST: 4,
};

const M_BLOCK = MOVING.BLOCK;
const M_PITCH = MOVING.PITCH;

function blockIndex(r, c) {
  return r * 3 + c;
}

function blockAtTile(level, tx, ty) {
  if (!level || !level.blocks) return null;
  if (tx < 0 || ty < 0 || tx >= level.w || ty >= level.h) return null;
  const c = Math.min(2, Math.max(0, Math.floor(tx / M_PITCH)));
  const r = Math.min(2, Math.max(0, Math.floor(ty / M_PITCH)));
  return level.blocks[blockIndex(r, c)] || null;
}

/** The block that owns a tile. Shared borders belong to the lower/right block. */
function blockAt(level, tx, ty) {
  return blockAtTile(level, tx, ty);
}

const localAt = (x, y) => y * M_BLOCK + x;

/** A one-tile-wide maze on a 10x10 cell grid, wrapped by a one-tile ring.
 *  `sides` says which sides have a neighbouring room; only those get doors. */
function makeBlockPlan(rnd, sides) {
  const g = new Uint8Array(M_BLOCK * M_BLOCK).fill(1);
  const set = (x, y, v) => {
    g[localAt(x, y)] = v;
  };

  // One-tile ring corridor inside the outer wall.
  for (let i = 1; i < M_BLOCK - 1; i++) {
    set(1, i, 0);
    set(M_BLOCK - 2, i, 0);
    set(i, 1, 0);
    set(i, M_BLOCK - 2, 0);
  }

  // Two doors per *interior* side, at odd coordinates so each one lines up
  // with a one-tile corridor. Outer sides stay solid.
  const doors = { up: [], down: [], left: [], right: [] };
  for (const d of [5, 17]) {
    if (sides.up) {
      doors.up.push(d);
      set(d, 0, 0);
      set(d, 2, 0);
    }
    if (sides.down) {
      doors.down.push(d);
      set(d, M_BLOCK - 1, 0);
      set(d, M_BLOCK - 3, 0);
    }
    if (sides.left) {
      doors.left.push(d);
      set(0, d, 0);
      set(2, d, 0);
    }
    if (sides.right) {
      doors.right.push(d);
      set(M_BLOCK - 1, d, 0);
      set(M_BLOCK - 3, d, 0);
    }
  }

  // 10x10 cells at odd local coordinates 3..21; walls at even coordinates.
  const N = 10;
  const cellX = (c) => 3 + c * 2;
  const cellY = (r) => 3 + r * 2;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) set(cellX(c), cellY(r), 0);
  }

  const key = (c, r) => r * N + c;
  const seen = new Uint8Array(N * N);
  const degree = new Uint8Array(N * N);
  const links = new Set();
  const neighbours = (c, r) => {
    const out = [];
    if (c > 0) out.push([c - 1, r]);
    if (c < N - 1) out.push([c + 1, r]);
    if (r > 0) out.push([c, r - 1]);
    if (r < N - 1) out.push([c, r + 1]);
    return out;
  };
  const connect = (c1, r1, c2, r2) => {
    if (c1 === c2) {
      const r = Math.min(r1, r2);
      set(cellX(c1), cellY(r) + 1, 0);
    } else {
      const c = Math.min(c1, c2);
      set(cellX(c) + 1, cellY(r1), 0);
    }
    links.add(`${key(c1, r1)}-${key(c2, r2)}`);
    links.add(`${key(c2, r2)}-${key(c1, r1)}`);
    degree[key(c1, r1)]++;
    degree[key(c2, r2)]++;
  };

  const start = [ri(rnd, 0, N - 1), ri(rnd, 0, N - 1)];
  seen[key(start[0], start[1])] = 1;
  const stack = [start];
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const options = neighbours(c, r).filter(([nc, nr]) => !seen[key(nc, nr)]);
    if (!options.length) {
      stack.pop();
      continue;
    }
    const [nc, nr] = options[Math.floor(rnd() * options.length)];
    connect(c, r, nc, nr);
    seen[key(nc, nr)] = 1;
    stack.push([nc, nr]);
  }

  // A few loops so the maze is not a pure tree.
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (degree[key(c, r)] > 1 || rnd() > 0.12) continue;
      const options = neighbours(c, r).filter(([nc, nr]) => !links.has(`${key(c, r)}-${key(nc, nr)}`));
      if (!options.length) continue;
      const [nc, nr] = options[Math.floor(rnd() * options.length)];
      connect(c, r, nc, nr);
    }
  }

  // Centre room: 3x3 open, one solid 口 in the middle, and one-tile entrances
  // on all four sides so the button is never sealed off.
  for (let y = 11; y <= 13; y++) {
    for (let x = 11; x <= 13; x++) set(x, y, 0);
  }
  for (const [x, y] of [[10, 11], [10, 13], [14, 11], [14, 13], [11, 10], [13, 10], [11, 14], [13, 14]]) {
    set(x, y, 0);
  }

  g.doors = doors;
  return g;
}

function applyCenter(g, decor) {
  g[localAt(12, 12)] = decor === 'none' ? 0 : 1;
}

function fillPlan(g, v) {
  g.fill(v);
}

function planDoors(b) {
  const out = [];
  const sides = (b && b.sides) || {};
  for (const d of [5, 17]) {
    if (sides.up) out.push([d, 0]);
    if (sides.down) out.push([d, M_BLOCK - 1]);
    if (sides.left) out.push([0, d]);
    if (sides.right) out.push([M_BLOCK - 1, d]);
  }
  return out;
}

/** World tile coordinates of the doors on a block's interior sides. */
function movingDoors(b) {
  const out = [];
  for (const [lx, ly] of planDoors(b)) out.push({ x: b.ox + lx, y: b.oy + ly });
  return out;
}

function writeMovingBlock(level, b) {
  const src = b.variants[b.z];
  for (let y = 0; y < M_BLOCK; y++) {
    const row = (b.oy + y) * level.w + b.ox;
    const srow = y * M_BLOCK;
    for (let x = 0; x < M_BLOCK; x++) level.grid[row + x] = src[srow + x];
  }
  // A shattered 口 stays open: the variant still has its centre wall, but the
  // glass is gone, so never let a later write close it again.
  if (b.core && b.core.broken) {
    level.grid[(b.oy + 12) * level.w + b.ox + 12] = 0;
  }
}

function composeMoving(level) {
  for (const b of level.blocks) writeMovingBlock(level, b);
}

function buildMovingMap(seed = 1) {
  const rnd = mulberry32(seed);
  const W = MOVING.W;
  const H = MOVING.H;
  const grid = new Uint8Array(W * H).fill(1);
  const blocks = [];
  for (let i = 0; i < 9; i++) {
    const r = Math.floor(i / 3);
    const c = i % 3;
    const sides = { up: r > 0, down: r < 2, left: c > 0, right: c < 2 };
    // Two different one-tile mazes. Doors are identical on both faces, so a
    // room can be replaced without its exits moving.
    const variants = [makeBlockPlan(rnd, sides), makeBlockPlan(rnd, sides)];
    blocks.push({
      i,
      r,
      c,
      ox: c * M_PITCH,
      oy: r * M_PITCH,
      z: 0,
      gone: false,
      broken: false,
      sides,
      variants,
      decor: ['spark', 'spark'],
      core: null,
    });
  }

  // Spawn in a corner; the goal is the opposite corner. b2 is the centre room
  // and always the secret one.
  const corner = [0, 2, 6, 8][Math.floor(rnd() * 4)];
  const sr = Math.floor(corner / 3);
  const sc = corner % 3;
  const target = blockIndex(2 - sr, 2 - sc);
  for (const b of blocks) {
    if (b.i === target) b.decor = ['none', 'button'];
    if (b.i === 4) b.decor = ['spark', 'spark'];
    // The two variants may need different centres (the goal is absent on the
    // first floor and a button on the second).
    applyCenter(b.variants[0], b.decor[0]);
    applyCenter(b.variants[1], b.decor[1]);
    const color = b.i === 4 ? '255, 200, 90' : b.i === target ? '255, 210, 120' : ['127, 227, 212', '70, 150, 160'][b.z];
    b.core = {
      tx: b.ox + 12,
      ty: b.oy + 12,
      cell: { x: b.ox + 12, y: b.oy + 12 },
      broken: false,
      kind: b.i === 4 ? 'b2' : b.i === target ? 'button' : 'spark',
      color,
      decor: b.decor.slice(),
    };
  }

  const level = {
    mapId: 'moving',
    w: W,
    h: H,
    tile: TILE,
    size: { w: W * TILE, h: H * TILE },
    grid,
    rooms: [],
    blocks,
    spawnTile: { x: blocks[corner].ox + 12, y: blocks[corner].oy + 13 },
    spawn: {
      x: (blocks[corner].ox + 12) * TILE + TILE / 2,
      y: (blocks[corner].oy + 13) * TILE + TILE / 2,
    },
    key: null,
    exit: null,
    exits: [],
    absorb: [],
    monsters: [],
    loot: [],
    seed,
    moving: {
      state: 'running',
      clock: 0,
      nextFlip: MOVING.FIRST,
      period: MOVING.PERIOD,
      flips: 0,
      spawn: corner,
      target,
      targetLayer: 1,
      rng: mulberry32((seed ^ 0x9e3779b9) >>> 0),
    },
  };

  composeMoving(level);

  // Loot lives on the ring, six spots across the whole map.
  const ring = [];
  for (const b of blocks) {
    for (let y = 1; y < M_BLOCK - 1; y++) {
      for (let x = 1; x < M_BLOCK - 1; x++) {
        if (x >= 3 && x <= 21 && y >= 3 && y <= 21) continue;
        ring.push({ x: b.ox + x, y: b.oy + y });
      }
    }
  }
  shuffle(ring, rnd);
  for (const p of ring) {
    if (level.loot.length >= 6) break;
    if (level.grid[p.y * W + p.x] !== 0) continue;
    if (Math.hypot(p.x - level.spawnTile.x, p.y - level.spawnTile.y) < 10) continue;
    if (level.loot.some((q) => Math.hypot(q.x - p.x, q.y - p.y) < 7)) continue;
    level.loot.push({ x: p.x, y: p.y });
  }

  // Eighteen lurkers: one per block-layer, so each of the two faces of a room
  // has its own guard. Only the guard of the face currently written into the
  // physical grid is awake; the other one waits in its variant.
  for (const b of blocks) {
    for (let layer = 0; layer < 2; layer++) {
      const spots = [];
      const v = b.variants[layer];
      for (let y = 1; y < 24; y++) {
        for (let x = 1; x < 24; x++) {
          // Keep the 3x3 centre room quiet: the button side must stay safe.
          if (x >= 9 && x <= 15 && y >= 9 && y <= 15) continue;
          if (v[y * M_BLOCK + x] !== 0) continue;
          spots.push({ x: b.ox + x, y: b.oy + y });
        }
      }
      shuffle(spots, rnd);
      for (const p of spots) {
        if (Math.hypot(p.x - level.spawnTile.x, p.y - level.spawnTile.y) < 8) continue;
        if (level.monsters.some((m) => m.x === p.x && m.y === p.y)) continue;
        level.monsters.push({ x: p.x, y: p.y, type: 'lurker', block: b.i, layer });
        break;
      }
    }
  }

  return level;
}

/** Pick exactly five unbroken blocks to flip, never `avoid` (the player's room). */
function pickMovingFlips(level, avoid = -1) {
  const pool = level.blocks.filter((b) => !b.core.broken && !b.gone && b.i !== avoid).map((b) => b.i);
  if (pool.length <= 5) return pool;
  return shuffle(pool, level.moving.rng).slice(0, 5);
}

function flipMovingBlock(level, b) {
  b.z ^= 1;
  writeMovingBlock(level, b);
  level.moving.flips++;
}

/** Toggle the picked blocks. Returns the blocks that actually moved. */
function flipMoving(level, picked = pickMovingFlips(level)) {
  const moved = [];
  for (const i of picked) {
    const b = level.blocks[i];
    if (!b.core.broken) moved.push(b);
  }
  for (const b of moved) flipMovingBlock(level, b);
  return moved;
}

/** The active core at a pixel position, if a thrown thing would hit it. */
function coreHitAt(level, x, y, radius = 30) {
  const tx = Math.floor(x / level.tile);
  const ty = Math.floor(y / level.tile);
  const b = blockAtTile(level, tx, ty);
  if (!b || !b.core || b.core.broken || b.decor[b.z] === 'none') return null;
  const cx = (b.ox + 12 + 0.5) * level.tile;
  const cy = (b.oy + 12 + 0.5) * level.tile;
  return Math.hypot(x - cx, y - cy) <= radius ? b : null;
}

/** Move a body that the flip just buried back onto the nearest open tile. */
function nearestOpenInBlock(level, b, px, py) {
  const sx = Math.floor(px / level.tile);
  const sy = Math.floor(py / level.tile);
  for (let r = 0; r <= 12; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) + Math.abs(dy) !== r) continue;
        const x = sx + dx;
        const y = sy + dy;
        if (x < b.ox || x > b.ox + M_BLOCK - 1 || y < b.oy || y > b.oy + M_BLOCK - 1) continue;
        if (level.grid[y * level.w + x] === 0) {
          return { x: (x + 0.5) * level.tile, y: (y + 0.5) * level.tile };
        }
      }
    }
  }
  return null;
}

/** The target button is only real on the second floor. */
function solveMoving(level) {
  const m = level.moving;
  const target = level.blocks[m.target];
  if (!target || target.core.broken || target.z !== m.targetLayer) return null;
  const goal = { x: target.ox + 12, y: target.oy + 13 };
  return findPath(level.grid, level.w, level.h, level.spawnTile.x, level.spawnTile.y, goal.x, goal.y);
}

/** Normal clear: the maze stops, the centre room seals, eight doors open. */
function clearMoving(level) {
  const m = level.moving;
  if (m.state === 'collapsed') return level.exits;
  m.state = 'cleared';
  for (const b of level.blocks) b.core.broken = true;
  const b2 = level.blocks[4];
  b2.gone = true;
  for (const v of b2.variants) fillPlan(v, 1);
  for (const [lx, ly] of planDoors(b2)) {
    b2.variants[0][localAt(lx, ly)] = 0;
    b2.variants[1][localAt(lx, ly)] = 0;
  }
  writeMovingBlock(level, b2);
  // The clear is terminal: b2 is gone, so its whole 3x3 centre is wall. The
  // broken-core rule in writeMovingBlock only applies while the maze still runs.
  level.grid[(b2.oy + 12) * level.w + b2.ox + 12] = 1;
  level.exits = movingDoors(b2).map((d) => ({
    to: 'mech',
    x: d.x,
    y: d.y,
    require: null,
    color: '200, 160, 255',
  }));
  return level.exits;
}

/** b2's egg: everything else turns to stone, b2 becomes the way out. */
function collapseB2(level) {
  const m = level.moving;
  if (m.state === 'cleared') return level.exits;
  m.state = 'collapsed';
  for (const b of level.blocks) {
    b.core.broken = true;
    b.gone = b.i !== 4;
    for (const v of b.variants) fillPlan(v, b.i === 4 ? 0 : 1);
    writeMovingBlock(level, b);
  }
  level.exits = movingDoors(level.blocks[4]).map((d) => ({
    to: 'lab',
    x: d.x,
    y: d.y,
    require: null,
    color: '255, 200, 90',
  }));
  return level.exits;
}

/** Connectivity audit used by tests + the generator retry loop. */
function mapConnected(level) {
  const { grid, w, h, spawnTile } = level;
  const seen = reachable(grid, w, h, spawnTile.x, spawnTile.y);
  let open = 0;
  let ok = 0;
  for (let i = 0; i < w * h; i++) {
    if (grid[i] !== 0) continue;
    open++;
    if (seen[i]) ok++;
  }
  return { ok: open === ok, open, reached: ok };
}

// ---- src/entities.js ----

function isSolid(grid, w, h, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= w || ty >= h) return true;
  return grid[ty * w + tx] !== 0;
}

/**
 * Axis-separated collision for a square-ish body (radius r) against the tile
 * grid. Returns the resolved position.
 */
function moveCircle(grid, w, h, tile, x, y, r, dx, dy) {
  let nx = x;
  let ny = y;
  if (dx !== 0) {
    nx = x + dx;
    const minTy = Math.floor((y - r + 0.01) / tile);
    const maxTy = Math.floor((y + r - 0.01) / tile);
    const solidColumn = (tx) => {
      for (let ty = minTy; ty <= maxTy; ty++) if (isSolid(grid, w, h, tx, ty)) return true;
      return false;
    };
    if (dx > 0) {
      const from = Math.floor((x + r - 0.01) / tile);
      const to = Math.floor((nx + r) / tile);
      for (let tx = from; tx <= to; tx++) {
        if (solidColumn(tx)) {
          nx = tx * tile - r - 0.01;
          break;
        }
      }
    } else {
      const from = Math.floor((x - r + 0.01) / tile);
      const to = Math.floor((nx - r) / tile);
      for (let tx = from; tx >= to; tx--) {
        if (solidColumn(tx)) {
          nx = (tx + 1) * tile + r + 0.01;
          break;
        }
      }
    }
  }
  if (dy !== 0) {
    ny = y + dy;
    const minTx = Math.floor((nx - r + 0.01) / tile);
    const maxTx = Math.floor((nx + r - 0.01) / tile);
    const solidRow = (ty) => {
      for (let tx = minTx; tx <= maxTx; tx++) if (isSolid(grid, w, h, tx, ty)) return true;
      return false;
    };
    if (dy > 0) {
      const from = Math.floor((y + r - 0.01) / tile);
      const to = Math.floor((ny + r) / tile);
      for (let ty = from; ty <= to; ty++) {
        if (solidRow(ty)) {
          ny = ty * tile - r - 0.01;
          break;
        }
      }
    } else {
      const from = Math.floor((y - r + 0.01) / tile);
      const to = Math.floor((ny - r) / tile);
      for (let ty = from; ty >= to; ty--) {
        if (solidRow(ty)) {
          ny = (ty + 1) * tile + r + 0.01;
          break;
        }
      }
    }
  }
  return { x: nx, y: ny };
}

class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.r = 9;
    this.vx = 0;
    this.vy = 0;
    this.speed = 0;
    this.moving = false;
    this.face = 0;
    this.stride = 0;
    this.trail = [];
    this.trailT = 0;
    this.stepPhase = 0;
  }

  update(dt, move, { run = false, listen = false, creep = false, creepMul = 0.5, mul = 1 } = {}) {
    const maxSpeed = (creep ? Math.round(92 * creepMul) : listen ? 60 : run ? 152 : 92) * mul;
    const targetX = move.x * maxSpeed;
    const targetY = move.y * maxSpeed;
    const k = 1 - Math.exp(-(move.x || move.y ? 16 : 12) * dt);
    this.vx += (targetX - this.vx) * k;
    this.vy += (targetY - this.vy) * k;
    this.speed = Math.hypot(this.vx, this.vy);
    this.moving = this.speed > 14;
    if (this.moving) this.face = Math.atan2(this.vy, this.vx);
    this.stepPhase += this.speed * dt;
    this.trailT -= dt;
    if (this.trailT <= 0 && this.speed > 20) {
      this.trailT = 0.05;
      this.trail.push({ x: this.x, y: this.y, life: 0.55 });
      if (this.trail.length > 26) this.trail.shift();
    }
    for (let i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].life -= dt;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }
    return { x: this.vx * dt, y: this.vy * dt };
  }
}

let hunterId = 0;

class Hunter {
  constructor(x, y, type = 'hunter', home = null) {
    this.id = hunterId++;
    this.x = x;
    this.y = y;
    this.r = 11;
    this.type = type;
    this.home = home;
    this.route = home && home.route ? home.route : null;
    this.routeIdx = 0;
    this.state = this.route ? 'patrol' : 'idle';
    this.path = [];
    this.searchT = 0;
    this.pending = null;
    // A corpse's lure owns this body until it arrives; a bugspray's line
    // repels it for one second. Neither may be overwritten by the player's
    // own sonar (the whole point of the corpse).
    this.lureLock = null;
    this.repelT = 0;
    this.repelFrom = null;
    this.repelTag = -1;
    this.lastTag = -1;
    this.face = Math.random() * Math.PI * 2;
    this.speed = 0;
    this.stepAcc = 0;
    // How long this body has been chasing a sound. Calm bodies drift at 0.7×
    // the player's pace; alerted ones close at 2×.
    this.alertT = 0;
    this.wanderCooldown = Math.random() * 2;
    this.turn = 0;
    this.target = null;
    this.chaseT = 0;
    this.windT = 0;
    this.burstT = 0;
    this.restT = 0;
    this.chargeT = 0;
    this.vx = 0;
    this.vy = 0;
    this.bounces = 0;
    this.cycleT = 0;
    this.pulseDone = false;
    this.pounce = null;
    this.dashT = 0;
  }

  hear(x, y, delay = 0.25) {
    // A lure (corpse) or a repulsion (bugspray) is already in charge.
    if (this.lureLock || this.repelT > 0) return;
    this.alertT = Math.max(this.alertT || 0, 3);
    this.pending = { x, y, t: delay };
  }

  _retarget(game, x, y) {
    const far = !this.target || Math.hypot(this.target.x - x, this.target.y - y) > 22;
    if (this.path.length && !far) return;
    this.target = { x, y };
    this._plan(game, x, y);
  }

  _plan(game, x, y) {
    const L = game.level;
    const sx = Math.floor(this.x / L.tile);
    const sy = Math.floor(this.y / L.tile);
    let tx = Math.floor(x / L.tile);
    let ty = Math.floor(y / L.tile);
    if (isSolid(L.grid, L.w, L.h, tx, ty)) {
      const open = nearestOpen(L.grid, L.w, L.h, tx, ty);
      if (!open) return false;
      tx = open.x;
      ty = open.y;
    }
    const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
    if (path && path.length) {
      this.path = path.map((p) => ({ x: (p.x + 0.5) * L.tile, y: (p.y + 0.5) * L.tile }));
      return true;
    }
    return false;
  }

  _walk(dt, game, speed) {
    const L = game.level;
    let tx = this.x;
    let ty = this.y;
    while (this.path.length && Math.hypot(this.path[0].x - this.x, this.path[0].y - this.y) < 9) this.path.shift();
    const arrived = this.path.length === 0;
    if (!arrived) {
      tx = this.path[0].x;
      ty = this.path[0].y;
    }
    let dx = 0;
    let dy = 0;
    if (!arrived) {
      const d = Math.hypot(tx - this.x, ty - this.y) || 1;
      dx = ((tx - this.x) / d) * speed;
      dy = ((ty - this.y) / d) * speed;
      this.face = Math.atan2(dy, dx);
    }
    this.speed = Math.hypot(dx, dy);
    const step = moveCircle(L.grid, L.w, L.h, L.tile, this.x, this.y, this.r, dx * dt, dy * dt);
    this.x = step.x;
    this.y = step.y;
    this._footsteps(dt, game);
    return arrived;
  }

  _footsteps(dt, game) {
    if (this.speed <= 5) return;
    this.stepAcc += this.speed * dt;
    const alert = (this.alertT || 0) > 0;
    // An alerted body rings more often, but each burst is thinner: it knows
    // roughly where you are and no longer needs the wide calm sweep.
    if (this.stepAcc < (alert ? 34 : 58)) return;
    this.stepAcc = 0;
    const rel = this.x - game.player.x;
    const d = Math.hypot(rel, this.y - game.player.y);
    if (d < 620) game.audio.hunterStep(Math.max(-1, Math.min(1, rel / 380)), Math.min(1, 1.15 - d / 640));
    game.stepEcho?.(this.x, this.y, this.type === 'butcher' ? '255, 90, 60' : '255, 70, 70', {
      tagged: false,
      count: alert ? 9 : 22,
    });
  }

  _burst(game, tint = '255, 110, 90', count = 12) {
    game.stepEcho?.(this.x, this.y, tint, { count, speed: 300, life: 0.45, tagged: false });
  }

  update(dt, game) {
    if (this.alertT > 0) {
      this.alertT = Math.max(0, this.alertT - dt);
      if (this.alertT === 0 && this.type === 'lurker') {
        this.state = 'idle';
        this.path = [];
        this.target = null;
      }
    }
    const alert = (this.alertT || 0) > 0;
    const speed = game.level && game.level.moving
      ? (alert ? 184 : 64)
      : (this.speedCap || (game.hunterSpeed ? game.hunterSpeed() : 126));
    if (this.pending) {
      this.pending.t -= dt;
      if (this.pending.t <= 0) {
        const s = this.pending;
        this.pending = null;
        this.target = { x: s.x, y: s.y };
        this.chaseT = 0;
        this._plan(game, s.x, s.y);
        if (this.type === 'patroller') this.state = 'chase';
        else if (this.type === 'stalker') {
          if (this.state !== 'windup' && this.state !== 'charge') this.state = 'chase';
        } else if (this.type === 'hunter') this.state = 'investigate';
      }
    }

    // Bugspray: keep fleeing the newest line for a second.
    if (this.repelT > 0) {
      this.repelT -= dt;
      if (this.repelT <= 0) {
        this.repelT = 0;
        this.repelFrom = null;
      } else if (!this.path || this.path.length === 0) {
        const a = Math.atan2(this.y - this.repelFrom.y, this.x - this.repelFrom.x) || 0;
        this._plan(game, this.repelFrom.x + Math.cos(a) * 340, this.repelFrom.y + Math.sin(a) * 340);
      }
    }
    // The corpse keeps a body until it physically reaches it.
    if (this.lureLock && (!this.path || this.path.length === 0)) {
      if (Math.hypot(this.x - this.lureLock.x, this.y - this.lureLock.y) < 30) this.lureLock = null;
    }

    if (this.type === 'patroller') return this._patrol(dt, game, speed);
    if (this.type === 'stalker') return this._stalker(dt, game, speed);
    if (this.type === 'butcher') return this._butcher(dt, game, speed);
    if (this.type === 'lurker') return this._lurk(dt, game, speed);

    const arrived = this._walk(dt, game, speed);
    if (arrived && this.state === 'investigate') this.state = 'idle';
  }

  /** A slow drifter used on the room and maze maps: wanders when it hears nothing. */
  _lurk(dt, game, speed) {
    const L = game.level;
    const alert = (this.alertT || 0) > 0;
    this.lurkT = (this.lurkT ?? 0) - dt;
    if (!alert && this.lurkT <= 0 && (!this.path || this.path.length === 0)) {
      this.lurkT = 2.2 + Math.random() * 2.8;
      const t = L.tile;
      const blk = this.block != null && L.blocks ? L.blocks[this.block] : null;
      const x0 = blk ? blk.ox + 1 : 1;
      const y0 = blk ? blk.oy + 1 : 1;
      const x1 = blk ? blk.ox + 23 : L.w - 2;
      const y1 = blk ? blk.oy + 23 : L.h - 2;
      for (let i = 0; i < 60; i++) {
        const tx = x0 + Math.floor(Math.random() * (x1 - x0 + 1));
        const ty = y0 + Math.floor(Math.random() * (y1 - y0 + 1));
        if (isSolid(L.grid, L.w, L.h, tx, ty)) continue;
        if (blk && tx >= blk.ox + 11 && tx <= blk.ox + 13 && ty >= blk.oy + 11 && ty <= blk.oy + 13) continue;
        this._plan(game, (tx + 0.5) * t, (ty + 0.5) * t);
        break;
      }
    }
    // Calm drift is already 0.7× in `speed`; alerted bodies get the full 2×.
    const arrived = this._walk(dt, game, speed);
    if (arrived && !alert) this.state = 'idle';
    return arrived;
  }

  _patrol(dt, game, speed) {
    if (this.state === 'chase') {
      this.chaseT += dt;
      const arrived = this._walk(dt, game, speed * 1.05);
      if (arrived || this.chaseT > 9) {
        this._returnHome(game);
      }
      return;
    }
    if (this.state === 'return' && this.path.length === 0) this._returnHome(game);
    if (!this.path.length) {
      if (!this.route || !this.route.length) return;
      const wp = this.route[this.routeIdx % this.route.length];
      this.routeIdx = (this.routeIdx + 1) % this.route.length;
      this._plan(game, wp.x, wp.y);
    }
    this._walk(dt, game, speed * 0.72);
  }

  _returnHome(game) {
    const route = this.route;
    if (!route) return;
    let best = 0;
    let bd = Infinity;
    for (let i = 0; i < route.length; i++) {
      const d = Math.hypot(route[i].x - this.x, route[i].y - this.y);
      if (d < bd) { bd = d; best = i; }
    }
    this.routeIdx = (best + 1) % route.length;
    this._plan(game, route[best].x, route[best].y);
    this.state = 'patrol';
  }

  _stalker(dt, game, speed) {
    if (this.state === 'windup') {
      this.windT -= dt;
      this.burstT -= dt;
      if (this.burstT <= 0) { this.burstT = 0.17; this._burst(game, '255, 120, 90', 10); }
      if (this.windT <= 0) {
        const tx = this.target ? this.target.x : this.x;
        const ty = this.target ? this.target.y : this.y;
        const d = Math.hypot(tx - this.x, ty - this.y) || 1;
        this.vx = ((tx - this.x) / d) * 560;
        this.vy = ((ty - this.y) / d) * 560;
        this.chargeT = 0.95;
        this.bounces = 0;
        this.state = 'charge';
      }
      return;
    }
    if (this.state === 'charge') {
      this.chargeT -= dt;
      this.burstT -= dt;
      if (this.burstT <= 0) { this.burstT = 0.12; this._burst(game, '255, 110, 80', 8); }
      const L = game.level;
      const wantX = this.vx * dt;
      const wantY = this.vy * dt;
      const step = moveCircle(L.grid, L.w, L.h, L.tile, this.x, this.y, this.r, wantX, wantY);
      const blockedX = Math.abs((step.x - this.x) - wantX) > 0.6;
      const blockedY = Math.abs((step.y - this.y) - wantY) > 0.6;
      this.x = step.x;
      this.y = step.y;
      if (blockedX) { this.vx = -this.vx; this.bounces += 1; }
      if (blockedY) { this.vy = -this.vy; this.bounces += 1; }
      this.speed = Math.hypot(this.vx, this.vy);
      if (this.bounces >= 2 || this.chargeT <= 0) {
        this.state = 'rest';
        this.restT = 1.3;
      }
      return;
    }
    if (this.state === 'rest') {
      this.restT -= dt;
      if (this.restT <= 0) this.state = this.target ? 'chase' : 'idle';
      return;
    }
    if (this.state === 'chase') {
      const arrived = this._walk(dt, game, speed * 1.15);
      const near = this.target && Math.hypot(this.target.x - this.x, this.target.y - this.y) < 130;
      if (arrived || near) {
        this.state = 'windup';
        this.windT = 1.05;
        this.burstT = 0;
      }
    }
  }

  _butcher(dt, game, speed) {
    if (this.pounce) {
      this.dashT -= dt;
      if (this.dashT <= 0) { this.pounce = null; this.cycleT = 0; this.pulseDone = false; return; }
      const tx = this.pounce.x;
      const ty = this.pounce.y;
      const d = Math.hypot(tx - this.x, ty - this.y) || 1;
      const step = moveCircle(game.level.grid, game.level.w, game.level.h, game.level.tile, this.x, this.y, this.r, ((tx - this.x) / d) * 640 * dt, ((ty - this.y) / d) * 640 * dt);
      this.x = step.x;
      this.y = step.y;
      this.speed = 640;
      this._footsteps(dt, game);
      return;
    }
    this.cycleT += dt;
    const phase = this.cycleT % 4;
    if (phase >= 2) {
      this.burstT -= dt;
      if (this.burstT <= 0 && phase < 3.2) { this.burstT = 0.13; this._burst(game, '255, 150, 90', 7); }
      if (!this.pulseDone && phase >= 3.2) {
        this.pulseDone = true;
        game.butcherSweep?.(this.x, this.y, this);
      }
      return;
    }
    this.pulseDone = false;
    if (this.target) this._walk(dt, game, speed * 0.85);
  }
}

let skitterId = 0;

// The hunter listens. The skitter does not. It is deaf, fast and predictable:
// the only way to know where it is, is to look -- which costs a ping, and a
// ping can wake a hunter. That trade is the whole point of the thing.
class Skitter {
  constructor(x, y) {
    this.id = skitterId++;
    this.x = x;
    this.y = y;
    this.r = 8;
    this.path = [];
    this.rest = 0.3 + Math.random() * 1.2;
    this.speed = 0;
    this.tickAcc = Math.random();
    this.face = 0;
    this.wobble = Math.random() * 6;
    this.echoT = 0;
    this.echoCool = 0;
    this.lastTag = -1;
    this.echoKind = null;
    this.echoSrc = null;
    this.revealT = 0;
    this.lure = null;
  }

  /** It is deaf to meaning but not to sound: anything loud enough is repeated
   *  back a beat later, from where the mimic is standing. */
  hear(x, y, kind = 'ping', delay = 1.2) {
    if (this.echoT > 0 || this.echoCool > 0) return false;
    this.echoT = delay + Math.random() * 0.3;
    this.echoKind = kind;
    this.echoSrc = { x, y };
    return true;
  }

  _plan(game) {
    const L = game.level;
    const sx = Math.floor(this.x / L.tile);
    const sy = Math.floor(this.y / L.tile);
    if (this.lure) {
      const tx = Math.floor(this.lure.x / L.tile);
      const ty = Math.floor(this.lure.y / L.tile);
      const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
      this.lure = null;
      if (path && path.length) {
        this.path = path.map((p) => ({
          x: (p.x + 0.5) * L.tile,
          y: (p.y + 0.5) * L.tile,
        }));
        return true;
      }
    }
    for (let tries = 0; tries < 16; tries++) {
      const tx = sx + Math.round((Math.random() * 2 - 1) * 9);
      const ty = sy + Math.round((Math.random() * 2 - 1) * 9);
      if (tx < 1 || ty < 1 || tx >= L.w - 1 || ty >= L.h - 1) continue;
      if (L.grid[ty * L.w + tx] !== 0) continue;
      if (Math.abs(tx - sx) + Math.abs(ty - sy) < 5) continue;
      const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
      if (path && path.length) {
        this.path = path.map((p) => ({
          x: (p.x + 0.5) * L.tile,
          y: (p.y + 0.5) * L.tile,
        }));
        return true;
      }
    }
    this.rest = 0.4;
    return false;
  }

  update(dt, game) {
    const L = game.level;
    this.wobble += dt * 6;
    this.stepAcc = (this.stepAcc || 0);
    if (this.revealT > 0) this.revealT -= dt;
    if (this.echoCool > 0) this.echoCool -= dt;
    if (this.echoT > 0) {
      this.echoT -= dt;
      if (this.echoT <= 0) {
        this.echoT = 0;
        if (game.onEcho) game.onEcho(this, this.echoKind, this.echoSrc);
        this.lure = this.echoSrc;
        this.echoSrc = null;
      }
    }

    if (!this.path.length) {
      this.speed = 0;
      this.rest -= dt;
      if (this.rest <= 0) this._plan(game);
      return;
    }

    const wp = this.path[0];
    if (Math.hypot(wp.x - this.x, wp.y - this.y) < 7) {
      this.path.shift();
      if (!this.path.length) this.rest = 0.35 + Math.random() * 0.9;
      return;
    }

    const SPEED = 118;
    const d = Math.hypot(wp.x - this.x, wp.y - this.y) || 1;
    this.face = Math.atan2(wp.y - this.y, wp.x - this.x);
    const step = moveCircle(
      L.grid,
      L.w,
      L.h,
      L.tile,
      this.x,
      this.y,
      this.r,
      ((wp.x - this.x) / d) * SPEED * dt,
      ((wp.y - this.y) / d) * SPEED * dt,
    );
    this.x = step.x;
    this.y = step.y;
    this.speed = SPEED;

    // neutral things still make sound: a blue thread through the dark
    this.stepAcc += SPEED * dt;
    if (this.stepAcc > 64) {
      this.stepAcc = 0;
      game.stepEcho?.(this.x, this.y, '110, 180, 255', { tagged: false });
    }

    // a dry tick, only audible close by: enough to feel it, not to track it
    this.tickAcc += dt;
    if (this.tickAcc > 0.85) {
      this.tickAcc = 0;
      const dx = this.x - game.player.x;
      const dy = this.y - game.player.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 260 && game.audio) {
        const pan = Math.max(-1, Math.min(1, dx / 300));
        game.audio.skitterTick(pan, Math.max(0, 1 - dist / 300));
      }
    }
  }
}

// ---- src/input.js ----
const MOVE_KEYS = {
  KeyW: 'up',
  ArrowUp: 'up',
  KeyS: 'down',
  ArrowDown: 'down',
  KeyA: 'left',
  ArrowLeft: 'left',
  KeyD: 'right',
  ArrowRight: 'right',
};

class Input {
  constructor(target = window, canvas = null) {
    this.keys = new Set();
    this.pressed = new Set();
    this.released = new Set();
    this.mouseDown = false;
    this.anyKey = false;
    this.pointer = { x: 0, y: 0 };

    target.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.repeat) return;
      this.keys.add(e.code);
      this.pressed.add(e.code);
      this.anyKey = true;
      if (this.onAnyKey) this.onAnyKey(e);
    });
    target.addEventListener('keyup', (e) => {
      this.keys.delete(e.code);
      this.released.add(e.code);
      if (this.onAnyKey) this.onAnyKey(e);
    });
    target.addEventListener('blur', () => {
      this.keys.clear();
      this.mouseDown = false;
    });

    if (canvas) {
      canvas.addEventListener('pointerdown', (e) => {
        if (e.button === 0) {
          this.mouseDown = true;
          this.pressed.add('Mouse0');
        }
        this.pointer.x = e.clientX;
        this.pointer.y = e.clientY;
      });
      canvas.addEventListener('pointerup', (e) => {
        if (e.button === 0) this.mouseDown = false;
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    window.addEventListener('pointerdown', (e) => {
      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;
    });
  }

  down(code) {
    return this.keys.has(code);
  }

  consume(code) {
    const has = this.pressed.has(code);
    if (has) this.pressed.delete(code);
    return has;
  }

  consumeAny() {
    if (!this.pressed.size) return false;
    this.pressed.clear();
    return true;
  }

  moveVector() {
    let x = 0;
    let y = 0;
    for (const code of this.keys) {
      const dir = MOVE_KEYS[code];
      if (dir === 'up') y -= 1;
      else if (dir === 'down') y += 1;
      else if (dir === 'left') x -= 1;
      else if (dir === 'right') x += 1;
    }
    if (x && y) {
      x *= Math.SQRT1_2;
      y *= Math.SQRT1_2;
    }
    return { x, y };
  }

  endFrame() {
    this.pressed.clear();
    this.released.clear();
    this.anyKey = false;
  }
}

// ---- src/audio.js ----

/**
 * Every sound in HUSH is synthesised at runtime — no audio files.
 * The engine keeps a dry bus and a convolution reverb bus, and exposes
 * small musical helpers that the game calls for events.
 */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.dry = null;
    this.reverbSend = null;
    this.volume = 0.85;
    this.muted = false;
    this.started = false;
    this._heartTimer = 0;
    this._creakTimer = 6;
    this._noiseBuffer = null;
  }

  get ready() {
    return !!this.ctx;
  }

  async unlock() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.volume;
    this.master.connect(ctx.destination);
    this.dry = ctx.createGain();
    this.dry.gain.value = 0.9;
    this.dry.connect(this.master);
    const convolver = ctx.createConvolver();
    convolver.buffer = this._impulse(2.4, 2.6);
    this.reverbSend = ctx.createGain();
    this.reverbSend.gain.value = 0.55;
    this.reverbSend.connect(convolver);
    convolver.connect(this.master);
    this._noiseBuffer = this._makeNoise(2);
    this._startAmbience();
    this.started = true;
    if (ctx.state === 'suspended') await ctx.resume();
  }

  setMuted(muted) {
    this.muted = muted;
    if (this.master) {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(muted ? 0 : this.volume, this.ctx.currentTime, 0.05);
    }
  }

  toggleMute() {
    this.setMuted(!this.muted);
    return this.muted;
  }

  _impulse(seconds, decay) {
    const rate = this.ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = this.ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  _makeNoise(seconds) {
    const rate = this.ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = this.ctx.createBuffer(1, len, rate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  _route(node, pan, send) {
    let out = node;
    if (pan) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = clamp(pan, -1, 1);
      out.connect(p);
      out = p;
    }
    out.connect(this.dry);
    if (send > 0) {
      const s = this.ctx.createGain();
      s.gain.value = send;
      out.connect(s);
      s.connect(this.reverbSend);
    }
  }

  tone({
    freq,
    freqEnd,
    type = 'sine',
    dur = 0.4,
    gain = 0.15,
    attack = 0.006,
    pan = 0,
    send = 0.35,
    delay = 0,
    detune = 0,
  } = {}) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur);
    if (detune) osc.detune.value = detune;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    this._route(g, pan, send);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    osc.onended = () => {
      try {
        osc.disconnect();
        g.disconnect();
      } catch {
        /* already gone */
      }
    };
  }

  noise({
    dur = 0.2,
    gain = 0.1,
    type = 'bandpass',
    freq = 800,
    q = 1,
    pan = 0,
    send = 0.2,
    delay = 0,
  } = {}) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuffer;
    src.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = freq;
    filter.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter);
    filter.connect(g);
    this._route(g, pan, send);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
    src.onended = () => {
      try {
        src.disconnect();
        filter.disconnect();
        g.disconnect();
      } catch {
        /* already gone */
      }
    };
  }

  _startAmbience() {
    const ctx = this.ctx;
    // Low drone: two slightly detuned oscillators through a soft lowpass.
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.035;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 220;
    droneGain.connect(lp);
    lp.connect(this.dry);
    this._drone = [];
    for (const [f, det] of [
      [55, -6],
      [82.4, 7],
      [110, 3],
    ]) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      o.detune.value = det;
      const g = ctx.createGain();
      g.gain.value = f < 60 ? 0.5 : 0.2;
      o.connect(g);
      g.connect(droneGain);
      o.start();
      this._drone.push({ osc: o, base: f });
    }
    // Wind.
    const wind = ctx.createBufferSource();
    wind.buffer = this._noiseBuffer;
    wind.loop = true;
    const wf = ctx.createBiquadFilter();
    wf.type = 'lowpass';
    wf.frequency.value = 320;
    const wg = ctx.createGain();
    wg.gain.value = 0.02;
    wind.connect(wf);
    wf.connect(wg);
    wg.connect(this.dry);
    wind.start();
    // Slow breathing LFO on the wind.
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.012;
    lfo.connect(lfoGain);
    lfoGain.connect(wg.gain);
    lfo.start();
  }

  /** Each part of the cave sits on a different note of the same chord. Crossing
   *  into it is a slow detune, not a cut. */
  setSector(n) {
    if (!this._drone || !this.ctx) return;
    const ratios = [1, 1.0595, 0.9439, 1.1225, 0.8909, 1.1892, 1.0293, 0.8409];
    const r = ratios[((n % 8) + 8) % 8];
    const t = this.ctx.currentTime;
    for (const d of this._drone) d.osc.frequency.setTargetAtTime(d.base * r, t, 2.2);
  }

  ping(strength = 1) {
    this.tone({ freq: 1680, freqEnd: 720, type: 'triangle', dur: 0.16, gain: 0.05 * strength, send: 0.5 });
    this.tone({ freq: 780, freqEnd: 210, type: 'sine', dur: 0.85, gain: 0.16 * strength, send: 1.1 });
    this.noise({ dur: 0.09, gain: 0.05 * strength, type: 'highpass', freq: 2600, send: 0.6 });
  }

  /** Something out there answered your sound. Detuned, wetter, further away. */
  echo(pan = 0, kind = 'ping') {
    const heavy = kind === 'ping' || kind === 'hum';
    const g = heavy ? 0.1 : 0.055;
    this.tone({ freq: 1640, freqEnd: 600, type: 'triangle', dur: 0.22, gain: g * 0.45, pan, send: 1.5, delay: 0.02, detune: -40 });
    this.tone({ freq: 720, freqEnd: 170, type: 'sine', dur: 1.15, gain: g, pan, send: 1.7, delay: 0.06, detune: -70 });
    this.noise({ dur: 0.16, gain: g * 0.22, type: 'bandpass', freq: 1700, q: 3.5, pan, send: 1.3, delay: 0.04 });
  }

  /** Dry chitin clicks: the only warning a mimic gives, and only up close. */
  skitterTick(pan = 0, loud = 1) {
    this.noise({ dur: 0.028, gain: 0.022 * loud, type: 'highpass', freq: 3400, pan, send: 0.12 });
    this.tone({ freq: 2100, freqEnd: 1500, type: 'square', dur: 0.018, gain: 0.005 * loud, pan, send: 0.08 });
  }

  /** A sealed door breathing: low, patient, and just audible enough to answer. */
  gateHum() {
    this.tone({ freq: 61, freqEnd: 57, type: 'sine', dur: 1.5, gain: 0.05, send: 1.2, delay: 0.02 });
    this.tone({ freq: 122, freqEnd: 116, type: 'triangle', dur: 1.1, gain: 0.012, send: 1.0 });
  }

  deny() {
    this.tone({ freq: 180, freqEnd: 120, type: 'square', dur: 0.12, gain: 0.05, send: 0.1 });
  }

  // A hunter just heard something. Low, sour, panned toward it: the "it knows"
  // tell, so the player can connect their own noise to the reaction.
  alert(pan = 0) {
    this.tone({ freq: 150, freqEnd: 96, type: 'triangle', dur: 0.28, gain: 0.05, pan, send: 0.25 });
    this.tone({ freq: 300, freqEnd: 240, type: 'sine', dur: 0.09, gain: 0.02, pan, send: 0.2, delay: 0.02 });
  }

  footstep(pan = 0, loud = 1) {
    this.noise({ dur: 0.07, gain: 0.035 * loud, type: 'bandpass', freq: 900 + Math.random() * 300, q: 1.2, pan, send: 0.12 });
  }

  hunterStep(pan = 0, closeness = 0.3) {
    this.noise({ dur: 0.1, gain: 0.09 * closeness, type: 'lowpass', freq: 190, q: 0.8, pan, send: 0.25 });
    this.tone({ freq: 62, freqEnd: 44, type: 'sine', dur: 0.16, gain: 0.06 * closeness, pan, send: 0.1 });
  }

  shard() {
    const notes = [880, 1174.7, 1568];
    notes.forEach((f, i) =>
      this.tone({ freq: f, type: 'triangle', dur: 0.7, gain: 0.07, delay: i * 0.07, send: 0.9 }),
    );
  }

  /** A shard answering a pulse: thin, high, far away. */
  shardEcho(pan = 0, gain = 0.02, delay = 0) {
    const f = 1876 + Math.random() * 120;
    this.tone({ freq: f, type: 'sine', dur: 0.5, gain, pan, delay, send: 1.1 });
    this.tone({ freq: f * 1.5, type: 'sine', dur: 0.35, gain: gain * 0.35, pan, delay: delay + 0.04, send: 1.3 });
  }

  gateOpen() {
    this.tone({ freq: 220, freqEnd: 55, type: 'sawtooth', dur: 1.4, gain: 0.07, send: 0.7 });
    this.tone({ freq: 660, freqEnd: 990, type: 'sine', dur: 1.2, gain: 0.05, send: 0.9 });
    this.noise({ dur: 1.1, gain: 0.03, type: 'lowpass', freq: 500, send: 0.5 });
  }

  heartbeat(intensity = 1) {
    this.tone({ freq: 54, freqEnd: 40, type: 'sine', dur: 0.16, gain: 0.12 * intensity, send: 0.05 });
    this.tone({ freq: 48, freqEnd: 36, type: 'sine', dur: 0.2, gain: 0.08 * intensity, send: 0.05, delay: 0.18 });
  }

  death() {
    this.noise({ dur: 0.8, gain: 0.28, type: 'lowpass', freq: 1400, send: 0.8 });
    this.tone({ freq: 190, freqEnd: 30, type: 'sawtooth', dur: 1.1, gain: 0.18, send: 0.6 });
    this.tone({ freq: 2400, freqEnd: 400, type: 'sine', dur: 0.5, gain: 0.05, send: 0.9 });
  }

  clear() {
    const chord = [261.6, 329.6, 392, 523.3];
    chord.forEach((f, i) =>
      this.tone({ freq: f, type: 'sine', dur: 1.8, gain: 0.055, delay: i * 0.12, send: 1.2 }),
    );
  }

  click() {
    this.tone({ freq: 900, freqEnd: 600, type: 'square', dur: 0.05, gain: 0.03, send: 0.1 });
  }

  /** Which floor just arrived under your feet: 1, 2, or -1. */
  floorChime(n = 1) {
    const pair = n === 2 ? [660, 990] : n === -1 ? [300, 200] : [520, 780];
    const t = this.ctx ? this.ctx.currentTime : 0;
    this.tone({ freq: pair[0], type: 'square', dur: 0.09, gain: 0.035, send: 0.25 });
    this.tone({ freq: pair[1], type: 'square', dur: 0.09, gain: 0.03, send: 0.3, delay: 0.06 });
    this.tone({ freq: pair[0] * 0.5, type: 'sine', dur: 0.5, gain: 0.02, send: 0.5, delay: 0.01 });
    void t;
  }

  /** Nine rooms moving at once: stone grinding somewhere under everything. */
  swapRumble() {
    this.tone({ freq: 120, freqEnd: 40, type: 'sine', dur: 1.1, gain: 0.11, send: 0.8 });
    this.noise({ dur: 0.03, gain: 0.05, type: 'bandpass', freq: 1800, q: 1.4, send: 0.5, delay: 0.04 });
    this.noise({ dur: 0.9, gain: 0.03, type: 'lowpass', freq: 260, send: 0.7, delay: 0.02 });
  }

  /** A core shatters. Glass, then three bright falling shards. */
  glassBreak() {
    this.noise({ dur: 0.04, gain: 0.08, type: 'highpass', freq: 2600, send: 0.3 });
    for (const [f, i] of [[2400, 0], [3100, 0.045], [4200, 0.09]]) {
      this.tone({ freq: f, freqEnd: f * 0.62, type: 'triangle', dur: 0.32, gain: 0.03, send: 0.6, delay: i });
    }
  }

  /** b2 breaks: the whole structure drops a floor. */
  b2Quake() {
    this.tone({ freq: 30, type: 'sine', dur: 1.4, gain: 0.3, send: 0.9 });
    this.noise({ dur: 1.4, gain: 0.2, type: 'lowpass', freq: 200, send: 0.8 });
    this.noise({ dur: 0.5, gain: 0.06, type: 'bandpass', freq: 900, q: 0.9, send: 0.6, delay: 0.1 });
  }

  /** The maze stops: a long, settling exhale. */
  mcStopped() {
    this.tone({ freq: 220, freqEnd: 110, type: 'sine', dur: 1.6, gain: 0.08, send: 1.1 });
    this.tone({ freq: 110, freqEnd: 55, type: 'triangle', dur: 1.8, gain: 0.035, send: 1.2, delay: 0.05 });
  }

  /** Called each frame from the game loop. */
  update(dt, { danger = 0, paused = false } = {}) {
    if (!this.ready) return;
    if (paused) return;
    this._heartTimer -= dt;
    if (danger > 0.15 && this._heartTimer <= 0) {
      this._heartTimer = 1.15 - danger * 0.65;
      this.heartbeat(clamp(danger, 0.2, 1));
    }
    this._creakTimer -= dt;
    if (this._creakTimer <= 0) {
      this._creakTimer = 9 + Math.random() * 10;
      const f = 70 + Math.random() * 60;
      this.tone({ freq: f, freqEnd: f * 0.8, type: 'sine', dur: 1.6, gain: 0.025, send: 1 });
    }
  }
}

// Charms and items.
//
// A charm is a small permanent (per-run) upgrade. Two identical charms merge
// into the next level on the workbench, so the table below only describes what
// a level *does*; the inventory code handles merging.

const ITEMS = {
  pebbles: { id: 'pebbles', kind: 'throw', name: '一小堆石子', count: 3, noise: 1, kills: false },
  sharpStone: { id: 'sharpStone', kind: 'throw', name: '一块锋利的石头', count: 1, noise: 1, kills: true },
  vitamin: { id: 'vitamin', kind: 'use', name: '维他命', speed: 2, dur: 5 },
  totem: { id: 'totem', kind: 'use', name: '不死图腾', stress: 1 },
  star: { id: 'star', kind: 'use', name: '无敌星', invuln: 3, kills: true },
  corpse: { id: 'corpse', kind: 'throw', name: '同类的尸骸', lure: 5 },
  bugspray: { id: 'bugspray', kind: 'throw', name: '老旧的驱虫器', repel: 1 },
  scanner: { id: 'scanner', kind: 'use', name: '扫描仪', scan: 1 },
};

/** Six rows of four: two workbench cells, eight pack slots, four hotkeys, four charms. */
const SLOTS = {
  cols: 4,
  rows: 6,
};

/** Hotkey order on the number row: 1, 2, 4, 3. */
const HOTKEY_ORDER = [1, 2, 3, 4];

/**
 * Inventory: four charm sockets (only these take effect), four hotkey cells,
 * a two-cell workbench, and a deliberately small six-cell pack. Charms ride in
 * the pack until dragged into a socket, so every pickup competes for space.
 */
class Inventory {
  constructor() {
    this.pack = new Array(6).fill(null); // { kind:'item', id, n } | { kind:'charm', id, lvl }
    this.hot = new Array(4).fill(null); // references a pack entry
    this.charms = new Array(4).fill(null); // equipped, effective
    this.work = [null, null]; // charms moved out of pack/socket for fusing
    this.stones = 0;
  }

  /** Deep copy, keeping hotkey references pointing at the copied pack. */
  clone() {
    const c = new Inventory();
    const map = new Map();
    c.pack = this.pack.map((s) => {
      if (!s) return null;
      const copy = { ...s };
      map.set(s, copy);
      return copy;
    });
    c.hot = this.hot.map((h) => (h && map.get(h)) || null);
    c.charms = this.charms.map((s) => (s ? { ...s } : null));
    c.work = this.work.map((s) => (s ? { ...s } : null));
    c.stones = this.stones;
    return c;
  }

  /** Only equipped charms count. */
  level(id) {
    return this.charms.reduce((sum, c) => sum + (c && c.id === id ? c.lvl : 0), 0);
  }

  has(id) {
    return this.level(id) || 0;
  }

  charmAt(i) {
    return this.charms[i] || null;
  }

  count(id) {
    let n = 0;
    for (const s of this.pack) if (s && s.kind === 'item' && s.id === id) n += s.n;
    return n;
  }

  addItem(id, n = 1) {
    if (!ITEMS[id]) return false;
    for (const slot of this.pack) {
      if (slot && slot.kind === 'item' && slot.id === id) {
        slot.n += n;
        return true;
      }
    }
    const i = this.pack.indexOf(null);
    if (i < 0) return false;
    this.pack[i] = { kind: 'item', id, n };
    return true;
  }

  /** Charms drop into the pack; they must be dragged into a socket to work. */
  addCharm(id) {
    if (!CHARMS[id]) return 'bad';
    if (this.pack.indexOf(null) < 0) return 'full';
    this.pack[this.pack.indexOf(null)] = { kind: 'charm', id, lvl: 1 };
    return 'added';
  }

  /** Detach an entry from wherever it lives. */
  take(kind, i) {
    if (kind === 'pack') {
      const o = this.pack[i];
      if (!o) return null;
      this.pack[i] = null;
      for (let k = 0; k < this.hot.length; k++) if (this.hot[k] === o) this.hot[k] = null;
      return o;
    }
    if (kind === 'charm') {
      const o = this.charms[i];
      this.charms[i] = null;
      return o || null;
    }
    if (kind === 'work') {
      const o = this.work[i];
      this.work[i] = null;
      return o || null;
    }
    if (kind === 'hot') {
      const o = this.hot[i];
      this.hot[i] = null;
      return o ? { recycle: o } : null;
    }
    return null;
  }

  /** Place an object into a cell. */
  place(kind, i, o) {
    if (!o) return false;
    if (kind === 'pack') {
      if (this.pack[i]) return false;
      this.pack[i] = o;
      return true;
    }
    if (kind === 'charm') {
      if (this.charms[i] || !o || o.kind !== 'charm') return false;
      this.charms[i] = { kind: 'charm', id: o.id, lvl: o.lvl };
      return true;
    }
    if (kind === 'work') {
      if (this.work[i] || !o || o.kind !== 'charm') return false;
      this.work[i] = { kind: 'charm', id: o.id, lvl: o.lvl };
      return true;
    }
    if (kind === 'hot') {
      if (this.hot[i] || !o || o.kind !== 'item') return false;
      const def = ITEMS[o.id];
      if (!def) return false;
      // A hotkey is a pointer into the pack, never a second home for the stack:
      // if the object is not in the pack, the caller must put it back first.
      if (!this.pack.includes(o)) return false;
      this.hot[i] = o;
      return true;
    }
    return false;
  }

  /** Drag from one cell to another. Returns true when something changed. */
  move(fromKind, fromI, toKind, toI) {
    if (fromKind === toKind && fromI === toI) return false;
    if (fromKind === 'result') return false;
    const o = this.take(fromKind, fromI);
    if (!o) return false;
    if (o.recycle) return true;
    if (this.place(toKind, toI, o)) return true;
    if (fromKind === 'pack') this.pack[fromI] = o;
    else if (fromKind === 'charm') this.charms[fromI] = { kind: 'charm', id: o.id, lvl: o.lvl };
    else if (fromKind === 'work') this.work[fromI] = o;
    else if (fromKind === 'hot') this.hot[fromI] = o;
    return false;
  }

  craftable() {
    const [a, b] = this.work;
    if (!a || !b) return null;
    if (a.id !== b.id || a.lvl !== b.lvl) return null;
    if (a.lvl >= CHARMS[a.id].max) return null;
    return { kind: 'charm', id: a.id, lvl: a.lvl + 1 };
  }

  /** Consume both workbench charms and hand the result back (caller places it). */
  craft() {
    const out = this.craftable();
    if (!out) return null;
    this.work = [null, null];
    return out;
  }

  /** Spend one item from the pack; clears stale hotkey references. */
  consume(id) {
    const i = this.pack.findIndex((s) => s && s.kind === 'item' && s.id === id);
    if (i < 0) return false;
    const slot = this.pack[i];
    slot.n -= 1;
    if (slot.n <= 0) {
      this.pack[i] = null;
      for (let k = 0; k < this.hot.length; k++) if (this.hot[k] === slot) this.hot[k] = null;
    }
    return true;
  }

  bindHot(i, packIndex) {
    const slot = this.pack[packIndex];
    this.hot[i] = slot || null;
    return !!slot;
  }
}

/** Level N shows its own lines plus every earlier line: longer, never repeated. */
function charmText(id, lvl) {
  const c = CHARM_TEXT[id];
  if (!c) return '';
  return c.lines.slice(0, Math.max(1, lvl)).join('');
}
