          <div class="deep-glyph" id="dead-deep"></div>
          <div class="icon-row">
            <button class="btn icon" id="btn-retry" aria-label="再试">${icon('retry')}</button>
            <button class="btn icon" id="btn-dead-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen clear-screen hidden" id="scr-clear">
        <div class="panel">
          <svg class="panel-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <path class="burst" d="M50 8l7 26 20-18-8 27 27-6-22 19 26 8-27 6 18 21-26-9 2 27-17-22-17 22 2-27-26 9 18-21-27-6 26-8-22-19 27 6-8-27 20 18z"/>
          </svg>
          <div class="stats-glyphs" id="clear-stats"></div>
          <div class="icon-row">
            <button class="btn icon" id="btn-next" aria-label="下一间">${icon('next')}</button>
            <button class="btn icon" id="btn-clear-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen victory-screen hidden" id="scr-victory">
        <div class="panel">
          <svg class="panel-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="8" class="dot"/>
            <circle cx="50" cy="50" r="20" class="ring-dim"/>
            <circle cx="50" cy="50" r="32" class="ring-dim d2"/>
            <circle cx="50" cy="50" r="43" class="ring-dim d3"/>
          </svg>
          <div class="stats-glyphs" id="victory-stats"></div>
          <button class="btn icon" id="btn-victory-home" aria-label="标题">${icon('home')}</button>
        </div>
      </section>

      <div class="hud hidden" id="hud">
        <div class="hud-left">
          <span class="hud-num" id="hud-num" data-sector="I"></span>
          <span class="hud-sector" id="hud-sector"></span>
        </div>
        <div class="hud-right">
          <span class="diamond"></span>
          <span class="shard-bar" id="hud-shards"></span>
        </div>
        <div class="hud-charges" id="hud-charges"></div>
        <div class="hud-listen" id="hud-listen">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M14 20a6 6 0 0 1 12 0" class="l1"/>

    const $ = (id) => this.root.querySelector('#' + id);
    this.scr = {
      title: $('scr-title'),
      pause: $('scr-pause'),
      dead: $('scr-dead'),
      clear: $('scr-clear'),
      victory: $('scr-victory'),
    };
    this.hud = $('hud');
    this.grid = $('chamber-grid');
    this.nestGlyph = $('nest-glyph');
    this.foot = $('title-foot');
    this.hudNum = $('hud-num');
    this.hudSector = $('hud-sector');
    this.hudShards = $('hud-shards');
    this.hudCharges = $('hud-charges');
    this.hudListen = $('hud-listen');
    this.clearStats = $('clear-stats');
    this.victoryStats = $('victory-stats');
    this.deadDeep = $('dead-deep');

    // Buttons blur themselves so Space never triggers twice.
    const bind = (id, fn) => {
      const el = $(id);
      if (!el) return;
      el.addEventListener('click', (e) => {
        e.preventDefault();
        el.blur();
        fn();
      });
    };
    const g = this.game;
    bind('btn-start', () => g.startBest());
    bind('btn-edit', () => g.openEditor());
    bind('btn-resume', () => g.resume());
    bind('btn-restart', () => g.restart());
    bind('btn-mute', () => g.toggleMute());
    bind('btn-title', () => g.quitToTitle());
    bind('btn-retry', () => g.restart());
    bind('btn-dead-title', () => g.quitToTitle());
    bind('btn-next', () => g.next());
    bind('btn-clear-title', () => g.quitToTitle());
    bind('btn-victory-home', () => g.quitToTitle());
    this.muteBtn = $('btn-mute');
  }

  hideScreens() {
    for (const s of Object.values(this.scr)) s.classList.add('hidden');
  }

  showScreen(name) {
    this.hideScreens();
    this.scr[name].classList.remove('hidden');
  }

  showTitle(progress = {}) {
    this.showScreen('title');
    this.hideHUD();
    this.grid.innerHTML = '';
    const unlocked = progress.unlocked || 1;
    const cleared = new Set(progress.cleared || []);
    for (let i = 0; i < 8; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell' + (i < unlocked ? '' : ' locked') + (cleared.has(i) ? ' cleared' : '');
      // The chamber's number is drawn as bars, not written.
      let bars = '<span class="cell-bars">';
      for (let b = 0; b <= i; b++) bars += '<i></i>';
      bars += '</span>';
      cell.innerHTML = bars + (i < unlocked ? '' : '<span class="cell-slash"></span>');
      cell.disabled = i >= unlocked;
      cell.addEventListener('click', () => {
        cell.blur();
        this.game.startChamber(i);
      });
      this.grid.appendChild(cell);
    }
    this.nestGlyph.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('i');
      if (progress.worldCleared) p.className = 'done';
      this.nestGlyph.appendChild(p);
    }
    this.foot.innerHTML = progress.worldCleared ? `<span class="foot-rings">${icon('sound')}</span>` : '';
  }

  showGame() {
    this.hideScreens();
    this.hud.classList.remove('hidden');
  }

  hideHUD() {
    this.hud.classList.add('hidden');
  }

  showPause() {
    this.showScreen('pause');
    this.syncMute();
  }

  showDead({ deepest = null } = {}) {
    this.showScreen('dead');
    this.hideHUD();
    this.deadDeep.innerHTML = '';
    if (deepest != null) {
      const n = Math.min(8, deepest + 1);
      for (let i = 0; i < 8; i++) {
        const t = document.createElement('i');
        if (i < n) t.className = 'lit';
        this.deadDeep.appendChild(t);
      }
    }
  }

  showClear({ time = 0, pings = 0, isRecord = false } = {}) {
    this.showScreen('clear');
    this.hideHUD();
    this.clearStats.innerHTML = this._statRow(time, pings, isRecord);
  }

  showVictory() {
    this.showScreen('victory');
    this.hideHUD();
    this.victoryStats.innerHTML = this._statRow(0, 0, false);
  }

  showWorldVictory({ time = 0, pings = 0, isRecord = false } = {}) {
    this.showScreen('victory');
    this.hideHUD();
    this.victoryStats.innerHTML = this._statRow(time, pings, isRecord);
  }

  _statRow(time, pings, isRecord) {
    // Time and pings as bars; the record as a small bright ring.
    const tBars = Math.min(10, Math.max(1, Math.round(time / 30)));
    const pBars = Math.min(10, Math.max(0, Math.round(pings / 4)));
    let t = '<span class="stat"><span class="stat-bars">';
    for (let i = 0; i < 10; i++) t += `<i class="${i < tBars ? 'on' : ''}"></i>`;
    t += '</span></span>';
    let p = '<span class="stat"><span class="stat-bars amber">';
    for (let i = 0; i < 10; i++) p += `<i class="${i < pBars ? 'on' : ''}"></i>`;
    p += '</span></span>';
    const rec = isRecord ? '<span class="record-ring"></span>' : '';
    return `<div class="stat-row">${t}${p}${rec}</div>`;
  }

  setSector(num) {
    this.hudNum.dataset.sector = num;
    this.hudNum.innerHTML = '';
    const idx = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'].indexOf(num);
    const n = idx < 0 ? 1 : idx + 1;
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('i');
      d.className = 'sector-dot';
      if (i < n) d.classList.add('lit');
      this.hudNum.appendChild(d);
    }
    this.hudNum.classList.remove('pulse');
    void this.hudNum.offsetWidth;
    this.hudNum.classList.add('pulse');
  }

  updateHUD({ shards = 0, total = 1, charges = 0, listen = false, danger = 0 } = {}) {
    const collected = Math.max(0, total - shards);
    const filled = total ? Math.round((collected / total) * 12) : 0;
    let bar = '';
    for (let i = 0; i < 12; i++) bar += `<i class="${i < filled ? 'on' : ''}"></i>`;
    this.hudShards.innerHTML = bar;
    let ch = '';
    for (let i = 0; i < 3; i++) ch += `<i class="${i < charges ? 'on' : ''}"></i>`;
    this.hudCharges.innerHTML = ch;
    this.hudListen.classList.toggle('on', !!listen);
    this.hud.classList.toggle('sneaking', !!this.game.sneak);
    this.root.style.setProperty('--danger', String(danger || 0));
    this.syncMute();
  }

  syncMute() {
    if (!this.muteBtn) return;
    const muted = this.game.audio && this.game.audio.muted;
    this.muteBtn.innerHTML = icon(muted ? 'muted' : 'sound');
  }

  /** A shape where a sentence used to be: one soft ring. */
  intro() {
    this.root.classList.add('intro-ring');
    clearTimeout(this.introTimer);
    this.introTimer = setTimeout(() => this.root.classList.remove('intro-ring'), 1400);
  }

  /** Feedback without language: amber for a shard, red for a refusal. */
  toast(kind = 'shard') {
    const cls = kind === 'deny' ? 'flash-red' : 'flash-amber';
    this.root.classList.add(cls);
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.root.classList.remove(cls), 420);
  }

  dismiss() {
    clearTimeout(this.introTimer);
    clearTimeout(this.toastTimer);
    this.root.classList.remove('intro-ring', 'flash-red', 'flash-amber');
  }

  tick() {}
}

// ---- src/game.js ----

const SAVE_KEY = 'hush.save.v1';
const PING_MAX = 3;
const PING_REGEN = 2.4;
const PING_SPEED = 720;
const PING_LIFE = 0.9;
const WAVE_LISTEN = 620;
const THROUGH_WALL = 0.6;
const SHARD_ECHO_RANGE = 1150;
const SHARD_ECHO_SPEED = 1500;
const SOUND_SPEED = 560;
const STEP_RANGE = 215;
const SHARD_NOISE = 330;
const RAY_COUNT = 96;
const RAY_SPEED = 560;
const RAY_LIFE = 0.95;
const START_CHARGES = 3;

function makeDust(level, count = 130) {
  const dust = [];
  const rng = Math.random;
  for (let i = 0; i < count * 4 && dust.length < count; i++) {
    const x = 24 + rng() * (level.size.w - 48);
    const y = 24 + rng() * (level.size.h - 48);
    const tx = Math.floor(x / TILE);
    const ty = Math.floor(y / TILE);
    if (level.grid[ty * level.w + tx] !== 0) continue;
    dust.push({
      x,
      y,
      vx: (rng() * 2 - 1) * 5,
      vy: (rng() * 2 - 1) * 5,
      phase: rng() * Math.PI * 2,
    });
  }
  return dust;
}

class Game {
  constructor(canvas, uiRoot) {
    this.canvas = canvas;
    this.audio = new AudioEngine();
    this.input = new Input(window, canvas);
    this.renderer = new Renderer(canvas);
    this.ui = new UI(uiRoot, this);
    this.state = 'title';
    this.now = 0;
    this.last = 0;
    this.timeScale = 1;
    this.progress = this.loadProgress();

    this.level = null;
    this.player = null;
    this.hunters = [];
    this.skitters = [];
    this.shards = [];
    this.particles = [];
    this.pings = [];
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.echoRings = [];
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.camX = 0;
    this.camY = 0;
    this.chamberIndex = 0;
    this.denyCooldown = 0;
    this.alertCd = 0;
    this.titlePingTimer = 0;

    this.ui.build();
    this.editor = new Editor(this);
    this.ui.showTitle(this.progress);
    this.loadDemo();

    this.input.onAnyKey = () => {
      if (this.state === 'title') {
        this.audio.unlock();
        this.startBest();
      }
    };
    window.addEventListener('resize', () => this.renderer.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.state === 'playing') this.pause();
    });
    window.addEventListener('blur', () => {
      if (this.state === 'playing' && !this.frozen) this.pause();
    });

    requestAnimationFrame(this.frame);
  }

  // ---------------------------------------------------------------- progress
  loadProgress() {
    const fallback = { unlocked: 1, cleared: [], last: 0, best: {} };
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return fallback;
      const data = JSON.parse(raw);
      if (typeof data.unlocked !== 'number') return fallback;
      const best = {};
      if (data.best && typeof data.best === 'object') {
        for (const [k, v] of Object.entries(data.best)) {
          const i = Number(k);
          if (!Number.isInteger(i) || !v || typeof v.time !== 'number') continue;
          best[i] = { time: v.time, pings: Math.max(0, v.pings | 0) };
        }
      }
      return {
        unlocked: clamp(data.unlocked, 1, CHAMBERS.length),
        cleared: Array.isArray(data.cleared) ? data.cleared : [],
        last: typeof data.last === 'number' ? data.last : 0,
        best,
      };
    } catch {
      return fallback;
    }
  }

  saveProgress() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.progress));
    } catch {
      /* storage can fail in private mode — progress is a nicety */
    }
  }

  // ------------------------------------------------------------------- setup
  loadDemo() {
    const cfg = CHAMBERS[CHAMBERS.length - 1];
    this.level = generateLevel(777, { shards: 5, hunters: 5, style: cfg.style });
    this.player = null;
    this.hunters = [];
    this.shards = this.level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.sounds = [];
    this.flashes = [];
    this.sneak = false;
    this.debugMode = false;
    this.debugFreeze = false;
    this.blind = false;
    this.particles = makeDust(this.level);
    this.camX = this.level.size.w / 2;
    this.camY = this.level.size.h / 2;
    this.titlePingTimer = 0.2;
    this.exitOpen = false;
    this.state = 'title';
  }

  startBest() {
    if (this.state !== 'title') return;
    if (this.startWorld()) return;
    const idx = clamp((this.progress.unlocked || 1) - 1, 0, CHAMBERS.length - 1);
    this.startChamber(idx);
  }

  /** Dev/experimental: one continuous map, no chamber select. */
  startWorld(seed = 424242) {
    const level = generateWorld(seed);
    if (!level) return false;
    this.worldSeed = seed;
    this.customData = null;
    this.audio.unlock();
    this.worldMode = true;
    this.level = level;
    this.chamberIndex = 0;
    this.totalShards = level.shards.length;
    this.player = new Player(level.spawn.x, level.spawn.y);
    this.hunters = level.hunters.map((h) => new Hunter(h.x, h.y));
    this.skitters = (level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.echoRings = [];
    this.particles = makeDust(level, 260);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = true;
    this.echoHeard = false;
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.sector = sectorOf(this.player.x, this.player.y, level);
    this.state = 'playing';
    this.ui.showGame();
    return true;
  }

  /** Build mode: play the map the player drew. */
  startCustom(data) {
    this.customData = data;
    this.worldMode = false;
    const w = data.w;
    const h = data.h;
    const grid = Uint8Array.from(data.cells);
    const toWorld = (t) => ({ x: (t.x + 0.5) * TILE, y: (t.y + 0.5) * TILE });
    const level = {
      w, h, tile: TILE, grid,
      size: { w: w * TILE, h: h * TILE },
      rooms: [],
      spawn: toWorld(data.spawn),
      spawnTile: { ...data.spawn },
      exit: toWorld(data.exit),
      exitTile: { ...data.exit },
      shards: data.shards.map((t, i) => ({ ...toWorld(t), tile: { ...t }, id: i })),
      hunters: data.hunters.map((t) => toWorld(t)),
      skitters: data.skitters.map((t) => toWorld(t)),
      seed: 'custom',
    };
    if (!level.shards.length) {
      // A map with nothing to gather is a map with nothing to do.
      level.shards = [{ ...toWorld(data.exit), tile: { ...data.exit }, id: 0 }];
      level.shards[0].x = (data.exit.x + 0.5) * TILE - TILE * 2;
    }
    this.audio.unlock();
    this.worldMode = false;
    this.level = level;
    this.chamberIndex = 0;
    this.totalShards = level.shards.length;
    this.player = new Player(level.spawn.x, level.spawn.y);
    this.hunters = level.hunters.map((hh) => new Hunter(hh.x, hh.y));
    this.skitters = (level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.sounds = [];
    this.echoRings = [];
    this.particles = makeDust(level, 200);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.sneak = false;
    this.blind = false;
    this.humT = 99;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.sector = 0;
    this.state = 'playing';
    this.ui.showGame();
  }

  openEditor() {
    this.audio.unlock();
    this.state = 'edit';
    this.ui.hideScreens();
    this.ui.hideHUD();
    this.editor.open();
  }

  closeEditor() {
    this.editor.close();
    this.state = 'title';
    this.loadDemo();
    this.ui.showTitle(this.progress);
  }

  startChamber(index) {
    this.audio.unlock();
    this.chamberIndex = clamp(index, 0, CHAMBERS.length - 1);
    const cfg = CHAMBERS[this.chamberIndex];
    this.level = generateLevel(cfg.seed, {
      shards: cfg.shards,
      hunters: cfg.hunters,
      skitters: cfg.skitters || 0,
      style: cfg.style,
    }) || generateLevel(cfg.seed, { shards: cfg.shards, hunters: cfg.hunters, style: 'halls' });
    this.player = new Player(this.level.spawn.x, this.level.spawn.y);
    this.hunters = this.level.hunters.map((h) => new Hunter(h.x, h.y));
    this.skitters = (this.level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = this.level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.particles = makeDust(this.level);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.echoRings = [];
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.echoRequired = !!cfg.echoGate;
    this.state = 'playing';
    this.progress.last = this.chamberIndex;
    this.saveProgress();
    this.ui.showGame();
  }

  restart() {
    if (this.state !== 'playing' && this.state !== 'dead' && this.state !== 'paused') return;
    // Same room, same seed — a retry must not quietly hand you a new map.
    if (this.worldMode) this.startWorld(this.worldSeed ?? 424242);
    else if (this.customData) this.startCustom(this.customData);
    else this.startChamber(this.chamberIndex);
    if (this.state !== 'playing') this.state = 'playing';
  }

  toggleMute() {
    const muted = this.audio.toggleMute();
    this.ui.toast(muted ? 'deny' : 'shard');
    this.ui.syncMute();
    return muted;
  }

  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    this.ui.showPause();
    if (this.audio.ctx) this.audio.ctx.suspend();
  }

  resume() {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    this.ui.hideScreens();
    if (this.audio.ctx) this.audio.ctx.resume();
  }

  quitToTitle() {
    this.ui.hideScreens();
    this.loadDemo();
    this.ui.showTitle(this.progress);
  }

  next() {
    if (this.chamberIndex + 1 < CHAMBERS.length) {
      this.startChamber(this.chamberIndex + 1);
    } else {
      this.victory();
    }
  }

  victory() {
    this.state = 'victory';
    this.ui.dismiss();
    this.ui.showVictory(this.progress);
  }

  // ------------------------------------------------------------------- loop
  frame = (ts) => {
    requestAnimationFrame(this.frame);
    if (!this.last) this.last = ts;
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    if (!Number.isFinite(dt)) dt = 0;
    dt = Math.min(dt, 0.05);

    if (!this.frozen) {
      if (this.state !== 'paused') this.now += dt;
      this.handleGlobalKeys();

      if (this.state === 'playing') this.update(dt);
      else if (this.state === 'title') this.updateTitle(dt);
      else if (this.state === 'dead') this.updateDead(dt);
      else if (this.state === 'complete' || this.state === 'victory') this.updateIdle(dt);
      else if (this.state === 'paused') this.updateIdle(0);
    }

    this.render();
    this.ui.tick(dt);
    this.input.endFrame();
  };

  handleGlobalKeys() {
    if (this.input.consume('KeyM')) this.toggleMute();
    if (this.input.consume('Backquote')) {
      this.debugMode = !this.debugMode;
      if (!this.debugMode) this.debugFreeze = false;
      this.ui.toast(this.debugMode ? 'shard' : 'deny');
    }
    if (this.debugMode && this.input.consume('Digit1')) {
      this.debugFreeze = !this.debugFreeze;
      this.ui.toast(this.debugFreeze ? 'deny' : 'shard');
    }
    if (this.state === 'edit' && this.input.consume('Escape')) this.closeEditor();
    else if (this.state === 'playing' && this.input.consume('Escape')) this.pause();
    else if (this.state === 'paused' && this.input.consume('Escape')) this.resume();
    else if (this.state === 'dead' && this.input.consume('KeyR')) this.restart();
    else if (this.state === 'playing' && this.input.consume('KeyR')) this.restart();
    else if (this.state === 'complete' && (this.input.consume('Enter') || this.input.consume('Space'))) {
      this.next();
    }
  }

  updateTitle(dt) {
    this.titlePingTimer -= dt;
    if (this.titlePingTimer <= 0) {
      this.titlePingTimer = 2.4 + Math.random() * 1.6;
      const rooms = this.level.rooms;
      const r = rooms[Math.floor(Math.random() * rooms.length)];
      this.pings.push({
        x: (r.x + r.w / 2) * TILE,
        y: (r.y + r.h / 2) * TILE,
        t0: this.now,
        speed: PING_SPEED,
        life: PING_LIFE,
        heard: new Set(),
      });
      this.spawnRays((r.x + r.w / 2) * TILE, (r.y + r.h / 2) * TILE);
    }
    this.pings = this.pings.filter((p) => this.now - p.t0 < p.life + 0.15);
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 20);
    this.danger = 0;
  }

  updateDead(dt) {
    this.deathT += dt;
    this.shake = Math.max(0, this.shake - dt * 26);
    this.updateRays(dt);
    this.updateParticles(dt);
    this.pings = this.pings.filter((p) => this.now - p.t0 < p.life + 0.2);
    if (this.deathT > 0.75) {
      if (this.worldMode) {
        this.ui.worldLabels = CHAMBERS.map((c) => c.title);
        this.ui.showDead({ sector: this.sector, deepest: this.maxSector ?? 0 });
      } else {
        this.ui.showDead();
      }
    }
  }

  updateIdle(dt) {
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 30);
  }

  update(dt) {
    const p = this.player;
    const L = this.level;
    if (this.debugFreeze && this.debugMode) {
      this.updateRays(0);
      this.updateParticles(dt);
      this.ui.updateHUD({
        chamber: this.chamberLabel,
        shards: this.totalShards - this.shards.length,
        total: this.totalShards,
        charges: this.charges,
        listen: this.listen,
        muted: this.audio.muted,
        danger: this.danger,
      });
      return;
    }
    this.levelTime += dt;

    // Shift is HELD, not toggled: silent and blind while the key is down.
    const sneaking = this.input.down('ShiftLeft') || this.input.down('ShiftRight');
    if (sneaking !== this.sneak) {
      this.sneak = sneaking;
      this.audio.click(0.4);
      if (this.sneak) this.audio.noise({ dur: 0.25, gain: 0.01, type: 'lowpass', freq: 300, send: 0.4 });
    }
    this.blind = false; // sneaking is silence, not blindness: you still see every line
    const creeping = this.sneak;
    const run = false;
    const move = this.debugMove || this.input.moveVector();

    const listen = !this.sneak && (this.debugListen === true || (this.listenT > 0.26 && !p.moving));
    this.listen = listen;
    const motion = p.update(dt, move, { run, listen, creep: this.sneak });
    const resolved = this.resolve(p, motion.x, motion.y);
    p.x = resolved.x;
    p.y = resolved.y;
    const k = Math.min(1, dt * 7);
    this.camX += (p.x - this.camX) * k;
    this.camY += (p.y - this.camY) * k;

    if (p.moving) this.listenT = 0;
    else this.listenT = Math.min(1, this.listenT + dt);

    // footsteps
    if (p.moving && !this.sneak) {
      if (p.stepPhase > 58) {
        p.stepPhase = 0;
        this.audio.footstep(0, 0.85);
        this.stepEcho(p.x, p.y);
      }
    }

    // pinging
    if ((this.input.consume('Space') || this.input.consume('Mouse0') || this.input.consume('KeyJ')) && this.charges > 0) {
      if (this.sneak) {
        this.audio.deny();
        if (!this.sneakHintShown) {
          this.sneakHintShown = true;
          this.audio.noise({ dur: 0.4, gain: 0.02, type: 'lowpass', freq: 240, send: 0.5 });
        }
      } else {
        this.firePing();
      }
    }


    // charge regen
    if (this.charges < PING_MAX) {
      this.chargeTimer -= dt;
      if (this.chargeTimer <= 0) {
        this.charges++;
        this.chargeTimer = this.charges < PING_MAX ? PING_REGEN : 0;
        this.audio.tone({ freq: 1200, type: 'sine', dur: 0.1, gain: 0.02, send: 0.2 });
      }
    }

    // pings: expand, alert hunters as the shell reaches them
    for (const ping of this.pings) {
      const age = this.now - ping.t0;
      if (age < 0 || age > ping.life) continue;
    }
    this.pings = this.pings.filter((ping) => this.now - ping.t0 < ping.life + 0.2);

    // shards
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const sh = this.shards[i];
      if (dist(p.x, p.y, sh.x, sh.y) < 22) {
        this.shards.splice(i, 1);
        this.collected++;
        this.audio.shard();
        this.flash = 1;
        this.shake = Math.max(this.shake, 2.5);
        this.stepEcho(p.x, p.y, null, { count: 34, speed: 380, life: 0.7 });
        if (this.shards.length === 0) this.tryOpenExit(true);
      }
    }

    // exit
    if (this.exitOpen && dist(p.x, p.y, L.exit.x, L.exit.y) < 30) {
      this.complete();
      return;
    } else if (!this.exitOpen && dist(p.x, p.y, L.exit.x, L.exit.y) < 34) {
      if (this.denyCooldown <= 0) {
        this.audio.deny();
        if (this.shards.length > 0) this.ui.toast('deny');
        this.denyCooldown = 2.2;
      }
    }
    this.denyCooldown -= dt;
    this.alertCd -= dt;

    // skitters: deaf, fast, silent until they are close. No sound can warn
    // you early, so contact is the only rule that matters.
    for (const sk of this.skitters) {
      sk.update(dt, this);
      if (dist(p.x, p.y, sk.x, sk.y) < p.r + sk.r - 1) {
        this.die();
        return;
      }
    }

    // hunters
    let nearest = Infinity;
    for (const h of this.hunters) {
      h.update(dt, this);
      const d = dist(p.x, p.y, h.x, h.y);
      if (d < nearest) nearest = d;
      if (d < p.r + h.r - 1) {
        this.die();
        return;
      }
    }

    if (this.worldMode) {
      const sec = sectorOf(p.x, p.y, L);
      if (sec !== this.sector) {
        this.sector = sec;
        this.maxSector = Math.max(this.maxSector ?? 0, sec);
        const cfg = CHAMBERS[sec];
        this.ui.setSector(cfg.num, cfg.title);
        this.audio.setSector(sec);
      }
    }

    this.danger = this.hunters.length
      ? clamp(1 - (nearest - 55) / 300, 0, 1)
      : 0;
    if (this.danger > 0.4) this.danger = Math.min(1, this.danger + 0.1);

    for (let i = this.echoRings.length - 1; i >= 0; i--) {
      if (this.now - this.echoRings[i].t > 1.4) this.echoRings.splice(i, 1);
    }
    if (this.echoRequired && !this.echoHeard && this.shards.length === 0) {
      this.humT -= dt;
      if (this.humT <= 0) {
        this.humT = 3.6;
        this.audio.gateHum();
        this.stepEcho(L.exit.x, L.exit.y, '140,240,170', { count: 18, speed: 260, life: 0.9, tagged: false });
      }
    }

    this.audio.update(dt, { danger: this.danger });
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 24);
    this.flash = Math.max(0, this.flash - dt * 3.4);
    this.ui.updateHUD({
      chamber: this.chamberIndex,
      shards: this.shards.length,
      total: this.totalShards || CHAMBERS[this.chamberIndex].shards,
      charges: this.charges,
      listen,
      muted: this.audio.muted,
      danger: this.danger,
    });
  }

  // Every noise source goes through here, so the "it heard that" stinger stays
  // tied to the moment a hunter actually wakes up rather than to every step.
  /** A mimic repeated something. Hunters turn toward it, the room gets a
   *  visible ring, and a sealed door that hears an answer unlocks. */
  onEcho(m, kind, src) {
    m.echoCool = 2.0;
    m.revealT = 1.8;
    const pan = clamp((m.x - this.player.x) / 480, -1, 1) * 0.9;
    this.audio.echo(pan, kind);
    this.echoRings.push({ x: m.x, y: m.y, t: this.now, kind });
    for (const h of this.hunters) {
      if (dist(m.x, m.y, h.x, h.y) < 520) this.alertHunter(h, m.x, m.y, 0.15);
    }
    const byPlayer = kind === 'ping' || kind === 'step' || kind === 'shard';
    if (this.echoRequired && !this.echoHeard && byPlayer
      && dist(m.x, m.y, this.level.exit.x, this.level.exit.y) < 620) {
      this.echoHeard = true;
      this.tryOpenExit(false);
    }
  }

  /** The exit stays shut until the door has heard a doubled sound, not just
   *  the shards. No text explains this: the door hums, something answers. */
  tryOpenExit(withFanfare = false) {
    if (this.exitOpen) return false;
    if (this.shards.length > 0) return false;
    if (this.echoRequired && !this.echoHeard) return false;
    this.exitOpen = true;
    this.audio.gateOpen();
    this.shake = Math.max(this.shake, 6);
    if (withFanfare) this.ui.toast('shard');
    return true;
  }

  alertHunter(h, x, y, delay) {
    const tracking = h.state === 'investigate';
    h.hear(x, y, delay);
    if (tracking || this.alertCd > 0) return;
    this.alertCd = 0.75;
    const pan = clamp((h.x - this.player.x) / 420, -1, 1) * 0.8;
    this.audio.alert(pan);
  }

  resolve(entity, dx, dy) {
    const L = this.level;
    return moveCircle(L.grid, L.w, L.h, L.tile, entity.x, entity.y, entity.r, dx, dy);
  }

  /** Spawn a fan of sonar rays that bounce off walls and leave light trails. */
  /** A sound line touched a body: it now knows the tagged origin of that sound.
   *  Newer tags overwrite older ones; an equal tag changes nothing. */
  onRayTouch(e, tag) {
    if (!e || !tag) return;
    if (e instanceof Hunter) {
      if (tag.t <= (e.lastTag ?? -1)) return;
      e.lastTag = tag.t;
      this.alertHunter(e, tag.x, tag.y, 0.14);
    } else if (e instanceof Skitter) {
      if (tag.t <= (e.lastTag ?? -1)) return;
      e.lastTag = tag.t;
      e.hear(tag.x, tag.y, tag.kind, tag.kind === 'ping' ? 1.05 : 1.35);
    }
  }

  /** Which body a ray touched, if any. */
  /** What a ray is allowed to touch. Colour is knowledge: gold is a shard,
   *  green is the door, red is something that hunts you. */
  hitEntity(x, y) {
    for (const sh of this.shards) {
      if (dist(x, y, sh.x, sh.y) < 13) return { e: sh, kind: 'shard', tint: '255,205,110' };
    }
    const ex = this.level.exit;
    if (dist(x, y, ex.x, ex.y) < 17) return { e: ex, kind: 'exit', tint: '140,240,170' };
    for (const h of this.hunters) {
      if (dist(x, y, h.x, h.y) < 15) return { e: h, kind: 'hunter', tint: '255,58,58', hot: true };
    }
    for (const sk of this.skitters) {
      if (dist(x, y, sk.x, sk.y) < 12) return { e: sk, kind: 'skitter', tint: '255,58,58', hot: true };
    }
    return null;
  }

  /** Every footstep is a small sonar ring. White for you and for hunters,
   *  blue for the mimic, which is neither prey nor predator. */
  // A footstep is a small sonar burst and nothing else: no ring, no centre dot.
  // Only the player's own bursts carry a tag; a hunter's steps are mute.
  stepEcho(x, y, tint = null, opts = {}) {
    const count = opts.count ?? 22;
    const speed = opts.speed ?? 330;
    const life = opts.life ?? 0.58;
    const tag = opts.tagged === false ? null : undefined;
    this.spawnRays(x, y, { count, speed, life, tint, tag, kind: opts.kind || 'step' });
  }

  spawnRays(x, y, { count = RAY_COUNT, speed = RAY_SPEED, life = RAY_LIFE, tint = null, kind = 'ping', tag = undefined } = {}) {
    const stamp = tag === null ? null : tag || { x, y, t: this.now, kind };
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.035;
      this.rays.push({
        x,
        y,
        dx: Math.cos(a),
        dy: Math.sin(a),
        age: 0,
        speed,
        life: life * (0.85 + Math.random() * 0.25),
        bounce: 0,
        hot: false,
        tint,
        tag: stamp,
        pts: [{ x, y }],
      });
    }
    while (this.rays.length > RAY_COUNT * 4) this.rays.shift();
  }

  /** Advance every ray, reflecting off walls and pruning dead trails. */
  updateRays(dt) {
    const L = this.level;
    if (!L) return;
    const alive = [];
    for (let i = 0; i < this.rays.length; i++) {
      const r = this.rays[i];
      r.age += dt;
      if (r.age > r.life + 1.5) continue;
      if (r.age <= r.life) {
        let move = (r.speed || RAY_SPEED) * dt;
        while (move > 0.001) {
          const d = Math.min(6, move);
          move -= d;
          const nx = r.x + r.dx * d;
          const ny = r.y + r.dy * d;
          const ent = this.hitEntity(nx, ny);
          if (ent) {
            ent.e.seenAt = this.now;
            if (r.tag) this.onRayTouch(ent.e, r.tag);
            r.tint = ent.tint;
            r.hot = !!ent.hot;
            if (ent.hot) {
              r.life += 0.55;
              this.flashes.push({ x: ent.e.x, y: ent.e.y, t: this.now });
            }
            this.contacts.push({ x: r.x, y: r.y, t: this.now, kind: ent.kind });
            const nlen = Math.hypot(r.x - ent.e.x, r.y - ent.e.y) || 1;
            const nxn = (r.x - ent.e.x) / nlen;
            const nyn = (r.y - ent.e.y) / nlen;
            const dot = r.dx * nxn + r.dy * nyn;
            r.dx -= 2 * dot * nxn;
            r.dy -= 2 * dot * nyn;
            r.x += r.dx * 3;
            r.y += r.dy * 3;
            r.bounce++;
            if (r.bounce >= 3) { r.age = Math.max(r.age, r.life); break; }
            continue;
          }
          const hitX = isSolid(L.grid, L.w, L.h, Math.floor(nx / TILE), Math.floor(r.y / TILE));
          const hitY = isSolid(L.grid, L.w, L.h, Math.floor(r.x / TILE), Math.floor(ny / TILE));
          if (hitX) r.dx *= -1;
          if (hitY) r.dy *= -1;
          if (hitX || hitY) {
            r.bounce++;
            this.contacts.push({ x: r.x, y: r.y, t: this.now });
          }
          r.x = hitX ? r.x : nx;
          r.y = hitY ? r.y : ny;
          const last = r.pts[r.pts.length - 1];
          if (Math.abs(r.x - last.x) + Math.abs(r.y - last.y) >= 5) {
            r.pts.push({ x: r.x, y: r.y });
            if (r.pts.length > 14) r.pts.shift();
          }
          if (r.bounce >= 3) {
            r.age = Math.max(r.age, r.life);
            break;
          }
        }
      }
      alive.push(r);
    }
    this.rays = alive;
    if (this.flashes.length) this.flashes = this.flashes.filter((f) => this.now - f.t < 0.55);
    if (this.contacts.length > 40) {
      let cut = 0;
      while (cut < this.contacts.length && this.now - this.contacts[cut].t > 1.9) cut++;
      if (cut) this.contacts.splice(0, cut);
      if (this.contacts.length > 600) this.contacts.splice(0, this.contacts.length - 600);
    }
  }

  firePing() {
    if (this.charges < 1) {
      this.audio.deny();
      return;
    }
    this.charges--;
    if (this.chargeTimer <= 0) this.chargeTimer = PING_REGEN;
    const p = this.player;
    this.pings.push({
      x: p.x,
      y: p.y,
      t0: this.now,
      speed: PING_SPEED,
      life: PING_LIFE,
      heard: new Set(),
    });
    this.pingsUsed++;
    this.spawnRays(p.x, p.y);
    this.audio.ping();
    this.echoShards(p.x, p.y);
    this.shake = Math.max(this.shake, 2.4);
    this.flash = 0.85;
    if (!this.pingHintShown) {
      this.pingHintShown = true;
      this.ui.toast('shard');
    }

  }

  /** The shards are not silent. A pulse reaching them is answered by a bell
   *  whose delay is its distance and whose pan is its bearing — navigation by
   *  ear, never by pointer. */
  echoShards(px, py) {
    const reached = [];
    for (const sh of this.shards) {
      const d = dist(px, py, sh.x, sh.y);
      if (d > SHARD_ECHO_RANGE) continue;
      const delay = d / SHARD_ECHO_SPEED;
      const gain = 0.05 * (1 - d / SHARD_ECHO_RANGE) ** 1.4 + 0.006;
      const pan = echoPan(sh.x - px, sh.y - py);
      this.audio.shardEcho(pan, gain, delay);
      reached.push({ id: sh.id, d: Math.round(d), delay: +delay.toFixed(3) });
    }
    reached.sort((a, b) => a.d - b.d);
    this.lastShardEchoes = reached.slice(0, 4);
  }

  die() {
    if (this.state !== 'playing') return;
    if (this.debugInvincible) return;
    this.state = 'dead';
    this.deathT = 0;
    this.shake = 18;
    this.flash = 0;
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.audio.death();
    this.ui.dismiss();
    this.ui.hideHUD();
  }

  complete() {
    if (this.state !== 'playing') return;
    if (this.worldMode) {
      const time = Math.max(0, this.levelTime);
      const prev = this.progress.worldBest;
      const isRecord = !prev || time < prev.time;
      if (isRecord) this.progress.worldBest = { time, pings: this.pingsUsed };
      this.progress.worldCleared = true;
      this.saveProgress();
      this.state = 'victory';
      this.audio.clear();
      this.ui.dismiss();
      this.ui.showWorldVictory({
        time,
        pings: this.pingsUsed,
        best: this.progress.worldBest,
        isRecord,
        shards: this.collected,
      });
      return;
    }
    this.state = 'complete';
    this.audio.clear();
    const cleared = new Set(this.progress.cleared);
    cleared.add(this.chamberIndex);
    this.progress.cleared = [...cleared];
    this.progress.unlocked = Math.max(this.progress.unlocked, this.chamberIndex + 2);
    this.progress.last = this.chamberIndex;
    const prev = this.progress.best[this.chamberIndex];
    const time = Math.max(0, this.levelTime);
    const isRecord =
      !prev || time < prev.time || (time === prev.time && this.pingsUsed < prev.pings);
    if (isRecord) {
      this.progress.best[this.chamberIndex] = { time, pings: this.pingsUsed };
    }
    this.saveProgress();
    this.ui.dismiss();
    this.ui.showClear({
      chamber: this.chamberIndex,
      time,
      pings: this.pingsUsed,
      best: this.progress.best[this.chamberIndex],
      isRecord,
      last: this.chamberIndex === CHAMBERS.length - 1,
    });
  }

  updateParticles(dt) {
    if (!this.level) return;
    const W = this.level.size.w;
    const H = this.level.size.h;
    for (const p of this.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < 0) p.x += W;
      if (p.x > W) p.x -= W;
      if (p.y < 0) p.y += H;
      if (p.y > H) p.y -= H;
    }
  }

  render() {
    this.renderer.draw(this);
  }

  // Debug hooks used by the headless screenshot script.
  debugPing() {
    if (this.state === 'playing') this.firePing();
  }

  // Deterministic capture: step the world forward without relying on rAF,
  // then leave one ping mid-flight so the sonar shell is visible.
  debugSimulate(seconds, opts = {}) {
    this.debugMove = opts.move || null;
    const dt = 1 / 60;
    const steps = Math.max(1, Math.round(seconds / dt));
    let next = opts.every || 0;
    for (let i = 0; i < steps; i++) {
      if (next && this.now >= next) {
        next += opts.every;
        this.pings.push({
          x: this.player.x,
          y: this.player.y,
          t0: this.now,
          speed: PING_SPEED,
          life: PING_LIFE,
          heard: new Set(),
        });
        this.spawnRays(this.player.x, this.player.y);
      }
      this.now += dt;
      this.update(dt);
    }
    if (opts.ping && this.player) {
      const wave = opts.wave ?? 0.45;
      this.pings.push({
        x: this.player.x,
        y: this.player.y,
        t0: this.now - wave,
        speed: PING_SPEED,
        life: PING_LIFE,
        heard: new Set(),
      });
      this.spawnRays(this.player.x, this.player.y);
      if (wave > 0) this.updateRays(wave);
    }
    this.debugMove = null;
    this.frozen = true;
  }
}

// ---- src/main.js ----

// Surface any runtime error instead of failing to a black screen.
window.addEventListener('error', (e) => {
  document.title = `ERR ${e.message}`;
  const pre = document.createElement('pre');
  pre.id = 'err';
  pre.style.cssText =
    'position:fixed;z-index:99;inset:0 0 auto 0;margin:0;padding:12px;color:#ff8a8a;' +
    'background:#120404;font:12px/1.5 monospace;white-space:pre-wrap';
  pre.textContent = `${e.message}\n${e.filename}:${e.lineno}:${e.colno}`;
  document.body.appendChild(pre);
});

const params = new URLSearchParams(location.search);
if (params.has('static')) document.documentElement.classList.add('no-anim');

const canvas = document.getElementById('game');
const game = new Game(canvas, document.getElementById('ui'));
window.__hush = game;
if (params.has('edit')) setTimeout(() => game.openEditor(), 60);
if (params.has('hunt')) {
  setTimeout(() => {
    game.startChamber(1);
    const L = game.level;
    const T = L.tile;
    const px = Math.floor(game.player.x / T);
    const py = Math.floor(game.player.y / T);
    let spot = null;
    for (let r = 6; r <= 7 && !spot; r++) {
      for (const [dx, dy] of [[r, 0], [-r, 0], [0, r], [0, -r], [r, r], [-r, -r], [r, -r], [-r, r]]) {
        const x = px + dx;
        const y = py + dy;
        if (x > 1 && y > 1 && x < L.w - 1 && y < L.h - 1 && !L.grid[y * L.w + x]) {
          spot = { x: (x + 0.5) * T, y: (y + 0.5) * T };
          break;
        }
      }
    }
    const h = game.hunters[0];
    if (spot) { h.x = spot.x; h.y = spot.y; }
    h.hear(game.player.x, game.player.y, 0.05);
    game.debugSimulate(0.75, {});
    game.stepEcho(h.x, h.y, '255, 70, 70');
    game.debugSimulate(0.16, {});
  }, 700);
}
if (params.has('red')) {
  setTimeout(() => {
    game.startChamber(1);
    game.stepEcho(game.player.x + 40, game.player.y + 2, '255, 70, 70');
    game.debugSimulate(0.2, {});
  }, 700);
}
if (params.has('debug')) {
  setTimeout(() => {
    game.debugMode = true;
  }, 600);
}
if (params.has('blue')) {
  setTimeout(() => {
    game.startChamber(0);
    game.stepEcho(game.player.x + 70, game.player.y, '110, 180, 255');
    game.debugSimulate(0.24, {});
  }, 900);
}

// Debug / screenshot helpers. None of this is reachable from the UI.
const chamber = params.get('c');
if (chamber !== null) {
  const idx = Number(chamber);
  if (Number.isFinite(idx)) {
    // Let the first frame settle, then jump straight into a chamber.
    setTimeout(() => game.startChamber(Math.max(0, Math.min(7, idx))), 60);
  }
}
const sim = params.get('sim');
if (sim !== null) {
  setTimeout(() => {
    game.debugInvincible = true;
    game.debugSimulate(Number(sim) || 2, {
      wave: Number(params.get('wave') ?? 0.45),
      every: Number(params.get('every') || 0),
      ping: params.has('ping'),
      move: params.has('move') ? { x: 1, y: 0 } : null,
    });
  }, 500);
} else if (params.has('ping')) {
  setInterval(() => game.debugPing(), 700);
}
if (params.has('listen')) {
  game.debugListen = true;
}
const freeze = params.get('freeze');
if (freeze !== null) {
  setTimeout(
    () => {
      game.frozen = true;
    },
    Math.max(0, Number(freeze) || 0),
  );
}

// Experimental: walk the single continuous map.
if (params.has('world')) {
  setTimeout(() => {
    game.startWorld(Number(params.get('world')) || 424242);
  }, 250);
}

// Force one of the end screens for visual checks.
const doc = params.get('doc');
if (doc) {
  setTimeout(() => {
    if (doc === 'dead') {
      game.die();
      game.ui.showDead();
    } else if (doc === 'clear') {
      game.complete();
    } else if (doc === 'victory') {
      game.chamberIndex = 7;
      game.victory();
    } else if (doc === 'pause') {
      game.pause();
    } else if (doc === 'worldwin') {
      game.startWorld();
      game.shards = [];
      game.collected = game.totalShards;
      game.echoHeard = true;
      game.exitOpen = true;
      game.levelTime = 421;
      game.pingsUsed = 37;
      game.complete();
    } else if (doc === 'echo') {
      game.startChamber(5);
      const m = game.skitters[0];
      if (m) {
        game.player.x = m.x + 120;
        game.player.y = m.y;
        game.charges = 3;
        if (m._plan) m._plan(game);
        game.firePing();
        game.debugSimulate(1.35, {});
      }
    }
  }, 900);
}
