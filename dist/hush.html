    this.inv = new Inventory();
    return this.startFloor(1);
  }

  /** Killing a hunter pays 2 diamonds and 10 gold. 亡命猎屠 multiplies this. */
  killHunter(h, { ghost = false } = {}) {
    if (this.mapMode && this.mapId === 'room' && !this.castleKey) {
      this.castleKey = true;
      this.flash = 1;
    }
    const i = this.hunters.indexOf(h);
    if (i < 0) return false;
    this.hunters.splice(i, 1);
    h.dead = true;
    const lvl = this.charmLevel ? this.charmLevel('hunt') : 0;
    const mult = lvl ? 2 ** lvl : 1;
    this.diamonds += 2 * mult;
    this.gold += 10 * mult;
    this.flash = 1;
    this.shake = Math.max(this.shake, 5);
    this.audio.shard();
    // Every death, however it was caused, answers once in purple.
    this.stepEcho(h.x, h.y, '190, 130, 255', { count: 40, speed: 420, life: 0.8, ghost });
    return true;
  }

  startFloor(depth) {
    this._entryPending = true;
    this.depth = clamp(depth, 1, FLOORS);
    const level = generateFloor(this.runSeed + this.depth * 7919, this.depth - 1);
    this.floorMode = true;
    this.worldMode = false;
    this.customData = null;
    this.audio.unlock();
    this.level = level;
    this.chamberIndex = 0;
    this.player = new Player(level.spawn.x, level.spawn.y);
    const centers = level.rooms
      .filter((r) => r.kind !== 'start')
      .map((r) => {
        const t = r.x + 2 + ((r.w - 4) >> 1);
        const u = r.y + 2 + ((r.h - 4) >> 1);
        return { x: (t + 0.5) * TILE, y: (u + 0.5) * TILE };
      });
    const at = (i) => centers[i % Math.max(1, centers.length)] || { x: level.spawn.x, y: level.spawn.y };
    const route = centers.slice(0, Math.min(4, centers.length));
    const mk = (i, type = 'hunter', home = null) => {
      const c = at(i);
      return new Hunter(c.x, c.y, type, home);
    };
    this.hunters = [];
    if (this.depth >= 5) {
      this.hunters.push(mk(0, 'butcher'), mk(1, 'patroller', { route }), mk(2, 'stalker'), mk(3));
    } else if (this.depth === 4) {
      this.hunters.push(mk(0), mk(1), mk(2, 'patroller', { route }), mk(3, 'stalker'));
    } else if (this.depth === 3) {
      this.hunters.push(mk(0), mk(1), mk(2, 'patroller', { route }));
    } else {
      for (let i = 0; i < this.depth; i++) this.hunters.push(mk(i));
    }
    this.skitters = [];
    this.shards = [{ x: level.key.x, y: level.key.y, key: true, id: 0 }];
    // Identity is rolled when the player gets close (see revealLoot); until
    // then a spot is only a faint mark.
    this.loot = (level.loot || []).map((l) => ({ ...l, seenAt: -9 }));
    this.totalShards = 1;
    this.pings = [];
    this.rays = [];
    this.echoRings = [];
    this.flipRings = [];
    this.flipSoundLines = [];
    this.flipFreeze = 0;
    this.mcBurst = null;
    this.soundTrails = [];
    this.coreTrails = this.makeCoreTrails(level);
    this.particles = makeDust(level, 220);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.hasKey = false;
    this.diamonds = this.diamonds || 0;
    this.gold = this.gold || 0;
    this.echoRequired = false;
    this.echoHeard = false;
    this.humT = 99;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.sneak = false;
    this.state = 'playing';
    this.throws = [];
    this.activeItem = null;
    this.speedT = 0;
    this.speedMul = 1;
    this.invulnT = 0;
    this.lives = this.maxLives();
    this.starT = 0;
    this.stressUsed = false;
    this.counterUsed = false;
    this.stoneGranted = false;
    this.stoneLevel = 0;
    this.refreshStones();
    this.ui.showGame();
    return true;
  }

  /** One of the named map nodes from the redesigned world. */
  startMap(id = 'room', seed = (Math.random() * 1e9) | 0) {
    this._entryPending = true;
    const node = mapNode(id) || mapNode('room');
    const level = node.kind === 'maze'
      ? buildMazeMap(seed)
      : node.kind === 'moving'
        ? buildMovingMap(seed)
        : buildRoomMap(seed);
    this.mapMode = true;
    this.mapId = node.id;
    this.mapSeed = seed;
    this.mapNode = node;
    this.floorMode = false;
    this.worldMode = false;
    this.customData = null;
    this.level = level;
    this.player = new Player(level.spawn.x, level.spawn.y);
    this.mapExits = (level.exits || []).map((e) => ({
      x: e.x * level.tile + level.tile / 2,
      y: e.y * level.tile + level.tile / 2,
      to: e.to,
      require: e.require || null,
      color: e.color || '140,240,170',
      built: BUILT_MAPS.has(e.to),
    }));
    this.absorbSet = new Set((level.absorb || []).map((a) => `${a.x},${a.y}`));
    // worldgen already hands back pixel coordinates for key/spawn/exit.
    this.mapKey = level.key ? { x: level.key.x, y: level.key.y } : null;
    this.castleKey = false;
    this.hasKey = false;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.humT = 99;
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.mapNodes = level.monsters || [];
    this.mcHunters = null;
    this.hunters = this.mapNodes.map((m) => {
      const h = new Hunter(m.x * level.tile + level.tile / 2, m.y * level.tile + level.tile / 2, m.type);
      h.speedCap = m.speed || (node.kind === 'maze' ? 76 : node.kind === 'moving' ? 184 : 84);
      h.block = m.block;
      h.layer = m.layer ?? 0;
      h.reserve = !!level.moving && m.layer !== 0;
      h.state = 'idle';
      return h;
    });
    if (level.moving) {
      // Both faces exist in the data, but the guard that rides the room is
      // always the same body. It never blinks out when the room turns over;
      // the reserve face stays asleep.
      this.mcHunters = this.hunters;
      this.syncMovingHunters();
    }
    this.skitters = [];
    this.shards = [];
    this.totalShards = 0;
    this.collected = 0;
    this.loot = (level.loot || []).map((l) => ({
      x: l.x * level.tile + level.tile / 2,
      y: l.y * level.tile + level.tile / 2,
      kind: l.kind,
      id: l.id,
      seenAt: -9,
    }));
    this.throws = [];
    this.pings = [];
    this.rays = [];
    this.echoRings = [];
    this.flipRings = [];
    this.flipSoundLines = [];
    this.flipFreeze = 0;
    this.mcBurst = null;
    this.soundTrails = [];
    this.coreTrails = this.makeCoreTrails(level);
    this.particles = [];
    this.charges = PING_MAX;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.activeItem = null;
    this.state = 'playing';
    this.ui.showGame();
    const startBlock = level.moving ? blockAt(level, Math.floor(this.player.x / level.tile), Math.floor(this.player.y / level.tile)) : null;
    this.mcFloorBlock = startBlock ? startBlock.i : -1;
    this.mcFloor = level.moving ? (startBlock ? startBlock.z + 1 : 1) : 0;
    this.ui.updateHUD({ chamber: 0, title: node.name, shards: 0, total: 0, charges: this.charges, listen: false, muted: this.audio.muted, danger: 0, depth: 0, diamonds: this.diamonds, gold: this.gold, floor: level.moving ? this.movingFloor() : 0 });
    if (level.moving) this.maybeGuide('moving', '这些房间都在动。去对角那一间的二层。');
    return true;
  }

  /** Step through a map exit (or bounce when the door is locked). */
  enterMapExit(exit) {
    // Only the areas that actually have a generator are open; the rest stay sealed.
    if (!BUILT_MAPS.has(exit.to)) {
      this.audio.deny();
      this.ui.toast('deny');
      return false;
    }
    if (exit.require === 'key' && !this.hasKey) {
      this.audio.deny();
      this.ui.toast('deny');
      return false;
    }
    if (exit.require === 'castle' && !this.castleKey) {
      this.audio.deny();
      this.ui.toast('deny');
      return false;
    }
    this.audio.gateOpen();
    this.flash = 1;
    const to = exit.to;
    if (!to || to === this.mapId) return false;
    if (mapNode(to)) this.startMap(to, this.mapSeed);
    else this.startFloor(1);
    return true;
  }

  /** The moving block the player currently stands in. */
  playerBlock() {
    const L = this.level;
    if (!L || !L.moving) return null;
    return blockAt(L, Math.floor(this.player.x / L.tile), Math.floor(this.player.y / L.tile));
  }

  /** Every block whose 25x25 area covers the player's tile. A tile on a
   *  shared border belongs to two rooms, and either one could rewrite it. */
  playerBlocks() {
    const L = this.level;
    if (!L || !L.moving) return [];
    const tx = Math.floor(this.player.x / L.tile);
    const ty = Math.floor(this.player.y / L.tile);
    const cols = [Math.floor(tx / MOVING.PITCH)];
    const rows = [Math.floor(ty / MOVING.PITCH)];
    if (tx % MOVING.PITCH === 0) cols.push(cols[0] - 1);
    if (ty % MOVING.PITCH === 0) rows.push(rows[0] - 1);
    const out = [];
    for (const r of rows) {
      for (const c of cols) {
        if (r < 0 || r > 2 || c < 0 || c > 2) continue;
        out.push(L.blocks[r * 3 + c]);
      }
    }
    return out;
  }

  /** Rebuild the map-exit list after the moving maze opens or seal it. */
  rebuildMapExits() {
    const L = this.level;
    this.mapExits = (L.exits || []).map((e) => ({
      x: e.x * L.tile + L.tile / 2,
      y: e.y * L.tile + L.tile / 2,
      to: e.to,
      require: e.require || null,
      color: e.color || '140,240,170',
      built: BUILT_MAPS.has(e.to),
    }));
  }

  /** 1 / 2 / -1 for the HUD floor readout. */
  movingFloor() {
    const L = this.level;
    if (!L || !L.moving) return 0;
    if (L.moving.state === 'collapsed' || L.moving.state === 'collapsing') return -1;
    const pb = this.playerBlock ? this.playerBlock() : null;
    if (pb && pb.i !== this.mcFloorBlock) {
      this.mcFloorBlock = pb.i;
      this.mcFloor = pb.z + 1;
    }
    return this.mcFloor || 1;
  }

  /** Keep the nine guards that actually ride the rooms. The second face is a
   *  dormant copy; it never pops in or out when a room turns over. */
  syncMovingHunters() {
    const L = this.level;
    if (!L || !L.moving || !this.mcHunters) return;
    if (L.moving.state === 'collapsed') {
      this.hunters = this.mcHunters.filter((h) => !h.dead && !h.reserve && h.block === 4);
      return;
    }
    this.hunters = this.mcHunters.filter((h) => !h.dead && !h.reserve);
  }

  /** One actual sound line: a particle with a fading point trail. */
  spawnSoundTrail(x, y, dx, dy, { speed = 38, life = 0.95, tint = '255, 70, 70', width = 1.1, kind = 'door' } = {}) {
    this.soundTrails.push({ x, y, dx, dy, age: 0, life, speed, tint, width, kind, trail: [{ x, y }] });
  }

  /** Advance every free-flying sound particle and prune finished tails. */
  updateSoundTrails(dt) {
    const out = [];
    for (const t of this.soundTrails || []) {
      t.age += dt;
      if (t.age > t.life) continue;
      t.x += t.dx * t.speed * dt;
      t.y += t.dy * t.speed * dt;
      t.trail.push({ x: t.x, y: t.y });
      if (t.trail.length > 40) t.trail.shift();
      out.push(t);
    }
    this.soundTrails = out;
  }

  /** Three real sound particles per active core. They are born at the centre
   *  and bounce forever inside the one-tile 口, at the same speed as sonar. */
  makeCoreTrails(level) {
    const out = [];
    const tile = level.tile;
    for (const b of level.blocks || []) {
      if (!b.core || b.core.broken) continue;
      const cx = (b.ox + 12.5) * tile;
      const cy = (b.oy + 12.5) * tile;
      for (let k = 0; k < 3; k++) {
        const ang = -Math.PI / 2 + (38 * Math.PI) / 180 + (k * Math.PI * 2) / 3;
        out.push({ block: b.i, x: cx, y: cy, dx: Math.cos(ang), dy: Math.sin(ang), pts: [{ x: cx, y: cy }] });
      }
    }
    return out;
  }

  updateCoreTrails(dt) {
    const L = this.level;
    if (!L || !L.moving) return;
    const tile = L.tile;
    for (const t of this.coreTrails || []) {
      const b = L.blocks[t.block];
      if (!b || b.gone || b.core.broken || b.decor[b.z] === 'none') {
        t.pts.length = 0;
        continue;
      }
      // The particle lives inside the one-tile 口 and reflects off its edges.
      const x0 = (b.ox + 12) * tile + 1;
      const x1 = (b.ox + 13) * tile - 1;
      const y0 = (b.oy + 12) * tile + 1;
      const y1 = (b.oy + 13) * tile - 1;
      let left = CORE_RAY_SPEED * dt;
      while (left > 0) {
        const step = Math.min(2, left);
        left -= step;
        let nx = t.x + t.dx * step;
        let ny = t.y + t.dy * step;
        if (nx < x0) {
          nx = x0 + (x0 - nx);
          t.dx = Math.abs(t.dx);
        } else if (nx > x1) {
          nx = x1 - (nx - x1);
          t.dx = -Math.abs(t.dx);
        }
        if (ny < y0) {
          ny = y0 + (y0 - ny);
          t.dy = Math.abs(t.dy);
        } else if (ny > y1) {
          ny = y1 - (ny - y1);
          t.dy = -Math.abs(t.dy);
        }
        t.x = clamp(nx, x0, x1);
        t.y = clamp(ny, y0, y1);
        const last = t.pts[t.pts.length - 1];
        if (!last || Math.abs(t.x - last.x) + Math.abs(t.y - last.y) >= 2) {
          t.pts.push({ x: t.x, y: t.y });
          if (t.pts.length > 32) t.pts.shift();
        }
      }
    }
  }

  /** A room about to move shows it only in the last second: at each door,
   *  eight red sound particles cross the one-tile opening, alternating ways. */
  emitFlipSoundLines(picked) {
    const L = this.level;
    const tile = L.tile;
    const seen = new Set();
    for (const i of picked) {
      const b = L.blocks[i];
      if (!b || b.gone) continue;
      for (const d of movingDoors(b)) {
        const verticalDivider = d.x === b.ox || d.x === b.ox + 24;
        const key = `${d.x},${d.y},${verticalDivider ? 'v' : 'h'}`;
        if (seen.has(key)) continue;
        seen.add(key);
        for (let j = 0; j < 8; j++) {
          const u = (j + 0.5) / 8 * tile - tile / 2;
          const dir = j % 2 ? -1 : 1;
          let x;
          let y;
          let dx = 0;
          let dy = 0;
          if (verticalDivider) {
            x = (d.x + (dir > 0 ? 0 : 1)) * tile;
            y = (d.y + 0.5) * tile + u;
            dx = dir;
          } else {
            x = (d.x + 0.5) * tile + u;
            y = (d.y + (dir > 0 ? 0 : 1)) * tile;
            dy = dir;
          }
          this.spawnSoundTrail(x, y, dx, dy, { speed: 44, life: 0.55, tint: '255, 70, 70', width: 1 });
        }
      }
    }
    this.flipSoundLines = [];
  }

  /** Run the moving-maze clock: five rooms swap every twenty seconds. */
  updateMoving(dt) {
    const L = this.level;
    const m = L && L.moving;
    if (!m) return;
    this.updateCoreTrails(dt);
    this.updateSoundTrails(dt);
    if (m.state === 'running') {
      m.clock += dt;
      if (m.clock >= m.nextFlip) {
        m.nextFlip += m.period;
        const picked = m.pending;
        m.pending = null;
        this.flipSoundLines = [];
        this.doFlip(picked);
      } else if (m.nextFlip - m.clock <= 1 && !m.pending) {
        m.pending = pickMovingFlips(L, this.playerBlock() ? this.playerBlock().i : -1);
        this.emitFlipSoundLines(m.pending);
      }
    } else if (m.state === 'collapsing') {
      m.collapseT -= dt;
      this.updateMcBurst(dt);
      if (m.collapseT <= 0) {
        this.mcBurst = null;
        collapseB2(L);
        this.syncMovingHunters();
        this.rebuildMapExits();
        const b2 = L.blocks[4];
        this.player.x = (b2.ox + 12.5) * L.tile;
        this.player.y = (b2.oy + 13.5) * L.tile;
        this.camX = this.player.x;
        this.camY = this.player.y;
        this.flash = 1;
        this.shake = Math.max(this.shake, 10);
        this.ui.feed('脚下空了。');
        this.ui.setFloor(-1);
        this.audio.mcStopped();
      }
    }
  }

  /** After a swap, any guard whose new tile is solid is nudged to the
   *  nearest open tile of the same room. Nothing rotates, so the player's
   *  room and everything inside it stays exactly where it was. */
  relocateMoved(movedIds) {
    const L = this.level;
    const tile = L.tile;
    for (const h of this.mcHunters || []) {
      if (h.dead || h.reserve || !movedIds.has(h.block)) continue;
      const b = L.blocks[h.block];
      h.layer = b.z;
      h.path = [];
      h.pending = null;
      h.target = null;
      h.state = 'idle';
      if (!isSolid(L.grid, L.w, L.h, Math.floor(h.x / tile), Math.floor(h.y / tile))) continue;
      const spot = nearestOpenInBlock(L, b, h.x, h.y);
      if (spot) {
        h.x = spot.x;
        h.y = spot.y;
      }
    }
    this.syncMovingHunters();
  }

  /** One swap: five unbroken rooms. The room the player is standing in is
   *  never rewritten; its slot is swapped out for another room instead. */
  doFlip(picked = null) {
    const L = this.level;
    const tile = L.tile;
    const m = L.moving;
    this.flipSoundLines = [];
    this.soundTrails = (this.soundTrails || []).filter((t) => t.kind !== 'door');
    const pb = this.playerBlock();
    const protectedIds = new Set(this.playerBlocks().map((b) => b.i));
    let ids = (picked || pickMovingFlips(L, pb ? pb.i : -1)).slice();
    let spared = false;
    if (ids.some((i) => protectedIds.has(i))) {
      spared = true;
      ids = ids.filter((i) => !protectedIds.has(i));
      const pool = L.blocks.filter((b) => !b.core.broken && !b.gone && !protectedIds.has(b.i) && !ids.includes(b.i));
      while (ids.length < 5 && pool.length) ids.push(pool.splice(Math.floor(m.rng() * pool.length), 1)[0].i);
    }
    const moved = flipMoving(L, ids);
    if (!moved.length) return;
    const movedIds = new Set(moved.map((b) => b.i));
    this.flipRings = this.flipRings || [];
    for (const b of moved) {
      this.flipRings.push({ x: (b.ox + 12.5) * tile, y: (b.oy + 12.5) * tile, t: this.now });
    }

    this.relocateMoved(movedIds);

    this.flipFreeze = 0.7;
    this.shakeT = 0.7;
    this.shake = Math.max(this.shake, 9);
    this.audio.swapRumble();
    if (spared && pb) {
      // The room stayed, but the player rose or fell with it. HUD and
      // announcement both follow the perceived floor.
      this.mcFloor = this.mcFloor === 1 ? 2 : 1;
      this.mcFloorBlock = pb.i;
    }
    this.ui.setFloor(this.movingFloor());
    if (spared && pb) {
      this.audio.floorChime(this.mcFloor);
      this.ui.announceFloor(this.mcFloor);
    }
  }

  /** Drive the b2 wall-breaking cutscene. The ring only exists for ~1.2 s;
   *  walls it reaches turn to open floor and throw one short gray line. */
  updateMcBurst(dt) {
    const B = this.mcBurst;
    if (!B || B.done) return;
    const L = this.level;
    const tile = L.tile;
    B.t += dt;
    const k = Math.min(1, B.t / B.dur);
    B.r = B.max * k;
    for (const w of B.walls) {
      if (w.broken || w.d > B.r) continue;
      w.broken = true;
      L.grid[w.y * L.w + w.x] = 0;
      // Every broken wall answers with a tiny ring of its own.
      for (let j = 0; j < 6; j++) {
        const a = w.ang + (j * Math.PI) / 3 + 0.2;
        this.spawnSoundTrail((w.x + 0.5) * tile, (w.y + 0.5) * tile, Math.cos(a), Math.sin(a), {
          speed: 42,
          life: 0.18,
          tint: '210, 216, 220',
          width: 0.9,
          kind: 'spall',
        });
      }
    }
    for (const h of this.mcHunters || []) {
      if (h.dead || h.reserve || h.block !== 4) continue;
      if (Math.hypot(h.x - B.x, h.y - B.y) > B.r) continue;
      this.killHunter(h, { ghost: true });
    }
    if (k >= 1 && !B.done) {
      B.done = true;
      B.doneAt = this.now;
    }
  }

  /** A thrown thing hit a core. b2 is the egg; every other spark just stops. */
  breakCore(b) {
    const L = this.level;
    const m = L.moving;
    if (!b || !b.core || b.core.broken) return false;
    if (b.core.kind === 'button') {
      this.audio.deny();
      return false;
    }
    b.core.broken = true;
    // The 口 itself is gone: from now on that centre tile is walkable, and
    // writeMovingBlock keeps it open even if the variant still says solid.
    L.grid[(b.oy + 12) * L.w + b.ox + 12] = 0;
    b.variants[b.z][12 * 25 + 12] = 0;
    this.audio.glassBreak();
    this.shake = Math.max(this.shake, 3);
    this.stepEcho((b.ox + 12.5) * L.tile, (b.oy + 12.5) * L.tile, b.i === 4 ? '255, 200, 90' : '200, 220, 230', {
      count: b.i === 4 ? 96 : 26,
      speed: b.i === 4 ? 420 : 340,
      life: b.i === 4 ? 0.9 : 0.6,
      ghost: b.i === 4,
    });
    if (b.i === 4) {
      m.state = 'collapsing';
      // The cutscene happens at the core, even if the player threw from afar.
      this.camX = (b.ox + 12.5) * L.tile;
      this.camY = (b.oy + 12.5) * L.tile;
      m.collapseT = 1.45;
      m.pending = null;
      this.flipSoundLines = [];
      this.soundTrails = (this.soundTrails || []).filter((t) => t.kind !== 'door');
      const protectedIds = new Set(this.playerBlocks().map((o) => o.i));
      const allIds = new Set(L.blocks.filter((o) => !protectedIds.has(o.i)).map((o) => o.i));
      // The one command that moves even shattered rooms, except the room the
      // player is standing in.
      for (const o of L.blocks) if (allIds.has(o.i)) flipMovingBlock(L, o);
      this.relocateMoved(allIds);
      // Cutscene: a golden sound ring flies out from the broken core and
      // breaks every interior wall of b2 (the outer wall stays). Characters
      // are frozen while it travels; anything caught by the ring dies.
      const cx = (b.ox + 12.5) * L.tile;
      const cy = (b.oy + 12.5) * L.tile;
      this.camX = cx;
      this.camY = cy;
      const walls = [];
      for (let ly = 1; ly < 24; ly++) {
        for (let lx = 1; lx < 24; lx++) {
          const tx = b.ox + lx;
          const ty = b.oy + ly;
          if (L.grid[ty * L.w + tx] !== 1) continue;
          const dx = tx + 0.5 - (b.ox + 12.5);
          const dy = ty + 0.5 - (b.oy + 12.5);
          walls.push({ x: tx, y: ty, d: Math.hypot(dx, dy) * L.tile, ang: Math.atan2(dy, dx), broken: false });
        }
      }
      this.mcBurst = { x: cx, y: cy, t: 0, dur: 1.15, max: 600, r: 0, walls, debris: [], done: false, doneAt: 0 };
      this.flipFreeze = 1.45;
      this.shakeT = 1.45;
      this.shake = 14;
      this.audio.b2Quake();
      this.ui.announceFloor(-1);
      this.ui.setFloor(-1);
      this.ui.feed('你打碎了那一颗。');
    } else {
      this.ui.feed('中心碎了。这一间不再动了。');
    }
    return true;
  }

  /** The target button: seal the centre and open eight ways out. */
  clearMovingMaze() {
    const L = this.level;
    const m = L && L.moving;
    if (!m || m.state !== 'running') {
      this.audio.deny();
      return false;
    }
    clearMoving(L);
    m.pending = null;
    this.flipSoundLines = [];
    this.rebuildMapExits();
    this.flash = 1;
    this.shake = Math.max(this.shake, 6);
    this.audio.mcStopped();
    this.ui.feed('整座迷宫停下来了。');
    if (this.playerBlock() && this.playerBlock().i === 4) {
      const t = L.blocks[m.target];
      const spot = nearestOpenInBlock(L, t, this.player.x, this.player.y) || { x: (t.ox + 12.5) * L.tile, y: (t.oy + 13.5) * L.tile };
      this.player.x = spot.x;
      this.player.y = spot.y;
      this.camX = this.player.x;
      this.camY = this.player.y;
    }
    this.ui.setFloor(this.movingFloor());
    return true;
  }

  /** Nearest thing the player can press F on: loot, key, portal or stair. */
  interactAt() {
    const p = this.player;
    let best = null;
    const take = (kind, ref, x, y, r) => {
      const d = dist(p.x, p.y, x, y);
      if (d > r) return;
      if (!best || d < best.d) best = { kind, ref, x, y, d };
    };
    for (const it of this.loot) if (it.kind) take('loot', it, it.x, it.y, 46);
    if (this.mapMode) {
      if (this.mapKey && !this.hasKey) take('key', this.mapKey, this.mapKey.x, this.mapKey.y, 42);
      const mv = this.level && this.level.moving;
      if (mv && mv.state === 'running') {
        const tb = this.level.blocks[mv.target];
        if (tb && tb.z === mv.targetLayer && tb.core && !tb.core.broken && tb.decor[tb.z] === 'button') {
          const cx = (tb.ox + 12.5) * this.level.tile;
          const cy = (tb.oy + 12.5) * this.level.tile;
          take('button', tb, cx, cy, 56);
        }
      }
      for (const e of this.mapExits) take('exit', e, e.x, e.y, 50);
    } else if (this.level && this.level.exit) {
      const e = this.level.exit;
      take('stair', e, e.x, e.y, 50);
    }
    return best;
  }

  /** One floating prompt for whatever F would do right now. */
  showInteractTip(near) {
    const r = this.renderer;
    const vw = r.cw / r.scale;
    const vh = r.ch / r.scale;
    const c = this.level
      ? viewCenter(this.level.size.w, this.level.size.h, this.camX, this.camY, vw, vh)
      : { x: this.camX, y: this.camY };
    const sx = r.cw / 2 + (near.x - c.x) * r.scale;
    const sy = r.ch / 2 + (near.y - c.y) * r.scale;
    let title = '';
    let body = '';
    if (near.kind === 'loot') {
      const it = near.ref;
      const txt = it.kind === 'charm' ? CHARM_TEXT[it.id] : ITEM_TEXT[it.id];
      title = txt.name;
      body = `${it.kind === 'charm' ? charmText(it.id, 1) : txt.line}\n\n[ F ] 拾取`;
    } else if (near.kind === 'key') {
      title = '地图钥匙';
      body = '按 [ F ] 拾取。\n取得之后，上锁的门才会回应你。';
    } else if (near.kind === 'button') {
      title = '楼层开关';
      body = '按 [ F ] 停下整座迷宫。\\n走遍九间屋子，只有这一颗在发金光。';
    } else if (near.kind === 'exit') {
      const ex = near.ref;
      const dest = mapNode(ex.to);
      title = `传送门 · ${dest ? dest.name : '未知区域'}`;
      if (!BUILT_MAPS.has(ex.to)) body = '此路尚未开通。';
      else if (ex.require === 'key' && !this.hasKey) body = '需要地图钥匙。';
      else if (ex.require === 'castle' && !this.castleKey) body = '需要城堡钥匙。';
      else body = `按 [ F ] 前往「${dest.name}」。`;
      if (dest && dest.sub && BUILT_MAPS.has(ex.to)) body += `\n${dest.sub}`;
    } else {
      title = '出口';
      body = this.exitOpen ? '按 [ F ] 下行。' : `还需 ${this.shards.length} 块碎片。`;
    }
    this.ui.showTip(title, body, sx + 18, sy - 34);
  }

  /** Run the F action. Returns true when the scene changed. */
  doInteract(near) {
    if (near.kind === 'loot') { this.takeLoot(near.ref); return false; }
    if (near.kind === 'key') {
      this.hasKey = true;
      this.audio.shard();
      this.flash = 1;
      this.shake = Math.max(this.shake, 2);
      this.stepEcho(this.player.x, this.player.y, '255, 205, 110', { count: 28, speed: 360, life: 0.6 });
      this.ui.feed('取得地图钥匙');
      this.ui.hideTip();
      return false;
    }
    if (near.kind === 'button') {
      this.ui.hideTip();
      return this.clearMovingMaze();
    }
    if (near.kind === 'exit') { this.ui.hideTip(); return this.enterMapExit(near.ref); }
    if (this.exitOpen) { this.complete(); return true; }
    this.audio.deny();
    this.ui.toast('deny');
    return false;
  }

  /** Move one loot spot into the pack; shared by the F prompt. */
  takeLoot(it) {
    const amount = it.kind === 'charm' ? 1 : (ITEMS[it.id].count || 1);
    const res = it.kind === 'charm'
      ? this.inv.addCharm(it.id)
      : (this.inv.addItem(it.id, amount) ? 'added' : 'full');
    if (res === 'full' || res === 'max') {
      this.audio.deny();
      this.ui.toast('deny');
      this.ui.guide('背包已满：按 Tab 打开背包，把物品拖到外面即可丢弃');
      return;
    }
    this.loot.splice(this.loot.indexOf(it), 1);
    this.audio.shard();
    this.flash = 1;
    this.refreshStones();
    this.ui.toast('shard');
    this.stepEcho(this.player.x, this.player.y, '255, 205, 110', { count: 26, speed: 360, life: 0.6 });
    this.nearLoot = null;
    this.ui.hideTip();
    const label = it.kind === 'charm'
      ? `${CHARMS[it.id].name} 护符`
      : `${ITEMS[it.id].name} ×${amount}`;
    this.ui.feed(`拾取 ${label}`);
    // One introduction per kind: charms are socketed, usable items are bound
    // to the hotkey row, throwables are taught when they are first bound.
    if (it.kind === 'charm') this.maybeGuide('charm', '你捡到了一个护符，摁下tab以装配');
    else if (ITEMS[it.id].kind !== 'throw') {
      this.maybeGuide('item', '你捡到了一个道具，摁下tab以将其绑定在快捷键上');
    }
  }

  /** 1..4 map to hotkeys left-to-right; throwables arm the left mouse button. */
  useHotkey(i) {
    let slot = this.inv.hot[i];
    // A hot slot can outlive its pack stack (used up, dropped, map restart).
    if (slot && slot.kind === 'item' && this.inv.count(slot.id) === 0) {
      const idx = this.inv.pack.findIndex((s) => s && s.kind === 'item' && s.id === slot.id);
      if (idx >= 0) {
        this.inv.hot[i] = this.inv.pack[idx];
        slot = this.inv.hot[i];
      } else if (slot.n > 0) {
        // orphaned stack: put it back into the pack so it cannot be lost
        const free = this.inv.pack.indexOf(null);
        if (free >= 0) {
          this.inv.pack[free] = slot;
        } else {
          this.inv.hot[i] = null;
          slot = null;
        }
      } else {
        this.inv.hot[i] = null;
        slot = null;
      }
    }
    if (!slot) {
      this.audio.deny();
      this.ui.feed(`${i + 1} 号键是空的`);
      return;
    }
    const def = ITEMS[slot.id];
    if (!def) return;
    if (def.kind === 'throw') {
      const id = slot.id;
      this.activeItem = this.activeItem === id ? null : id;
      this.audio.click(0.4);
      if (this.activeItem) {
        if (!this.guides?.throwSelect) {
          this.maybeGuide('throwSelect', '摁下鼠标左键可以投掷出投掷物');
          this.laterGuide('throwCancel', '再次摁下对应快捷键以取消选中', 3600);
        }
        this.ui.feed(`已握紧 ${def.name} · 左键掷出`);
      } else {
        this.cancelGuide('throwCancel');
        this.ui.feed(`已松开 ${def.name}`);
      }
      return;
    }
    if (!this.useItem(slot.id)) this.ui.feed(`${def.name}：已经没有了`);
  }

  useItem(id) {
    const p = this.player;
    const take = (n = 1) => {
      const idx = this.inv.pack.findIndex((s) => s && s.id === id && s.n >= n);
      if (idx < 0) return false;
      this.inv.pack[idx].n -= n;
      if (this.inv.pack[idx].n <= 0) {
        const dead = this.inv.pack[idx];
        this.inv.pack[idx] = null;
        for (let k = 0; k < this.inv.hot.length; k++) if (this.inv.hot[k] === dead) this.inv.hot[k] = null;
      }
      return true;
    };
    if (id === 'vitamin') {
      if (!take()) { this.audio.deny(); return false; }
      this.speedT = ITEMS.vitamin.dur;
      this.flash = 1;
      this.audio.shard();
      this.ui.feed('维他命：脚下生风');
    } else if (id === 'star') {
      if (!take()) { this.audio.deny(); return false; }
      this.invulnT = 3;
      this.starT = 3;
      this.audio.gateOpen();
      this.flash = 1;
      this.ui.feed('无敌星：撞上你的会死');
    } else if (id === 'totem') {
      if (!take()) { this.audio.deny(); return false; }
      this.stressCharges += 1;
      this.audio.gateOpen();
      this.ui.feed('不死图腾：多一条命');
    } else if (id === 'scanner') {
      if (!take()) { this.audio.deny(); return false; }
      this.scanT = 6;
      this.scanTick = 0;
      this.refreshScan();
      this.audio.gateOpen();
      this.ui.feed('扫描仪：钥匙与门的位置亮了');
      this.audio.ping();
    } else {
      return false;
    }
    return true;
  }

  throwStone() {
    const lvl = this.inv.level('stone');
    if (!lvl) return;
    const id = this.inv.count('sharpStone') > 0 ? 'sharpStone' : this.inv.count('pebbles') > 0 ? 'pebbles' : null;
    if (!id) return;
    if (!this.inv.consume(id)) return;
    this.throwItem(id, { free: true, noise: CHARMS.stone.noise[lvl - 1] });
  }

  tryPing() {
    if (this.charges < 1) {
      this.audio.deny();
      return;
    }
    this.firePing();
  }

  openMapSelect() {
    const entries = MAP_ORDER.map((id) => {
      const node = mapNode(id);
      return { id, name: node.name, sub: node.sub || '', built: BUILT_MAPS.has(id) };
    });
    this.ui.showMapSelect(entries, this.mapId, (id) => {
      this.ui.hideMapSelect();
      if (!BUILT_MAPS.has(id)) {
        this.ui.feed(`「${mapNode(id).name}」还没有建成`);
        return;
      }
      const seed = (Math.random() * 1e9) | 0;
      this.resetRunState();
      this.startMap(id, seed);
      this.ui.feed(`进入「${mapNode(id).name}」`);
    });
  }

  aimPoint() {
    const r = this.renderer;
    const p = this.player;
    if (this.msx == null) {
      const a = p.face ?? 0;
      return { x: p.x + Math.cos(a) * 160, y: p.y + Math.sin(a) * 160 };
    }
    // The camera stops at the level edges, so near one the screen centre is
    // not the player. Aim from the clamped centre the renderer actually uses;
    // using raw camX made the throw leave along "screen centre -> cursor"
    // instead of "player -> cursor".
    const L = this.level;
    const c = L
      ? viewCenter(L.size.w, L.size.h, this.camX, this.camY, r.cw / r.scale, r.ch / r.scale)
      : { x: this.camX, y: this.camY };
    return {
      x: c.x + (this.msx - r.cw / 2) / r.scale,
      y: c.y + (this.msy - r.ch / 2) / r.scale,
    };
  }

  /** The spot decides what it is only once you are close enough to notice it. */
  revealLoot(it) {
    if (!it || it.kind) return;
    const charm = Math.random() < 0.55;
    let pool = charm ? LOOT_CHARMS.slice() : LOOT_ITEMS.slice();
    if (charm) {
      // 绝地求生 only exists for builds that can already cheat death.
      const canSurvive = this.inv.level('stress') > 0 && this.inv.level('counter') > 0;
      if (!canSurvive) pool = pool.filter((id) => id !== 'survive');
    }
    it.kind = charm ? 'charm' : 'item';
    it.id = pool[(Math.random() * pool.length) | 0] || 'stone';
    it.seenAt = this.now;
  }

  /** Where the scanner wants to lead: the key and the way out. */
  scanTargets() {
    const L = this.level;
    if (!L) return [];
    const out = [];
    if (this.mapMode) {
      if (this.mapKey && !this.hasKey) out.push({ x: this.mapKey.x, y: this.mapKey.y, col: '255,205,110' });
      for (const e of this.mapExits || []) out.push({ x: e.x, y: e.y, col: '140,240,170' });
    } else {
      if (L.key) out.push({ x: L.key.x, y: L.key.y, col: '255,205,110' });
      if (L.exit) out.push({ x: L.exit.x, y: L.exit.y, col: '140,240,170' });
    }
    return out;
  }

  /** Recompute real walking routes, so the line is a path, not a straight hint. */
  refreshScan() {
    const L = this.level;
    const p = this.player;
    this.scanRoutes = [];
    if (!L || !p) return;
    const sx = clamp(Math.floor(p.x / L.tile), 0, L.w - 1);
    const sy = clamp(Math.floor(p.y / L.tile), 0, L.h - 1);
    for (const t of this.scanTargets()) {
      let tx = clamp(Math.floor(t.x / L.tile), 0, L.w - 1);
      let ty = clamp(Math.floor(t.y / L.tile), 0, L.h - 1);
      if (isSolid(L.grid, L.w, L.h, tx, ty)) {
        const open = nearestOpen(L.grid, L.w, L.h, tx, ty);
        if (!open) continue;
        tx = open.x;
        ty = open.y;
      }
      const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
      if (!path || !path.length) continue;
      this.scanRoutes.push({
        col: t.col,
        pts: path.map((q) => ({ x: (q.x + 0.5) * L.tile, y: (q.y + 0.5) * L.tile })),
      });
    }
  }

  throwItem(id, opts = {}) {
    const p = this.player;
    const aim = this.aimPoint();
    const a = Math.atan2(aim.y - p.y, aim.x - p.x);
    const def = ITEMS[id];
    if (!def) return;
    if (!opts.free && !this.inv.consume(id)) {
      this.activeItem = null;
      this.audio.deny();
      return;
    }
    this.ui.feed(`掷出 ${def.name}`);
    const speed = id === 'bugspray' ? 200 : 420;
    // start a little in front of the body: hugging a wall must not eat the throw
    let sx = p.x + Math.cos(a) * 14;
    let sy = p.y + Math.sin(a) * 14;
    const L0 = this.level;
    const solidHere = (x, y) => isSolid(L0.grid, L0.w, L0.h, Math.floor(x / L0.tile), Math.floor(y / L0.tile));
    for (let k = 0; k < 8 && solidHere(sx, sy); k++) {
      sx -= Math.cos(a) * 5;
      sy -= Math.sin(a) * 5;
    }
    this.throws.push({
      x: sx, y: sy, trail: [],
      dx: Math.cos(a), dy: Math.sin(a),
      speed, life: id === 'bugspray' ? 4.2 : 1.6, id,
      kills: !!def.kills, noise: def.noise || 1,
    });
    if (opts.noise) this.throws[this.throws.length - 1].noise = opts.noise;
    const still = this.inv.pack.some((sl) => sl && sl.kind === 'item' && sl.id === id);
    if (!still) this.activeItem = null;
  }

  updateThrows(dt) {
    for (let i = this.throws.length - 1; i >= 0; i--) {
      const t = this.throws[i];
      t.life -= dt;
      const step = t.speed * dt;
      let hitWall = false;
      for (let m = 0; m < step; m += 6) {
        const nx = t.x + t.dx * 6;
        const ny = t.y + t.dy * 6;
        const tx = Math.floor(nx / TILE);
        const ty = Math.floor(ny / TILE);
        const core = this.level.moving ? coreHitAt(this.level, nx, ny, 32) : null;
        if (core) {
          this.breakCore(core);
          hitWall = true;
          break;
        }
        if (tx < 0 || ty < 0 || tx >= this.level.w || ty >= this.level.h || this.level.grid[ty * this.level.w + tx]) {
          hitWall = true;
          break;
        }
        t.x = nx;
        t.y = ny;
        if (!t.trail || t.trail.length === 0 || dist2(t.trail[t.trail.length - 1].x, t.trail[t.trail.length - 1].y, nx, ny) > 9) {
          t.trail.push({ x: nx, y: ny });
          if (t.trail.length > 16) t.trail.shift();
        }
        for (const h of this.hunters) {
          if (dist(t.x, t.y, h.x, h.y) < 15) {
            if (t.kills) {
              this.killHunter(h);
              hitWall = true;
              break;
            }
            // The bugspray drifts straight through and keeps humming until
            // a wall stops it; its own lines do the repelling.
            if (t.id === 'bugspray') continue;
            hitWall = true;
            break;
          }
        }
        if (hitWall) break;
      }
      // The spray keeps emitting while it flies, one dark-green line every
      // heartbeat. A newer line replaces the previous line's hold.
      if (t.id === 'bugspray') {
        t.emitT = (t.emitT ?? 0) - dt;
        if (t.emitT <= 0) {
          t.emitT = 0.22;
          this.spawnRays(t.x, t.y, {
            count: 18,
            speed: 430,
            life: 1.5,
            tint: '64, 132, 92',
            kind: 'repel',
            tag: { x: t.x, y: t.y, t: this.now, kind: 'repel' },
          });
        }
      }
      if (hitWall || t.life <= 0) {
        if (t.id !== 'bugspray') {
          this.stepEcho(t.x, t.y, null, { count: 30, speed: 380, life: 0.7 * (t.noise || 1), tagged: false });
        }
        const def = ITEMS[t.id] || {};
        if (def.lure) {
          this.lures.push({ x: t.x, y: t.y, t: LURE_T, emitT: 0 });
          this.ui.feed(`尸骸的气味散开了`);
        }
        if (def.repel) {
          // Stop the spray where the wall stopped it: a final, short hiss.
          this.spawnRays(t.x, t.y, {
            count: 22,
            speed: 380,
            life: 1.1,
            tint: '64, 132, 92',
            kind: 'repel',
            tag: { x: t.x, y: t.y, t: this.now, kind: 'repel' },
          });
          this.ui.feed(`驱虫器撞上墙壁`);
        }
        if (!def.lure) {
          for (const h of this.hunters) {
            if (dist(t.x, t.y, h.x, h.y) < 620) this.alertHunter(h, t.x, t.y, 0.1);
          }
        }
        this.audio.noise({ dur: 0.22, gain: 0.06, type: 'bandpass', freq: 900, send: 0.5 });
        this.throws.splice(i, 1);
      }
    }
  }

  maxLives() {
    const lvl = this.inv.level('survive');
    return 1 + (lvl ? CHARMS.survive.extraLives[lvl - 1] : 0);
  }

  /** Everything that can hurt you comes through here: charms get a say first. */
  hurt(source) {
    if (this.state !== 'playing') return;
    // The star kills on contact, so its own invulnerability must not swallow
    // the contact first (that made it behave like a plain shield).
    if (this.starT > 0) {
      if (source && source.x != null) this.killHunter(source);
      this.invulnT = Math.max(this.invulnT, 0.6);
      return;
    }
    if (this.debugInvincible || this.invulnT > 0) return;
    if (this.stressCharges > 0) {
      this.stressCharges -= 1;
      this.enterStress();
      return;
    }
    if (this.inv.level('stress') > 0 && !this.stressUsed) {
      this.stressUsed = true;
      this.enterStress();
      return;
    }
    if (this.inv.level('counter') > 0 && !this.counterUsed) {
      this.counterUsed = true;
      if (source && source.x != null) this.killHunter(source);
      this.invulnT = CHARMS.counter.window;
      this.flash = 1;
      this.audio.gateOpen();
      return;
    }
    this.lives -= 1;
    if (this.lives > 0) {
      this.invulnT = 1.4;
      this.flash = 1;
      this.shake = Math.max(this.shake, 9);
      this.audio.alert(0);
      // a new life re-arms the once-per-life charms, whatever is socketed now
      this.stressUsed = false;
      this.counterUsed = false;
      return;
    }
    // 时间逆流: the first lethal hit of a run is always forgiven.
    const rw = this.inv.level('rewind');
    if (rw) {
      const chance = CHARMS.rewind.chance[rw - 1];
      const forced = !this.rewindUsed;
      this.rewindUsed = true;
      if (forced || Math.random() < chance) {
        this.restoreEntry();
        this.flash = 1;
        this.audio.gateOpen();
        this.ui.feed('时间逆流：这一击没有发生');
        return;
      }
    }
    this.die();
  }

  /** Restart the current area (same seed), keeping the inventory. */
  reviveHere() {
    if (this.mapMode) return this.startMap(this.mapId, this.mapSeed);
    if (this.floorMode) return this.startFloor(this.depth);
    if (this.worldMode) return this.startWorld(this.worldSeed ?? 424242);
    if (this.customData) return this.startCustom(this.customData);
    return this.startChamber(this.chamberIndex);
  }

  enterStress() {
    this.invulnT = CHARMS.stress.invuln;
    this.speedT = CHARMS.stress.invuln;
    this.flash = 1;
    this.shake = Math.max(this.shake, 8);
    this.audio.gateOpen();
    this.stepEcho(this.player.x, this.player.y, '255, 210, 120', { count: 48, speed: 520, life: 1.2, tagged: false });
  }

  /**
   * Stones are a per-floor pool. Equipping twice must not refill the quiver,
   * but a level-up hands over the difference (3 -> 5 -> 7 is +2 each time).
   */
  /** Every floor makes the same bodies a little faster. */
  hunterSpeed() {
    const depth = this.floorMode ? this.depth : 1;
    return 126 * (1 + 0.07 * (depth - 1));
  }

  /** The butcher's long sweep: a burst of long sound lines that reveal and share a target. */
  butcherSweep(x, y, owner) {
    owner.sweepHit = false;
    this.spawnRays(x, y, { count: 64, speed: 560, life: 1.05, tint: '255, 140, 80', tag: null, sweep: owner });
    this.audio.echo(clamp((x - this.player.x) / 480, -1, 1), 'ping');
    this.flash = Math.max(this.flash, 0.3);
  }

  /** A sweep line touching the player starts the pounce; touching a hunter shares the target. */
  sweepCheck(r, nx, ny) {
    const o = r.sweep;
    const p = this.player;
    if (!o || !p) return;
    if (!o.sweepHit && dist2(nx, ny, p.x, p.y) < 18 * 18) {
      o.sweepHit = true;
      o.target = { x: p.x, y: p.y };
      o.pounce = { x: p.x, y: p.y };
      o.dashT = 0.7;
      this.flash = Math.max(this.flash, 1);
      this.shake = Math.max(this.shake, 7);
      this.audio.alert(0);
    }
    if (!o.target) return;
    o.shared = o.shared || new Set();
    for (const h of this.hunters) {
      if (h === o || o.shared.has(h.id)) continue;
      if (h.lureLock || h.repelT > 0) continue;
      if (dist2(nx, ny, h.x, h.y) < 14 * 14) {
        o.shared.add(h.id);
        h.pending = { x: o.target.x, y: o.target.y, t: 0.15 };
      }
    }
  }

  refreshStones() {
    const lvl = this.inv.level('stone');
    if (lvl < 1) return;
    if (this.stoneGranted && lvl <= this.stoneLevel) return;
    const quota = CHARMS.stone.stones[lvl - 1];
    const prev = this.stoneGranted ? CHARMS.stone.stones[this.stoneLevel - 1] : 0;
    this.stoneGranted = true;
    this.stoneLevel = lvl;
    const gain = quota - prev;
    if (gain <= 0) return;
    // Stones are ordinary items now: they sit in the pack, stack, and can be dragged.
    this.inv.addItem(lvl >= CHARMS.stone.sharp ? 'sharpStone' : 'pebbles', gain);
  }

  stoneCount() {
    return this.inv.count('sharpStone') + this.inv.count('pebbles');
  }

  /** Dev/experimental: one continuous map, no chamber select. */
  startWorld(seed = 424242) {
    this._entryPending = true;
    const level = generateWorld(seed);
    if (!level) return false;
    this.worldSeed = seed;
    this.customData = null;
    this.audio.unlock();
    this.worldMode = true;
    this.level = level;
    this.chamberIndex = 0;
    this.totalShards = level.shards.length;
    this.player = new Player(level.spawn.x, level.spawn.y);
    this.hunters = level.hunters.map((h) => new Hunter(h.x, h.y));
    this.skitters = (level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.echoRings = [];
    this.particles = makeDust(level, 260);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = true;
    this.echoHeard = false;
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.sector = sectorOf(this.player.x, this.player.y, level);
    this.state = 'playing';
    this.ui.showGame();
    return true;
  }

  /** Build mode: play the map the player drew. */
  startCustom(data) {
    this._entryPending = true;
    this.customData = data;
    this.worldMode = false;
    const w = data.w;
    const h = data.h;
    const grid = Uint8Array.from(data.cells);
    const toWorld = (t) => ({ x: (t.x + 0.5) * TILE, y: (t.y + 0.5) * TILE });
    const level = {
      w, h, tile: TILE, grid,
      size: { w: w * TILE, h: h * TILE },
      rooms: [],
      spawn: toWorld(data.spawn),
      spawnTile: { ...data.spawn },
      exit: toWorld(data.exit),
      exitTile: { ...data.exit },
      shards: data.shards.map((t, i) => ({ ...toWorld(t), tile: { ...t }, id: i })),
      hunters: data.hunters.map((t) => toWorld(t)),
      skitters: data.skitters.map((t) => toWorld(t)),
      seed: 'custom',
    };
    if (!level.shards.length) {
      // A map with nothing to gather is a map with nothing to do.
      level.shards = [{ ...toWorld(data.exit), tile: { ...data.exit }, id: 0 }];
      level.shards[0].x = (data.exit.x + 0.5) * TILE - TILE * 2;
    }
    this.audio.unlock();
    this.worldMode = false;
    this.level = level;
    this.chamberIndex = 0;
    this.totalShards = level.shards.length;
    this.player = new Player(level.spawn.x, level.spawn.y);
    this.hunters = level.hunters.map((hh) => new Hunter(hh.x, hh.y));
    this.skitters = (level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.sounds = [];
    this.echoRings = [];
    this.particles = makeDust(level, 200);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.sneak = false;
    this.blind = false;
    this.humT = 99;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.sector = 0;
    this.state = 'playing';
    this.ui.showGame();
  }

  openEditor() {
    this.audio.unlock();
    this.state = 'edit';
    this.ui.hideScreens();
    this.ui.hideHUD();
    this.editor.open();
  }

  closeEditor() {
    this.editor.close();
    this.state = 'title';
    this.loadDemo();
    this.ui.showTitle(this.progress);
  }

  startChamber(index) {
    this._entryPending = true;
    this.audio.unlock();
    this.chamberIndex = clamp(index, 0, CHAMBERS.length - 1);
    const cfg = CHAMBERS[this.chamberIndex];
    this.level = generateLevel(cfg.seed, {
      shards: cfg.shards,
      hunters: cfg.hunters,
      skitters: cfg.skitters || 0,
      style: cfg.style,
    }) || generateLevel(cfg.seed, { shards: cfg.shards, hunters: cfg.hunters, style: 'halls' });
    this.player = new Player(this.level.spawn.x, this.level.spawn.y);
    this.hunters = this.level.hunters.map((h) => new Hunter(h.x, h.y));
    this.skitters = (this.level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = this.level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.particles = makeDust(this.level);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.echoRings = [];
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.echoRequired = !!cfg.echoGate;
    this.state = 'playing';
    this.progress.last = this.chamberIndex;
    this.saveProgress();
    this.ui.showGame();
  }

  restart() {
    if (this.state !== 'playing' && this.state !== 'dead' && this.state !== 'paused') return;
    if (this.floorMode) {
      this.startRun();
      if (this.state !== 'playing') this.state = 'playing';
      return;
    }
    if (this.mapMode) {
      // Retry = a fresh layout of the same place, not a replay of the same rooms.
      this.resetRunState();
      this.startMap(this.mapId, (Math.random() * 1e9) | 0);
      if (this.state !== 'playing') this.state = 'playing';
      return;
    }
    // Same room, same seed — a retry must not quietly hand you a new map.
    this.resetRunState();
    if (this.worldMode) this.startWorld(this.worldSeed ?? 424242);
    else if (this.customData) this.startCustom(this.customData);
    else this.startChamber(this.chamberIndex);
    if (this.state !== 'playing') this.state = 'playing';
  }

  toggleMute() {
    const muted = this.audio.toggleMute();
    this.ui.toast(muted ? 'deny' : 'shard');
    this.ui.syncMute();
    return muted;
  }

  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    this.ui.showPause();
    if (this.audio.ctx) this.audio.ctx.suspend();
  }

  resume() {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    this.ui.hideScreens();
    if (this.audio.ctx) this.audio.ctx.resume();
  }

  quitToTitle() {
    this.ui.hideScreens();
    this.loadDemo();
    this.ui.showTitle(this.progress);
  }

  next() {
    if (this.mapMode) {
      this.startMap(this.mapId === 'room' ? 'maze' : 'room', (Math.random() * 1e9) | 0);
      return;
    }
    if (this.floorMode) {
      if (this.depth < FLOORS) this.startFloor(this.depth + 1);
      else this.victory();
      return;
    }
    if (this.chamberIndex + 1 < CHAMBERS.length) {
      this.startChamber(this.chamberIndex + 1);
    } else {
      this.victory();
    }
  }

  victory() {
    this.state = 'victory';
    this.ui.dismiss();
    this.ui.showVictory(this.progress);
  }

  // ------------------------------------------------------------------- loop
  frame = (ts) => {
    requestAnimationFrame(this.frame);
    if (!this.last) this.last = ts;
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    if (!Number.isFinite(dt)) dt = 0;
    dt = Math.min(dt, 0.05);

    if (!this.frozen) {
      if (this.state !== 'paused') this.now += dt;
      this.handleGlobalKeys();

      if (this.state === 'playing') this.update(dt);
      else if (this.state === 'title') this.updateTitle(dt);
      else if (this.state === 'dead') this.updateDead(dt);
      else if (this.state === 'complete' || this.state === 'victory') this.updateIdle(dt);
      else if (this.state === 'paused') this.updateIdle(0);
    }

    this.render();
    this.ui.tick(dt);
    this.input.endFrame();
  };

  handleGlobalKeys() {
    if (this.input.consume('KeyM')) this.toggleMute();
    if (this.input.consume('Tab')) this.ui.toggleInventory(this);
    if (this.input.consume('Backquote')) {
      this.debugMode = !this.debugMode;
      this.debugInvincible = this.debugMode;
      if (!this.debugMode) this.debugFreeze = false;
      this.ui.toast(this.debugMode ? 'shard' : 'deny');
    }
    // Debug digits must win over the hotkey row, or 2 would just use slot 2.
    let debugDigit = false;
    if (this.debugMode && this.input.consume('Digit2') && !this.ui.mapSel) {
      debugDigit = true;
      this.openMapSelect();
    }
    if (this.debugMode && this.input.consume('Digit1')) {
      debugDigit = true;
      this.debugFreeze = !this.debugFreeze;
      this.ui.toast(this.debugFreeze ? 'deny' : 'shard');
    }
    if (!debugDigit) {
      for (let i = 0; i < 4; i++) {
        if (this.input.consume(`Digit${HOTKEY_ORDER[i]}`)) this.useHotkey(i);
      }
    }
    if (this.state === 'edit' && this.input.consume('Escape')) this.closeEditor();
    else if (this.state === 'playing' && this.input.consume('Escape')) this.pause();
    else if (this.state === 'paused' && this.input.consume('Escape')) this.resume();
    else if (this.state === 'dead' && this.input.consume('KeyR')) this.restart();
    else if (this.state === 'playing' && this.input.consume('KeyR')) this.restart();
    else if (this.state === 'complete' && (this.input.consume('Enter') || this.input.consume('Space'))) {
      this.next();
    }
  }

  updateTitle(dt) {
    this.titlePingTimer -= dt;
    if (this.titlePingTimer <= 0) {
      this.titlePingTimer = 2.4 + Math.random() * 1.6;
      const rooms = this.level.rooms;
      const r = rooms[Math.floor(Math.random() * rooms.length)];
      this.pings.push({
        x: (r.x + r.w / 2) * TILE,
        y: (r.y + r.h / 2) * TILE,
        t0: this.now,
        speed: PING_SPEED,
        life: PING_LIFE,
        heard: new Set(),
      });
      this.spawnRays((r.x + r.w / 2) * TILE, (r.y + r.h / 2) * TILE);
    }
    this.pings = this.pings.filter((p) => this.now - p.t0 < p.life + 0.15);
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 20);
    this.danger = 0;
  }

  updateDead(dt) {
    this.deathT += dt;
    this.shake = Math.max(0, this.shake - dt * 26);
    this.updateRays(dt);
    this.updateParticles(dt);
    this.pings = this.pings.filter((p) => this.now - p.t0 < p.life + 0.2);
    if (this.deathT > 0.75) {
      if (this.worldMode) {
        this.ui.worldLabels = CHAMBERS.map((c) => c.title);
        this.ui.showDead({ sector: this.sector, deepest: this.maxSector ?? 0 });
      } else {
        this.ui.showDead();
      }
    }
  }

  updateIdle(dt) {
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 30);
  }

  update(dt) {
    if (this._entryPending && this.player && !this._suppressSnapshot) {
      this._entryPending = false;
      this.snapshotEntry();
    }
    const p = this.player;
    const L = this.level;
    if (this.debugFreeze && this.debugMode) {
      this.updateRays(0);
      this.updateParticles(dt);
      this.ui.updateHUD({
        chamber: this.chamberLabel,
        name: this.mapMode && this.mapNode ? this.mapNode.name : null,
        shards: this.totalShards - this.shards.length,
        total: this.totalShards,
        charges: this.charges,
        listen: this.listen,
        muted: this.audio.muted,
        danger: this.danger,
      });
      return;
    }
    this.levelTime += dt;
    this.updateMoving(dt);

    // A moving room takes the whole cast with it. For 0.7 s nobody but a thrown
    // object moves: no steps, no hunter paths, no contact damage.
    if (this.flipFreeze > 0) {
      this.flipFreeze = Math.max(0, this.flipFreeze - dt);
      this.updateThrows(dt);
      this.updateRays(dt);
      this.updateParticles(dt);
      if (this.shakeT > 0) {
        this.shakeT = Math.max(0, this.shakeT - dt);
        this.shake = Math.max(this.shake, 9);
        if (this.shakeT === 0) this.shake = 0;
      } else {
        this.shake = Math.max(0, this.shake - dt * 24);
      }
      this.flash = Math.max(0, this.flash - dt * 3.4);
      this.audio.update(dt, { danger: this.danger });
      this.ui.updateHUD({
        chamber: this.chamberIndex,
        shards: this.shards.length,
        total: this.totalShards || (this.floorMode ? 1 : CHAMBERS[this.chamberIndex].shards),
        depth: this.floorMode ? this.depth : 0,
        charges: this.charges,
        listen: this.listen,
        muted: this.audio.muted,
        danger: this.danger,
        diamonds: this.diamonds,
        gold: this.gold,
        charms: this.inv.charms.length,
        hot: this.inv.hot,
        active: this.activeItem,
        name: this.mapMode && this.mapNode ? this.mapNode.name : null,
        floor: this.level.moving ? this.movingFloor() : 0,
      });
      return;
    }

    // Shift is HELD, not toggled: silent and blind while the key is down.
    const sneaking = this.input.down('ShiftLeft') || this.input.down('ShiftRight');
    if (sneaking !== this.sneak) {
      this.sneak = sneaking;
      this.audio.click(0.4);
      if (this.sneak) this.audio.noise({ dur: 0.25, gain: 0.01, type: 'lowpass', freq: 300, send: 0.4 });
    }
    this.blind = false; // sneaking is silence, not blindness: you still see every line
    const creeping = this.sneak;
    const run = false;
    const move = this.debugMove || this.input.moveVector();

    const listen = !this.sneak && (this.debugListen === true || (this.listenT > 0.26 && !p.moving));
    this.listen = listen;
    const swiftLvl = this.inv.level('swift');
    const creepMul = this.sneak && swiftLvl ? CHARMS.swift.creep[swiftLvl - 1] : 0.5;
    if (this.speedT > 0) {
      this.speedT -= dt;
      this.speedMul = 1 + 2;
      if (this.speedT <= 0) this.speedMul = 1;
    }
    const motion = p.update(dt, move, { run, listen, creep: this.sneak, creepMul, mul: this.speedMul });
    const resolved = this.resolve(p, motion.x, motion.y);
    p.x = resolved.x;
    p.y = resolved.y;
    const k = Math.min(1, dt * 7);
    this.camX += (p.x - this.camX) * k;
    this.camY += (p.y - this.camY) * k;

    if (p.moving) this.listenT = 0;
    else this.listenT = Math.min(1, this.listenT + dt);

    // footsteps
    if (p.moving && !this.sneak) {
      if (p.stepPhase > 58) {
        p.stepPhase = 0;
        this.audio.footstep(0, 0.85);
        this.stepEcho(p.x, p.y);
      }
    }

    // 潜行声呐: while creeping the charm draws quiet lines on its own; they are
    // untagged, so no hunter ever learns anything from them.
    if (this.sneak && p.moving && this.inv.level('sneakSonar')) {
      this.sneakAcc = (this.sneakAcc || 0) + dt;
      if (this.sneakAcc > 0.42) {
        this.sneakAcc = 0;
        const lvl = this.inv.level('sneakSonar');
        this.spawnRays(p.x, p.y, {
          count: CHARMS.sneakSonar.directions[lvl - 1],
          speed: 300,
          life: 0.55,
          tag: null,
        });
      }
    } else {
      this.sneakAcc = 0;
    }

    // pinging
    // The left button only throws what a hotkey has bound to the cursor;
    // without a bound throwable it is just the sonar.
    if (this.input.consume('Mouse0')) {
      if (this.activeItem) this.throwItem(this.activeItem);
      else this.tryPing();
    }
    if (this.input.consume('Space') || this.input.consume('KeyJ')) this.firePing();


    const aim = this.aimPoint();
    this.aimX = aim.x;
    this.aimY = aim.y;

    // timed items and thrown lures
    if (this.starT > 0) this.starT = Math.max(0, this.starT - dt);
    if (this.scanT > 0) {
      this.scanT -= dt;
      this.scanTick -= dt;
      if (this.scanTick <= 0) {
        this.scanTick = 0.5;
        this.refreshScan();
      }
      if (this.scanT <= 0) this.scanRoutes = [];
    }
    for (let i = this.lures.length - 1; i >= 0; i--) {
      const lu = this.lures[i];
      lu.t -= dt;
      lu.emitT = (lu.emitT ?? 0) - dt;
      if (lu.emitT <= 0) {
        lu.emitT = 0.9;
        // Three times a ping's reach, flesh-coloured, and it can touch bodies.
        this.spawnRays(lu.x, lu.y, {
          count: 28,
          speed: LURE_SPEED,
          life: LURE_LIFE,
          tint: '232, 178, 148',
          kind: 'lure',
          tag: { x: lu.x, y: lu.y, t: this.now, kind: 'lure', lock: true },
        });
        this.audio.echo(clamp((lu.x - p.x) / 480, -1, 1), 'ping');
      }
      // The first body to physically reach the corpse ends the call.
      let touched = null;
      for (const h of this.hunters) {
        if (dist(h.x, h.y, lu.x, lu.y) < 22) { touched = h; break; }
      }
      if (touched) {
        touched.lureLock = null;
        this.lures.splice(i, 1);
        this.ui.feed('尸骸被发现了');
        continue;
      }
      if (lu.t <= 0) this.lures.splice(i, 1);
    }

    // charge regen
    if (this.charges < PING_MAX) {
      this.chargeTimer -= dt;
      if (this.chargeTimer <= 0) {
        this.charges++;
        this.chargeTimer = this.charges < PING_MAX ? PING_REGEN : 0;
        this.audio.tone({ freq: 1200, type: 'sine', dur: 0.1, gain: 0.02, send: 0.2 });
      }
    }

    // pings: expand, alert hunters as the shell reaches them
    for (const ping of this.pings) {
      const age = this.now - ping.t0;
      if (age < 0 || age > ping.life) continue;
    }
    this.pings = this.pings.filter((ping) => this.now - ping.t0 < ping.life + 0.2);

    // shards
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const sh = this.shards[i];
      if (dist(p.x, p.y, sh.x, sh.y) < 22) {
        this.shards.splice(i, 1);
        this.collected++;
        this.audio.shard();
        this.flash = 1;
        this.shake = Math.max(this.shake, 2.5);
        this.stepEcho(p.x, p.y, null, { count: 34, speed: 380, life: 0.7 });
        if (sh.key) this.hasKey = true;
        if (this.shards.length === 0) this.tryOpenExit(true);
      }
    }

    // loot: charms and items sit at the end of side branches
    // A spot only becomes an item or a charm at the moment you come near it.
    for (const it of this.loot) {
      if (!it.kind && dist2(p.x, p.y, it.x, it.y) < LOOT_REVEAL * LOOT_REVEAL) this.revealLoot(it);
    }

    // Everything you can touch answers to F: walk close, read the prompt, press it.
    const near = this.interactAt();
    this.nearLoot = near && near.kind === 'loot' ? near.ref : null;
    if (near) this.showInteractTip(near);
    else this.ui.hideTip();
    if (near && this.input.consume('KeyF')) {
      if (this.doInteract(near)) return;
    }
    this.alertCd -= dt;

    // skitters: deaf, fast, silent until they are close. No sound can warn
    // you early, so contact is the only rule that matters.
    for (const sk of this.skitters) {
      sk.update(dt, this);
      if (dist(p.x, p.y, sk.x, sk.y) < p.r + sk.r - 1) {
        // The star's light kills anything that touches it, skitters included.
        if (this.starT > 0) {
          this.skitters.splice(this.skitters.indexOf(sk), 1);
          this.stepEcho(sk.x, sk.y, '190, 130, 255', { count: 18, speed: 300, life: 0.5, tagged: false });
          continue;
        }
        this.die();
        return;
      }
    }

    // hunters
    let nearest = Infinity;
    for (const h of this.hunters) {
      h.update(dt, this);
      const d = dist(p.x, p.y, h.x, h.y);
      if (d < nearest) nearest = d;
      if (d < p.r + h.r - 1) {
        this.hurt(h);
        return;
      }
    }

    if (this.worldMode) {
      const sec = sectorOf(p.x, p.y, L);
      if (sec !== this.sector) {
        this.sector = sec;
        this.maxSector = Math.max(this.maxSector ?? 0, sec);
        const cfg = CHAMBERS[sec];
        this.ui.setSector(cfg.num, cfg.title);
        this.audio.setSector(sec);
      }
    }

    this.danger = this.hunters.length
      ? clamp(1 - (nearest - 55) / 300, 0, 1)
      : 0;
    if (this.danger > 0.4) this.danger = Math.min(1, this.danger + 0.1);

    for (let i = this.echoRings.length - 1; i >= 0; i--) {
      if (this.now - this.echoRings[i].t > 1.4) this.echoRings.splice(i, 1);
    }
    this.flipRings = this.flipRings || [];
    for (let i = this.flipRings.length - 1; i >= 0; i--) {
      if (this.now - this.flipRings[i].t > 1.2) this.flipRings.splice(i, 1);
    }
    if (this.echoRequired && !this.echoHeard && this.shards.length === 0) {
      this.humT -= dt;
      if (this.humT <= 0) {
        this.humT = 3.6;
        this.audio.gateHum();
        this.stepEcho(L.exit.x, L.exit.y, '140,240,170', { count: 18, speed: 260, life: 0.9, tagged: false });
      }
    }

    this.updateThrows(dt);
    if (this.invulnT > 0) this.invulnT = Math.max(0, this.invulnT - dt);
    this.audio.update(dt, { danger: this.danger });
    this.updateRays(dt);
    this.updateParticles(dt);
    this.flipFreeze = Math.max(0, (this.flipFreeze || 0) - dt);
    if (this.shakeT > 0) {
      this.shakeT = Math.max(0, this.shakeT - dt);
      this.shake = Math.max(this.shake, 9);
      if (this.shakeT === 0) this.shake = 0;
    } else {
      this.shake = Math.max(0, this.shake - dt * 24);
    }
    this.flash = Math.max(0, this.flash - dt * 3.4);
    this.ui.updateHUD({
      chamber: this.chamberIndex,
      shards: this.shards.length,
      total: this.totalShards || (this.floorMode ? 1 : CHAMBERS[this.chamberIndex].shards),
      depth: this.floorMode ? this.depth : 0,
      charges: this.charges,
      listen,
      muted: this.audio.muted,
      danger: this.danger,
      diamonds: this.diamonds,
      gold: this.gold,
      charms: this.inv.charms.length,
      hot: this.inv.hot,
      active: this.activeItem,
      name: this.mapMode && this.mapNode ? this.mapNode.name : null,
      floor: this.level.moving ? this.movingFloor() : 0,
    });
    this.homeMarkers = [];
    const homeLvl = this.inv.level('home');
    if (homeLvl) {
      const r = CHARMS.home.range[homeLvl - 1];
      const marks = [];
      if (this.mapMode) {
        if (this.mapKey && !this.hasKey) marks.push({ x: this.mapKey.x, y: this.mapKey.y, c: '150,220,255', s: 'key' });
        for (const e of this.mapExits) marks.push({ x: e.x, y: e.y, c: '255,205,110', s: 'exit' });
      } else {
        if (L.key) marks.push({ x: L.key.x, y: L.key.y, c: '150,220,255', s: 'key' });
        if (L.exit) marks.push({ x: L.exit.x, y: L.exit.y, c: '255,205,110', s: 'exit' });
      }
      for (const m of marks) {
        if (dist(p.x, p.y, m.x, m.y) < r) this.homeMarkers.push(m);
      }
    }
  }

  // Every noise source goes through here, so the "it heard that" stinger stays
  // tied to the moment a hunter actually wakes up rather than to every step.
  /** A mimic repeated something. Hunters turn toward it, the room gets a
   *  visible ring, and a sealed door that hears an answer unlocks. */
  onEcho(m, kind, src) {
    m.echoCool = 2.0;
    m.revealT = 1.8;
    const pan = clamp((m.x - this.player.x) / 480, -1, 1) * 0.9;
    this.audio.echo(pan, kind);
    this.echoRings.push({ x: m.x, y: m.y, t: this.now, kind });
    for (const h of this.hunters) {
      if (dist(m.x, m.y, h.x, h.y) < 520) this.alertHunter(h, m.x, m.y, 0.15);
    }
    const byPlayer = kind === 'ping' || kind === 'step' || kind === 'shard';
    if (this.echoRequired && !this.echoHeard && byPlayer
      && dist(m.x, m.y, this.level.exit.x, this.level.exit.y) < 620) {
      this.echoHeard = true;
      this.tryOpenExit(false);
    }
  }

  /** The exit stays shut until the door has heard a doubled sound, not just
   *  the shards. No text explains this: the door hums, something answers. */
  tryOpenExit(withFanfare = false) {
    if (this.exitOpen) return false;
    if (this.shards.length > 0) return false;
    if (this.echoRequired && !this.echoHeard) return false;
    this.exitOpen = true;
    this.audio.gateOpen();
    this.shake = Math.max(this.shake, 6);
    if (withFanfare) this.ui.toast('shard');
    return true;
  }

  alertHunter(h, x, y, delay) {
    if (!this.guides?.hunter) {
      this.maybeGuide('hunter', '你惊扰了一只猎手，按下shift以潜行');
      this.laterGuide('hunterSound', '猎手可以听到你发出来的声音', 3600);
    }
    const tracking = h.state === 'investigate';
    h.hear(x, y, delay);
    if (tracking || this.alertCd > 0) return;
    this.alertCd = 0.75;
    const pan = clamp((h.x - this.player.x) / 420, -1, 1) * 0.8;
    this.audio.alert(pan);
  }

  /** A bugspray line: flee its origin for one second. A newer line wins. */
  repelHunter(h, tag) {
    if (!h) return;
    if (tag.t < (h.repelTag ?? -1)) return;
    h.repelTag = tag.t;
    h.lureLock = null;
    h.repelT = 1;
    h.repelFrom = { x: tag.x, y: tag.y };
    const a = Math.atan2(h.y - tag.y, h.x - tag.x) || Math.random() * Math.PI * 2;
    let fx = tag.x + Math.cos(a) * 300;
    let fy = tag.y + Math.sin(a) * 300;
    const L = this.level;
    if (L) {
      fx = clamp(fx, L.tile, L.size.w - L.tile);
      fy = clamp(fy, L.tile, L.size.h - L.tile);
    }
    h.target = { x: fx, y: fy };
    h.pending = { x: fx, y: fy, t: 0.02 };
    h.path = [];
    if (h.type === 'patroller' || h.type === 'stalker') h.state = 'chase';
  }

  maybeGuide(key, text) {
    if (!this.guides) this.guides = {};
    if (this.guides[key]) return;
    this.guides[key] = true;
    this.ui.guide(text);
  }

  /** The first-run lesson: one line at a time, never while a screen owns input. */
  beginTutorial() {
    if (this.state !== 'playing' || this.tutorialStarted) return;
    this.tutorialStarted = true;
    // The key that started the game must not also be spent on a ping.
    this.input.pressed.delete('Space');
    this.input.pressed.delete('Enter');
    this.ui.guide('空格键可以发出声呐，探索更大的范围');
  }

  /** A follow-up hint with a beat in between, skipped if the moment passed. */
  laterGuide(key, text, ms = 3600) {
    if (!this.guideTimers) this.guideTimers = new Map();
    this.cancelGuide(key);
    const t = setTimeout(() => {
      this.guideTimers.delete(key);
      if (this.state !== 'playing') return;
      this.maybeGuide(key, text);
    }, ms);
    this.guideTimers.set(key, t);
  }

  cancelGuide(key) {
    if (!this.guideTimers) return;
    const t = this.guideTimers.get(key);
    if (t) clearTimeout(t);
    this.guideTimers.delete(key);
  }

  clearGuideTimers() {
    if (!this.guideTimers) return;
    for (const t of this.guideTimers.values()) clearTimeout(t);
    this.guideTimers.clear();
  }

  /** A usable was just bound to the hotkey row. */
  onHotkeyBound(o) {
    if (o && o.kind === 'item' && ITEMS[o.id] && ITEMS[o.id].kind === 'throw') this.throwBound = true;
  }

  onInventoryClosed() {
    if (!this.throwBound) return;
    this.throwBound = false;
    this.maybeGuide('bindThrow', '摁下对应快捷键可以选中投掷物');
  }

  resolve(entity, dx, dy) {
    const L = this.level;
    return moveCircle(L.grid, L.w, L.h, L.tile, entity.x, entity.y, entity.r, dx, dy);
  }

  /** Spawn a fan of sonar rays that bounce off walls and leave light trails. */
  /** A sound line touched a body: it now knows the tagged origin of that sound.
   *  Newer tags overwrite older ones; an equal tag changes nothing. */
  onRayTouch(e, tag) {
    if (!e || !tag) return;
    if (e instanceof Hunter) {
      if (tag.kind === 'lure') {
        // The corpse's call owns the body until it physically arrives, and a
        // player ping must not be able to redirect it in the meantime.
        e.lureLock = { x: tag.x, y: tag.y };
        e.alertT = Math.max(e.alertT || 0, 3);
        e.lastTag = Math.max(e.lastTag ?? -1, tag.t);
        e.target = { x: tag.x, y: tag.y };
        e.pending = { x: tag.x, y: tag.y, t: 0.1 };
        e.path = [];
        if (e.type === 'patroller' || e.type === 'stalker') e.state = 'chase';
        else if (e.type === 'hunter') e.state = 'investigate';
        return;
      }
      if (tag.kind === 'repel') {
        this.repelHunter(e, tag);
        return;
      }
      if (tag.t <= (e.lastTag ?? -1)) return;
      e.lastTag = tag.t;
      this.alertHunter(e, tag.x, tag.y, 0.14);
    } else if (e instanceof Skitter) {
      if (tag.t <= (e.lastTag ?? -1)) return;
      e.lastTag = tag.t;
      e.hear(tag.x, tag.y, tag.kind, tag.kind === 'ping' ? 1.05 : 1.35);
    }
  }

  /** Which body a ray touched, if any. */
  /** What a ray is allowed to touch. Colour is knowledge: gold is a shard,
   *  green is the door, red is something that hunts you. */
  hitEntity(x, y) {
    for (const sh of this.shards) {
      if (dist(x, y, sh.x, sh.y) < 13) return { e: sh, kind: 'shard', tint: '255,205,110' };
    }
    const ex = this.level.exit;
    if (ex && dist(x, y, ex.x, ex.y) < 17) return { e: ex, kind: 'exit', tint: '140,240,170' };
    for (const h of this.hunters) {
      if (dist(x, y, h.x, h.y) < 15) return { e: h, kind: 'hunter', tint: '255,58,58', hot: true };
    }
    for (const sk of this.skitters) {
      if (dist(x, y, sk.x, sk.y) < 12) return { e: sk, kind: 'skitter', tint: '255,58,58', hot: true };
    }
    return null;
  }

  /** Every footstep is a small sonar ring. White for you and for hunters,
   *  blue for the mimic, which is neither prey nor predator. */
  // A footstep is a small sonar burst and nothing else: no ring, no centre dot.
  // Only the player's own bursts carry a tag; a hunter's steps are mute.
  stepEcho(x, y, tint = null, opts = {}) {
    const count = opts.count ?? 22;
    const speed = opts.speed ?? 330;
    const life = opts.life ?? 0.58;
    const tag = opts.tagged === false ? null : undefined;
    this.spawnRays(x, y, { count, speed, life, tint, tag, kind: opts.kind || 'step', ghost: !!opts.ghost });
  }

  spawnRays(x, y, { count = RAY_COUNT, speed = RAY_SPEED, life = RAY_LIFE, tint = null, kind = 'ping', tag = undefined, sweep = null, ghost = false } = {}) {
    const stamp = tag === null ? null : tag || { x, y, t: this.now, kind };
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.035;
      const o = 6 + Math.random() * 9;
      const ox = x + Math.cos(a) * o;
      const oy = y + Math.sin(a) * o;
      this.rays.push({
        x: ox,
        y: oy,
        dx: Math.cos(a),
        dy: Math.sin(a),
        age: 0,
        speed,
        life: life * (0.85 + Math.random() * 0.25),
        bounce: 0,
        hot: false,
        tint,
        tag: stamp,
        sweep,
        ghost,
        pts: [{ x: ox, y: oy }],
      });
    }
    while (this.rays.length > RAY_COUNT * 4) this.rays.shift();
  }

  /** Advance every ray, reflecting off walls and pruning dead trails. */
  updateRays(dt) {
    const L = this.level;
    if (!L) return;
    const alive = [];
    for (let i = 0; i < this.rays.length; i++) {
      const r = this.rays[i];
      r.age += dt;
      if (r.age > r.life + 1.5) continue;
      if (r.ghost && r.age <= r.life) {
        const step = (r.speed || RAY_SPEED) * dt;
        r.x += r.dx * step;
        r.y += r.dy * step;
        const lastG = r.pts[r.pts.length - 1];
        if (Math.abs(r.x - lastG.x) + Math.abs(r.y - lastG.y) >= 5) {
          r.pts.push({ x: r.x, y: r.y });
          if (r.pts.length > 14) r.pts.shift();
        }
        alive.push(r);
        continue;
      }
      if (r.age <= r.life) {
        let move = (r.speed || RAY_SPEED) * dt;
        while (move > 0.001) {
          const d = Math.min(6, move);
          move -= d;
          const nx = r.x + r.dx * d;
          const ny = r.y + r.dy * d;
          // Only tagged (player-made) sound can touch a body. A hunter's own
          // footstep is scenery: it must not collide with the hunter itself.
          const ent = r.tag ? this.hitEntity(nx, ny) : null;
          if (ent) {
            ent.e.seenAt = this.now;
            if (r.tag) this.onRayTouch(ent.e, r.tag);
            r.tint = ent.tint;
            r.hot = !!ent.hot;
            if (ent.hot) {
              r.life += 0.55;
              this.flashes.push({ x: ent.e.x, y: ent.e.y, t: this.now });
            }
            const nlen = Math.hypot(r.x - ent.e.x, r.y - ent.e.y) || 1;
            const nxn = (r.x - ent.e.x) / nlen;
            const nyn = (r.y - ent.e.y) / nlen;
            const dot = r.dx * nxn + r.dy * nyn;
            r.dx -= 2 * dot * nxn;
            r.dy -= 2 * dot * nyn;
            r.x += r.dx * 3;
            r.y += r.dy * 3;
            r.bounce++;
            if (r.bounce >= 3) { r.age = Math.max(r.age, r.life); break; }
            continue;
          }
          const hitX = isSolid(L.grid, L.w, L.h, Math.floor(nx / TILE), Math.floor(r.y / TILE));
          const hitY = isSolid(L.grid, L.w, L.h, Math.floor(r.x / TILE), Math.floor(ny / TILE));
          if (hitX) r.dx *= -1;
          if (hitY) r.dy *= -1;
          if (hitX || hitY) {
            const ax = Math.floor(r.x / TILE);
            const ay = Math.floor(r.y / TILE);
            if (this.mapMode && this.absorbSet && this.absorbSet.has(`${ax},${ay}`)) {
              r.age = Math.max(r.age, r.life);
              break;
            }
            r.bounce++;
          }
          r.x = hitX ? r.x : nx;
          r.y = hitY ? r.y : ny;
          if (r.sweep) this.sweepCheck(r, nx, ny);
          const last = r.pts[r.pts.length - 1];
          if (Math.abs(r.x - last.x) + Math.abs(r.y - last.y) >= 5) {
            r.pts.push({ x: r.x, y: r.y });
            if (r.pts.length > 14) r.pts.shift();
          }
          if (r.bounce >= 3) {
            r.age = Math.max(r.age, r.life);
            break;
          }
        }
      }
      alive.push(r);
    }
    this.rays = alive;
    if (this.flashes.length) this.flashes = this.flashes.filter((f) => this.now - f.t < 0.55);
  }

  firePing() {
    if (this.charges < 1) {
      this.audio.deny();
      return;
    }
    this.charges--;
    if (this.chargeTimer <= 0) this.chargeTimer = PING_REGEN;
    const p = this.player;
    this.pings.push({
      x: p.x,
      y: p.y,
      t0: this.now,
      speed: PING_SPEED,
      life: PING_LIFE,
      heard: new Set(),
    });
    this.pingsUsed++;
    const quietLvl = this.inv.level('sleep');
    const quiet = quietLvl && Math.random() < CHARMS.sleep.quiet[quietLvl - 1];
    this.spawnRays(p.x, p.y, quiet ? { tag: null } : {});
    this.audio.ping();
    this.echoShards(p.x, p.y);
    this.shake = Math.max(this.shake, 2.4);
    this.flash = 0.85;
    if (!this.pingHintShown) {
      this.pingHintShown = true;
      this.ui.toast('shard');
    }
    // The dots only mean something once one has gone dark: teach them on the
    // first real ping, a beat after the shell has left the body.
    if (this.tutorialStarted && !this.guides?.charges) {
      this.laterGuide('charges', '左下角的点表示你还剩余多少次声呐释放机会，它会随着时间自然恢复', 900);
    }
  }

  /** The shards are not silent. A pulse reaching them is answered by a bell
   *  whose delay is its distance and whose pan is its bearing — navigation by
   *  ear, never by pointer. */
  echoShards(px, py) {
    const reached = [];
    for (const sh of this.shards) {
      const d = dist(px, py, sh.x, sh.y);
      if (d > SHARD_ECHO_RANGE) continue;
      const delay = d / SHARD_ECHO_SPEED;
      const gain = 0.05 * (1 - d / SHARD_ECHO_RANGE) ** 1.4 + 0.006;
      const pan = echoPan(sh.x - px, sh.y - py);
      this.audio.shardEcho(pan, gain, delay);
      reached.push({ id: sh.id, d: Math.round(d), delay: +delay.toFixed(3) });
    }
    reached.sort((a, b) => a.d - b.d);
    this.lastShardEchoes = reached.slice(0, 4);
  }

  die() {
    if (this.state !== 'playing') return;
    if (this.debugInvincible) return;
    this.state = 'dead';
    this.deathT = 0;
    this.shake = 18;
    this.flash = 0;
    this.pings = [];
    this.rays = [];
    this.audio.death();
    this.ui.dismiss();
    this.ui.hideHUD();
  }
