// ---- src/selfcheck.js ----
// Startup self-check: proves the build the browser actually loaded is intact.
// This exists because a stale module cache once made bug fixes look absent
// until Ctrl+F5 — so the boot screen now shows what loaded and what works.
const VERSION = '0.8.10';

const SCRIPT_VERSION = () => {
  const s = [...document.scripts].map((el) => el.src).find((src) => src.includes('main.js'));
  if (!s) return null;
  const m = s.match(/[?&]v=([\w.]+)/);
  return m ? m[1] : null;
};

/** The engine synthesises everything, so "loaded" means every voice exists. */
const AUDIO_VOICES = [
  'tone', 'noise', 'setSector', 'ping', 'echo', 'skitterTick', 'gateHum',
  'deny', 'alert', 'footstep', 'hunterStep', 'shard', 'shardEcho', 'gateOpen',
  'heartbeat', 'death', 'clear', 'click', 'update', 'setMuted',
  'floorChime', 'swapRumble', 'glassBreak', 'b2Quake', 'mcStopped',
];

function collectChecks(game) {
  const rows = [];
  const add = (name, ok, detail = '', warn = false) => rows.push({ name, ok, detail, warn });

  add('脚本', typeof window.__hush !== 'undefined' && typeof game?.update === 'function', `v${VERSION}`);

  let rooms = 0;
  try {
    const L = game.level;
    rooms = L?.rooms?.length ?? 0;
    add('关卡', !!(L && L.grid && L.spawn && L.size), `${L.w}×${L.h}${rooms ? ` · ${rooms} 间` : ''}`);
  } catch (e) {
    add('关卡', false, String(e.message || e));
  }

  try {
    const inv = new Inventory();
    inv.addItem('pebbles', 3);
    const idx = inv.pack.findIndex((s) => s && s.id === 'pebbles');
    const bound = inv.bindHot(0, idx);
    const kept = inv.count('pebbles') === 3;
    const spent = inv.consume('pebbles') && inv.count('pebbles') === 2;
    const ref = !!(inv.hot[0] && inv.hot[0].n === 2);
    add('背包与快捷键', bound && kept && spent && ref, kept && ref ? '堆叠留在背包' : '快捷键抢走了整堆');
  } catch (e) {
    add('背包与快捷键', false, String(e.message || e));
  }

  // Consumables are the most bug-prone part of the inventory: every one must
  // consume exactly one unit and have a name/line to show in the tooltip.
  try {
    let thrown = 0;
    let used = 0;
    for (const [id, def] of Object.entries(ITEMS)) {
      if (!ITEM_TEXT[id]) throw new Error(`${id} 缺少描述`);
      // A fresh pack per item: eight stacks would overflow the six slots and
      // the seventh check would fail for the wrong reason.
      const inv = new Inventory();
      if (!inv.addItem(id, 2)) throw new Error(`${id} 未能入包`);
      const before = inv.count(id);
      if (before !== 2) throw new Error(`${id} 未能入包`);
      if (!inv.consume(id) || inv.count(id) !== 1) throw new Error(`${id} 消耗异常`);
      if (def.kind === 'throw') thrown++;
      else used++;
    }
    add('消耗品', true, `${thrown} 投掷 · ${used} 使用`);
  } catch (e) {
    add('消耗品', false, String(e.message || e));
  }

  const a = game?.audio;
  const missing = AUDIO_VOICES.filter((m) => typeof a?.[m] !== 'function');
  const audioState = a && a.ctx ? a.ctx.state : '未初始化';
  if (missing.length) {
    add('音效', false, `缺少 ${missing.length} 个音色`);
  } else if (audioState === 'running') {
    add('音效', true, `已就绪 · ${AUDIO_VOICES.length} 音色`);
  } else {
    // A suspended context is not a failure: browsers require a gesture first.
    add('音效', false, audioState === '未初始化' ? '等待启动' : '点击画面启用', true);
  }

  const sv = SCRIPT_VERSION();
  add('版本', sv === VERSION, sv ? `脚本 ${sv}` : '无版本号');
  return rows;
}

function runSelfCheck(game, { onDone } = {}) {
  const wrap = document.createElement('div');
  wrap.id = 'boot';
  wrap.innerHTML = `
    <div class="boot-panel">
      <div class="boot-mark"></div>
      <div class="boot-head"><span class="boot-stage">载入声呐</span><span class="boot-pct">0%</span></div>
      <div class="boot-bar"><i></i></div>
      <ul class="boot-rows"></ul>
      <div class="boot-actions"></div>
    </div>`;
  document.body.appendChild(wrap);

  const bar = wrap.querySelector('.boot-bar i');
  const pct = wrap.querySelector('.boot-pct');
  const stage = wrap.querySelector('.boot-stage');
  const list = wrap.querySelector('.boot-rows');
  const actions = wrap.querySelector('.boot-actions');

  const all = collectChecks(game);
  const rows = [];
  const paint = () => {
    list.innerHTML = rows
      .map(
        (r) =>
          `<li class="${r.warn ? 'warn' : r.ok ? 'ok' : 'bad'}"><b>${r.warn ? '·' : r.ok ? '✓' : '×'}</b><span>${r.name}</span><em>${r.detail || ''}</em></li>`
      )
      .join('');
  };

  // One row per stage, with a cumulative weight: the bar only ever moves
  // forward, the way a loading bar is supposed to.
  const steps = [
    ['脚本', '载入模块', 0.14],
    ['关卡', '构筑关卡', 0.3],
    ['背包与快捷键', '校验背包', 0.52],
    ['消耗品', '检查消耗品', 0.72],
    ['音效', '载入音效', 0.9],
    ['版本', '核对版本', 1],
  ];

  let i = 0;
  const tick = () => {
    if (i < steps.length) {
      const [name, label, at] = steps[i];
      const row = all.find((r) => r.name === name);
      if (row) rows.push(row);
      stage.textContent = label;
      const p = Math.round(at * 100);
      bar.style.width = `${p}%`;
      pct.textContent = `${p}%`;
      paint();
      i++;
      setTimeout(tick, 150);
      return;
    }

    rows.length = 0;
    rows.push(...all);
    paint();
    stage.textContent = '完成';
    const bad = all.filter((r) => !r.ok && !r.warn);
    const warn = all.filter((r) => r.warn);

    if (bad.length) {
      actions.innerHTML = '<button class="boot-retry">重新载入（跳过缓存）</button>';
      actions.querySelector('.boot-retry').onclick = () => {
        location.replace(`${location.pathname}?fresh=${Date.now()}`);
      };
      wrap.classList.add('has-errors');
    } else {
      actions.innerHTML = `<span class="boot-hint">${warn.length ? '点击画面启用音效' : '按任意键开始'}</span>`;
      setTimeout(() => {
        wrap.classList.add('done');
        setTimeout(() => wrap.remove(), 420);
      }, 460);
    }
    onDone?.(rows);
  };

  tick();
  return wrap;
}

// ---- src/render.js ----

const WALL_RGB = '150, 238, 226';
const GLOW_RGB = '80, 210, 198';
const AMBER = '255, 196, 107';
const RED = '255, 86, 86';
const TEAL = '127, 227, 212';
// Sonar lines sit a step below the UI teal: the dark should stay dark.
const RAY_RGB = '150, 198, 192';
const GOLD = '255, 205, 110';
const GREEN = '140, 240, 170';

const BUCKETS = 12;
// (duplicate TAU removed by the bundler)

/**
 * Sonar renderer.
 *
 * The world is drawn in world units; walls are lit analytically: for each wall
 * segment we compute the distance from every live ping's wavefront, so a wall
 * only glows while the shell is passing over it. Everything else is black.
 */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.cw = 0;
    this.ch = 0;
    this.scale = 1;
    this.ox = 0;
    this.oy = 0;
    this.buckets = Array.from({ length: BUCKETS }, () => []);
    this.resize();
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.cw = Math.max(320, rect.width);
    this.ch = Math.max(240, rect.height);
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.round(this.cw * this.dpr);
    this.canvas.height = Math.round(this.ch * this.dpr);
  }

  fit(level) {
    const pad = Math.min(56, Math.max(18, Math.min(this.cw, this.ch) * 0.06));
    const fitScale = Math.min(
      (this.cw - pad * 2) / level.size.w,
      (this.ch - pad * 2) / level.size.h,
    );
    // Stay close enough that the room never fits on screen at once: darkness
    // should extend past the edge of the display.
    const zoom = Math.max(this.cw / 900, this.ch / 620);
    this.scale = Math.max(fitScale, Math.min(2.35, Math.max(1, zoom)));
  }

  _segBrightness(s, pings, now) {
    let best = 0;
    for (let i = 0; i < pings.length; i++) {
      const p = pings[i];
      const age = now - p.t0;
      if (age < 0 || age > p.life) continue;
      const R = age * p.speed;
      const dx = s.x2 - s.x1;
      const dy = s.y2 - s.y1;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((p.x - s.x1) * dx + (p.y - s.y1) * dy) / len2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const cx = s.x1 + dx * t;
      const cy = s.y1 + dy * t;
      const d = Math.hypot(p.x - cx, p.y - cy);
      const band = d - R;
      if (band > 64 || band < -64) continue;
      const pulse = 1 - age / p.life;
      const v = pulse * Math.exp(-(band * band) / 1600);
      if (v > best) best = v;
    }
    return best;
  }

  _pointBrightness(x, y, pings, now, level, occlude = true) {
    let best = 0;
    for (let i = 0; i < pings.length; i++) {
      const p = pings[i];
      const age = now - p.t0;
      if (age < 0 || age > p.life) continue;
      const R = age * p.speed;
      const d = Math.hypot(x - p.x, y - p.y);
      const band = d - R;
      if (band > 58 || band < -58) continue;
      const pulse = 1 - age / p.life;
      let v = pulse * Math.exp(-(band * band) / 1200);
      if (occlude && v > 0.02 && level) {
        if (!lineOfSight(level.grid, level.w, level.h, p.x, p.y, x, y, level.tile)) v *= 0.1;
      }
      if (v > best) best = v;
    }
    return best;
  }

  draw(game) {
    const { ctx } = this;
    const level = game.level;
    if (!level) return;
    this.fit(level);
    const now = game.now;
    const shake = game.shake || 0;
    const sx = (Math.random() * 2 - 1) * shake;
    const sy = (Math.random() * 2 - 1) * shake;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#04070a';
    ctx.fillRect(0, 0, this.cw, this.ch);

    const vw = this.cw / this.scale;
    const vh = this.ch / this.scale;
    const { x: cx, y: cy } = viewCenter(level.size.w, level.size.h, game.camX, game.camY, vw, vh);

    ctx.save();
    ctx.translate(this.cw / 2 - cx * this.scale + sx, this.ch / 2 - cy * this.scale + sy);
    ctx.scale(this.scale, this.scale);

    // ---- sonar: sparks fly out, bounce off walls, leave short comet tails ---
    // Stealth is silence, and silence is blindness: nothing renders at all.
    const vision = !game.blind;
    const rays = vision ? game.rays || [] : [];
    if (rays.length) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 0; i < rays.length; i++) {
        const r = rays[i];
        if (!r.pts || r.pts.length < 2) continue;
        const fade = r.age <= r.life ? 1 : Math.max(0, 1 - (r.age - r.life) / 1.2);
        if (fade <= 0.02) continue;
        const head = Math.min(1, r.age / r.life);
        const a = (0.34 - head * 0.2) * fade * (r.tint ? 1.2 : 1);
        if (a <= 0.02) continue;
        const pts = r.pts;
        const n = pts.length;
        const start = Math.max(0, n - 10);
        const segs = n - 1 - start;
        if (segs > 0) {
          const batches = 3;
          for (let b = 0; b < batches; b++) {
            const i0 = start + Math.floor((segs * b) / batches);
            const i1 = start + Math.max(1, Math.floor((segs * (b + 1)) / batches));
            if (i1 <= i0) continue;
            const ta = a * Math.pow((b + 1) / batches, 1.6);
            ctx.beginPath();
            ctx.moveTo(pts[i0].x, pts[i0].y);
            for (let j = i0 + 1; j <= i1; j++) ctx.lineTo(pts[j].x, pts[j].y);
            if (b === batches - 1) ctx.lineTo(r.x, r.y);
            ctx.strokeStyle = `rgba(${r.tint || RAY_RGB}, ${Math.min(1, ta * (r.hot ? 1.9 : r.tint ? 1.3 : 1))})`;
            ctx.lineWidth = (r.hot ? 1.6 : r.tint ? 1.0 : 0.8) + ta * (r.hot ? 2.4 : 1.4);
            ctx.stroke();
          }
        }
        if (r.age <= r.life) {
          ctx.fillStyle = `rgba(${r.tint || RAY_RGB}, ${Math.min(0.62, a * (r.hot ? 2.6 : 1.25))})`;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.hot ? 2.6 : 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // ---- particles ----------------------------------------------------------
    const dust = game.particles;
    if (dust) {
      for (let i = 0; i < dust.length; i++) {
        const p = dust[i];
        const b = this._pointBrightness(p.x, p.y, game.pings, now, level, false);
        if (b < 0.02) continue;
        ctx.fillStyle = `rgba(225, 248, 246, ${b * 0.45})`;
        ctx.fillRect(p.x, p.y, 1.5, 1.5);
      }
    }

    // ---- shards -------------------------------------------------------------
    for (const l of game.loot || []) {
      // Until the player is close, a spot is only a faint, colourless echo.
      const unknown = !l.kind;
      const k = Math.max(0, 1 - (now - (l.seenAt ?? -9)) / 2.2);
      const glow = unknown ? 0.09 + 0.03 * Math.sin(now * 1.5 + l.x * 0.01) : Math.max(0.16, k);
      const col = unknown ? '170, 220, 210' : l.kind === 'charm' ? '170,225,255' : '255,205,110';
      ctx.strokeStyle = `rgba(${col}, ${glow * 0.8})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(l.x, l.y, unknown ? 3.4 : 5.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = `rgba(${col}, ${glow * 0.55})`;
      ctx.beginPath();
      ctx.arc(l.x, l.y, unknown ? 1 : 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const sh of game.shards) {
      if (!vision) continue;
      const seen = now - (sh.seenAt ?? -99);
      const px = game.player ? game.player.x : game.camX;
      const py = game.player ? game.player.y : game.camY;
      const near = Math.max(0, 1 - Math.hypot(sh.x - px, sh.y - py) / 46) * 0.22;
      const a = clamp(seen < 2.6 ? 0.35 + 0.65 * (1 - seen / 2.6) : near, 0, 1);
      if (a < 0.02) continue;
      const pulse = 0.75 + 0.25 * Math.sin(now * 2.4 + sh.id * 1.7);
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = `rgba(${GOLD}, ${0.16 * a * pulse})`;
      ctx.fillRect(-12, -12, 24, 24);
      ctx.strokeStyle = `rgba(${GOLD}, ${0.9 * a * pulse})`;
      ctx.lineWidth = 1.6;
      ctx.strokeRect(-6.5, -6.5, 13, 13);
      ctx.fillStyle = `rgba(255, 240, 210, ${0.9 * a * pulse})`;
      ctx.fillRect(-2.5, -2.5, 5, 5);
      ctx.restore();
    }

    // ---- named-map key and doors --------------------------------------------
    if (vision && game.mapMode) {
      if (game.mapKey && !game.hasKey) {
        const k = game.mapKey;
        const pulse = 0.72 + 0.28 * Math.sin(now * 3.1);
        ctx.save();
        ctx.translate(k.x, k.y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = `rgba(${GOLD}, ${0.95 * pulse})`;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(-7, -7, 14, 14);
        ctx.strokeRect(-3.5, -3.5, 7, 7);
        ctx.restore();
      }
      for (const e of game.mapExits || []) {
        const locked = e.require === 'key' && !game.hasKey;
        const col = locked ? '255, 110, 110' : e.color;
        const pulse = 0.6 + 0.4 * Math.sin(now * 2.2);
        const near = game.player ? Math.hypot(game.player.x - e.x, game.player.y - e.y) : 999;
        // Far away a door is only a small signal; the ring opens up as you walk
        // closer, so a room reads before you are standing on top of it.
        // Two-arm phase keeps its size; growth runs in the same window as
        // the third arm's fade-in, so full size arrives with the full triad.
        const prox = smoothstep(PORTAL.d3, Math.max(60, PORTAL.d3 - PORTAL.fade), near);
        const R = lerp(PORTAL.far, PORTAL.near, prox);
        const arm3 = smoothstep(PORTAL.d3, PORTAL.d3 - PORTAL.fade, near);
        const a = (locked ? 0.5 : 0.55 + 0.35 * pulse) * (0.55 + 0.45 * prox);
        // Even a far door is a small living vortex; it opens up as you walk
        // closer, so the same door reads at both ends of the room.
        drawPortalFx(ctx, e.x, e.y, R, now, col, locked, 1, e.x * 0.017 + e.y * 0.011, arm3, PORTAL.spin);
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.strokeStyle = `rgba(${col}, ${a})`;
        // Radius scales; the ink weight does not, so distant doors stay crisp.
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = `rgba(${col}, ${a * 0.7})`;
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(1.6, R * 0.22), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // A portal should name its destination before you step in. The font is
        // divided by the zoom so the label stays readable at every scale; it
        // keeps its size while the ring breathes with proximity.
        const dest = mapNode(e.to);
        const suffix = !e.built ? '·未开通' : locked ? '·需钥匙' : '';
        ctx.save();
        ctx.font = `${Math.round(11 / this.scale)}px ui-monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(${col}, ${near < 170 ? 0.9 : 0.4})`;
        ctx.fillText(`${dest ? dest.name : '未知'}${suffix}`, e.x, e.y - (R + 17 * prox));
        ctx.restore();
      }
    }

    // ---- moving maze: sound particles, cores, flip rings --------------------
    // A sound line is a moving particle with a fading point trail, exactly like
    // the sonar rays. Nothing here is a static stroke.
    if (level.moving) {
      const tile = level.tile;
      ctx.save();

      // Door warning: four red particles per door, two crossing each way.
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (const t of game.soundTrails || []) {
        const pts = t.trail;
        if (!pts || pts.length < 2) continue;
        const life = Math.max(0, 1 - t.age / t.life);
        if (life <= 0) continue;
        const n = pts.length;
        const start = Math.max(0, n - 10);
        const segs = n - 1 - start;
        if (segs <= 0) continue;
        for (let b = 0; b < 3; b++) {
          const i0 = start + Math.floor((segs * b) / 3);
          const i1 = start + Math.max(1, Math.floor((segs * (b + 1)) / 3));
          if (i1 <= i0) continue;
          const f = (b + 1) / 3;
          ctx.strokeStyle = `rgba(${t.tint}, ${life * (0.08 + 0.62 * f)})`;
          ctx.lineWidth = t.width * (0.6 + f * 0.8);
          ctx.beginPath();
          ctx.moveTo(pts[i0].x, pts[i0].y);
          for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
        ctx.fillStyle = `rgba(${t.tint}, ${0.85 * life})`;
        ctx.beginPath();
        ctx.arc(pts[n - 1].x, pts[n - 1].y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Core: three real sonar particles bouncing inside the one-tile 口.
      for (const t of game.coreTrails || []) {
        const blk = level.blocks[t.block];
        if (!blk || blk.gone || blk.core.broken || blk.decor[blk.z] === 'none') continue;
        const pts = t.pts;
        if (!pts || pts.length < 2) continue;
        const col = blk.i === 4 ? '255, 200, 90' : blk.z === 1 ? '70, 150, 160' : '127, 227, 212';
        const n = pts.length;
        const start = Math.max(0, n - 32);
        const tail = pts[start];
        const grad = ctx.createLinearGradient(tail.x, tail.y, t.x, t.y);
        grad.addColorStop(0, `rgba(${col}, 0)`);
        grad.addColorStop(0.45, `rgba(${col}, 0.14)`);
        grad.addColorStop(1, `rgba(${col}, 0.62)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[start].x, pts[start].y);
        for (let i = start + 1; i < n - 1; i++) {
          const mx = (pts[i].x + pts[i + 1].x) / 2;
          const my = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        ctx.lineTo(pts[n - 1].x, pts[n - 1].y);
        ctx.stroke();
        ctx.fillStyle = `rgba(${col}, 0.9)`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      for (const blk of level.blocks) {
        if (blk.gone) continue;
        const kind = blk.decor[blk.z];
        if (kind === 'none') continue;
        const cx = (blk.ox + 12.5) * tile;
        const cy = (blk.oy + 12.5) * tile;
        if (blk.core.broken) {
          // The 口 is gone; only a cold ember is left.
          const flick = 0.25 + 0.1 * Math.sin(now * 7.1 + blk.i);
          ctx.fillStyle = `rgba(180, 190, 195, ${flick})`;
          ctx.beginPath();
          ctx.arc(cx, cy, 2.2, 0, Math.PI * 2);
          ctx.fill();
          continue;
        }
        const col = blk.i === 4 ? '255, 200, 90' : blk.z === 1 ? '70, 150, 160' : '127, 227, 212';
        // The sealed cell's four edges, faint enough to read without a pulse.
        ctx.strokeStyle = blk.i === 4 ? 'rgba(255, 200, 90, 0.16)' : 'rgba(255, 255, 255, 0.10)';
        ctx.lineWidth = 1;
        ctx.strokeRect((blk.ox + 12) * tile, (blk.oy + 12) * tile, tile, tile);
        if (kind === 'button') {
          const pulse = 0.5 + 0.5 * Math.sin(now * (Math.PI * 2 / 1.2));
          ctx.strokeStyle = `rgba(255, 240, 200, ${0.35 + 0.5 * pulse})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(cx, cy, 6, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx, cy - 10);
          ctx.lineTo(cx, cy - 3);
          ctx.stroke();
        }
      }
      for (const fr of level.moving.state === 'running' ? game.flipRings || [] : []) {
        const k = (now - fr.t) / 0.5;
        if (k < 0 || k > 1) continue;
        ctx.strokeStyle = `rgba(255, 70, 70, ${0.5 * (1 - k)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(fr.x, fr.y, 18 + 362 * k, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ---- exit ---------------------------------------------------------------
    if (vision && level.exit) {
      const eSeen = now - (level.exit.seenAt ?? -99);
      if (game.scanT > 0 && game.level) {
        // The route is a real path around walls, drawn only while it lasts.
        for (const rt of game.scanRoutes || []) {
          if (!rt.pts || rt.pts.length < 2) continue;
          ctx.save();
          ctx.setLineDash([6, 6]);
          ctx.lineDashOffset = -now * 16;
          ctx.strokeStyle = `rgba(${rt.col}, 0.62)`;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(rt.pts[0].x, rt.pts[0].y);
          for (let i = 1; i < rt.pts.length; i++) ctx.lineTo(rt.pts[i].x, rt.pts[i].y);
          ctx.stroke();
          ctx.restore();
        }
        const pulse = 0.5 + 0.5 * Math.sin(now * 4);
        const marks = [];
        if (game.mapMode) {
          if (game.mapKey) marks.push({ x: game.mapKey.x, y: game.mapKey.y, col: '255,205,110' });
          for (const e of game.mapExits || []) marks.push({ x: e.x, y: e.y, col: '140,240,170' });
        } else {
          if (game.level.key) marks.push({ x: game.level.key.x, y: game.level.key.y, col: '255,205,110' });
          if (game.level.exit) marks.push({ x: game.level.exit.x, y: game.level.exit.y, col: '140,240,170' });
        }
        for (const m of marks) {
          ctx.strokeStyle = `rgba(${m.col}, ${0.35 + pulse * 0.45})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(m.x, m.y, 12 + pulse * 6, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(m.x, m.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${m.col}, 0.9)`;
          ctx.fill();
        }
      }
      if (game.exitOpen) {
        this._drawExit(level.exit.x, level.exit.y, 0.9, GREEN, now, true);
      } else if (eSeen < 2.6) {
        this._drawExit(level.exit.x, level.exit.y, 0.3 + 0.6 * (1 - eSeen / 2.6), GREEN, now, false);
      }
    }

    // ---- hunters: never drawn as bodies. Only their reflection exists --------

    // ---- echo rings: where a mimic answered --------------------------------
    for (const r of game.echoRings || []) {
      const k = (now - r.t) / 1.2;
      if (k < 0 || k > 1) continue;
      ctx.strokeStyle = `rgba(150, 242, 230, ${(1 - k) * 0.3})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 7 + k * 54, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ---- debug view (only when ~ was pressed) -------------------------------
    if (game.debugMode) {
      ctx.save();
      ctx.lineWidth = 1;
      for (const h of game.hunters) {
        ctx.strokeStyle = 'rgba(255, 70, 70, 0.95)';
        ctx.strokeRect(h.x - 11, h.y - 11, 22, 22);
        if (h.path && h.path.length) {
          ctx.beginPath();
          ctx.moveTo(h.x, h.y);
          for (const wp of h.path) ctx.lineTo(wp.x, wp.y);
          ctx.strokeStyle = 'rgba(255, 70, 70, 0.45)';
          ctx.stroke();
        }
        if (h.state) {
          ctx.strokeStyle = 'rgba(255, 220, 140, 0.85)';
          ctx.font = '9px monospace';
          ctx.fillStyle = 'rgba(255, 220, 140, 0.9)';
          ctx.fillText(h.type === 'hunter' ? h.state : `${h.type}:${h.state}`, h.x - 14, h.y - 16);
        }
        if (h.pending) {
          ctx.strokeStyle = 'rgba(255, 200, 120, 0.9)';
          ctx.beginPath();
          ctx.arc(h.pending.x, h.pending.y, 8, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      for (const sk of game.skitters || []) {
        ctx.strokeStyle = 'rgba(110, 180, 255, 0.95)';
        ctx.strokeRect(sk.x - 9, sk.y - 9, 18, 18);
      }
      ctx.restore();
    }

    // ---- throwables: aiming fan and flight trails ---------------------------
    if (game.player) {
      const p = game.player;
      const showAim = !!game.activeItem;
      if (showAim) {
        const r = this;
        const ax = game.aimX ?? p.x + Math.cos(p.face || 0) * 160;
        const ay = game.aimY ?? p.y + Math.sin(p.face || 0) * 160;
        const a = Math.atan2(ay - p.y, ax - p.x);
        const len = 196;
        ctx.save();
        ctx.setLineDash([9, 7]);
        ctx.lineDashOffset = -now * 34;
        ctx.strokeStyle = 'rgba(255, 214, 150, 0.5)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * 16, p.y + Math.sin(a) * 16);
        ctx.lineTo(p.x + Math.cos(a) * len, p.y + Math.sin(a) * len);
        ctx.stroke();
        ctx.setLineDash([3, 5]);
        ctx.lineDashOffset = 0;
        ctx.strokeStyle = 'rgba(255, 236, 200, 0.22)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * 16, p.y + Math.sin(a) * 16);
        ctx.lineTo(p.x + Math.cos(a) * len, p.y + Math.sin(a) * len);
        ctx.stroke();
        ctx.restore();
      }
      // a corpse keeps calling: the long rings are its rays, this marks the body
      for (const lu of game.lures || []) {
        const k = Math.max(0, Math.min(1, lu.t / 5));
        const pulse = 0.6 + 0.4 * Math.sin(now * 2.2);
        ctx.strokeStyle = `rgba(232, 178, 148, ${0.34 * k * pulse})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(lu.x, lu.y, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([2, 8]);
        ctx.strokeStyle = `rgba(232, 178, 148, ${0.18 * k})`;
        ctx.beginPath();
        ctx.arc(lu.x, lu.y, 34 + pulse * 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = `rgba(232, 178, 148, ${0.5 * k})`;
        ctx.beginPath();
        ctx.arc(lu.x, lu.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const t of game.throws || []) {
        if (!t.trail || t.trail.length < 2) continue;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 1; i < t.trail.length; i++) {
          const k = i / t.trail.length;
          ctx.strokeStyle = `rgba(${game.activeItem === 'sharpStone' || t.kills ? '255, 205, 120' : '220, 250, 245'}, ${k * 0.5})`;
          ctx.lineWidth = 0.8 + k * 2.2;
          ctx.beginPath();
          ctx.moveTo(t.trail[i - 1].x, t.trail[i - 1].y);
          ctx.lineTo(t.trail[i].x, t.trail[i].y);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255, 246, 226, 0.95)';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ---- player -------------------------------------------------------------
    if (game.player) {
      const p = game.player;
      // Way home: a small triangle orbiting the player toward the key / exit.
      for (const m of game.homeMarkers || []) {
        const a = Math.atan2(m.y - p.y, m.x - p.x);
        const mx = p.x + Math.cos(a) * 34;
        const my = p.y + Math.sin(a) * 34;
        ctx.fillStyle = `rgba(${m.c}, 0.85)`;
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(a) * 6, my + Math.sin(a) * 6);
        ctx.lineTo(mx + Math.cos(a + 2.4) * 5, my + Math.sin(a + 2.4) * 5);
        ctx.lineTo(mx + Math.cos(a - 2.4) * 5, my + Math.sin(a - 2.4) * 5);
        ctx.closePath();
        ctx.fill();
      }
      for (const t of p.trail) {
        ctx.fillStyle = `rgba(190, 255, 246, ${(t.life / 0.55) * 0.07})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      const breathe = 0.75 + 0.25 * Math.sin(now * 2.1);
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 34);
      grad.addColorStop(0, `rgba(225, 255, 250, ${0.9 * breathe})`);
      grad.addColorStop(0.25, `rgba(150, 245, 235, ${0.4 * breathe})`);
      grad.addColorStop(1, 'rgba(80, 210, 198, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(240, 255, 252, 0.95)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.4, 0, Math.PI * 2);
      ctx.fill();
      // facing tick
      ctx.strokeStyle = 'rgba(220, 255, 250, 0.5)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(p.face) * 7, p.y + Math.sin(p.face) * 7);
      ctx.lineTo(p.x + Math.cos(p.face) * 11, p.y + Math.sin(p.face) * 11);
      ctx.stroke();

      if (game.listen) {
        const rr = 58 + Math.sin(now * 2.6) * 2.5;
        ctx.strokeStyle = 'rgba(120, 220, 210, 0.10)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 7]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // ---- wavefront rings ----------------------------------------------------
    for (const p of game.pings) {
      const age = now - p.t0;
      if (age < 0 || age > p.life) continue;
      const R = age * p.speed;
      const fade = (1 - age / p.life) * (p.small ? 0.45 : 1);
      ctx.strokeStyle = `rgba(${p.tint || TEAL}, ${fade * (p.tint ? 0.45 : 0.13)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(${p.tint || TEAL}, ${fade * fade * 0.055})`;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();

    // ---- screen space overlays ---------------------------------------------
    const danger = game.danger || 0;
    if (danger > 0.02) {
      const g = ctx.createRadialGradient(
        this.cw / 2,
        this.ch / 2,
        Math.min(this.cw, this.ch) * 0.24,
        this.cw / 2,
        this.ch / 2,
        Math.max(this.cw, this.ch) * 0.72,
      );
      g.addColorStop(0, 'rgba(255, 40, 40, 0)');
      g.addColorStop(1, `rgba(255, 40, 40, ${0.22 * danger})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
    if (game.state === 'dead' && game.deathT !== undefined) {
      const a = clamp(0.55 - game.deathT * 0.25, 0, 0.55);
      ctx.fillStyle = `rgba(120, 8, 8, ${a})`;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
    if (game.debugMode) {
      ctx.save();
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(255, 90, 90, 0.85)';
      const p = game.player || { x: 0, y: 0 };
      const lines = [
        `hunters ${game.hunters.length}  mimics ${(game.skitters || []).length}  shards ${game.shards.length}`,
        `player ${Math.round(p.x)},${Math.round(p.y)}  rays ${(game.rays || []).length}`,
        `freeze ${game.debugFreeze ? 'ON (1)' : 'off (1)'}`,
      ];
      lines.forEach((t, i) => ctx.fillText(t, 18, this.ch - 54 + i * 15));
      ctx.restore();
    }
    if (game.flash > 0) {
      ctx.fillStyle = `rgba(190, 255, 245, ${game.flash * 0.06})`;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
  }

  _drawExit(x, y, a, color, now, open) {
    const { ctx } = this;
    ctx.save();
    ctx.translate(x, y);
    const pulse = open ? 0.8 + 0.2 * Math.sin(now * 2.2) : 1;
    if (open) {
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 46);
      g.addColorStop(0, `rgba(255, 210, 140, ${0.25 * a})`);
      g.addColorStop(1, 'rgba(255, 210, 140, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 46, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = `rgba(${color}, ${a * pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-13, 16);
    ctx.lineTo(-13, -6);
    ctx.arc(0, -6, 13, Math.PI, 0);
    ctx.lineTo(13, 16);
    ctx.stroke();
    ctx.strokeStyle = `rgba(${color}, ${a * pulse * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-7, 16);
    ctx.lineTo(-7, -4);
    ctx.arc(0, -4, 7, Math.PI, 0);
    ctx.lineTo(7, 16);
    ctx.stroke();
    if (open) {
      ctx.fillStyle = `rgba(255, 230, 190, ${a * 0.6})`;
      for (let i = 0; i < 3; i++) {
        const yy = 4 - ((now * 18 + i * 12) % 26);
        ctx.fillRect(-2, yy, 4, 2);
      }
    }
    ctx.restore();
  }
}

// ---- src/editor.js ----
// Build mode: draw the dark yourself.
// Everything here is a shape too — the palette is colour and form, not labels.

const EDGE_W = 44;
const EDGE_H = 30;
const CELL = 20;

class Editor {
  constructor(game) {
    this.game = game;
    this.data = this.load();
    this.tool = 'wall';
    this.root = null;
    this.canvas = null;
    this.painting = false;
    this.erase = false;
  }

  empty() {
    const w = EDGE_W;
    const h = EDGE_H;
    const cells = new Uint8Array(w * h);
    for (let x = 0; x < w; x++) {
      cells[x] = 1;
      cells[(h - 1) * w + x] = 1;
    }
    for (let y = 0; y < h; y++) {
      cells[y * w] = 1;
      cells[y * w + w - 1] = 1;
    }
    return { w, h, cells: [...cells], spawn: { x: 2, y: 2 }, exit: { x: w - 4, y: h - 4 },
      shards: [], hunters: [], skitters: [] };
  }

  load() {
    try {
      const raw = localStorage.getItem('hush.map.v1');
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.w === EDGE_W && d.h === EDGE_H && Array.isArray(d.cells)) return d;
      }
    } catch (e) { /* a broken map is just an empty map */ }
    return this.empty();
  }

  save() {
    try { localStorage.setItem('hush.map.v1', JSON.stringify(this.data)); } catch (e) { /* private mode */ }
  }

  open() {
    if (!this.root) this.build();
    this.root.classList.remove('hidden');
    this.render();
  }

  close() {
    if (this.root) this.root.classList.add('hidden');
  }

  build() {
    const root = document.createElement('div');
    root.className = 'editor hidden';
    root.innerHTML = `
      <div class="editor-bar">
        <div class="tool" data-tool="wall" title="wall">${this.swatch('wall')}</div>
        <div class="tool" data-tool="erase" title="erase">${this.swatch('erase')}</div>
        <div class="sep"></div>
        <div class="tool" data-tool="shard" title="shard">${this.swatch('shard')}</div>
        <div class="tool" data-tool="exit" title="exit">${this.swatch('exit')}</div>
        <div class="tool" data-tool="hunter" title="hunter">${this.swatch('hunter')}</div>
        <div class="tool" data-tool="skitter" title="skitter">${this.swatch('skitter')}</div>
        <div class="tool" data-tool="spawn" title="spawn">${this.swatch('spawn')}</div>
        <div class="sep"></div>
        <button class="tool act" id="ed-play" title="play">${this.iconPlay()}</button>
        <button class="tool act" id="ed-close" title="close">${this.iconClose()}</button>
      </div>
      <canvas class="editor-canvas"></canvas>
      <div class="editor-foot"><span class="ed-legend"></span></div>
    `;
    this.game.ui.root.appendChild(root);
    this.root = root;
    this.canvas = root.querySelector('.editor-canvas');
    this.canvas.width = this.data.w * CELL;
    this.canvas.height = this.data.h * CELL;
    root.querySelectorAll('.tool[data-tool]').forEach((el) => {
      el.addEventListener('click', () => {
        this.tool = el.dataset.tool;
        this.syncTools();
      });
    });
    root.querySelector('#ed-play').addEventListener('click', () => this.play());
    root.querySelector('#ed-close').addEventListener('click', () => this.game.closeEditor());
    this.syncTools();
    this.bindCanvas();
  }

  swatch(kind) {
    if (kind === 'wall') return '<i class="sw wall"></i>';
    if (kind === 'erase') return '<i class="sw erase"></i>';
    if (kind === 'shard') return '<i class="sw shard"></i>';
    if (kind === 'exit') return '<i class="sw exit"></i>';
    if (kind === 'hunter') return '<i class="sw hunter"></i>';
    if (kind === 'skitter') return '<i class="sw skitter"></i>';
    return '<i class="sw spawn"></i>';
  }

  iconPlay() {
    return '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>';
  }

  iconClose() {
    return '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  }

  syncTools() {
    this.root.querySelectorAll('.tool[data-tool]').forEach((el) => {
      el.classList.toggle('on', el.dataset.tool === this.tool);
    });
  }

  bindCanvas() {
    const c = this.canvas;
    const pos = (e) => {
      const r = c.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / (r.width / this.data.w));
      const y = Math.floor((e.clientY - r.top) / (r.height / this.data.h));
      return { x: Math.max(0, Math.min(this.data.w - 1, x)), y: Math.max(0, Math.min(this.data.h - 1, y)) };
    };
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    c.addEventListener('pointerdown', (e) => {
      this.painting = true;
      this.erase = e.button === 2;
      this.paint(pos(e));
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', (e) => {
      if (this.painting) this.paint(pos(e));
    });
    c.addEventListener('pointerup', (e) => {
      this.painting = false;
      try { c.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
      this.save();
      this.render();
    });
  }

  paint({ x, y }) {
    const d = this.data;
    const idx = y * d.w + x;
    const erase = this.erase;
    if (this.tool === 'wall' || this.tool === 'erase') {
      const solid = this.tool === 'wall' ? !erase : erase;
      d.cells[idx] = solid ? 1 : 0;
      if (solid) {
        d.shards = d.shards.filter((s) => !(s.x === x && s.y === y));
      }
      this.render();
      return;
    }
    if (d.cells[idx]) return;
    const drop = () => {
      d.shards = d.shards.filter((s) => !(s.x === x && s.y === y));
      d.hunters = d.hunters.filter((s) => !(s.x === x && s.y === y));
      d.skitters = d.skitters.filter((s) => !(s.x === x && s.y === y));
    };
    if (erase) {
      drop();
      this.render();
      return;
    }
    if (this.tool === 'shard') {
      drop();
      d.shards.push({ x, y });
    } else if (this.tool === 'hunter') {
      drop();
      d.hunters.push({ x, y });
    } else if (this.tool === 'skitter') {
      drop();
      d.skitters.push({ x, y });
    } else if (this.tool === 'exit') {
      d.exit = { x, y };
    } else if (this.tool === 'spawn') {
      d.spawn = { x, y };
    }
    this.render();
  }

  render() {
    if (!this.canvas) return;
    const ctx = this.canvas.getContext('2d');
    const d = this.data;
    const S = CELL;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05080b';
    ctx.fillRect(0, 0, d.w * S, d.h * S);
    ctx.strokeStyle = 'rgba(127,227,212,0.05)';
    ctx.lineWidth = 1;
    for (let x = 1; x < d.w; x++) {
      ctx.beginPath(); ctx.moveTo(x * S, 0); ctx.lineTo(x * S, d.h * S); ctx.stroke();
    }
    for (let y = 1; y < d.h; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * S); ctx.lineTo(d.w * S, y * S); ctx.stroke();
    }
    for (let y = 0; y < d.h; y++) {
      for (let x = 0; x < d.w; x++) {
        if (!d.cells[y * d.w + x]) continue;
        ctx.fillStyle = 'rgba(127,227,212,0.16)';
        ctx.fillRect(x * S + 0.5, y * S + 0.5, S - 1, S - 1);
        ctx.strokeStyle = 'rgba(127,227,212,0.45)';
        ctx.strokeRect(x * S + 0.5, y * S + 0.5, S - 1, S - 1);
      }
    }
    const dot = (p, color, r = 3.2) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(p.x * S + S / 2, p.y * S + S / 2, r, 0, Math.PI * 2);
      ctx.fill();
    };
    for (const s of d.shards) dot(s, 'rgba(255,205,110,0.95)');
    for (const h of d.hunters) dot(h, 'rgba(255,86,86,0.95)');
    for (const k of d.skitters) dot(k, 'rgba(255,120,120,0.9)', 2.4);
    const ex = d.exit;
    ctx.strokeStyle = 'rgba(140,240,170,0.95)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(ex.x * S + S / 2, ex.y * S + S / 2, 5.4, Math.PI, 0, true);
    ctx.moveTo(ex.x * S + S / 2 - 5.4, ex.y * S + S / 2);
    ctx.lineTo(ex.x * S + S / 2 - 5.4, ex.y * S + S * 0.85);
    ctx.moveTo(ex.x * S + S / 2 + 5.4, ex.y * S + S / 2);
    ctx.lineTo(ex.x * S + S / 2 + 5.4, ex.y * S + S * 0.85);
    ctx.stroke();
    const sp = d.spawn;
    ctx.strokeStyle = 'rgba(235,255,250,0.9)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(sp.x * S + S / 2, sp.y * S + S / 2, 5, 0, Math.PI * 2);
    ctx.moveTo(sp.x * S + S / 2 - 7, sp.y * S + S / 2);
    ctx.lineTo(sp.x * S + S / 2 + 7, sp.y * S + S / 2);
    ctx.stroke();
  }

  play() {
    this.save();
    this.close();
    this.game.startCustom(this.data);
  }
}

// The interface never speaks. Every message is a shape, a pulse, or a change
// in colour — because in this game words would do the listening for you.
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
  resume: '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 3v6h6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M5 11l7-6 7 6v8H5z" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  sound: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  muted: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  bars: '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/></svg>',
};

function icon(name, cls = '') {
  return `<span class="ico ${cls}" aria-hidden="true">${ICON[name]}</span>`;
}

class UI {
  constructor(root, game) {
    this.root = root;
    this.game = game;
    this.introTimer = 0;
    this.toastTimer = 0;
    this.build();
  }

  build() {
    this.root.innerHTML = `

      <div class="grain"></div>

      <section class="screen title-screen" id="scr-title">
        <div class="title-inner">
          <svg class="emblem" viewBox="0 0 160 160" aria-hidden="true">
            <circle cx="80" cy="80" r="3.2" class="dot"/>
            <path class="arc a1" d="M80 26a54 54 0 0 1 0 108"/>
            <path class="arc a2" d="M80 12a68 68 0 0 1 0 136"/>
            <path class="arc a3" d="M80 44a36 36 0 0 1 0 72"/>
          </svg>
          <div class="start-row">
            <button class="btn primary" id="btn-start" aria-label="进入">${icon('play')}</button>
            <button class="btn build" id="btn-edit" aria-label="造图">${icon('pencil')}</button>

        </div>
        <div class="title-foot" id="title-foot"></div>
      </section>

      <section class="screen pause-screen hidden" id="scr-pause">
        <div class="panel">
          <div class="panel-glyph">${ICON.bars}</div>
          <div class="icon-row">
            <button class="btn icon" id="btn-resume" aria-label="继续">${icon('resume')}</button>
            <button class="btn icon" id="btn-restart" aria-label="重来">${icon('retry')}</button>
            <button class="btn icon" id="btn-mute" aria-label="静音">${icon('sound')}</button>
            <button class="btn icon" id="btn-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen dead-screen hidden" id="scr-dead">
        <div class="panel">
          <svg class="panel-glyph broken" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="34" class="ring-broken"/>
            <circle cx="50" cy="50" r="5" class="dot-red"/>
          </svg>
          <div class="deep-glyph" id="dead-deep"></div>
          <div class="icon-row">
            <button class="btn icon" id="btn-retry" aria-label="再试">${icon('retry')}</button>
            <button class="btn icon" id="btn-dead-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen clear-screen hidden" id="scr-clear">
        <div class="panel">
          <svg class="panel-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <path class="burst" d="M50 8l7 26 20-18-8 27 27-6-22 19 26 8-27 6 18 21-26-9 2 27-17-22-17 22 2-27-26 9 18-21-27-6 26-8-22-19 27 6-8-27 20 18z"/>
          </svg>
          <div class="stats-glyphs" id="clear-stats"></div>
          <div class="icon-row">
            <button class="btn icon" id="btn-next" aria-label="下一间">${icon('next')}</button>
            <button class="btn icon" id="btn-clear-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen victory-screen hidden" id="scr-victory">
        <div class="panel">
          <svg class="panel-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="8" class="dot"/>
            <circle cx="50" cy="50" r="20" class="ring-dim"/>
            <circle cx="50" cy="50" r="32" class="ring-dim d2"/>
            <circle cx="50" cy="50" r="43" class="ring-dim d3"/>
          </svg>
          <div class="stats-glyphs" id="victory-stats"></div>
          <button class="btn icon" id="btn-victory-home" aria-label="标题">${icon('home')}</button>
        </div>
      </section>

      <div class="hud hidden" id="hud">
        <div class="hud-left">
          <span class="hud-num" id="hud-num" data-sector="I"></span>
          <span class="hud-sector" id="hud-sector"></span>
          <span class="hud-floor" id="hud-floor"></span>
        </div>
        <div class="hud-announce" id="hud-announce"></div>
        <div class="hud-right">
          <span class="diamond"></span>
          <span class="shard-bar" id="hud-shards"></span>
        </div>
        <div class="hud-hot" id="hud-hot"></div>
        <div class="hud-loot" id="hud-loot"></div>
        <div class="hud-charges" id="hud-charges"></div>
        <div class="hud-listen" id="hud-listen">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M14 20a6 6 0 0 1 12 0" class="l1"/>
            <path d="M9 20a11 11 0 0 1 22 0" class="l2"/>
          </svg>
        </div>
      </div>
    `;

    const $ = (id) => this.root.querySelector('#' + id);
    this.scr = {
      title: $('scr-title'),
      pause: $('scr-pause'),
      dead: $('scr-dead'),
      clear: $('scr-clear'),
      victory: $('scr-victory'),
    };
    this.hud = $('hud');
    this.grid = $('chamber-grid');
    this.nestGlyph = $('nest-glyph');
    this.foot = $('title-foot');
    this.hudNum = $('hud-num');
    this.hudSector = $('hud-sector');
    this.hudFloor = $('hud-floor');
    this.hudAnnounce = $('hud-announce');
    this.hudShards = $('hud-shards');
    this.hudCharges = $('hud-charges');
    this.hudLoot = $('hud-loot');
    this.hudHot = $('hud-hot');
    this.hudListen = $('hud-listen');
    this.clearStats = $('clear-stats');
    this.victoryStats = $('victory-stats');
    this.deadDeep = $('dead-deep');

    // Buttons blur themselves so Space never triggers twice.
    const bind = (id, fn) => {
      const el = $(id);
      if (!el) return;
      el.addEventListener('click', (e) => {
        e.preventDefault();
        el.blur();
        fn();
      });
    };
    const g = this.game;
    bind('btn-start', () => g.startBest());
    bind('btn-edit', () => g.openEditor());
    bind('btn-resume', () => g.resume());
    bind('btn-restart', () => g.restart());
    bind('btn-mute', () => g.toggleMute());
    bind('btn-title', () => g.quitToTitle());
    bind('btn-retry', () => g.restart());
    bind('btn-dead-title', () => g.quitToTitle());
    bind('btn-next', () => g.next());
    bind('btn-clear-title', () => g.quitToTitle());
    bind('btn-victory-home', () => g.quitToTitle());
    this.muteBtn = $('btn-mute');
  }

  hideScreens() {
    for (const s of Object.values(this.scr)) s.classList.add('hidden');
  }

  showScreen(name) {
    this.hideScreens();
    this.scr[name].classList.remove('hidden');
  }

  showTitle(progress = {}) {
    this.showScreen('title');
    this.hideHUD();
    this.guide('摁下空格键以开始', { sticky: true });
    this.grid.innerHTML = '';
    const unlocked = progress.unlocked || 1;
    const cleared = new Set(progress.cleared || []);
    for (let i = 0; i < 8; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell' + (i < unlocked ? '' : ' locked') + (cleared.has(i) ? ' cleared' : '');
      // The chamber's number is drawn as bars, not written.
      let bars = '<span class="cell-bars">';
      for (let b = 0; b <= i; b++) bars += '<i></i>';
      bars += '</span>';
      cell.innerHTML = bars + (i < unlocked ? '' : '<span class="cell-slash"></span>');
      cell.disabled = i >= unlocked;
      cell.addEventListener('click', () => {
        cell.blur();
        this.game.openMapSelect();
      });
      this.grid.appendChild(cell);
    }
    this.nestGlyph.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('i');
      if (progress.worldCleared) p.className = 'done';
      this.nestGlyph.appendChild(p);
    }
    this.foot.innerHTML = progress.worldCleared ? `<span class="foot-rings">${icon('sound')}</span>` : '';
  }

  showGame() {
    this.hideScreens();
    this.hud.classList.remove('hidden');
  }

  hideHUD() {
    this.hud.classList.add('hidden');
  }

  showPause() {
    this.showScreen('pause');
    this.syncMute();
  }

  showDead({ deepest = null } = {}) {
    this.showScreen('dead');
    this.hideHUD();
    this.deadDeep.innerHTML = '';
    if (deepest != null) {
      const n = Math.min(8, deepest + 1);
      for (let i = 0; i < 8; i++) {
        const t = document.createElement('i');
        if (i < n) t.className = 'lit';
        this.deadDeep.appendChild(t);
      }
    }
  }

  showClear({ time = 0, pings = 0, isRecord = false } = {}) {
    this.showScreen('clear');
    this.hideHUD();
    this.clearStats.innerHTML = this._statRow(time, pings, isRecord);
  }

  showVictory() {
    this.showScreen('victory');
    this.hideHUD();
    this.victoryStats.innerHTML = this._statRow(0, 0, false);
  }

  showWorldVictory({ time = 0, pings = 0, isRecord = false } = {}) {
    this.showScreen('victory');
    this.hideHUD();
    this.victoryStats.innerHTML = this._statRow(time, pings, isRecord);
  }

  /** Floor cleared: show how deep the run is as pips, not a sentence. */
  showFloorClear({ depth = 1, max = 5, time = 0 } = {}) {
    this.showScreen('clear');
    this.hideHUD();
    let pips = '<span class="depth-pips">';
    for (let i = 0; i < max; i++) pips += `<i class="${i < depth ? 'on' : ''}"></i>`;
    pips += '</span>';
    this.clearStats.innerHTML = pips + this._statRow(time, 0, false);
  }

  showRunVictory({ time = 0, best = 0, depth = 5 } = {}) {
    this.showScreen('victory');
    this.hideHUD();
    let pips = '<span class="depth-pips">';
    for (let i = 0; i < depth; i++) pips += '<i class="on"></i>';
    pips += '</span>';
    this.victoryStats.innerHTML = pips + this._statRow(time, 0, best === time);
  }

  _statRow(time, pings, isRecord) {
    // Time and pings as bars; the record as a small bright ring.
    const tBars = Math.min(10, Math.max(1, Math.round(time / 30)));
    const pBars = Math.min(10, Math.max(0, Math.round(pings / 4)));
    let t = '<span class="stat"><span class="stat-bars">';
    for (let i = 0; i < 10; i++) t += `<i class="${i < tBars ? 'on' : ''}"></i>`;
    t += '</span></span>';
    let p = '<span class="stat"><span class="stat-bars amber">';
    for (let i = 0; i < 10; i++) p += `<i class="${i < pBars ? 'on' : ''}"></i>`;
    p += '</span></span>';
    const rec = isRecord ? '<span class="record-ring"></span>' : '';
    return `<div class="stat-row">${t}${p}${rec}</div>`;
  }

  setSector(num) {
    this.hudNum.dataset.sector = num;
    this.hudNum.innerHTML = '';
    const idx = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'].indexOf(num);
    const n = idx < 0 ? 1 : idx + 1;
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('i');
      d.className = 'sector-dot';
      if (i < n) d.classList.add('lit');
      this.hudNum.appendChild(d);
    }
    this.hudNum.classList.remove('pulse');
    void this.hudNum.offsetWidth;
    this.hudNum.classList.add('pulse');
  }

  glyph(kind, id) {
    const path = kind === 'charm' ? CHARM_GLYPH[id] : ITEM_GLYPH[id];
    if (!path) return '';
    return `<svg class="glyph ${kind}" viewBox="0 0 24 24">${path}</svg>`;
  }

  /** Tab: workbench, hotkeys, sockets, pack. Everything moves by dragging. */
  toggleInventory(game) {
    if (!this.invPanel) {
      const el = document.createElement('div');
      el.id = 'inv-panel';
      el.className = 'inv-panel hidden';
      document.body.appendChild(el);
      this.invPanel = el;
      this.bindInventory(el);
    }
    this.invPanel.classList.toggle('hidden');
    const open = !this.invPanel.classList.contains('hidden');
    if (open) this.renderInventory(game);
    else {
      this.hideTip();
      // Closing the bag is the moment the hotkey row becomes usable again.
      this.game.onInventoryClosed();
    }
    if (this.guideEl) this.guideEl.style.visibility = open ? 'hidden' : '';
  }

  bindInventory(el) {
    let press = null;   // { kind, i, x, y }
    let drag = null;     // { obj, from, hotRef, pending }
    const ghost = document.createElement('div');
    ghost.className = 'inv-ghost hidden';
    document.body.appendChild(ghost);

    const peek = (kind, i) => {
      const g = this.game;
      if (kind === 'pack') return g.inv.pack[i];
      if (kind === 'charm') return g.inv.charms[i];
      if (kind === 'work') return g.inv.work[i];
      if (kind === 'hot') return g.inv.hot[i];
      return null;
    };

    el.addEventListener('pointerdown', (e) => {
      const cell = e.target.closest('.inv-cell');
      if (!cell || !cell.dataset.kind || cell.dataset.kind === 'result') return;
      const kind = cell.dataset.kind;
      const i = Number(cell.dataset.i);
      if (!peek(kind, i)) return;
      press = { kind, i, x: e.clientX, y: e.clientY, cell };
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', (e) => {
      if (!press || drag) return;
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
      const g = this.game;
      const kind = press.kind;
      const i = press.i;
      if (kind === 'hot') {
        drag = { obj: g.inv.hot[i], from: { kind, i }, hotRef: true };
      } else {
        const o = g.inv.take(kind, i);
        if (!o) return;
        drag = { obj: o, from: { kind, i } };
      }
      ghost.innerHTML = press.cell.innerHTML;
      ghost.classList.remove('hidden');
      ghost.style.left = `${e.clientX - 32}px`;
      ghost.style.top = `${e.clientY - 32}px`;
    });

    el.addEventListener('pointermove', (e) => {
      if (!drag) return;
      ghost.style.left = `${e.clientX - 32}px`;
      ghost.style.top = `${e.clientY - 32}px`;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const cell = under && under.closest ? under.closest('.inv-cell') : null;
      for (const c of el.querySelectorAll('.inv-cell.drop-on')) c.classList.remove('drop-on');
      if (cell && cell.dataset.kind && cell.dataset.kind !== 'result') cell.classList.add('drop-on');
    });

    el.addEventListener('pointerup', (e) => {
      if (drag) {
        ghost.classList.add('hidden');
        for (const c of el.querySelectorAll('.inv-cell.drop-on')) c.classList.remove('drop-on');
        drag.ghostMoved = true;
        const under = document.elementFromPoint(e.clientX, e.clientY);
        const cell = under && under.closest ? under.closest('.inv-cell') : null;
        const target = cell && cell.dataset.kind && cell.dataset.kind !== 'result'
          ? { kind: cell.dataset.kind, i: Number(cell.dataset.i) }
          : null;
        if (drag.hotRef) {
          if (target && target.kind === 'hot') {
            this.game.inv.hot[target.i] = drag.obj;
            this.game.inv.hot[drag.from.i] = target.i === drag.from.i ? drag.obj : null;
            this.game.audio.click(0.35);
          } else {
            // dropped anywhere else: unbind this hotkey
            this.game.inv.hot[drag.from.i] = null;
            this.game.audio.click(0.3);
          }
        } else {
          this.dropDragged(drag, target);
        }
        this.game.refreshStones();
        this.renderInventory(this.game);
        drag = null;
        press = null;
        return;
      }
      // a press without movement is a click
      if (press && e.target.closest('.inv-cell') === press.cell) {
        const g = this.game;
        if (press.kind === 'hot') {
          g.useHotkey(press.i);
          this.renderInventory(g);
        } else if (press.kind === 'result') {
          // handled below by pointerdown on result
        }
      }
      press = null;
    });

    el.addEventListener('pointerdown', (e) => {
      const cell = e.target.closest('.inv-cell');
      if (!cell || cell.dataset.kind !== 'result') return;
      const g = this.game;
      const out = g.inv.craftable();
      if (!out) return;
      const target = g.inv.pack.indexOf(null);
      const slot = g.inv.charms.indexOf(null);
      const where = target >= 0 ? { kind: 'pack', i: target } : slot >= 0 ? { kind: 'charm', i: slot } : null;
      if (!where) {
        g.audio.deny();
        return;
      }
      const made = g.inv.craft();
      if (!made) return;
      g.inv.place(where.kind, where.i, made);
      g.refreshStones();
      g.audio.shard();
      g.flash = 0.5;
      this.renderInventory(g);
    });

    el.addEventListener('pointercancel', () => {
      if (drag && drag.from) {
        const g = this.game;
        const back = drag.from;
        if (back.kind === 'pack') g.inv.pack[back.i] = drag.obj;
        else if (back.kind === 'charm') g.inv.charms[back.i] = drag.obj;
        else if (back.kind === 'work') g.inv.work[back.i] = drag.obj;
        this.renderInventory(g);
      }
      drag = null;
      press = null;
      ghost.classList.add('hidden');
    });

    el.addEventListener('mouseover', (e) => {
      const cell = e.target.closest('.inv-cell');
      if (!cell) return this.hideTip();
      const tip = cell.dataset.tip;
      if (!tip) return this.hideTip();
      const r = cell.getBoundingClientRect();
      this.showTip(cell.dataset.title || '', tip, r.right + 12, r.top);
    });
    el.addEventListener('mouseleave', () => this.hideTip());
  }

  dropDragged(drag, target) {
    const inv = this.game.inv;
    // dropped outside the panel: the thing is gone, on purpose
    if (!target) return true;
    // Binding a hotkey must not move the stack out of the pack, or the key
    // becomes the only owner of the stack and the first press deletes it.
    if (target.kind === 'hot' && drag.from && drag.from.kind === 'pack') {
      inv.pack[drag.from.i] = drag.obj;
      if (!inv.place('hot', target.i, drag.obj)) {
        inv.pack[drag.from.i] = null;
        return false;
      }
      this.game.onHotkeyBound(drag.obj);
      return true;
    }
    if (inv.place(target.kind, target.i, drag.obj)) return true;
    // nothing accepted: put it back
    const back = drag.from;
    if (back) {
      if (back.kind === 'hot') { inv.hot[back.i] = drag.obj; return true; }
      if (back.kind === 'pack') inv.pack[back.i] = drag.obj;
      else if (back.kind === 'charm') inv.charms[back.i] = { kind: 'charm', id: drag.obj.id, lvl: drag.obj.lvl };
      else if (back.kind === 'work') inv.work[back.i] = { id: drag.obj.id, lvl: drag.obj.lvl };
    }
    return false;
  }

  cellBody(o) {
    if (!o) return '';
    if (o.kind === 'charm') {
      return this.glyph('charm', o.id) + `<b class="lvl">${o.lvl}</b>`;
    }
    const def = ITEMS[o.id];
    return this.glyph('item', o.id) + `<em>${o.n}</em>` + (def && def.kind === 'throw' ? '<i class="throw-dot"></i>' : '');
  }

  cellTip(o) {
    if (!o) return { title: '', tip: '' };
    if (o.kind === 'charm') {
      const t = CHARM_TEXT[o.id];
      if (!t) return { title: '', tip: '' };
      return { title: `${t.name} · ${'一二三'[o.lvl - 1]}级`, tip: charmText(o.id, o.lvl) };
    }
    const t = ITEM_TEXT[o.id];
    if (!t) { console.warn('unknown item', o.id, o); return { title: '', tip: '' }; }
    return { title: t.name, tip: t.line };
  }

  renderInventory(game) {
    const inv = game.inv;
    const cells = [];
    const push = (kind, i, o, cls = '') => {
      const t = this.cellTip(o);
      const tip = t.tip ? `data-tip="${t.tip.replace(/"/g, '&quot;')}" data-title="${t.title.replace(/"/g, '&quot;')}"` : '';
      cells.push(`<div class="inv-cell ${cls}${o ? ' filled' : ''}" data-kind="${kind}" data-i="${i}"${o ? ` data-id="${o.id}"` : ''} ${tip}>${this.cellBody(o)}</div>`);
    };
    for (let i = 0; i < 2; i++) push('work', i, inv.work[i], 'work');
    cells.push('<div class="inv-cell arrow">→</div>');
    const out = inv.craftable();
    push('result', 0, out, out ? 'result ready' : 'result');
    cells.push('<div class="inv-cut work"><span>工作台</span></div>');
    for (let i = 0; i < 4; i++) {
      const o = inv.hot[i];
      const t = this.cellTip(o);
      const tip = o ? `data-tip="${t.tip.replace(/"/g, '&quot;')}" data-title="${t.title.replace(/"/g, '&quot;')}"` : '';
      cells.push(`<div class="inv-cell hot${o ? ' filled' : ''}" data-kind="hot" data-i="${i}"${o ? ` data-id="${o.id}"` : ''} ${tip}>${this.cellBody(o)}<b class="key">${['1', '2', '3', '4'][i]}</b></div>`);
    }
    cells.push('<div class="inv-cut hot"><span>快捷键</span></div>');
    for (let i = 0; i < 4; i++) push('charm', i, inv.charms[i], 'charm');
    cells.push('<div class="inv-cut charm"><span>护符槽</span></div>');
    for (let i = 0; i < 6; i++) push('pack', i, inv.pack[i], 'pack');
    for (let i = 0; i < 2; i++) cells.push('<div class="inv-cell deco"></div>');
    cells.push('<div class="inv-cut pack"><span>背包</span></div>');
    this.invPanel.innerHTML = `<div class="inv-grid">${cells.join('')}</div>`;
  }

  showTip(title, body, x, y) {
    if (!this.tip) {
      this.tip = document.createElement('div');
      this.tip.id = 'tip';
      this.tip.className = 'tip hidden';
      document.body.appendChild(this.tip);
    }
    const lines = String(body).split('\n');
    this.tip.innerHTML = `${title ? `<h4>${title}</h4>` : ''}${lines.map((l) => `<p>${l}</p>`).join('')}`;
    this.tip.classList.remove('hidden');
    const w = 260;
    const left = Math.min(window.innerWidth - w - 16, x);
    const top = Math.min(window.innerHeight - 120, Math.max(12, y - 8));
    this.tip.style.left = `${left}px`;
    this.tip.style.top = `${top}px`;
    this.tip.style.width = `${w}px`;
  }

  hideTip() {
    if (this.tip) this.tip.classList.add('hidden');
  }

  /** Bottom-of-screen guidance: plain words, only the first time.
   *  `sticky` keeps it up until something else replaces it (title screen). */
  guide(text, { sticky = false } = {}) {
    if (!this.guideEl) {
      this.guideEl = document.createElement('div');
      this.guideEl.className = 'guide';
      document.body.appendChild(this.guideEl);
    }
    const lines = Array.isArray(text) ? text : [text];
    this.guideEl.innerHTML = lines.map((t) => `<div>${t}</div>`).join('');
    this.guideEl.classList.toggle('multi', lines.length > 1);
    this.guideEl.classList.add('show');
    clearTimeout(this.guideT);
    this.guideT = sticky ? 0 : setTimeout(() => this.guideEl.classList.remove('show'), 7200);
  }

  hideGuide() {
    clearTimeout(this.guideT);
    if (this.guideEl) this.guideEl.classList.remove('show');
  }

  feed(text) {
    if (!this.feedEl) {
      this.feedEl = document.createElement('div');
      this.feedEl.className = 'feed';
      document.body.appendChild(this.feedEl);
    }
    const line = document.createElement('div');
    line.className = 'feed-line';
    line.textContent = text;
    this.feedEl.appendChild(line);
    requestAnimationFrame(() => line.classList.add('in'));
    setTimeout(() => line.classList.add('out'), 3200);
    setTimeout(() => line.remove(), 4000);
    while (this.feedEl.children.length > 5) this.feedEl.firstChild.remove();
  }

  showMapSelect(entries, current, onPick) {
    this.hideMapSelect();
    const ov = document.createElement('div');
    ov.className = 'map-select';
    ov.innerHTML = `<div class="ms-panel"><div class="ms-head">地图</div><div class="ms-grid"></div><div class="ms-hint">Esc 关闭</div></div>`;
    const grid = ov.querySelector('.ms-grid');
    for (const e of entries) {
      const b = document.createElement('button');
      b.className = 'ms-cell' + (e.built ? '' : ' locked') + (e.id === current ? ' cur' : '');
      b.innerHTML = `<b>${e.name}</b><span>${e.sub || ''}</span>`;
      b.addEventListener('click', (ev) => {
        ev.stopPropagation();
        b.blur();
        onPick(e.id);
      });
      grid.appendChild(b);
    }
    ov.addEventListener('pointerdown', (ev) => {
      if (ev.target === ov) this.hideMapSelect();
    });
    this.mapSel = ov;
    document.body.appendChild(ov);
    this.mapSelKey = (ev) => {
      if (ev.key === 'Escape') {
        ev.stopPropagation();
        this.hideMapSelect();
      }
    };
    window.addEventListener('keydown', this.mapSelKey, true);
  }

  hideMapSelect() {
    if (!this.mapSel) return;
    window.removeEventListener('keydown', this.mapSelKey, true);
    this.mapSel.remove();
    this.mapSel = null;
  }

  /** The moving maze's floor readout, kept apart from the sector glyphs. */
  setFloor(floor = 0) {
    if (!this.hudFloor) return;
    if (!floor) {
      this.hudFloor.textContent = '';
      this.hudFloor.classList.remove('on', 'under');
      return;
    }
    this.hudFloor.textContent = floor < 0 ? '-1 层' : `第 ${floor} 层`;
    this.hudFloor.classList.add('on');
    this.hudFloor.classList.toggle('under', floor < 0);
  }

  /** A big two-second floor stamp when the room under you moves. */
  announceFloor(floor = 1) {
    if (!this.hudAnnounce) return;
    this.hudAnnounce.textContent = `已到达 ${floor} 层`;
    this.feed(`已到达 ${floor} 层`);
    this.hudAnnounce.classList.remove('show');
    void this.hudAnnounce.offsetWidth;
    this.hudAnnounce.classList.add('show');
    clearTimeout(this.floorTimer);
    this.floorTimer = setTimeout(() => this.hudAnnounce.classList.remove('show'), 2200);
  }

  updateHUD({ shards = 0, total = 1, charges = 0, listen = false, danger = 0, depth = 0, diamonds = 0, gold = 0, hot = null, active = null, name = null, floor = 0 } = {}) {
    if (name && this.hudNum && this.hudNum.dataset.mode !== 'name') {
      this.hudNum.dataset.mode = 'name';
      this.hudNum.classList.add('hud-name');
      this.hudNum.textContent = name;
    } else if (name && this.hudNum) {
      this.hudNum.textContent = name;
    }
    if (this.hudHot && hot) {
      this.hudHot.innerHTML = hot.map((s, i) => {
        if (!s) return `<div class="hud-slot empty"><b>${['1', '2', '3', '4'][i]}</b></div>`;
        const count = s.kind === 'item' ? s.n : s.lvl;
        const on = active && active === s.id ? ' on' : '';
        return `<div class="hud-slot${on}"><b>${['1', '2', '3', '4'][i]}</b>${this.glyph(s.kind, s.id)}<i>${count}</i></div>`;
      }).join('');
    }
    if (this.hudLoot) {
      const d = Math.min(8, diamonds);
      let dh = '';
      for (let i = 0; i < d; i++) dh += '<i class="dmd"></i>';
      let gh = '<span class="gold-pile">';
      const bars = Math.min(6, Math.floor(gold / 10)) + (gold % 10 ? 1 : 0);
      for (let i = 0; i < bars; i++) gh += '<i class="gld"></i>';
      gh += '</span>';
      this.hudLoot.innerHTML = dh + gh;
    }
    if (depth > 0) {
      this.hudNum.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const d = document.createElement('i');
        d.className = 'sector-dot';
        if (i < depth) d.classList.add('lit');
        this.hudNum.appendChild(d);
      }
    }
    const collected = Math.max(0, total - shards);
    const filled = total ? Math.round((collected / total) * 12) : 0;
    let bar = '';
    for (let i = 0; i < 12; i++) bar += `<i class="${i < filled ? 'on' : ''}"></i>`;
    this.hudShards.innerHTML = bar;
    let ch = '';
    for (let i = 0; i < 3; i++) ch += `<i class="${i < charges ? 'on' : ''}"></i>`;
    this.hudCharges.innerHTML = ch;
    this.hudListen.classList.toggle('on', !!listen);
    this.hud.classList.toggle('sneaking', !!this.game.sneak);
    this.setFloor(floor);
    this.root.style.setProperty('--danger', String(danger || 0));
    this.syncMute();
  }

  syncMute() {
    if (!this.muteBtn) return;
    const muted = this.game.audio && this.game.audio.muted;
    this.muteBtn.innerHTML = icon(muted ? 'muted' : 'sound');
  }

  /** A shape where a sentence used to be: one soft ring. */
  intro() {
    this.root.classList.add('intro-ring');
    clearTimeout(this.introTimer);
    this.introTimer = setTimeout(() => this.root.classList.remove('intro-ring'), 1400);
  }

  /** Feedback without language: amber for a shard, red for a refusal. */
  toast(kind = 'shard') {
    const cls = kind === 'deny' ? 'flash-red' : 'flash-amber';
    this.root.classList.add(cls);
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.root.classList.remove(cls), 420);
  }

  dismiss() {
    clearTimeout(this.introTimer);
    clearTimeout(this.toastTimer);
    this.root.classList.remove('intro-ring', 'flash-red', 'flash-amber');
  }

  tick() {}
}

const SAVE_KEY = 'hush.save.v1';
const FLOORS = 5;
const BUILT_MAPS = new Set(['room', 'maze', 'moving', 'mech', 'lab']);
const PING_MAX = 3;
const PING_REGEN = 2.4;
const PING_SPEED = 720;
const PING_LIFE = 0.9;
const WAVE_LISTEN = 620;
const THROUGH_WALL = 0.6;
const SHARD_ECHO_RANGE = 1150;
const SHARD_ECHO_SPEED = 1500;
const SOUND_SPEED = 560;
const STEP_RANGE = 215;
const SHARD_NOISE = 330;
const RAY_COUNT = 96;
const RAY_SPEED = 560;
const CORE_RAY_SPEED = RAY_SPEED / 3;

/** A corpse's ring is three times as long as a sonar ping (720 * 0.9). */

/** Loot identity is rolled only once the player is this close. */

const LOOT_ITEMS = ['pebbles', 'sharpStone', 'vitamin', 'totem', 'star', 'corpse', 'bugspray', 'scanner'];

function makeDust(level, count = 130) {
  const dust = [];
  const rng = Math.random;
  for (let i = 0; i < count * 4 && dust.length < count; i++) {
    const x = 24 + rng() * (level.size.w - 48);
    const y = 24 + rng() * (level.size.h - 48);
    const tx = Math.floor(x / TILE);
    const ty = Math.floor(y / TILE);
    if (level.grid[ty * level.w + tx] !== 0) continue;
    dust.push({
      x,
      y,
      vx: (rng() * 2 - 1) * 5,
      vy: (rng() * 2 - 1) * 5,
      phase: rng() * Math.PI * 2,
    });
  }
  return dust;
}

class Game {
  constructor(canvas, uiRoot) {
    this.canvas = canvas;
    this.audio = new AudioEngine();
    this.input = new Input(window, canvas);
    this.renderer = new Renderer(canvas);
    this.ui = new UI(uiRoot, this);
    this.state = 'title';
    this.now = 0;
    this.last = 0;
    this.timeScale = 1;
    this.progress = this.loadProgress();

    this.level = null;
    this.player = null;
    this.hunters = [];
    this.skitters = [];
    this.shards = [];
    this.particles = [];
    this.pings = [];
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.echoRings = [];
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.camX = 0;
    this.camY = 0;
    this.chamberIndex = 0;
    this.floorMode = false;
    this.mapMode = false;
    this.mapId = 'room';
    this.mapSeed = 0;
    this.mapExits = [];
    this.mapKey = null;
    this.castleKey = false;
    this.mapNodes = [];
    this.depth = 1;
    this.runSeed = 0;
    this.hasKey = false;
    this.diamonds = 0;
    this.gold = 0;
    this.charms = [];
    this.inv = new Inventory();
    this.loot = [];
    this.guides = {};
    this.throws = [];
    this.activeItem = null;
    this.speedT = 0;
    this.speedMul = 1;
    this.invulnT = 0;
    this.stressCharges = 0;
    this.starT = 0;
    this.counterReady = false;
    this.rewindUsed = false;
    this.denyCooldown = 0;
    this.alertCd = 0;
    this.titlePingTimer = 0;
    this.guideTimers = new Map();
    this.tutorialStarted = false;
    this.throwBound = false;

    this.msx = null;
    this.msy = null;
    this.aimX = null;
    this.aimY = null;
    this.lures = [];
    this.scanT = 0;
    this.scanRoutes = [];
    this.scanTick = 0;
    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      this.msx = e.clientX - r.left;
      this.msy = e.clientY - r.top;
    });
    this.ui.build();
    this.editor = new Editor(this);
    this.ui.showTitle(this.progress);
    this.loadDemo();

    this.input.onAnyKey = (e) => {
      if (this.state !== 'title') return;
      // Space is the game's one gesture; Enter is the polite alternative.
      if (e && (e.code === 'Space' || e.code === 'Enter')) {
        this.audio.unlock();
        this.startBest();
      }
    };
    window.addEventListener('resize', () => this.renderer.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.state === 'playing') this.pause();
    });
    window.addEventListener('blur', () => {
      if (this.state === 'playing' && !this.frozen) this.pause();
    });

    requestAnimationFrame(this.frame);
  }

  // ---------------------------------------------------------------- progress
  loadProgress() {
    const fallback = { unlocked: 1, cleared: [], last: 0, best: {} };
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return fallback;
      const data = JSON.parse(raw);
      if (typeof data.unlocked !== 'number') return fallback;
      const best = {};
      if (data.best && typeof data.best === 'object') {
        for (const [k, v] of Object.entries(data.best)) {
          const i = Number(k);
          if (!Number.isInteger(i) || !v || typeof v.time !== 'number') continue;
          best[i] = { time: v.time, pings: Math.max(0, v.pings | 0) };
        }
      }
      return {
        unlocked: clamp(data.unlocked, 1, CHAMBERS.length),
        cleared: Array.isArray(data.cleared) ? data.cleared : [],
        last: typeof data.last === 'number' ? data.last : 0,
        best,
      };
    } catch {
      return fallback;
    }
  }

  saveProgress() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.progress));
    } catch {
      /* storage can fail in private mode — progress is a nicety */
    }
  }

  // ------------------------------------------------------------------- setup
  loadDemo() {
    const cfg = CHAMBERS[CHAMBERS.length - 1];
    this.level = generateLevel(777, { shards: 5, hunters: 5, style: cfg.style });
    this.player = null;
    this.hunters = [];
    this.shards = this.level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.sounds = [];
    this.flashes = [];
    this.sneak = false;
    this.debugMode = false;
    this.debugFreeze = false;
    this.blind = false;
    this.particles = makeDust(this.level);
    this.camX = this.level.size.w / 2;
    this.camY = this.level.size.h / 2;
    this.titlePingTimer = 0.2;

  }

  /** Freeze the state you had the moment you entered this area. */
  snapshotEntry() {
    this.entryState = {
      inv: this.inv.clone(),
      diamonds: this.diamonds,
      gold: this.gold,
      lives: this.lives,
      stressCharges: this.stressCharges,
      rewindUsed: this.rewindUsed,
    };
  }

  /** Rewind: put you back at the door of this area, same loot on the floor. */
  restoreEntry() {
    const snap = this.entryState;
    this._suppressSnapshot = true;
    if (this.mapMode) this.startMap(this.mapId, this.mapSeed);
    else if (this.floorMode) this.startFloor(this.depth);
    else if (this.worldMode) this.startWorld(this.worldSeed ?? 424242);
    else if (this.customData) this.startCustom(this.customData);
    else this.startChamber(this.chamberIndex);
    if (snap) {
      this.inv = snap.inv.clone();
      this.diamonds = snap.diamonds;
      this.gold = snap.gold;
      this.lives = snap.lives;
      this.stressCharges = snap.stressCharges;
    }
    this._suppressSnapshot = false;
    this._entryPending = false;
    this.rewindUsed = true;
    this.stressUsed = false;
    this.counterUsed = false;
    this.invulnT = Math.max(this.invulnT, 1.2);
    this.activeItem = null;
  }

  /** A new attempt: nothing you carried survives a death or a manual retry. */
  resetRunState() {
    this.inv = new Inventory();
    this.diamonds = 0;
    this.gold = 0;
    this.activeItem = null;
    this.throws = [];
    this.lures = [];
    this.stressCharges = 0;
    this.starT = 0;
    this.invulnT = 0;
    this.speedT = 0;
    this.scanT = 0;
    this.scanRoutes = [];
    this.listenT = 0;
    this.stressUsed = false;
    this.counterUsed = false;
    this.rewindUsed = false;
    this.lives = this.maxLives();
    this.guides = {};
    this.clearGuideTimers();
    this.tutorialStarted = false;
    this.throwBound = false;
  }

  startBest() {
    this.resetRunState();
    if (this.startMap('room', (Math.random() * 1e9) | 0)) { this.beginTutorial(); return; }
    if (this.state !== 'title') { this.beginTutorial(); return; }
    if (this.startRun()) { this.beginTutorial(); return; }
    if (this.startWorld()) { this.beginTutorial(); return; }
    const idx = clamp((this.progress.unlocked || 1) - 1, 0, CHAMBERS.length - 1);
    this.startChamber(idx);
    this.beginTutorial();
  }

  /** Roguelike run: five floors, each one a room-graph floor. */
  startRun(seed = (Math.random() * 1e9) | 0) {
    this.guides = {};
    this.clearGuideTimers();
    this.tutorialStarted = false;
    this.throwBound = false;
    this.rewindUsed = false;
    this.runSeed = seed;
    this.diamonds = 0;
    this.gold = 0;
    this.charms = [];
