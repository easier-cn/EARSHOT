// ---- src/worldgen.js ----
// Map generators for the redesigned world.
//
//   room  — the starting map: one big rectangle split by walls into rooms with
//           doorways, no corridors. Key in the middle, three far corners hold
//           the maze exit, the castle door sits on the middle of one side and
//           the meadow exit is a sound-absorbing wall.
//   maze  — narrow one-tile corridors with the occasional 3x3 / 4x4 pocket.
//
// Everything works on whole tiles; the game converts to pixels with TILE.
const TILE = 32;

const ri = (rnd, a, b) => a + Math.floor(rnd() * (b - a + 1));
const at = (w, x, y) => y * w + x;

function solid(grid, w, h, x, y) {
  if (x < 0 || y < 0 || x >= w || y >= h) return true;
  return grid[y * w + x] === 1;
}

function fill(grid, w, x0, y0, x1, y1, v) {
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) grid[y * w + x] = v;
  }
}

function reachable(grid, w, h, sx, sy) {
  const seen = new Uint8Array(w * h);
  const q = [sx, sy];
  seen[at(w, sx, sy)] = 1;
  while (q.length) {
    const y = q.pop();
    const x = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx;
      const ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const i = at(w, nx, ny);
      if (seen[i] || grid[i] === 1) continue;
      seen[i] = 1;
      q.push(nx, ny);
    }
  }
  return seen;
}

function floorCount(grid, w, h) {
  let n = 0;
  for (let i = 0; i < w * h; i++) if (grid[i] === 0) n++;
  return n;
}

function centerOf(r) {
  return { x: r.x + (r.w >> 1), y: r.y + (r.h >> 1) };
}

// ---------------------------------------------------------------- room map --

function splitRooms(rnd, box, depth, rooms) {
  const minW = 9;
  const minH = 7;
  const canV = box.w >= minW * 2 + 1;
  const canH = box.h >= minH * 2 + 1;
  if (depth <= 0 || (!canV && !canH)) {
    rooms.push(box);
    return;
  }
  const vertical = canV && (!canH || box.w > box.h || (box.w === box.h && rnd() < 0.5));
  if (vertical) {
    const cut = ri(rnd, minW, box.w - minW - 1);
    const wall = box.x + cut;
    rooms.push({ ...box, wallX: wall, split: 'v' });
    // the two halves are recorded by the caller through this marker
    splitRooms(rnd, { x: box.x, y: box.y, w: cut, h: box.h }, depth - 1, rooms);
    splitRooms(rnd, { x: wall + 1, y: box.y, w: box.w - cut - 1, h: box.h }, depth - 1, rooms);
  } else {
    const cut = ri(rnd, minH, box.h - minH - 1);
    const wall = box.y + cut;
    rooms.push({ ...box, wallY: wall, split: 'h' });
    splitRooms(rnd, { x: box.x, y: box.y, w: box.w, h: cut }, depth - 1, rooms);
    splitRooms(rnd, { x: box.x, y: wall + 1, w: box.w, h: box.h - cut - 1 }, depth - 1, rooms);
  }
}

/**
 * The starting map. Rooms touch each other, separated by one-tile walls with
 * two-tile doorways, so the whole rectangle is one connected space.
 */
function buildRoomMap(seed) {
  const rnd = mulberry32(seed);
  const w = 76;
  const h = 52;
  const grid = new Uint8Array(w * h);
  fill(grid, w, 0, 0, w - 1, h - 1, 1);
  fill(grid, w, 1, 1, w - 2, h - 2, 0);

  // --- 1. walls first: recursively split the big rectangle -----------------
  const boxes = [];
  const walls = [];
  const walk = (x, y, ww, hh, depth) => {
    const canV = ww >= 15;
    const canH = hh >= 13;
    if (depth <= 0 || (!canV && !canH)) {
      boxes.push({ x, y, w: ww, h: hh });
      return;
    }
    const vertical = canV && (!canH || ww > hh * 1.08 || (Math.abs(ww - hh) <= 2 && rnd() < 0.5));
    if (vertical) {
      const lo = Math.max(8, Math.round(ww * 0.34));
      const hi = Math.max(lo, Math.min(ww - 9, Math.round(ww * 0.66)));
      const cut = ri(rnd, lo, hi);
      walls.push({ x: x + cut, y, len: hh, axis: 'v' });
      for (let dy = 0; dy < hh; dy++) grid[at(w, x + cut, y + dy)] = 1;
      walk(x, y, cut, hh, depth - 1);
      walk(x + cut + 1, y, ww - cut - 1, hh, depth - 1);
    } else {
      const lo = Math.max(7, Math.round(hh * 0.34));
      const hi = Math.max(lo, Math.min(hh - 8, Math.round(hh * 0.66)));
      const cut = ri(rnd, lo, hi);
      walls.push({ x, y: y + cut, len: ww, axis: 'h' });
      for (let dx = 0; dx < ww; dx++) grid[at(w, x + dx, y + cut)] = 1;
      walk(x, y, ww, cut, depth - 1);
      walk(x, y + cut + 1, ww, hh - cut - 1, depth - 1);
    }
  };
  walk(1, 1, w - 2, h - 2, 6);

  // --- 2. then punch doorways so the wall network is one open space ---------
  for (const wl of walls) {
    if (wl.axis === 'v') {
      const y0 = wl.y + 2;
      const y1 = wl.y + wl.len - 3;
      if (y1 <= y0) continue;
      const atY = ri(rnd, y0, y1);
      const wide = rnd() < 0.25 ? 3 : 2;
      for (let dy = 0; dy < wide && atY + dy <= y1; dy++) {
        fill(grid, w, wl.x, atY + dy, wl.x, atY + dy, 0);
      }
    } else {
      const x0 = wl.x + 2;
      const x1 = wl.x + wl.len - 3;
      if (x1 <= x0) continue;
      const atX = ri(rnd, x0, x1);
      const wide = rnd() < 0.25 ? 3 : 2;
      for (let dx = 0; dx < wide && atX + dx <= x1; dx++) {
        fill(grid, w, atX + dx, wl.y, atX + dx, wl.y, 0);
      }
    }
  }

  const isFloor = (x, y) => x > 0 && y > 0 && x < w - 1 && y < h - 1 && grid[at(w, x, y)] === 0;

  // --- 3. furnishing: internal wall stubs, never allowed to seal a room -----
  const connected = () => {
    let first = -1;
    for (let i = 0; i < w * h; i++) if (grid[i] === 0) { first = i; break; }
    if (first < 0) return false;
    const seen = new Uint8Array(w * h);
    const q = [first];
    seen[first] = 1;
    let n = 0;
    while (q.length) {
      const i = q.pop();
      n++;
      const x = i % w;
      const y = (i / w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) continue;
        const j = ny * w + nx;
        if (seen[j] || grid[j] !== 0) continue;
        seen[j] = 1;
        q.push(j);
      }
    }
    let total = 0;
    for (let i = 0; i < w * h; i++) if (grid[i] === 0) total++;
    return n === total;
  };

  const decor = (box) => {
    const tiles = [];
    const kind = ri(rnd, 0, 3);
    const innerX0 = box.x + 2;
    const innerX1 = box.x + box.w - 3;
    const innerY0 = box.y + 2;
    const innerY1 = box.y + box.h - 3;
    if (innerX1 - innerX0 < 2 || innerY1 - innerY0 < 2) return tiles;
    if (kind === 0 && box.w >= 11 && box.h >= 9) {
      // a stub hanging off one wall, leaving room on both sides
      const fromTop = rnd() < 0.5;
      const len = ri(rnd, 3, Math.max(3, Math.min(6, (box.h >> 1) - 1)));
      const x = ri(rnd, innerX0 + 1, innerX1 - 1);
      for (let i = 0; i < len; i++) tiles.push([x, fromTop ? box.y + 1 + i : box.y + box.h - 2 - i]);
    } else if (kind === 1 && box.w >= 12) {
      // a free-standing partition with a gap at both ends
      const y = ri(rnd, innerY0, innerY1);
      const len = ri(rnd, 4, Math.max(4, Math.min(9, box.w - 7)));
      const x0 = ri(rnd, innerX0, innerX1 - len);
      for (let i = 0; i < len; i++) tiles.push([x0 + i, y]);
    } else if (kind === 2) {
      // short pillars
      for (let i = 0, n = ri(rnd, 2, 4); i < n; i++) {
        tiles.push([ri(rnd, innerX0, innerX1), ri(rnd, innerY0, innerY1)]);
      }
    } else {
      // an L corner inside the room
      const x = ri(rnd, innerX0 + 1, innerX1 - 3);
      const y = ri(rnd, innerY0 + 1, innerY1 - 3);
      for (let i = 0; i < 3; i++) { tiles.push([x + i, y]); tiles.push([x, y + i]); }
    }
    return tiles;
  };

  const snapshot = new Uint8Array(w * h);
  for (const box of boxes) {
    const passes = rnd() < 0.35 ? 2 : rnd() < 0.85 ? 1 : 0;
    for (let pass = 0; pass < passes; pass++) {
      snapshot.set(grid);
      const tiles = decor(box);
      let touched = false;
      for (const [x, y] of tiles) {
        if (!isFloor(x, y)) continue;
        grid[at(w, x, y)] = 1;
        touched = true;
      }
      if (!touched || !connected()) grid.set(snapshot);
    }
  }

  const spawnBox = boxes.reduce((a, b) => (a.x + a.y <= b.x + b.y ? a : b));
  const spawnC = centerOf(spawnBox);
  const mid = { x: w >> 1, y: h >> 1 };
  const keyBox = boxes.reduce((a, b) => {
    const da = Math.hypot(a.x + a.w / 2 - mid.x, a.y + a.h / 2 - mid.y);
    const db = Math.hypot(b.x + b.w / 2 - mid.x, b.y + b.h / 2 - mid.y);
    return da <= db ? a : b;
  });
  const keyC = centerOf(keyBox);

  // keep the important tiles clean, whatever the furnishing did
  const clearAround = (c, r) => {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const x = c.x + dx;
        const y = c.y + dy;
        if (x > 0 && y > 0 && x < w - 1 && y < h - 1) grid[at(w, x, y)] = 0;
      }
    }
  };
  clearAround(spawnC, 1);
  clearAround(keyC, 1);

  // Three far corners: the maze exit goes into one of them at random.
  const corners = [
    { x: 2, y: h - 3 },
    { x: w - 3, y: 2 },
    { x: w - 3, y: h - 3 },
  ];
  const pickCorner = corners[ri(rnd, 0, 2)];
  const mazeTile = { x: pickCorner.x, y: pickCorner.y };
  const mazeDoor = { x: 1, y: mazeTile.y };
  fill(grid, w, mazeDoor.x, mazeDoor.y, mazeDoor.x, mazeDoor.y, 0);
  clearAround(mazeTile, 1);

  const castleDoor = { x: w - 2, y: h >> 1 };
  const meadowDoor = { x: w >> 1, y: h - 2 };
  fill(grid, w, castleDoor.x, castleDoor.y, castleDoor.x, castleDoor.y, 0);
  fill(grid, w, meadowDoor.x, meadowDoor.y, meadowDoor.x, meadowDoor.y, 0);
  clearAround({ x: castleDoor.x - 1, y: castleDoor.y }, 1);
  clearAround({ x: meadowDoor.x, y: meadowDoor.y - 1 }, 1);

  const absorb = [];
  for (let dx = -1; dx <= 1; dx++) {
    const x = meadowDoor.x + dx;
    if (x >= 0 && x < w) absorb.push(at(w, x, h - 1));
  }

  const rooms = boxes.map((b) => {
    const c = centerOf(b);
    return { x: b.x, y: b.y, w: b.w, h: b.h, cx: c.x, cy: c.y, kind: 'room' };
  });

  // --- 4. props and enemies -------------------------------------------------
  const CHARM_IDS = ['sleep', 'stress', 'survive', 'stone', 'counter', 'sneakSonar', 'swift', 'home', 'rewind', 'hunt'];
  const ITEM_IDS = ['pebbles', 'sharpStone', 'vitamin', 'totem', 'star', 'corpse', 'bugspray', 'scanner'];
  const loot = [];
  const taken = new Set();
  const spotIn = (box) => {
    for (let i = 0; i < 24; i++) {
      const x = ri(rnd, box.x + 1, box.x + box.w - 2);
      const y = ri(rnd, box.y + 1, box.y + box.h - 2);
      const k = y * w + x;
      if (!isFloor(x, y) || taken.has(k)) continue;
      taken.add(k);
      return { x, y };
    }
    return null;
  };
  for (const b of boxes) {
    if (rnd() > 0.42) continue;
    const p = spotIn(b);
    if (!p) continue;
    const charm = rnd() < 0.55;
    loot.push(charm
      ? { kind: 'charm', id: CHARM_IDS[ri(rnd, 0, CHARM_IDS.length - 1)], x: p.x, y: p.y }
      : { kind: 'item', id: ITEM_IDS[ri(rnd, 0, ITEM_IDS.length - 1)], x: p.x, y: p.y });
  }

  const monsters = [];
  const far = boxes
    .filter((b) => Math.hypot(centerOf(b).x - spawnC.x, centerOf(b).y - spawnC.y) > 12)
    .sort(() => rnd() - 0.5);
  for (const b of far) {
    if (monsters.length >= 9) break;
    const c = centerOf(b);
    if (monsters.some((m) => Math.hypot(m.x - c.x, m.y - c.y) < 10)) continue;
    if (!isFloor(c.x, c.y)) {
      const p = spotIn(b);
      if (!p) continue;
      monsters.push({ x: p.x, y: p.y, type: 'hunter' });
    } else {
      monsters.push({ x: c.x, y: c.y, type: 'hunter' });
    }
  }

  const standing = (t) => grid[at(w, t.x, t.y)] === 0;
  return {
    mapId: 'room',
    w,
    h,
    tile: TILE,
    size: { w: w * TILE, h: h * TILE },
    grid,
    rooms,
    spawn: { x: spawnC.x * TILE + TILE / 2, y: spawnC.y * TILE + TILE / 2 },
    spawnTile: spawnC,
    key: { x: keyC.x * TILE + TILE / 2, y: keyC.y * TILE + TILE / 2 },
    keyTile: keyC,
    exit: { x: mazeTile.x * TILE + TILE / 2, y: mazeTile.y * TILE + TILE / 2 },
    exitTile: mazeTile,
    exits: [
      { to: 'maze', x: mazeDoor.x, y: mazeDoor.y, require: 'key', color: '127,227,212' },
      { to: 'meadow', x: meadowDoor.x, y: meadowDoor.y, require: null, color: '140,240,170', absorb: true },
      { to: 'castle', x: castleDoor.x, y: castleDoor.y, require: 'castle', color: '255,150,90' },
    ],
    absorb,
    monsters,
    loot,
    seed,
    valid: standing(spawnC) && standing(keyC) && standing(mazeTile),
  };
}

// ---------------------------------------------------------------- maze map --

/**
 * Narrow maze: one-tile corridors, occasional 3x3 / 4x4 pockets so it never
 * dead-ends into a single blocked tile. Exit sits diagonally opposite spawn.
 */
function buildMazeMap(seed) {
  const rnd = mulberry32(seed);
  const cw = 39;
  const ch = 25;
  const w = cw * 2 + 1;
  const h = ch * 2 + 1;
  const grid = new Uint8Array(w * h);
  fill(grid, w, 0, 0, w - 1, h - 1, 1);

  const seenCell = new Uint8Array(cw * ch);
  const stack = [[0, 0]];
  seenCell[0] = 1;
  fill(grid, w, 1, 1, 1, 1, 0);
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]].sort(() => rnd() - 0.5);
    let moved = false;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx;
      const ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= cw || ny >= ch) continue;
      if (seenCell[ny * cw + nx]) continue;
      seenCell[ny * cw + nx] = 1;
      fill(grid, w, cx * 2 + 1 + dx, cy * 2 + 1 + dy, cx * 2 + 1 + dx, cy * 2 + 1 + dy, 0);
      fill(grid, w, nx * 2 + 1, ny * 2 + 1, nx * 2 + 1, ny * 2 + 1, 0);
      stack.push([nx, ny]);
      moved = true;
      break;
    }
    if (!moved) stack.pop();
  }

  // pockets: widen a handful of cells into 3x3 / 4x4 open squares
  const pockets = [];
  for (let i = 0; i < 26; i++) {
    const cx = ri(rnd, 2, cw - 3);
    const cy = ri(rnd, 2, ch - 3);
    const size = rnd() < 0.65 ? 3 : 4;
    const tx = cx * 2;
    const ty = cy * 2;
    fill(grid, w, tx - 1, ty - 1, tx + size - 2, ty + size - 2, 0);
    pockets.push({ x: tx - 1, y: ty - 1, w: size, h: size });
  }

  const spawnTile = { x: 1, y: 1 };
  const exitTile = { x: w - 2, y: h - 2 };

  const monsters = [];
  for (let i = 0; i < 5; i++) {
    let tx = 0;
    let ty = 0;
    for (let tries = 0; tries < 200; tries++) {
      tx = ri(rnd, 3, w - 4);
      ty = ri(rnd, 3, h - 4);
      if (grid[at(w, tx, ty)] === 0 && Math.hypot(tx - spawnTile.x, ty - spawnTile.y) > 18) break;
    }
    if (grid[at(w, tx, ty)] === 0) monsters.push({ x: tx, y: ty, type: 'lurker' });
  }

  return {
    mapId: 'maze',
    w,
    h,
    tile: TILE,
    size: { w: w * TILE, h: h * TILE },
    grid,
    rooms: pockets,
    spawn: { x: spawnTile.x * TILE + TILE / 2, y: spawnTile.y * TILE + TILE / 2 },
    spawnTile,
    key: null,
    exit: { x: exitTile.x * TILE + TILE / 2, y: exitTile.y * TILE + TILE / 2 },
    exitTile,
    exits: [{ to: 'room', x: 0, y: 0, require: null, color: '127,227,212', silent: true }],
    absorb: [],
    monsters,
    loot: [],
    seed,
  };
}

/** Connectivity audit used by tests + the generator retry loop. */
function mapConnected(level) {
  const { grid, w, h, spawnTile } = level;
  const seen = reachable(grid, w, h, spawnTile.x, spawnTile.y);
  let open = 0;
  let ok = 0;
  for (let i = 0; i < w * h; i++) {
    if (grid[i] !== 0) continue;
    open++;
    if (seen[i]) ok++;
  }
  return { ok: open === ok, open, reached: ok };
}

// ---- src/entities.js ----

function isSolid(grid, w, h, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= w || ty >= h) return true;
  return grid[ty * w + tx] !== 0;
}

/**
 * Axis-separated collision for a square-ish body (radius r) against the tile
 * grid. Returns the resolved position.
 */
function moveCircle(grid, w, h, tile, x, y, r, dx, dy) {
  let nx = x;
  let ny = y;
  if (dx !== 0) {
    nx = x + dx;
    const minTy = Math.floor((y - r + 0.01) / tile);
    const maxTy = Math.floor((y + r - 0.01) / tile);
    const solidColumn = (tx) => {
      for (let ty = minTy; ty <= maxTy; ty++) if (isSolid(grid, w, h, tx, ty)) return true;
      return false;
    };
    if (dx > 0) {
      const from = Math.floor((x + r - 0.01) / tile);
      const to = Math.floor((nx + r) / tile);
      for (let tx = from; tx <= to; tx++) {
        if (solidColumn(tx)) {
          nx = tx * tile - r - 0.01;
          break;
        }
      }
    } else {
      const from = Math.floor((x - r + 0.01) / tile);
      const to = Math.floor((nx - r) / tile);
      for (let tx = from; tx >= to; tx--) {
        if (solidColumn(tx)) {
          nx = (tx + 1) * tile + r + 0.01;
          break;
        }
      }
    }
  }
  if (dy !== 0) {
    ny = y + dy;
    const minTx = Math.floor((nx - r + 0.01) / tile);
    const maxTx = Math.floor((nx + r - 0.01) / tile);
    const solidRow = (ty) => {
      for (let tx = minTx; tx <= maxTx; tx++) if (isSolid(grid, w, h, tx, ty)) return true;
      return false;
    };
    if (dy > 0) {
      const from = Math.floor((y + r - 0.01) / tile);
      const to = Math.floor((ny + r) / tile);
      for (let ty = from; ty <= to; ty++) {
        if (solidRow(ty)) {
          ny = ty * tile - r - 0.01;
          break;
        }
      }
    } else {
      const from = Math.floor((y - r + 0.01) / tile);
      const to = Math.floor((ny - r) / tile);
      for (let ty = from; ty >= to; ty--) {
        if (solidRow(ty)) {
          ny = (ty + 1) * tile + r + 0.01;
          break;
        }
      }
    }
  }
  return { x: nx, y: ny };
}

class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.r = 9;
    this.vx = 0;
    this.vy = 0;
    this.speed = 0;
    this.moving = false;
    this.face = 0;
    this.stride = 0;
    this.trail = [];
    this.trailT = 0;
    this.stepPhase = 0;
  }

  update(dt, move, { run = false, listen = false, creep = false, creepMul = 0.5, mul = 1 } = {}) {
    const maxSpeed = (creep ? Math.round(92 * creepMul) : listen ? 60 : run ? 152 : 92) * mul;
    const targetX = move.x * maxSpeed;
    const targetY = move.y * maxSpeed;
    const k = 1 - Math.exp(-(move.x || move.y ? 16 : 12) * dt);
    this.vx += (targetX - this.vx) * k;
    this.vy += (targetY - this.vy) * k;
    this.speed = Math.hypot(this.vx, this.vy);
    this.moving = this.speed > 14;
    if (this.moving) this.face = Math.atan2(this.vy, this.vx);
    this.stepPhase += this.speed * dt;
    this.trailT -= dt;
    if (this.trailT <= 0 && this.speed > 20) {
      this.trailT = 0.05;
      this.trail.push({ x: this.x, y: this.y, life: 0.55 });
      if (this.trail.length > 26) this.trail.shift();
    }
    for (let i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].life -= dt;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }
    return { x: this.vx * dt, y: this.vy * dt };
  }
}

let hunterId = 0;

class Hunter {
  constructor(x, y, type = 'hunter', home = null) {
    this.id = hunterId++;
    this.x = x;
    this.y = y;
    this.r = 11;
    this.type = type;
    this.home = home;
    this.route = home && home.route ? home.route : null;
    this.routeIdx = 0;
    this.state = this.route ? 'patrol' : 'idle';
    this.path = [];
    this.searchT = 0;
    this.pending = null;
    this.lastTag = -1;
    this.face = Math.random() * Math.PI * 2;
    this.speed = 0;
    this.stepAcc = 0;
    this.wanderCooldown = Math.random() * 2;
    this.turn = 0;
    this.target = null;
    this.chaseT = 0;
    this.windT = 0;
    this.burstT = 0;
    this.restT = 0;
    this.chargeT = 0;
    this.vx = 0;
    this.vy = 0;
    this.bounces = 0;
    this.cycleT = 0;
    this.pulseDone = false;
    this.pounce = null;
    this.dashT = 0;
  }

  hear(x, y, delay = 0.25) {
    this.pending = { x, y, t: delay };
  }

  _retarget(game, x, y) {
    const far = !this.target || Math.hypot(this.target.x - x, this.target.y - y) > 22;
    if (this.path.length && !far) return;
    this.target = { x, y };
    this._plan(game, x, y);
  }

  _plan(game, x, y) {
    const L = game.level;
    const sx = Math.floor(this.x / L.tile);
    const sy = Math.floor(this.y / L.tile);
    let tx = Math.floor(x / L.tile);
    let ty = Math.floor(y / L.tile);
    if (isSolid(L.grid, L.w, L.h, tx, ty)) {
      const open = nearestOpen(L.grid, L.w, L.h, tx * L.tile, ty * L.tile);
      tx = Math.floor(open.x / L.tile);
      ty = Math.floor(open.y / L.tile);
    }
    const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
    if (path && path.length) {
      this.path = path.map((p) => ({ x: (p.x + 0.5) * L.tile, y: (p.y + 0.5) * L.tile }));
      return true;
    }
    return false;
  }

  _walk(dt, game, speed) {
    const L = game.level;
    let tx = this.x;
    let ty = this.y;
    while (this.path.length && Math.hypot(this.path[0].x - this.x, this.path[0].y - this.y) < 9) this.path.shift();
    const arrived = this.path.length === 0;
    if (!arrived) {
      tx = this.path[0].x;
      ty = this.path[0].y;
    }
    let dx = 0;
    let dy = 0;
    if (!arrived) {
      const d = Math.hypot(tx - this.x, ty - this.y) || 1;
      dx = ((tx - this.x) / d) * speed;
      dy = ((ty - this.y) / d) * speed;
      this.face = Math.atan2(dy, dx);
    }
    this.speed = Math.hypot(dx, dy);
    const step = moveCircle(L.grid, L.w, L.h, L.tile, this.x, this.y, this.r, dx * dt, dy * dt);
    this.x = step.x;
    this.y = step.y;
    this._footsteps(dt, game);
    return arrived;
  }

  _footsteps(dt, game) {
    if (this.speed <= 5) return;
    this.stepAcc += this.speed * dt;
    if (this.stepAcc < 58) return;
    this.stepAcc = 0;
    const rel = this.x - game.player.x;
    const d = Math.hypot(rel, this.y - game.player.y);
    if (d < 620) game.audio.hunterStep(Math.max(-1, Math.min(1, rel / 380)), Math.min(1, 1.15 - d / 640));
    game.stepEcho?.(this.x, this.y, this.type === 'butcher' ? '255, 90, 60' : '255, 70, 70', { tagged: false });
  }

  _burst(game, tint = '255, 110, 90', count = 12) {
    game.stepEcho?.(this.x, this.y, tint, { count, speed: 300, life: 0.45, tagged: false });
  }

  update(dt, game) {
    const speed = this.speedCap || (game.hunterSpeed ? game.hunterSpeed() : 126);
    if (this.pending) {
      this.pending.t -= dt;
      if (this.pending.t <= 0) {
        const s = this.pending;
        this.pending = null;
        this.target = { x: s.x, y: s.y };
        this.chaseT = 0;
        this._plan(game, s.x, s.y);
        if (this.type === 'patroller') this.state = 'chase';
        else if (this.type === 'stalker') {
          if (this.state !== 'windup' && this.state !== 'charge') this.state = 'chase';
        } else if (this.type === 'hunter') this.state = 'investigate';
      }
    }

    if (this.type === 'patroller') return this._patrol(dt, game, speed);
    if (this.type === 'stalker') return this._stalker(dt, game, speed);
    if (this.type === 'butcher') return this._butcher(dt, game, speed);
    if (this.type === 'lurker') return this._lurk(dt, game, speed);

    const arrived = this._walk(dt, game, speed);
    if (arrived && this.state === 'investigate') this.state = 'idle';
  }

  /** A slow drifter used on the room and maze maps: wanders when it hears nothing. */
  _lurk(dt, game, speed) {
    const L = game.level;
    this.lurkT = (this.lurkT ?? 0) - dt;
    if (this.lurkT <= 0 && (!this.path || this.path.length === 0)) {
      this.lurkT = 2.2 + Math.random() * 2.8;
      const t = L.tile;
      for (let i = 0; i < 60; i++) {
        const tx = 1 + Math.floor(Math.random() * (L.w - 2));
        const ty = 1 + Math.floor(Math.random() * (L.h - 2));
        if (isSolid(L.grid, L.w, L.h, tx, ty)) continue;
        this._plan(game, (tx + 0.5) * t, (ty + 0.5) * t);
        break;
      }
    }
    const moving = speed * (this.moving ? 1 : 0.55);
    const arrived = this._walk(dt, game, moving);
    if (arrived) this.state = 'idle';
    return arrived;
  }

  _patrol(dt, game, speed) {
    if (this.state === 'chase') {
      this.chaseT += dt;
      const arrived = this._walk(dt, game, speed * 1.05);
      if (arrived || this.chaseT > 9) {
        this._returnHome(game);
      }
      return;
    }
    if (this.state === 'return' && this.path.length === 0) this._returnHome(game);
    if (!this.path.length) {
      if (!this.route || !this.route.length) return;
      const wp = this.route[this.routeIdx % this.route.length];
      this.routeIdx = (this.routeIdx + 1) % this.route.length;
      this._plan(game, wp.x, wp.y);
    }
    this._walk(dt, game, speed * 0.72);
  }

  _returnHome(game) {
    const route = this.route;
    if (!route) return;
    let best = 0;
    let bd = Infinity;
    for (let i = 0; i < route.length; i++) {
      const d = Math.hypot(route[i].x - this.x, route[i].y - this.y);
      if (d < bd) { bd = d; best = i; }
    }
    this.routeIdx = (best + 1) % route.length;
    this._plan(game, route[best].x, route[best].y);
    this.state = 'patrol';
  }

  _stalker(dt, game, speed) {
    if (this.state === 'windup') {
      this.windT -= dt;
      this.burstT -= dt;
      if (this.burstT <= 0) { this.burstT = 0.17; this._burst(game, '255, 120, 90', 10); }
      if (this.windT <= 0) {
        const tx = this.target ? this.target.x : this.x;
        const ty = this.target ? this.target.y : this.y;
        const d = Math.hypot(tx - this.x, ty - this.y) || 1;
        this.vx = ((tx - this.x) / d) * 560;
        this.vy = ((ty - this.y) / d) * 560;
        this.chargeT = 0.95;
        this.bounces = 0;
        this.state = 'charge';
      }
      return;
    }
    if (this.state === 'charge') {
      this.chargeT -= dt;
      this.burstT -= dt;
      if (this.burstT <= 0) { this.burstT = 0.12; this._burst(game, '255, 110, 80', 8); }
      const L = game.level;
      const wantX = this.vx * dt;
      const wantY = this.vy * dt;
      const step = moveCircle(L.grid, L.w, L.h, L.tile, this.x, this.y, this.r, wantX, wantY);
      const blockedX = Math.abs((step.x - this.x) - wantX) > 0.6;
      const blockedY = Math.abs((step.y - this.y) - wantY) > 0.6;
      this.x = step.x;
      this.y = step.y;
      if (blockedX) { this.vx = -this.vx; this.bounces += 1; }
      if (blockedY) { this.vy = -this.vy; this.bounces += 1; }
      this.speed = Math.hypot(this.vx, this.vy);
      if (this.bounces >= 2 || this.chargeT <= 0) {
        this.state = 'rest';
        this.restT = 1.3;
      }
      return;
    }
    if (this.state === 'rest') {
      this.restT -= dt;
      if (this.restT <= 0) this.state = this.target ? 'chase' : 'idle';
      return;
    }
    if (this.state === 'chase') {
      const arrived = this._walk(dt, game, speed * 1.15);
      const near = this.target && Math.hypot(this.target.x - this.x, this.target.y - this.y) < 130;
      if (arrived || near) {
        this.state = 'windup';
        this.windT = 1.05;
        this.burstT = 0;
      }
    }
  }

  _butcher(dt, game, speed) {
    if (this.pounce) {
      this.dashT -= dt;
      if (this.dashT <= 0) { this.pounce = null; this.cycleT = 0; this.pulseDone = false; return; }
      const tx = this.pounce.x;
      const ty = this.pounce.y;
      const d = Math.hypot(tx - this.x, ty - this.y) || 1;
      const step = moveCircle(game.level.grid, game.level.w, game.level.h, game.level.tile, this.x, this.y, this.r, ((tx - this.x) / d) * 640 * dt, ((ty - this.y) / d) * 640 * dt);
      this.x = step.x;
      this.y = step.y;
      this.speed = 640;
      this._footsteps(dt, game);
      return;
    }
    this.cycleT += dt;
    const phase = this.cycleT % 4;
    if (phase >= 2) {
      this.burstT -= dt;
      if (this.burstT <= 0 && phase < 3.2) { this.burstT = 0.13; this._burst(game, '255, 150, 90', 7); }
      if (!this.pulseDone && phase >= 3.2) {
        this.pulseDone = true;
        game.butcherSweep?.(this.x, this.y, this);
      }
      return;
    }
    this.pulseDone = false;
    if (this.target) this._walk(dt, game, speed * 0.85);
  }
}

let skitterId = 0;

// The hunter listens. The skitter does not. It is deaf, fast and predictable:
// the only way to know where it is, is to look -- which costs a ping, and a
// ping can wake a hunter. That trade is the whole point of the thing.
class Skitter {
  constructor(x, y) {
    this.id = skitterId++;
    this.x = x;
    this.y = y;
    this.r = 8;
    this.path = [];
    this.rest = 0.3 + Math.random() * 1.2;
    this.speed = 0;
    this.tickAcc = Math.random();
    this.face = 0;
    this.wobble = Math.random() * 6;
    this.echoT = 0;
    this.echoCool = 0;
    this.lastTag = -1;
    this.echoKind = null;
    this.echoSrc = null;
    this.revealT = 0;
    this.lure = null;
  }

  /** It is deaf to meaning but not to sound: anything loud enough is repeated
   *  back a beat later, from where the mimic is standing. */
  hear(x, y, kind = 'ping', delay = 1.2) {
    if (this.echoT > 0 || this.echoCool > 0) return false;
    this.echoT = delay + Math.random() * 0.3;
    this.echoKind = kind;
    this.echoSrc = { x, y };
    return true;
  }

  _plan(game) {
    const L = game.level;
    const sx = Math.floor(this.x / L.tile);
    const sy = Math.floor(this.y / L.tile);
    if (this.lure) {
      const tx = Math.floor(this.lure.x / L.tile);
      const ty = Math.floor(this.lure.y / L.tile);
      const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
      this.lure = null;
      if (path && path.length) {
        this.path = path.map((p) => ({
          x: (p.x + 0.5) * L.tile,
          y: (p.y + 0.5) * L.tile,
        }));
        return true;
      }
    }
    for (let tries = 0; tries < 16; tries++) {
      const tx = sx + Math.round((Math.random() * 2 - 1) * 9);
      const ty = sy + Math.round((Math.random() * 2 - 1) * 9);
      if (tx < 1 || ty < 1 || tx >= L.w - 1 || ty >= L.h - 1) continue;
      if (L.grid[ty * L.w + tx] !== 0) continue;
      if (Math.abs(tx - sx) + Math.abs(ty - sy) < 5) continue;
      const path = findPath(L.grid, L.w, L.h, sx, sy, tx, ty);
      if (path && path.length) {
        this.path = path.map((p) => ({
          x: (p.x + 0.5) * L.tile,
          y: (p.y + 0.5) * L.tile,
        }));
        return true;
      }
    }
    this.rest = 0.4;
    return false;
  }

  update(dt, game) {
    const L = game.level;
    this.wobble += dt * 6;
    this.stepAcc = (this.stepAcc || 0);
    if (this.revealT > 0) this.revealT -= dt;
    if (this.echoCool > 0) this.echoCool -= dt;
    if (this.echoT > 0) {
      this.echoT -= dt;
      if (this.echoT <= 0) {
        this.echoT = 0;
        if (game.onEcho) game.onEcho(this, this.echoKind, this.echoSrc);
        this.lure = this.echoSrc;
        this.echoSrc = null;
      }
    }

    if (!this.path.length) {
      this.speed = 0;
      this.rest -= dt;
      if (this.rest <= 0) this._plan(game);
      return;
    }

    const wp = this.path[0];
    if (Math.hypot(wp.x - this.x, wp.y - this.y) < 7) {
      this.path.shift();
      if (!this.path.length) this.rest = 0.35 + Math.random() * 0.9;
      return;
    }

    const SPEED = 118;
    const d = Math.hypot(wp.x - this.x, wp.y - this.y) || 1;
    this.face = Math.atan2(wp.y - this.y, wp.x - this.x);
    const step = moveCircle(
      L.grid,
      L.w,
      L.h,
      L.tile,
      this.x,
      this.y,
      this.r,
      ((wp.x - this.x) / d) * SPEED * dt,
      ((wp.y - this.y) / d) * SPEED * dt,
    );
    this.x = step.x;
    this.y = step.y;
    this.speed = SPEED;

    // neutral things still make sound: a blue thread through the dark
    this.stepAcc += SPEED * dt;
    if (this.stepAcc > 64) {
      this.stepAcc = 0;
      game.stepEcho?.(this.x, this.y, '110, 180, 255', { tagged: false });
    }

    // a dry tick, only audible close by: enough to feel it, not to track it
    this.tickAcc += dt;
    if (this.tickAcc > 0.85) {
      this.tickAcc = 0;
      const dx = this.x - game.player.x;
      const dy = this.y - game.player.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 260 && game.audio) {
        const pan = Math.max(-1, Math.min(1, dx / 300));
        game.audio.skitterTick(pan, Math.max(0, 1 - dist / 300));
      }
    }
  }
}

// ---- src/input.js ----
const MOVE_KEYS = {
  KeyW: 'up',
  ArrowUp: 'up',
  KeyS: 'down',
  ArrowDown: 'down',
  KeyA: 'left',
  ArrowLeft: 'left',
  KeyD: 'right',
  ArrowRight: 'right',
};

class Input {
  constructor(target = window, canvas = null) {
    this.keys = new Set();
    this.pressed = new Set();
    this.released = new Set();
    this.mouseDown = false;
    this.anyKey = false;
    this.pointer = { x: 0, y: 0 };

    target.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.repeat) return;
      this.keys.add(e.code);
      this.pressed.add(e.code);
      this.anyKey = true;
      if (this.onAnyKey) this.onAnyKey(e);
    });
    target.addEventListener('keyup', (e) => {
      this.keys.delete(e.code);
      this.released.add(e.code);
      if (this.onAnyKey) this.onAnyKey(e);
    });
    target.addEventListener('blur', () => {
      this.keys.clear();
      this.mouseDown = false;
    });

    if (canvas) {
      canvas.addEventListener('pointerdown', (e) => {
        if (e.button === 0) {
          this.mouseDown = true;
          this.pressed.add('Mouse0');
        }
        this.pointer.x = e.clientX;
        this.pointer.y = e.clientY;
      });
      canvas.addEventListener('pointerup', (e) => {
        if (e.button === 0) this.mouseDown = false;
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    window.addEventListener('pointerdown', (e) => {
      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;
    });
  }

  down(code) {
    return this.keys.has(code);
  }

  consume(code) {
    const has = this.pressed.has(code);
    if (has) this.pressed.delete(code);
    return has;
  }

  consumeAny() {
    if (!this.pressed.size) return false;
    this.pressed.clear();
    return true;
  }

  moveVector() {
    let x = 0;
    let y = 0;
    for (const code of this.keys) {
      const dir = MOVE_KEYS[code];
      if (dir === 'up') y -= 1;
      else if (dir === 'down') y += 1;
      else if (dir === 'left') x -= 1;
      else if (dir === 'right') x += 1;
    }
    if (x && y) {
      x *= Math.SQRT1_2;
      y *= Math.SQRT1_2;
    }
    return { x, y };
  }

  endFrame() {
    this.pressed.clear();
    this.released.clear();
    this.anyKey = false;
  }
}

/**
 * Every sound in HUSH is synthesised at runtime — no audio files.
 * The engine keeps a dry bus and a convolution reverb bus, and exposes
 * small musical helpers that the game calls for events.
 */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.dry = null;
    this.reverbSend = null;
    this.volume = 0.85;
    this.muted = false;
    this.started = false;
    this._heartTimer = 0;
    this._creakTimer = 6;
    this._noiseBuffer = null;
  }

  get ready() {
    return !!this.ctx;
  }

  async unlock() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.volume;
    this.master.connect(ctx.destination);
    this.dry = ctx.createGain();
    this.dry.gain.value = 0.9;
    this.dry.connect(this.master);
    const convolver = ctx.createConvolver();
    convolver.buffer = this._impulse(2.4, 2.6);
    this.reverbSend = ctx.createGain();
    this.reverbSend.gain.value = 0.55;
    this.reverbSend.connect(convolver);
    convolver.connect(this.master);
    this._noiseBuffer = this._makeNoise(2);
    this._startAmbience();
    this.started = true;
    if (ctx.state === 'suspended') await ctx.resume();
  }

  setMuted(muted) {
    this.muted = muted;
    if (this.master) {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(muted ? 0 : this.volume, this.ctx.currentTime, 0.05);
    }
  }

  toggleMute() {
    this.setMuted(!this.muted);
    return this.muted;
  }

  _impulse(seconds, decay) {
    const rate = this.ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = this.ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  _makeNoise(seconds) {
    const rate = this.ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = this.ctx.createBuffer(1, len, rate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  _route(node, pan, send) {
    let out = node;
    if (pan) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = clamp(pan, -1, 1);
      out.connect(p);
      out = p;
    }
    out.connect(this.dry);
    if (send > 0) {
      const s = this.ctx.createGain();
      s.gain.value = send;
      out.connect(s);
      s.connect(this.reverbSend);
    }
  }

  tone({
    freq,
    freqEnd,
    type = 'sine',
    dur = 0.4,
    gain = 0.15,
    attack = 0.006,
    pan = 0,
    send = 0.35,
    delay = 0,
    detune = 0,
  } = {}) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur);
    if (detune) osc.detune.value = detune;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    this._route(g, pan, send);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    osc.onended = () => {
      try {
        osc.disconnect();
        g.disconnect();
      } catch {
        /* already gone */
      }
    };
  }

  noise({
    dur = 0.2,
    gain = 0.1,
    type = 'bandpass',
    freq = 800,
    q = 1,
    pan = 0,
    send = 0.2,
    delay = 0,
  } = {}) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuffer;
    src.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = freq;
    filter.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter);
    filter.connect(g);
    this._route(g, pan, send);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
    src.onended = () => {
      try {
        src.disconnect();
        filter.disconnect();
        g.disconnect();
      } catch {
        /* already gone */
      }
    };
  }

  _startAmbience() {
    const ctx = this.ctx;
    // Low drone: two slightly detuned oscillators through a soft lowpass.
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.035;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 220;
    droneGain.connect(lp);
    lp.connect(this.dry);
    this._drone = [];
    for (const [f, det] of [
      [55, -6],
      [82.4, 7],
      [110, 3],
    ]) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      o.detune.value = det;
      const g = ctx.createGain();
      g.gain.value = f < 60 ? 0.5 : 0.2;
      o.connect(g);
      g.connect(droneGain);
      o.start();
      this._drone.push({ osc: o, base: f });
    }
    // Wind.
    const wind = ctx.createBufferSource();
    wind.buffer = this._noiseBuffer;
    wind.loop = true;
    const wf = ctx.createBiquadFilter();
    wf.type = 'lowpass';
    wf.frequency.value = 320;
    const wg = ctx.createGain();
    wg.gain.value = 0.02;
    wind.connect(wf);
    wf.connect(wg);
    wg.connect(this.dry);
    wind.start();
    // Slow breathing LFO on the wind.
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.012;
    lfo.connect(lfoGain);
    lfoGain.connect(wg.gain);
    lfo.start();
  }

  /** Each part of the cave sits on a different note of the same chord. Crossing
   *  into it is a slow detune, not a cut. */
  setSector(n) {
    if (!this._drone || !this.ctx) return;
    const ratios = [1, 1.0595, 0.9439, 1.1225, 0.8909, 1.1892, 1.0293, 0.8409];
    const r = ratios[((n % 8) + 8) % 8];
    const t = this.ctx.currentTime;
    for (const d of this._drone) d.osc.frequency.setTargetAtTime(d.base * r, t, 2.2);
  }

  ping(strength = 1) {
    this.tone({ freq: 1680, freqEnd: 720, type: 'triangle', dur: 0.16, gain: 0.05 * strength, send: 0.5 });
    this.tone({ freq: 780, freqEnd: 210, type: 'sine', dur: 0.85, gain: 0.16 * strength, send: 1.1 });
    this.noise({ dur: 0.09, gain: 0.05 * strength, type: 'highpass', freq: 2600, send: 0.6 });
  }

  /** Something out there answered your sound. Detuned, wetter, further away. */
  echo(pan = 0, kind = 'ping') {
    const heavy = kind === 'ping' || kind === 'hum';
    const g = heavy ? 0.1 : 0.055;
    this.tone({ freq: 1640, freqEnd: 600, type: 'triangle', dur: 0.22, gain: g * 0.45, pan, send: 1.5, delay: 0.02, detune: -40 });
    this.tone({ freq: 720, freqEnd: 170, type: 'sine', dur: 1.15, gain: g, pan, send: 1.7, delay: 0.06, detune: -70 });
    this.noise({ dur: 0.16, gain: g * 0.22, type: 'bandpass', freq: 1700, q: 3.5, pan, send: 1.3, delay: 0.04 });
  }

  /** Dry chitin clicks: the only warning a mimic gives, and only up close. */
  skitterTick(pan = 0, loud = 1) {
    this.noise({ dur: 0.028, gain: 0.022 * loud, type: 'highpass', freq: 3400, pan, send: 0.12 });
    this.tone({ freq: 2100, freqEnd: 1500, type: 'square', dur: 0.018, gain: 0.005 * loud, pan, send: 0.08 });
  }

  /** A sealed door breathing: low, patient, and just audible enough to answer. */
  gateHum() {
    this.tone({ freq: 61, freqEnd: 57, type: 'sine', dur: 1.5, gain: 0.05, send: 1.2, delay: 0.02 });
    this.tone({ freq: 122, freqEnd: 116, type: 'triangle', dur: 1.1, gain: 0.012, send: 1.0 });
  }

  deny() {
    this.tone({ freq: 180, freqEnd: 120, type: 'square', dur: 0.12, gain: 0.05, send: 0.1 });
  }

  // A hunter just heard something. Low, sour, panned toward it: the "it knows"
  // tell, so the player can connect their own noise to the reaction.
  alert(pan = 0) {
    this.tone({ freq: 150, freqEnd: 96, type: 'triangle', dur: 0.28, gain: 0.05, pan, send: 0.25 });
    this.tone({ freq: 300, freqEnd: 240, type: 'sine', dur: 0.09, gain: 0.02, pan, send: 0.2, delay: 0.02 });
  }

  footstep(pan = 0, loud = 1) {
    this.noise({ dur: 0.07, gain: 0.035 * loud, type: 'bandpass', freq: 900 + Math.random() * 300, q: 1.2, pan, send: 0.12 });
  }

  hunterStep(pan = 0, closeness = 0.3) {
    this.noise({ dur: 0.1, gain: 0.09 * closeness, type: 'lowpass', freq: 190, q: 0.8, pan, send: 0.25 });
    this.tone({ freq: 62, freqEnd: 44, type: 'sine', dur: 0.16, gain: 0.06 * closeness, pan, send: 0.1 });
  }

  shard() {
    const notes = [880, 1174.7, 1568];
    notes.forEach((f, i) =>
      this.tone({ freq: f, type: 'triangle', dur: 0.7, gain: 0.07, delay: i * 0.07, send: 0.9 }),
    );
  }

  /** A shard answering a pulse: thin, high, far away. */
  shardEcho(pan = 0, gain = 0.02, delay = 0) {
    const f = 1876 + Math.random() * 120;
    this.tone({ freq: f, type: 'sine', dur: 0.5, gain, pan, delay, send: 1.1 });
    this.tone({ freq: f * 1.5, type: 'sine', dur: 0.35, gain: gain * 0.35, pan, delay: delay + 0.04, send: 1.3 });
  }

  gateOpen() {
    this.tone({ freq: 220, freqEnd: 55, type: 'sawtooth', dur: 1.4, gain: 0.07, send: 0.7 });
    this.tone({ freq: 660, freqEnd: 990, type: 'sine', dur: 1.2, gain: 0.05, send: 0.9 });
    this.noise({ dur: 1.1, gain: 0.03, type: 'lowpass', freq: 500, send: 0.5 });
  }

  heartbeat(intensity = 1) {
    this.tone({ freq: 54, freqEnd: 40, type: 'sine', dur: 0.16, gain: 0.12 * intensity, send: 0.05 });
    this.tone({ freq: 48, freqEnd: 36, type: 'sine', dur: 0.2, gain: 0.08 * intensity, send: 0.05, delay: 0.18 });
  }

  death() {
    this.noise({ dur: 0.8, gain: 0.28, type: 'lowpass', freq: 1400, send: 0.8 });
    this.tone({ freq: 190, freqEnd: 30, type: 'sawtooth', dur: 1.1, gain: 0.18, send: 0.6 });
    this.tone({ freq: 2400, freqEnd: 400, type: 'sine', dur: 0.5, gain: 0.05, send: 0.9 });
  }

  clear() {
    const chord = [261.6, 329.6, 392, 523.3];
    chord.forEach((f, i) =>
      this.tone({ freq: f, type: 'sine', dur: 1.8, gain: 0.055, delay: i * 0.12, send: 1.2 }),
    );
  }

  click() {
    this.tone({ freq: 900, freqEnd: 600, type: 'square', dur: 0.05, gain: 0.03, send: 0.1 });
  }

  /** Called each frame from the game loop. */
  update(dt, { danger = 0, paused = false } = {}) {
    if (!this.ready) return;
    if (paused) return;
    this._heartTimer -= dt;
    if (danger > 0.15 && this._heartTimer <= 0) {
      this._heartTimer = 1.15 - danger * 0.65;
      this.heartbeat(clamp(danger, 0.2, 1));
    }
    this._creakTimer -= dt;
    if (this._creakTimer <= 0) {
      this._creakTimer = 9 + Math.random() * 10;
      const f = 70 + Math.random() * 60;
      this.tone({ freq: f, freqEnd: f * 0.8, type: 'sine', dur: 1.6, gain: 0.025, send: 1 });
    }
  }
}

/** Six rows of four: two workbench cells, eight pack slots, four hotkeys, four charms. */
const SLOTS = {
  cols: 4,
  rows: 6,
};

/** Hotkey order on the number row: 1, 2, 4, 3. */
const HOTKEY_ORDER = [1, 3, 4, 5];
// 2 is reserved for the map picker, so the hot row is 1 / 3 / 4 / 5.
const HOTKEY_LABELS = ['1', '3', '4', '5'];

/**
 * Inventory: four charm sockets (only these take effect), four hotkey cells,
 * a two-cell workbench, and a deliberately small six-cell pack. Charms ride in
 * the pack until dragged into a socket, so every pickup competes for space.
 */
class Inventory {
  constructor() {
    this.pack = new Array(6).fill(null); // { kind:'item', id, n } | { kind:'charm', id, lvl }
    this.hot = new Array(4).fill(null); // references a pack entry
    this.charms = new Array(4).fill(null); // equipped, effective
    this.work = [null, null]; // charms moved out of pack/socket for fusing
    this.stones = 0;
  }

  /** Only equipped charms count. */
  level(id) {
    return this.charms.reduce((sum, c) => sum + (c && c.id === id ? c.lvl : 0), 0);
  }

  has(id) {
    return this.level(id) || 0;
  }

  charmAt(i) {
    return this.charms[i] || null;
  }

  addItem(id, n = 1) {
    if (!ITEMS[id]) return false;
    for (const slot of this.pack) {
      if (slot && slot.kind === 'item' && slot.id === id) {
        slot.n += n;
        return true;
      }
    }
    const i = this.pack.indexOf(null);
    if (i < 0) return false;
    this.pack[i] = { kind: 'item', id, n };
    return true;
  }

  /** Charms drop into the pack; they must be dragged into a socket to work. */
  addCharm(id) {
    if (!CHARMS[id]) return 'bad';
    if (this.pack.indexOf(null) < 0) return 'full';
    this.pack[this.pack.indexOf(null)] = { kind: 'charm', id, lvl: 1 };
    return 'added';
  }

  /** Detach an entry from wherever it lives. */
  take(kind, i) {
    if (kind === 'pack') {
      const o = this.pack[i];
      if (!o) return null;
      this.pack[i] = null;
      for (let k = 0; k < this.hot.length; k++) if (this.hot[k] === o) this.hot[k] = null;
      return o;
    }
    if (kind === 'charm') {
      const o = this.charms[i];
      this.charms[i] = null;
      return o || null;
    }
    if (kind === 'work') {
      const o = this.work[i];
      this.work[i] = null;
      return o || null;
    }
    if (kind === 'hot') {
      const o = this.hot[i];
      this.hot[i] = null;
      return o ? { recycle: o } : null;
    }
    return null;
  }

  /** Place an object into a cell. */
  place(kind, i, o) {
    if (!o) return false;
    if (kind === 'pack') {
      if (this.pack[i]) return false;
      this.pack[i] = o;
      return true;
    }
    if (kind === 'charm') {
      if (this.charms[i] || !o || o.kind !== 'charm') return false;
      this.charms[i] = { kind: 'charm', id: o.id, lvl: o.lvl };
      return true;
    }
    if (kind === 'work') {
      if (this.work[i] || !o || o.kind !== 'charm') return false;
      this.work[i] = { kind: 'charm', id: o.id, lvl: o.lvl };
      return true;
    }
    if (kind === 'hot') {
      if (this.hot[i] || !o || o.kind !== 'item') return false;
      const def = ITEMS[o.id];
      if (!def) return false;
      this.hot[i] = o;
      return true;
    }
    return false;
  }

  /** Drag from one cell to another. Returns true when something changed. */
  move(fromKind, fromI, toKind, toI) {
    if (fromKind === toKind && fromI === toI) return false;
    if (fromKind === 'result') return false;
    const o = this.take(fromKind, fromI);
    if (!o) return false;
    if (o.recycle) return true;
    if (this.place(toKind, toI, o)) return true;
    if (fromKind === 'pack') this.pack[fromI] = o;
    else if (fromKind === 'charm') this.charms[fromI] = { kind: 'charm', id: o.id, lvl: o.lvl };
    else if (fromKind === 'work') this.work[fromI] = o;
    else if (fromKind === 'hot') this.hot[fromI] = o;
    return false;
  }

  craftable() {
    const [a, b] = this.work;
    if (!a || !b) return null;
    if (a.id !== b.id || a.lvl !== b.lvl) return null;
    if (a.lvl >= CHARMS[a.id].max) return null;
    return { kind: 'charm', id: a.id, lvl: a.lvl + 1 };
  }

  /** Consume both workbench charms and hand the result back (caller places it). */
  craft() {
    const out = this.craftable();
    if (!out) return null;
    this.work = [null, null];
    return out;
  }

  /** Spend one item from the pack; clears stale hotkey references. */
  consume(id) {
    const i = this.pack.findIndex((s) => s && s.kind === 'item' && s.id === id);
    if (i < 0) return false;
    const slot = this.pack[i];
    slot.n -= 1;
    if (slot.n <= 0) {
      this.pack[i] = null;
      for (let k = 0; k < this.hot.length; k++) if (this.hot[k] === slot) this.hot[k] = null;
    }
    return true;
  }

  bindHot(i, packIndex) {
    const slot = this.pack[packIndex];
    this.hot[i] = slot || null;
    return !!slot;
  }
}

// ---- src/render.js ----

const WALL_RGB = '150, 238, 226';
const GLOW_RGB = '80, 210, 198';
const AMBER = '255, 196, 107';
const RED = '255, 86, 86';
const TEAL = '127, 227, 212';
const GOLD = '255, 205, 110';
const GREEN = '140, 240, 170';

const BUCKETS = 12;

/**
 * Sonar renderer.
 *
 * The world is drawn in world units; walls are lit analytically: for each wall
 * segment we compute the distance from every live ping's wavefront, so a wall
 * only glows while the shell is passing over it. Everything else is black.
 */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.cw = 0;
    this.ch = 0;
    this.scale = 1;
    this.ox = 0;
    this.oy = 0;
    this.buckets = Array.from({ length: BUCKETS }, () => []);
    this.resize();
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.cw = Math.max(320, rect.width);
    this.ch = Math.max(240, rect.height);
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.round(this.cw * this.dpr);
    this.canvas.height = Math.round(this.ch * this.dpr);
  }

  fit(level) {
    const pad = Math.min(56, Math.max(18, Math.min(this.cw, this.ch) * 0.06));
    const fitScale = Math.min(
      (this.cw - pad * 2) / level.size.w,
      (this.ch - pad * 2) / level.size.h,
    );
    // Stay close enough that the room never fits on screen at once: darkness
    // should extend past the edge of the display.
    const zoom = Math.max(this.cw / 900, this.ch / 620);
    this.scale = Math.max(fitScale, Math.min(2.35, Math.max(1, zoom)));
  }

  _segBrightness(s, pings, now) {
    let best = 0;
    for (let i = 0; i < pings.length; i++) {
      const p = pings[i];
      const age = now - p.t0;
      if (age < 0 || age > p.life) continue;
      const R = age * p.speed;
      const dx = s.x2 - s.x1;
      const dy = s.y2 - s.y1;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((p.x - s.x1) * dx + (p.y - s.y1) * dy) / len2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const cx = s.x1 + dx * t;
      const cy = s.y1 + dy * t;
      const d = Math.hypot(p.x - cx, p.y - cy);
      const band = d - R;
      if (band > 64 || band < -64) continue;
      const pulse = 1 - age / p.life;
      const v = pulse * Math.exp(-(band * band) / 1600);
      if (v > best) best = v;
    }
    return best;
  }

  _pointBrightness(x, y, pings, now, level, occlude = true) {
    let best = 0;
    for (let i = 0; i < pings.length; i++) {
      const p = pings[i];
      const age = now - p.t0;
      if (age < 0 || age > p.life) continue;
      const R = age * p.speed;
      const d = Math.hypot(x - p.x, y - p.y);
      const band = d - R;
      if (band > 58 || band < -58) continue;
      const pulse = 1 - age / p.life;
      let v = pulse * Math.exp(-(band * band) / 1200);
      if (occlude && v > 0.02 && level) {
        if (!lineOfSight(level.grid, level.w, level.h, p.x, p.y, x, y, level.tile)) v *= 0.1;
      }
      if (v > best) best = v;
    }
    return best;
  }

  draw(game) {
    const { ctx } = this;
    const level = game.level;
    if (!level) return;
    this.fit(level);
    const now = game.now;
    const shake = game.shake || 0;
    const sx = (Math.random() * 2 - 1) * shake;
    const sy = (Math.random() * 2 - 1) * shake;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#04070a';
    ctx.fillRect(0, 0, this.cw, this.ch);

    const vw = this.cw / this.scale;
    const vh = this.ch / this.scale;
    const cx = level.size.w <= vw
      ? level.size.w / 2
      : clamp(game.camX || level.size.w / 2, vw / 2, level.size.w - vw / 2);
    const cy = level.size.h <= vh
      ? level.size.h / 2
      : clamp(game.camY || level.size.h / 2, vh / 2, level.size.h - vh / 2);

    ctx.save();
    ctx.translate(this.cw / 2 - cx * this.scale + sx, this.ch / 2 - cy * this.scale + sy);
    ctx.scale(this.scale, this.scale);

    // ---- sonar: sparks fly out, bounce off walls, leave short comet tails ---
    // Stealth is silence, and silence is blindness: nothing renders at all.
    const vision = !game.blind;
    const rays = vision ? game.rays || [] : [];
    const contacts = vision ? game.contacts || [] : [];
    if (rays.length || contacts.length) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 0; i < contacts.length; i++) {
        const c = contacts[i];
        if (c.kind === 'hunter' || c.kind === 'skitter') continue;
        const k = Math.max(0, 1 - (now - c.t) / 1.7);
        if (k <= 0.02) continue;
        const col = c.tint || (c.kind === 'shard' ? '255,205,110'
          : c.kind === 'exit' ? '140,240,170'
            : '236,252,250');
        ctx.fillStyle = `rgba(${col}, ${k * 0.5})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 1.4 + k * 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
      // A reflection off something that hunts you is the loudest thing in the dark.
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < contacts.length; i++) {
        const c = contacts[i];
        if (c.kind !== 'hunter' && c.kind !== 'skitter') continue;
        const k = Math.max(0, 1 - (now - c.t) / 1.7);
        if (k <= 0.02) continue;
        ctx.fillStyle = `rgba(255, 44, 44, ${0.55 + k * 0.45})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 1.2 + k * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 90, 90, ${k * 0.5})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 3.2 + (1 - k) * 6, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < rays.length; i++) {
        const r = rays[i];
        if (!r.pts || r.pts.length < 2) continue;
        const fade = r.age <= r.life ? 1 : Math.max(0, 1 - (r.age - r.life) / 1.2);
        if (fade <= 0.02) continue;
        const head = Math.min(1, r.age / r.life);
        const a = (0.5 - head * 0.3) * fade * (r.tint ? 1.45 : 1);
        if (a <= 0.02) continue;
        const pts = r.pts;
        const n = pts.length;
        const start = Math.max(0, n - 10);
        const segs = n - 1 - start;
        if (segs > 0) {
          const batches = 3;
          for (let b = 0; b < batches; b++) {
            const i0 = start + Math.floor((segs * b) / batches);
            const i1 = start + Math.max(1, Math.floor((segs * (b + 1)) / batches));
            if (i1 <= i0) continue;
            const ta = a * Math.pow((b + 1) / batches, 1.6);
            ctx.beginPath();
            ctx.moveTo(pts[i0].x, pts[i0].y);
            for (let j = i0 + 1; j <= i1; j++) ctx.lineTo(pts[j].x, pts[j].y);
            if (b === batches - 1) ctx.lineTo(r.x, r.y);
            ctx.strokeStyle = `rgba(${r.tint || '240,253,252'}, ${Math.min(1, ta * (r.hot ? 2.1 : r.tint ? 1.5 : 1))})`;
            ctx.lineWidth = (r.hot ? 1.6 : r.tint ? 1.0 : 0.8) + ta * (r.hot ? 2.4 : 1.4);
            ctx.stroke();
          }
        }
        if (r.age <= r.life) {
          ctx.fillStyle = `rgba(${r.tint || '240,253,252'}, ${Math.min(0.9, a * (r.hot ? 3 : 1.4))})`;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.hot ? 2.6 : 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // ---- particles ----------------------------------------------------------
    const dust = game.particles;
    if (dust) {
      for (let i = 0; i < dust.length; i++) {
        const p = dust[i];
        const b = this._pointBrightness(p.x, p.y, game.pings, now, level, false);
        if (b < 0.02) continue;
        ctx.fillStyle = `rgba(225, 248, 246, ${b * 0.45})`;
        ctx.fillRect(p.x, p.y, 1.5, 1.5);
      }
    }

    // ---- shards -------------------------------------------------------------
    for (const l of game.loot || []) {
      const k = Math.max(0, 1 - (now - (l.seenAt ?? -9)) / 2.2);
      const glow = Math.max(0.16, k);
      const col = l.kind === 'charm' ? '170,225,255' : '255,205,110';
      ctx.strokeStyle = `rgba(${col}, ${glow * 0.8})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(l.x, l.y, 5.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = `rgba(${col}, ${glow * 0.55})`;
      ctx.beginPath();
      ctx.arc(l.x, l.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const sh of game.shards) {
      if (!vision) continue;
      const seen = now - (sh.seenAt ?? -99);
      const px = game.player ? game.player.x : game.camX;
      const py = game.player ? game.player.y : game.camY;
      const near = Math.max(0, 1 - Math.hypot(sh.x - px, sh.y - py) / 46) * 0.22;
      const a = clamp(seen < 2.6 ? 0.35 + 0.65 * (1 - seen / 2.6) : near, 0, 1);
      if (a < 0.02) continue;
      const pulse = 0.75 + 0.25 * Math.sin(now * 2.4 + sh.id * 1.7);
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = `rgba(${GOLD}, ${0.16 * a * pulse})`;
      ctx.fillRect(-12, -12, 24, 24);
      ctx.strokeStyle = `rgba(${GOLD}, ${0.9 * a * pulse})`;
      ctx.lineWidth = 1.6;
      ctx.strokeRect(-6.5, -6.5, 13, 13);
      ctx.fillStyle = `rgba(255, 240, 210, ${0.9 * a * pulse})`;
      ctx.fillRect(-2.5, -2.5, 5, 5);
      ctx.restore();
    }

    // ---- named-map key and doors --------------------------------------------
    if (vision && game.mapMode) {
      if (game.mapKey && !game.hasKey) {
        const k = game.mapKey;
        const pulse = 0.72 + 0.28 * Math.sin(now * 3.1);
        ctx.save();
        ctx.translate(k.x, k.y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = `rgba(${GOLD}, ${0.95 * pulse})`;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(-7, -7, 14, 14);
        ctx.strokeRect(-3.5, -3.5, 7, 7);
        ctx.restore();
      }
      for (const e of game.mapExits || []) {
        const locked = e.require === 'key' && !game.hasKey;
        const col = locked ? '255, 110, 110' : e.color;
        const pulse = 0.6 + 0.4 * Math.sin(now * 2.2);
        const a = locked ? 0.5 : 0.55 + 0.35 * pulse;
        ctx.strokeStyle = `rgba(${col}, ${a})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 13, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(e.x, e.y, 20, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
        ctx.fillStyle = `rgba(${col}, ${a * 0.7})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---- exit ---------------------------------------------------------------
    if (vision) {
      const eSeen = now - (level.exit.seenAt ?? -99);
      if (game.exitOpen) {
        this._drawExit(level.exit.x, level.exit.y, 0.9, GREEN, now, true);
      } else if (eSeen < 2.6) {
        this._drawExit(level.exit.x, level.exit.y, 0.3 + 0.6 * (1 - eSeen / 2.6), GREEN, now, false);
      }
    }

    // ---- hunters: never drawn as bodies. Only their reflection exists --------

    // ---- echo rings: where a mimic answered --------------------------------
    for (const r of game.echoRings || []) {
      const k = (now - r.t) / 1.2;
      if (k < 0 || k > 1) continue;
      ctx.strokeStyle = `rgba(150, 242, 230, ${(1 - k) * 0.3})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 7 + k * 54, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ---- debug view (only when ~ was pressed) -------------------------------
    if (game.debugMode) {
      ctx.save();
      ctx.lineWidth = 1;
      for (const h of game.hunters) {
        ctx.strokeStyle = 'rgba(255, 70, 70, 0.95)';
        ctx.strokeRect(h.x - 11, h.y - 11, 22, 22);
        if (h.path && h.path.length) {
          ctx.beginPath();
          ctx.moveTo(h.x, h.y);
          for (const wp of h.path) ctx.lineTo(wp.x, wp.y);
          ctx.strokeStyle = 'rgba(255, 70, 70, 0.45)';
          ctx.stroke();
        }
        if (h.state) {
          ctx.strokeStyle = 'rgba(255, 220, 140, 0.85)';
          ctx.font = '9px monospace';
          ctx.fillStyle = 'rgba(255, 220, 140, 0.9)';
          ctx.fillText(h.type === 'hunter' ? h.state : `${h.type}:${h.state}`, h.x - 14, h.y - 16);
        }
        if (h.pending) {
          ctx.strokeStyle = 'rgba(255, 200, 120, 0.9)';
          ctx.beginPath();
          ctx.arc(h.pending.x, h.pending.y, 8, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      for (const sk of game.skitters || []) {
        ctx.strokeStyle = 'rgba(110, 180, 255, 0.95)';
        ctx.strokeRect(sk.x - 9, sk.y - 9, 18, 18);
      }
      ctx.restore();
    }

    // ---- throwables: aiming fan and flight trails ---------------------------
    if (game.player) {
      const p = game.player;
      const showAim = !!game.activeItem || (game.inv && game.inv.stones > 0);
      if (showAim) {
        const r = this;
        const ax = game.aimX ?? p.x + Math.cos(p.face || 0) * 160;
        const ay = game.aimY ?? p.y + Math.sin(p.face || 0) * 160;
        const a = Math.atan2(ay - p.y, ax - p.x);
        const len = 196;
        ctx.save();
        ctx.setLineDash([9, 7]);
        ctx.lineDashOffset = -now * 34;
        ctx.strokeStyle = 'rgba(255, 214, 150, 0.5)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * 16, p.y + Math.sin(a) * 16);
        ctx.lineTo(p.x + Math.cos(a) * len, p.y + Math.sin(a) * len);
        ctx.stroke();
        ctx.setLineDash([3, 5]);
        ctx.lineDashOffset = 0;
        ctx.strokeStyle = 'rgba(255, 236, 200, 0.22)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * 16, p.y + Math.sin(a) * 16);
        ctx.lineTo(p.x + Math.cos(a) * len, p.y + Math.sin(a) * len);
        ctx.stroke();
        ctx.restore();
      }
      for (const t of game.throws || []) {
        if (!t.trail || t.trail.length < 2) continue;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 1; i < t.trail.length; i++) {
          const k = i / t.trail.length;
          ctx.strokeStyle = `rgba(${game.activeItem === 'sharpStone' || t.kills ? '255, 205, 120' : '220, 250, 245'}, ${k * 0.5})`;
          ctx.lineWidth = 0.8 + k * 2.2;
          ctx.beginPath();
          ctx.moveTo(t.trail[i - 1].x, t.trail[i - 1].y);
          ctx.lineTo(t.trail[i].x, t.trail[i].y);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255, 246, 226, 0.95)';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ---- player -------------------------------------------------------------
    if (game.player) {
      const p = game.player;
      // Way home: a small triangle orbiting the player toward the key / exit.
      for (const m of game.homeMarkers || []) {
        const a = Math.atan2(m.y - p.y, m.x - p.x);
        const mx = p.x + Math.cos(a) * 34;
        const my = p.y + Math.sin(a) * 34;
        ctx.fillStyle = `rgba(${m.c}, 0.85)`;
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(a) * 6, my + Math.sin(a) * 6);
        ctx.lineTo(mx + Math.cos(a + 2.4) * 5, my + Math.sin(a + 2.4) * 5);
        ctx.lineTo(mx + Math.cos(a - 2.4) * 5, my + Math.sin(a - 2.4) * 5);
        ctx.closePath();
        ctx.fill();
      }
      for (const t of p.trail) {
        ctx.fillStyle = `rgba(190, 255, 246, ${(t.life / 0.55) * 0.07})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      const breathe = 0.75 + 0.25 * Math.sin(now * 2.1);
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 34);
      grad.addColorStop(0, `rgba(225, 255, 250, ${0.9 * breathe})`);
      grad.addColorStop(0.25, `rgba(150, 245, 235, ${0.4 * breathe})`);
      grad.addColorStop(1, 'rgba(80, 210, 198, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(240, 255, 252, 0.95)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.4, 0, Math.PI * 2);
      ctx.fill();
      // facing tick
      ctx.strokeStyle = 'rgba(220, 255, 250, 0.5)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(p.face) * 7, p.y + Math.sin(p.face) * 7);
      ctx.lineTo(p.x + Math.cos(p.face) * 11, p.y + Math.sin(p.face) * 11);
      ctx.stroke();

      if (game.listen) {
        const rr = 58 + Math.sin(now * 2.6) * 2.5;
        ctx.strokeStyle = 'rgba(120, 220, 210, 0.10)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 7]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // ---- wavefront rings ----------------------------------------------------
    for (const p of game.pings) {
      const age = now - p.t0;
      if (age < 0 || age > p.life) continue;
      const R = age * p.speed;
      const fade = (1 - age / p.life) * (p.small ? 0.45 : 1);
      ctx.strokeStyle = `rgba(${p.tint || TEAL}, ${fade * (p.tint ? 0.6 : 0.2)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(${p.tint || TEAL}, ${fade * fade * 0.09})`;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();

    // ---- screen space overlays ---------------------------------------------
    const danger = game.danger || 0;
    if (danger > 0.02) {
      const g = ctx.createRadialGradient(
        this.cw / 2,
        this.ch / 2,
        Math.min(this.cw, this.ch) * 0.24,
        this.cw / 2,
        this.ch / 2,
        Math.max(this.cw, this.ch) * 0.72,
      );
      g.addColorStop(0, 'rgba(255, 40, 40, 0)');
      g.addColorStop(1, `rgba(255, 40, 40, ${0.22 * danger})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
    if (game.state === 'dead' && game.deathT !== undefined) {
      const a = clamp(0.55 - game.deathT * 0.25, 0, 0.55);
      ctx.fillStyle = `rgba(120, 8, 8, ${a})`;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
    if (game.debugMode) {
      ctx.save();
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(255, 90, 90, 0.85)';
      const p = game.player || { x: 0, y: 0 };
      const lines = [
        `hunters ${game.hunters.length}  mimics ${(game.skitters || []).length}  shards ${game.shards.length}`,
        `player ${Math.round(p.x)},${Math.round(p.y)}  rays ${(game.rays || []).length}`,
        `freeze ${game.debugFreeze ? 'ON (1)' : 'off (1)'}`,
      ];
      lines.forEach((t, i) => ctx.fillText(t, 18, this.ch - 54 + i * 15));
      ctx.restore();
    }
    if (game.flash > 0) {
      ctx.fillStyle = `rgba(190, 255, 245, ${game.flash * 0.06})`;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
  }

  _drawExit(x, y, a, color, now, open) {
    const { ctx } = this;
    ctx.save();
    ctx.translate(x, y);
    const pulse = open ? 0.8 + 0.2 * Math.sin(now * 2.2) : 1;
    if (open) {
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 46);
      g.addColorStop(0, `rgba(255, 210, 140, ${0.25 * a})`);
      g.addColorStop(1, 'rgba(255, 210, 140, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 46, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = `rgba(${color}, ${a * pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-13, 16);
    ctx.lineTo(-13, -6);
    ctx.arc(0, -6, 13, Math.PI, 0);
    ctx.lineTo(13, 16);
    ctx.stroke();
    ctx.strokeStyle = `rgba(${color}, ${a * pulse * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-7, 16);
    ctx.lineTo(-7, -4);
    ctx.arc(0, -4, 7, Math.PI, 0);
    ctx.lineTo(7, 16);
    ctx.stroke();
    if (open) {
      ctx.fillStyle = `rgba(255, 230, 190, ${a * 0.6})`;
      for (let i = 0; i < 3; i++) {
        const yy = 4 - ((now * 18 + i * 12) % 26);
        ctx.fillRect(-2, yy, 4, 2);
      }
    }
    ctx.restore();
  }
}

// ---- src/ui.js ----
// The interface never speaks. Every message is a shape, a pulse, or a change
// in colour — because in this game words would do the listening for you.
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
  resume: '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 3v6h6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M5 11l7-6 7 6v8H5z" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  sound: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  muted: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  bars: '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/></svg>',
};

function icon(name, cls = '') {
  return `<span class="ico ${cls}" aria-hidden="true">${ICON[name]}</span>`;
}

class UI {
  constructor(root, game) {
    this.root = root;
    this.game = game;
    this.introTimer = 0;
    this.toastTimer = 0;
    this.build();
  }

  build() {
    this.root.innerHTML = `
      <div class="vignette"></div>
      <div class="grain"></div>

      <section class="screen title-screen" id="scr-title">
        <div class="title-inner">
          <svg class="emblem" viewBox="0 0 160 160" aria-hidden="true">
            <circle cx="80" cy="80" r="3.2" class="dot"/>
            <path class="arc a1" d="M80 26a54 54 0 0 1 0 108"/>
            <path class="arc a2" d="M80 12a68 68 0 0 1 0 136"/>
            <path class="arc a3" d="M80 44a36 36 0 0 1 0 72"/>
          </svg>
          <div class="start-row">
            <button class="btn primary" id="btn-start" aria-label="进入">${icon('play')}</button>
            <button class="btn build" id="btn-edit" aria-label="造图">${icon('pencil')}</button>
          </div>
          <div class="nest-glyph" id="nest-glyph"></div>
          <div class="chamber-grid" id="chamber-grid"></div>
        </div>
        <div class="title-foot" id="title-foot"></div>
      </section>

      <section class="screen pause-screen hidden" id="scr-pause">
        <div class="panel">
          <div class="panel-glyph">${ICON.bars}</div>
          <div class="icon-row">
            <button class="btn icon" id="btn-resume" aria-label="继续">${icon('resume')}</button>
            <button class="btn icon" id="btn-restart" aria-label="重来">${icon('retry')}</button>
            <button class="btn icon" id="btn-mute" aria-label="静音">${icon('sound')}</button>
            <button class="btn icon" id="btn-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen dead-screen hidden" id="scr-dead">
        <div class="panel">
          <svg class="panel-glyph broken" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="34" class="ring-broken"/>
            <circle cx="50" cy="50" r="5" class="dot-red"/>
          </svg>
          <div class="deep-glyph" id="dead-deep"></div>
          <div class="icon-row">
            <button class="btn icon" id="btn-retry" aria-label="再试">${icon('retry')}</button>
            <button class="btn icon" id="btn-dead-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen clear-screen hidden" id="scr-clear">
        <div class="panel">
          <svg class="panel-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <path class="burst" d="M50 8l7 26 20-18-8 27 27-6-22 19 26 8-27 6 18 21-26-9 2 27-17-22-17 22 2-27-26 9 18-21-27-6 26-8-22-19 27 6-8-27 20 18z"/>
          </svg>
          <div class="stats-glyphs" id="clear-stats"></div>
          <div class="icon-row">
            <button class="btn icon" id="btn-next" aria-label="下一间">${icon('next')}</button>
            <button class="btn icon" id="btn-clear-title" aria-label="标题">${icon('home')}</button>
          </div>
        </div>
      </section>

      <section class="screen victory-screen hidden" id="scr-victory">
        <div class="panel">
          <svg class="panel-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="8" class="dot"/>
            <circle cx="50" cy="50" r="20" class="ring-dim"/>
            <circle cx="50" cy="50" r="32" class="ring-dim d2"/>
            <circle cx="50" cy="50" r="43" class="ring-dim d3"/>
          </svg>
          <div class="stats-glyphs" id="victory-stats"></div>
          <button class="btn icon" id="btn-victory-home" aria-label="标题">${icon('home')}</button>
        </div>
      </section>

      <div class="hud hidden" id="hud">
        <div class="hud-left">
          <span class="hud-num" id="hud-num" data-sector="I"></span>
          <span class="hud-sector" id="hud-sector"></span>
        </div>
        <div class="hud-right">
          <span class="diamond"></span>
          <span class="shard-bar" id="hud-shards"></span>
        </div>
        <div class="hud-loot" id="hud-loot"></div>
        <div class="hud-charges" id="hud-charges"></div>
        <div class="hud-listen" id="hud-listen">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M14 20a6 6 0 0 1 12 0" class="l1"/>
            <path d="M9 20a11 11 0 0 1 22 0" class="l2"/>
          </svg>
        </div>
      </div>
    `;

    const $ = (id) => this.root.querySelector('#' + id);
    this.scr = {
      title: $('scr-title'),
      pause: $('scr-pause'),
      dead: $('scr-dead'),
      clear: $('scr-clear'),
      victory: $('scr-victory'),
    };
    this.hud = $('hud');
    this.grid = $('chamber-grid');
    this.nestGlyph = $('nest-glyph');
    this.foot = $('title-foot');
    this.hudNum = $('hud-num');
    this.hudSector = $('hud-sector');
    this.hudShards = $('hud-shards');
    this.hudCharges = $('hud-charges');
    this.hudLoot = $('hud-loot');
    this.hudListen = $('hud-listen');
    this.clearStats = $('clear-stats');
    this.victoryStats = $('victory-stats');
    this.deadDeep = $('dead-deep');

    // Buttons blur themselves so Space never triggers twice.
    const bind = (id, fn) => {
      const el = $(id);
      if (!el) return;
      el.addEventListener('click', (e) => {
        e.preventDefault();
        el.blur();
        fn();
      });
    };
    const g = this.game;
    bind('btn-start', () => g.startBest());
    bind('btn-edit', () => g.openEditor());
    bind('btn-resume', () => g.resume());
    bind('btn-restart', () => g.restart());
    bind('btn-mute', () => g.toggleMute());
    bind('btn-title', () => g.quitToTitle());
    bind('btn-retry', () => g.restart());
    bind('btn-dead-title', () => g.quitToTitle());
    bind('btn-next', () => g.next());
    bind('btn-clear-title', () => g.quitToTitle());
    bind('btn-victory-home', () => g.quitToTitle());
    this.muteBtn = $('btn-mute');
  }

  hideScreens() {
    for (const s of Object.values(this.scr)) s.classList.add('hidden');
  }

  showScreen(name) {
    this.hideScreens();
    this.scr[name].classList.remove('hidden');
  }

  showTitle(progress = {}) {
    this.showScreen('title');
    this.hideHUD();
    this.grid.innerHTML = '';
    const unlocked = progress.unlocked || 1;
    const cleared = new Set(progress.cleared || []);
    for (let i = 0; i < 8; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell' + (i < unlocked ? '' : ' locked') + (cleared.has(i) ? ' cleared' : '');
      // The chamber's number is drawn as bars, not written.
      let bars = '<span class="cell-bars">';
      for (let b = 0; b <= i; b++) bars += '<i></i>';
      bars += '</span>';
      cell.innerHTML = bars + (i < unlocked ? '' : '<span class="cell-slash"></span>');
      cell.disabled = i >= unlocked;
      cell.addEventListener('click', () => {
        cell.blur();
        this.game.openMapSelect();
      });
      this.grid.appendChild(cell);
    }
    this.nestGlyph.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('i');
      if (progress.worldCleared) p.className = 'done';
      this.nestGlyph.appendChild(p);
    }
    this.foot.innerHTML = progress.worldCleared ? `<span class="foot-rings">${icon('sound')}</span>` : '';
  }

  showGame() {
    this.hideScreens();
    this.hud.classList.remove('hidden');
  }

  hideHUD() {
    this.hud.classList.add('hidden');
  }

  showPause() {
    this.showScreen('pause');
    this.syncMute();
  }

  showDead({ deepest = null } = {}) {
    this.showScreen('dead');
    this.hideHUD();
    this.deadDeep.innerHTML = '';
    if (deepest != null) {
