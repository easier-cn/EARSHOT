  complete() {
    if (this.state !== 'playing') return;
    if (this.floorMode) {
      this.audio.gateOpen();
      this.state = 'complete';
      if (this.depth < FLOORS) {
        this.ui.dismiss();
        this.ui.showFloorClear({ depth: this.depth, max: FLOORS, time: this.levelTime, open: true });
      } else {
        this.progress.floorCleared = (this.progress.floorCleared || 0) + 1;
        this.progress.bestRun = this.progress.bestRun || null;
        const t = this.levelTime;
        if (!this.progress.bestRun || t < this.progress.bestRun) this.progress.bestRun = t;
        this.saveProgress();
        this.state = 'victory';
        this.ui.dismiss();
        this.ui.showRunVictory({ time: t, best: this.progress.bestRun, depth: FLOORS });
      }
      return;
    }
    if (this.worldMode) {
      const time = Math.max(0, this.levelTime);
      const prev = this.progress.worldBest;
      const isRecord = !prev || time < prev.time;
      if (isRecord) this.progress.worldBest = { time, pings: this.pingsUsed };
      this.progress.worldCleared = true;
      this.saveProgress();
      this.state = 'victory';
      this.audio.clear();
      this.ui.dismiss();
      this.ui.showWorldVictory({
        time,
        pings: this.pingsUsed,
        best: this.progress.worldBest,
        isRecord,
        shards: this.collected,
      });
      return;
    }
    this.state = 'complete';
    this.audio.clear();
    const cleared = new Set(this.progress.cleared);
    cleared.add(this.chamberIndex);
    this.progress.cleared = [...cleared];
    this.progress.unlocked = Math.max(this.progress.unlocked, this.chamberIndex + 2);
    this.progress.last = this.chamberIndex;
    const prev = this.progress.best[this.chamberIndex];
    const time = Math.max(0, this.levelTime);
    const isRecord =
      !prev || time < prev.time || (time === prev.time && this.pingsUsed < prev.pings);
    if (isRecord) {
      this.progress.best[this.chamberIndex] = { time, pings: this.pingsUsed };
    }
    this.saveProgress();
    this.ui.dismiss();
    this.ui.showClear({
      chamber: this.chamberIndex,
      time,
      pings: this.pingsUsed,
      best: this.progress.best[this.chamberIndex],
      isRecord,
      last: this.chamberIndex === CHAMBERS.length - 1,
    });
  }

  updateParticles(dt) {
    if (!this.level) return;
    const W = this.level.size.w;
    const H = this.level.size.h;
    for (const p of this.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < 0) p.x += W;
      if (p.x > W) p.x -= W;
      if (p.y < 0) p.y += H;
      if (p.y > H) p.y -= H;
    }
  }

  render() {
    this.renderer.draw(this);
  }

  // Debug hooks used by the headless screenshot script.
  debugPing() {
    if (this.state === 'playing') this.firePing();
  }

  // Deterministic capture: step the world forward without relying on rAF,
  // then leave one ping mid-flight so the sonar shell is visible.
  debugSimulate(seconds, opts = {}) {
    if (!this.player || !this.level) return;
    this.debugMove = opts.move || null;
    const dt = 1 / 60;
    const steps = Math.max(1, Math.round(seconds / dt));
    let next = opts.every || 0;
    for (let i = 0; i < steps; i++) {
      if (next && this.now >= next) {
        next += opts.every;
        this.pings.push({
          x: this.player.x,
          y: this.player.y,
          t0: this.now,
          speed: PING_SPEED,
          life: PING_LIFE,
          heard: new Set(),
        });
        this.spawnRays(this.player.x, this.player.y);
      }
      this.now += dt;
      this.update(dt);
    }
    if (opts.ping && this.player) {
      const wave = opts.wave ?? 0.45;
      this.pings.push({
        x: this.player.x,
        y: this.player.y,
        t0: this.now - wave,
        speed: PING_SPEED,
        life: PING_LIFE,
        heard: new Set(),
      });
      this.spawnRays(this.player.x, this.player.y);
      if (wave > 0) this.updateRays(wave);
    }
    this.debugMove = null;
    this.frozen = true;
  }
}

// ---- src/main.js ----

// Surface any runtime error instead of failing to a black screen.
window.addEventListener('error', (e) => {
  document.title = `ERR ${e.message}`;
  const pre = document.createElement('pre');
  pre.id = 'err';
  pre.style.cssText =
    'position:fixed;z-index:99;inset:0 0 auto 0;margin:0;padding:12px;color:#ff8a8a;' +
    'background:#120404;font:12px/1.5 monospace;white-space:pre-wrap';
  pre.textContent = `${e.message}\n${e.filename}:${e.lineno}:${e.colno}`;
  document.body.appendChild(pre);
});

const params = new URLSearchParams(location.search);
if (params.has('static')) document.documentElement.classList.add('no-anim');

const canvas = document.getElementById('game');
const game = new Game(canvas, document.getElementById('ui'));
window.__hush = game;
try { sessionStorage.removeItem('hushReload'); } catch {}
runSelfCheck(game);

// Chrome can suspend/interrupt the audio context after a reload or device change.
const resumeAudio = () => {
  const a = game.audio;
  if (!a || !a.ready || !a.ctx) return;
  if (a.ctx.state === 'suspended' || a.ctx.state === 'interrupted') a.ctx.resume();
};
window.addEventListener('pointerdown', resumeAudio, true);
window.addEventListener('keydown', resumeAudio, true);
document.addEventListener('visibilitychange', resumeAudio);
if (params.has('edit')) setTimeout(() => game.openEditor(), 60);
if (params.has('hunt')) {
  setTimeout(() => {
    game.startChamber(1);
    const L = game.level;
    const T = L.tile;
    const px = Math.floor(game.player.x / T);
    const py = Math.floor(game.player.y / T);
    let spot = null;
    for (let r = 6; r <= 7 && !spot; r++) {
      for (const [dx, dy] of [[r, 0], [-r, 0], [0, r], [0, -r], [r, r], [-r, -r], [r, -r], [-r, r]]) {
        const x = px + dx;
        const y = py + dy;
        if (x > 1 && y > 1 && x < L.w - 1 && y < L.h - 1 && !L.grid[y * L.w + x]) {
          spot = { x: (x + 0.5) * T, y: (y + 0.5) * T };
          break;
        }
      }
    }
    const h = game.hunters[0];
    if (spot) { h.x = spot.x; h.y = spot.y; }
    h.hear(game.player.x, game.player.y, 0.05);
    game.debugSimulate(0.75, {});
    game.stepEcho(h.x, h.y, '255, 70, 70');
    game.debugSimulate(0.16, {});
  }, 700);
}
if (params.has('red')) {
  setTimeout(() => {
    game.startChamber(1);
    game.stepEcho(game.player.x + 40, game.player.y + 2, '255, 70, 70');
    game.debugSimulate(0.2, {});
  }, 700);
}
if (params.has('debug')) {
  setTimeout(() => {
    game.debugMode = true;
  }, 600);
}
if (params.has('blue')) {
  setTimeout(() => {
    game.startChamber(0);
    game.stepEcho(game.player.x + 70, game.player.y, '110, 180, 255');
    game.debugSimulate(0.24, {});
  }, 900);
}

// Debug / screenshot helpers. None of this is reachable from the UI.
const chamber = params.get('c');
if (chamber !== null) {
  const idx = Number(chamber);
  if (Number.isFinite(idx)) {
    // Let the first frame settle, then jump straight into a chamber.
    setTimeout(() => game.startChamber(Math.max(0, Math.min(7, idx))), 60);
  }
}
const sim = params.get('sim');
if (sim !== null) {
  setTimeout(() => {
    game.debugInvincible = true;
    game.debugSimulate(Number(sim) || 2, {
      wave: Number(params.get('wave') ?? 0.45),
      every: Number(params.get('every') || 0),
      ping: params.has('ping'),
      move: params.has('move') ? { x: 1, y: 0 } : null,
    });
  }, 500);
} else if (params.has('ping')) {
  setInterval(() => game.debugPing(), 700);
}
if (params.has('listen')) {
  game.debugListen = true;
}
const freeze = params.get('freeze');
if (freeze !== null) {
  setTimeout(
    () => {
      game.frozen = true;
    },
    Math.max(0, Number(freeze) || 0),
  );
}

// Experimental: walk the single continuous map.
if (params.has('map')) {
  const id = params.get('map') || 'room';
  const seed = Number(params.get('seed')) || ((Math.random() * 1e9) | 0);
  setTimeout(() => game.startMap(id, seed), 0);
}
if (params.has('run')) {
  setTimeout(() => {
    game.startRun(Number(params.get('run')) || 12345);
    if (params.has('sim') && !params.has('run')) {
      game.debugSimulate(Number(params.get('sim')) || 1, {
        every: Number(params.get('every')) || 0.9,
        wave: params.has('wave') ? Number(params.get('wave')) : 0.45,
      });
    }
  }, 700);
}
if (params.has('world')) {
  setTimeout(() => {
    game.startWorld(Number(params.get('world')) || 424242);
  }, 250);
}

// Force one of the end screens for visual checks.
const doc = params.get('doc');
if (doc) {
  setTimeout(() => {
    if (doc === 'dead') {
      game.die();
      game.ui.showDead();
    } else if (doc === 'clear') {
      game.complete();
    } else if (doc === 'victory') {
      game.chamberIndex = 7;
      game.victory();
    } else if (doc === 'pause') {
      game.pause();
    } else if (doc === 'worldwin') {
      game.startWorld();
      game.shards = [];
      game.collected = game.totalShards;
      game.echoHeard = true;
      game.exitOpen = true;
      game.levelTime = 421;
      game.pingsUsed = 37;
      game.complete();
    } else if (doc === 'echo') {
      game.startChamber(5);
      const m = game.skitters[0];
      if (m) {
        game.player.x = m.x + 120;
        game.player.y = m.y;
        game.charges = 3;
        if (m._plan) m._plan(game);
        game.firePing();
        game.debugSimulate(1.35, {});
      }
    }
  }, 900);
}

      if (!sessionStorage.getItem('hushReload')) {

          if (!window.__hush) {
            sessionStorage.setItem('hushReload', '1');
            location.replace(location.pathname + '?fresh=' + Date.now());
          }
