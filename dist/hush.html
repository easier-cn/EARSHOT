      title: $('scr-title'),
      pause: $('scr-pause'),
      dead: $('scr-dead'),
      clear: $('scr-clear'),
      victory: $('scr-victory'),
      clearPanel: $('scr-clear'),
      hud: $('hud'),
      hudNum: $('hud-num'),
      hudTitle: $('hud-title'),
      hudShard: $('hud-shard-count'),
      hudPips: $('hud-pips'),
      listenTag: $('listen-tag'),
      toast: $('toast'),
      intro: $('intro'),
      start: $('btn-start'),
      grid: $('chamber-grid'),
      stats: $('clear-stats'),
      record: $('clear-record'),
      victoryStats: $('victory-stats'),
    };
    this.screens = {
      title: this.el.title,
      pause: this.el.pause,
      dead: this.el.dead,
      clear: this.el.clear,
      victory: this.el.victory,
    };

    const g = this.game;
    const bind = (el, fn) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        el.blur();
        g.audio.unlock();
        g.audio.click();
        fn();
      });
    };
    bind(this.el.start, () => g.startBest());
    bind($('btn-resume'), () => g.resume());
    bind($('btn-restart'), () => g.restart());
    bind($('btn-pause-mute'), () => {
      const m = g.audio.toggleMute();
      $('btn-pause-mute').textContent = m ? '开启声音' : '静音';
    });
    bind($('btn-title'), () => g.quitToTitle());
    bind($('btn-retry'), () => g.restart());
    bind($('btn-dead-title'), () => g.quitToTitle());
    bind($('btn-next'), () => {
      if (g.chamberIndex + 1 >= CHAMBERS.length) g.victory();
      else g.next();
    });
    bind($('btn-clear-title'), () => g.quitToTitle());
    bind($('btn-victory-title'), () => g.quitToTitle());
  }

  // --------------------------------------------------------------- screens
  hideScreens() {
    for (const el of Object.values(this.screens)) el.classList.add('hidden');
  }

  showScreen(name) {
    this.hideScreens();
    const el = this.screens[name];
    if (el) el.classList.remove('hidden');
  }

  showTitle(progress) {
    this.hideScreens();
    this.showScreen('title');
    this.el.hud.classList.add('hidden');
    this.el.listenTag.classList.add('hidden');
    const startBtn = this.el.start;
    startBtn.textContent = progress.unlocked > 1 ? `继续 · 密室 ${ROMAN[progress.unlocked - 1]}` : '进入黑暗';
    this.el.grid.innerHTML = CHAMBERS.map((c, i) => {
      const unlocked = i < progress.unlocked;
      const cleared = progress.cleared.includes(i);
      const best = progress.best && progress.best[i];
      const label = !unlocked ? '未解锁' : best ? `最佳 ${fmtTime(best.time)}` : c.title;
      return `<button class="chamber ${unlocked ? 'open' : 'locked'} ${cleared ? 'cleared' : ''}"
        data-i="${i}" ${unlocked ? '' : 'disabled'} title="${label}">
        <span>${ROMAN[i]}</span>${cleared ? '<i></i>' : ''}
      </button>`;
    }).join('');
    this.el.grid.querySelectorAll('.chamber.open').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        btn.blur();
        this.game.audio.unlock();
        this.game.startChamber(Number(btn.dataset.i));
      });
    });
    setTimeout(() => startBtn.focus({ preventScroll: true }), 80);
  }

  showGame(index, cfg) {
    this.hideScreens();
    this.el.hud.classList.remove('hidden');
    this.el.hudNum.textContent = cfg.num;
    this.el.hudTitle.textContent = cfg.title;
    this.lastHud = '';
    this.intro(cfg.intro);
    this.el.listenTag.classList.add('hidden');
    this.updateHUD({
      chamber: index,
      shards: cfg.shards,
      total: cfg.shards,
      charges: 3,
      listen: false,
      muted: this.game.audio.muted,
      danger: 0,
    });
  }

  hideHUD() {
    this.el.hud.classList.add('hidden');
    this.el.listenTag.classList.add('hidden');
  }

  showPause() {
    this.showScreen('pause');
    document.getElementById('btn-pause-mute').textContent = this.game.audio.muted ? '开启声音' : '静音';
  }

  showDead() {
    if (!this.screens.dead.classList.contains('hidden')) return;
    this.hideHUD();
    this.showScreen('dead');
  }

  showClear({ chamber, time, pings, best, isRecord, last }) {
    this.el.hud.classList.add('hidden');
    this.showScreen('clear');
    this.el.stats.innerHTML = `
      <div><span>用时</span><b>${fmtTime(time)}</b></div>
      <div><span>声呐</span><b>${pings} 次</b></div>
      <div><span>碎片</span><b>${CHAMBERS[chamber].shards} / ${CHAMBERS[chamber].shards}</b></div>
    `;
    const bestTime = best ? fmtTime(best.time) : '—';
    this.el.record.innerHTML = `
      ${isRecord ? '<span class="record-badge">新纪录</span>' : ''}
      <span>最佳 ${bestTime}${best ? ` · ${best.pings} 次声呐` : ''}</span>
    `;
    this.el.record.classList.toggle('fresh', !!isRecord);
    document.getElementById('btn-next').textContent = last ? '完成旅程' : '下一间';
  }

  showVictory(progress = {}) {
    this.el.hud.classList.add('hidden');
    this.showScreen('victory');
    const best = progress.best || {};
    const keys = Object.keys(best);
    let total = 0;
    let pings = 0;
    for (const k of keys) {
      total += best[k].time;
      pings += best[k].pings;
    }
    this.el.victoryStats.innerHTML = `
      <div><span>密室</span><b>${keys.length} / ${CHAMBERS.length}</b></div>
      <div><span>最佳总用时</span><b>${keys.length ? fmtTime(total) : '—'}</b></div>
      <div><span>声呐</span><b>${pings} 次</b></div>
    `;
  }

  /** Crossing into a new neighbourhood of the same cave. No fanfare, just a
   *  name, the way a place tells you where you are. */
  setSector(num, title) {
    this.el.hudNum.textContent = num;
    this.el.hudTitle.textContent = title;
    this.el.hudTitle.classList.remove('pulse');
    void this.el.hudTitle.offsetWidth;
    this.el.hudTitle.classList.add('pulse');
  }

  showWorldVictory({ time, pings, best, isRecord, shards }) {
    this.el.hud.classList.add('hidden');
    this.showScreen('victory');
    const panel = this.el.victory.querySelector('.panel');
    panel.querySelector('.panel-kicker').textContent = 'THE NEST IS QUIET';
    panel.querySelector('.panel-sub').textContent =
      '整座巢都安静下来了。你走完了它，没有让它听见最后一次。';
    this.el.victoryStats.innerHTML = `
      <div><span>用时</span><b>${fmtTime(time)}</b></div>
      <div><span>声呐</span><b>${pings} 次</b></div>
      <div><span>碎片</span><b>${shards} 块</b></div>
      <div><span>最佳</span><b>${best ? fmtTime(best.time) : '—'}</b></div>
    `;
    const kicker = panel.querySelector('.panel-kicker');
    if (isRecord) kicker.innerHTML = 'THE NEST IS QUIET <span class="record-badge">新纪录</span>';
  }

  // ------------------------------------------------------------------- hud
  updateHUD(d) {
    const key = `${d.shards}|${d.charges}|${d.listen}|${d.muted}`;
    if (key !== this.lastHud) {
      this.lastHud = key;
      this.el.hudShard.textContent = `${d.total - d.shards} / ${d.total}`;
      const pips = this.el.hudPips.children;
      for (let i = 0; i < pips.length; i++) {
        pips[i].classList.toggle('on', i < d.charges);
      }
      this.el.listenTag.classList.toggle('hidden', !d.listen);
    }
    this.el.hud.style.setProperty('--danger', (d.danger || 0).toFixed(2));
  }

  intro(text) {
    this.el.intro.textContent = text;
    this.el.intro.classList.remove('show');
    void this.el.intro.offsetWidth;
    this.el.intro.classList.add('show');
    clearTimeout(this.introTimer);
    this.introTimer = setTimeout(() => this.el.intro.classList.remove('show'), 5200);
  }

  toast(text) {
    this.el.toast.textContent = text;
    this.el.toast.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.el.toast.classList.remove('show'), 1700);
  }

  // Clear transient overlays so they never sit on top of an end screen.
  dismiss() {
    clearTimeout(this.introTimer);
    clearTimeout(this.toastTimer);
    this.el.intro.classList.remove('show');
    this.el.toast.classList.remove('show');
  }

  tick() {
    /* reserved for future HUD animation */
  }
}

// ---- src/game.js ----

const SAVE_KEY = 'hush.save.v1';
const PING_MAX = 3;
const PING_REGEN = 2.4;
const PING_SPEED = 720;
const PING_LIFE = 0.9;
const WAVE_LISTEN = 760;
const SHARD_ECHO_RANGE = 1150;
const SHARD_ECHO_SPEED = 1500;
const RAY_COUNT = 96;
const RAY_SPEED = 560;
const RAY_LIFE = 0.95;
const START_CHARGES = 3;

function makeDust(level, count = 130) {
  const dust = [];
  const rng = Math.random;
  for (let i = 0; i < count * 4 && dust.length < count; i++) {
    const x = 24 + rng() * (level.size.w - 48);
    const y = 24 + rng() * (level.size.h - 48);
    const tx = Math.floor(x / TILE);
    const ty = Math.floor(y / TILE);
    if (level.grid[ty * level.w + tx] !== 0) continue;
    dust.push({
      x,
      y,
      vx: (rng() * 2 - 1) * 5,
      vy: (rng() * 2 - 1) * 5,
      phase: rng() * Math.PI * 2,
    });
  }
  return dust;
}

class Game {
  constructor(canvas, uiRoot) {
    this.canvas = canvas;
    this.audio = new AudioEngine();
    this.input = new Input(window, canvas);
    this.renderer = new Renderer(canvas);
    this.ui = new UI(uiRoot, this);
    this.state = 'title';
    this.now = 0;
    this.last = 0;
    this.timeScale = 1;
    this.progress = this.loadProgress();

    this.level = null;
    this.player = null;
    this.hunters = [];
    this.skitters = [];
    this.shards = [];
    this.particles = [];
    this.pings = [];
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.echoRings = [];
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.camX = 0;
    this.camY = 0;
    this.chamberIndex = 0;
    this.denyCooldown = 0;
    this.alertCd = 0;
    this.titlePingTimer = 0;

    this.ui.build();
    this.ui.showTitle(this.progress);
    this.loadDemo();

    this.input.onAnyKey = () => {
      if (this.state === 'title') {
        this.audio.unlock();
        this.startBest();
      }
    };
    window.addEventListener('resize', () => this.renderer.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.state === 'playing') this.pause();
    });
    window.addEventListener('blur', () => {
      if (this.state === 'playing' && !this.frozen) this.pause();
    });

    requestAnimationFrame(this.frame);
  }

  // ---------------------------------------------------------------- progress
  loadProgress() {
    const fallback = { unlocked: 1, cleared: [], last: 0, best: {} };
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return fallback;
      const data = JSON.parse(raw);
      if (typeof data.unlocked !== 'number') return fallback;
      const best = {};
      if (data.best && typeof data.best === 'object') {
        for (const [k, v] of Object.entries(data.best)) {
          const i = Number(k);
          if (!Number.isInteger(i) || !v || typeof v.time !== 'number') continue;
          best[i] = { time: v.time, pings: Math.max(0, v.pings | 0) };
        }
      }
      return {
        unlocked: clamp(data.unlocked, 1, CHAMBERS.length),
        cleared: Array.isArray(data.cleared) ? data.cleared : [],
        last: typeof data.last === 'number' ? data.last : 0,
        best,
      };
    } catch {
      return fallback;
    }
  }

  saveProgress() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.progress));
    } catch {
      /* storage can fail in private mode — progress is a nicety */
    }
  }

  // ------------------------------------------------------------------- setup
  loadDemo() {
    const cfg = CHAMBERS[CHAMBERS.length - 1];
    this.level = generateLevel(777, { shards: 5, hunters: 5, style: cfg.style });
    this.player = null;
    this.hunters = [];
    this.shards = this.level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.particles = makeDust(this.level);
    this.camX = this.level.size.w / 2;
    this.camY = this.level.size.h / 2;
    this.titlePingTimer = 0.2;
    this.exitOpen = false;
    this.state = 'title';
  }

  startBest() {
    if (this.state !== 'title') return;
    if (this.startWorld()) return;
    const idx = clamp((this.progress.unlocked || 1) - 1, 0, CHAMBERS.length - 1);
    this.startChamber(idx);
  }

  /** Dev/experimental: one continuous map, no chamber select. */
  startWorld(seed = 424242) {
    const level = generateWorld(seed);
    if (!level) return false;
    this.audio.unlock();
    this.worldMode = true;
    this.level = level;
    this.chamberIndex = 0;
    this.totalShards = level.shards.length;
    this.player = new Player(level.spawn.x, level.spawn.y);
    this.hunters = level.hunters.map((h) => new Hunter(h.x, h.y));
    this.skitters = (level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.echoRings = [];
    this.particles = makeDust(level, 260);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = true;
    this.echoHeard = false;
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.sector = sectorOf(this.player.x, this.player.y, level);
    this.state = 'playing';
    this.ui.showGame(0, {
      num: CHAMBERS[this.sector].num,
      title: CHAMBERS[this.sector].title,
      shards: this.totalShards,
      intro: this.progress.worldCleared ? '' : '敲一下。墙会回答——远的碎片也会，只是晚一点。',
    });
    return true;
  }

  startChamber(index) {
    this.audio.unlock();
    this.chamberIndex = clamp(index, 0, CHAMBERS.length - 1);
    const cfg = CHAMBERS[this.chamberIndex];
    this.level = generateLevel(cfg.seed, {
      shards: cfg.shards,
      hunters: cfg.hunters,
      skitters: cfg.skitters || 0,
      style: cfg.style,
    }) || generateLevel(cfg.seed, { shards: cfg.shards, hunters: cfg.hunters, style: 'halls' });
    this.player = new Player(this.level.spawn.x, this.level.spawn.y);
    this.hunters = this.level.hunters.map((h) => new Hunter(h.x, h.y));
    this.skitters = (this.level.skitters || []).map((s) => new Skitter(s.x, s.y));
    this.shards = this.level.shards.map((s) => ({ ...s }));
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.particles = makeDust(this.level);
    this.camX = this.player.x;
    this.camY = this.player.y;
    this.charges = START_CHARGES;
    this.chargeTimer = 0;
    this.listenT = 0;
    this.pingsUsed = 0;
    this.levelTime = 0;
    this.collected = 0;
    this.exitOpen = false;
    this.echoRequired = false;
    this.echoHeard = false;
    this.echoRings = [];
    this.humT = 2.6;
    this.danger = 0;
    this.shake = 0;
    this.flash = 0;
    this.deathT = 0;
    this.denyCooldown = 0;
    this.echoRequired = !!cfg.echoGate;
    this.state = 'playing';
    this.progress.last = this.chamberIndex;
    this.saveProgress();
    this.ui.showGame(this.chamberIndex, cfg);
  }

  restart() {
    if (this.state === 'playing' || this.state === 'dead' || this.state === 'paused') {
      this.startChamber(this.chamberIndex);
    }
  }

  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    this.ui.showPause();
    if (this.audio.ctx) this.audio.ctx.suspend();
  }

  resume() {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    this.ui.hideScreens();
    if (this.audio.ctx) this.audio.ctx.resume();
  }

  quitToTitle() {
    this.ui.hideScreens();
    this.loadDemo();
    this.ui.showTitle(this.progress);
  }

  next() {
    if (this.chamberIndex + 1 < CHAMBERS.length) {
      this.startChamber(this.chamberIndex + 1);
    } else {
      this.victory();
    }
  }

  victory() {
    this.state = 'victory';
    this.ui.dismiss();
    this.ui.showVictory(this.progress);
  }

  // ------------------------------------------------------------------- loop
  frame = (ts) => {
    requestAnimationFrame(this.frame);
    if (!this.last) this.last = ts;
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    if (!Number.isFinite(dt)) dt = 0;
    dt = Math.min(dt, 0.05);

    if (!this.frozen) {
      if (this.state !== 'paused') this.now += dt;
      this.handleGlobalKeys();

      if (this.state === 'playing') this.update(dt);
      else if (this.state === 'title') this.updateTitle(dt);
      else if (this.state === 'dead') this.updateDead(dt);
      else if (this.state === 'complete' || this.state === 'victory') this.updateIdle(dt);
      else if (this.state === 'paused') this.updateIdle(0);
    }

    this.render();
    this.ui.tick(dt);
    this.input.endFrame();
  };

  handleGlobalKeys() {
    if (this.input.consume('KeyM')) {
      const muted = this.audio.toggleMute();
      this.ui.toast(muted ? '静音' : '声音开启');
    }
    if (this.state === 'playing' && this.input.consume('Escape')) this.pause();
    else if (this.state === 'paused' && this.input.consume('Escape')) this.resume();
    else if (this.state === 'dead' && this.input.consume('KeyR')) this.restart();
    else if (this.state === 'playing' && this.input.consume('KeyR')) this.restart();
    else if (this.state === 'complete' && (this.input.consume('Enter') || this.input.consume('Space'))) {
      this.next();
    }
  }

  updateTitle(dt) {
    this.titlePingTimer -= dt;
    if (this.titlePingTimer <= 0) {
      this.titlePingTimer = 2.4 + Math.random() * 1.6;
      const rooms = this.level.rooms;
      const r = rooms[Math.floor(Math.random() * rooms.length)];
      this.pings.push({
        x: (r.x + r.w / 2) * TILE,
        y: (r.y + r.h / 2) * TILE,
        t0: this.now,
        speed: PING_SPEED,
        life: PING_LIFE,
        heard: new Set(),
      });
      this.spawnRays((r.x + r.w / 2) * TILE, (r.y + r.h / 2) * TILE);
    }
    this.pings = this.pings.filter((p) => this.now - p.t0 < p.life + 0.15);
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 20);
    this.danger = 0;
  }

  updateDead(dt) {
    this.deathT += dt;
    this.shake = Math.max(0, this.shake - dt * 26);
    this.updateRays(dt);
    this.updateParticles(dt);
    this.pings = this.pings.filter((p) => this.now - p.t0 < p.life + 0.2);
    if (this.deathT > 0.75) this.ui.showDead();
  }

  updateIdle(dt) {
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 30);
  }

  update(dt) {
    const p = this.player;
    const L = this.level;
    this.levelTime += dt;

    // Holding Space = creep silently. But the directional sense only comes
    // once you have actually stopped: sound is read in stillness.
    const creeping = this.input.down('Space');
    const run = (this.input.down('ShiftLeft') || this.input.down('ShiftRight')) && !creeping;
    const move = this.input.moveVector();

    const motion = p.update(dt, move, { run, listen: creeping });
    const resolved = this.resolve(p, motion.x, motion.y);
    p.x = resolved.x;
    p.y = resolved.y;
    const k = Math.min(1, dt * 7);
    this.camX += (p.x - this.camX) * k;
    this.camY += (p.y - this.camY) * k;

    if (p.moving) this.listenT = 0;
    else this.listenT = Math.min(1, this.listenT + dt);
    const listen = this.debugListen === true || (creeping && this.listenT > 0.26);
    this.listen = listen;

    // footsteps
    if (p.moving) {
      const threshold = run ? 44 : creeping ? 70 : 58;
      if (p.stepPhase > threshold) {
        p.stepPhase = 0;
        this.audio.footstep(0, run ? 1.4 : 1);
        const noiseRadius = creeping ? 90 : run ? 340 : 215;
        for (const h of this.hunters) {
          if (dist(p.x, p.y, h.x, h.y) < noiseRadius) this.alertHunter(h, p.x, p.y, 0.18);
        }
        for (const sk of this.skitters) {
          if (dist(p.x, p.y, sk.x, sk.y) < noiseRadius * 0.85) sk.hear(p.x, p.y, 'step', 1.25);
        }
      }
    }

    // pinging
    if ((this.input.consume('Mouse0') || this.input.consume('KeyJ')) && this.charges > 0) {
      this.firePing();
    }

    // charge regen
    if (this.charges < PING_MAX) {
      this.chargeTimer -= dt;
      if (this.chargeTimer <= 0) {
        this.charges++;
        this.chargeTimer = this.charges < PING_MAX ? PING_REGEN : 0;
        this.audio.tone({ freq: 1200, type: 'sine', dur: 0.1, gain: 0.02, send: 0.2 });
      }
    }

    // pings: expand, alert hunters as the shell reaches them
    for (const ping of this.pings) {
      const age = this.now - ping.t0;
      if (age < 0 || age > ping.life) continue;
      const R = age * ping.speed;
      for (const h of this.hunters) {
        if (ping.heard.has(h.id)) continue;
        const d = dist(ping.x, ping.y, h.x, h.y);
        if (Math.abs(d - R) < 44) {
          ping.heard.add(h.id);
          this.alertHunter(h, ping.x, ping.y, 0.08);
        }
      }
      if (!ping.mimicsHeard) {
        ping.mimicsHeard = true;
        for (const sk of this.skitters) {
          if (dist(ping.x, ping.y, sk.x, sk.y) < 600) sk.hear(ping.x, ping.y, 'ping', 1.05);
        }
      }
    }
    this.pings = this.pings.filter((ping) => this.now - ping.t0 < ping.life + 0.2);

    // shards
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const sh = this.shards[i];
      if (dist(p.x, p.y, sh.x, sh.y) < 22) {
        this.shards.splice(i, 1);
        this.collected++;
        this.audio.shard();
        this.flash = 1;
        this.shake = Math.max(this.shake, 2.5);
        for (const h of this.hunters) {
          if (dist(sh.x, sh.y, h.x, h.y) < 330) this.alertHunter(h, sh.x, sh.y, 0.2);
        }
        for (const sk of this.skitters) {
          if (dist(sh.x, sh.y, sk.x, sk.y) < 380) sk.hear(sh.x, sh.y, 'shard', 1.2);
        }
        if (this.shards.length === 0) this.tryOpenExit(true);
      }
    }

    // exit
    if (this.exitOpen && dist(p.x, p.y, L.exit.x, L.exit.y) < 30) {
      this.complete();
      return;
    } else if (!this.exitOpen && dist(p.x, p.y, L.exit.x, L.exit.y) < 34) {
      if (this.denyCooldown <= 0) {
        this.audio.deny();
        if (this.shards.length > 0) this.ui.toast(`还差 ${this.shards.length} 块碎片`);
        this.denyCooldown = 2.2;
      }
    }
    this.denyCooldown -= dt;
    this.alertCd -= dt;

    // skitters: deaf, fast, silent until they are close. No sound can warn
    // you early, so contact is the only rule that matters.
    for (const sk of this.skitters) {
      sk.update(dt, this);
      if (dist(p.x, p.y, sk.x, sk.y) < p.r + sk.r - 1) {
        this.die();
        return;
      }
    }

    // hunters
    let nearest = Infinity;
    for (const h of this.hunters) {
      h.update(dt, this);
      const d = dist(p.x, p.y, h.x, h.y);
      if (d < nearest) nearest = d;
      if (d < p.r + h.r - 1) {
        this.die();
        return;
      }
    }

    if (this.worldMode) {
      const sec = sectorOf(p.x, p.y, L);
      if (sec !== this.sector) {
        this.sector = sec;
        const cfg = CHAMBERS[sec];
        this.ui.setSector(cfg.num, cfg.title);
      }
    }

    this.danger = this.hunters.length
      ? clamp(1 - (nearest - 55) / 300, 0, 1)
      : 0;
    if (this.danger > 0.4) this.danger = Math.min(1, this.danger + 0.1);

    for (let i = this.echoRings.length - 1; i >= 0; i--) {
      if (this.now - this.echoRings[i].t > 1.4) this.echoRings.splice(i, 1);
    }
    if (this.echoRequired && !this.echoHeard && this.shards.length === 0) {
      this.humT -= dt;
      if (this.humT <= 0) {
        this.humT = 3.6;
        this.audio.gateHum();
        for (const sk of this.skitters) {
          if (dist(L.exit.x, L.exit.y, sk.x, sk.y) < 700) sk.hear(L.exit.x, L.exit.y, 'hum', 0.95);
        }
      }
    }

    this.audio.update(dt, { danger: this.danger });
    this.updateRays(dt);
    this.updateParticles(dt);
    this.shake = Math.max(0, this.shake - dt * 24);
    this.flash = Math.max(0, this.flash - dt * 3.4);
    this.ui.updateHUD({
      chamber: this.chamberIndex,
      shards: this.shards.length,
      total: this.totalShards || CHAMBERS[this.chamberIndex].shards,
      charges: this.charges,
      listen,
      muted: this.audio.muted,
      danger: this.danger,
    });
  }

  // Every noise source goes through here, so the "it heard that" stinger stays
  // tied to the moment a hunter actually wakes up rather than to every step.
  /** A mimic repeated something. Hunters turn toward it, the room gets a
   *  visible ring, and a sealed door that hears an answer unlocks. */
  onEcho(m, kind, src) {
    m.echoCool = 2.0;
    m.revealT = 1.8;
    const pan = clamp((m.x - this.player.x) / 480, -1, 1) * 0.9;
    this.audio.echo(pan, kind);
    this.echoRings.push({ x: m.x, y: m.y, t: this.now, kind });
    for (const h of this.hunters) {
      if (dist(m.x, m.y, h.x, h.y) < 520) this.alertHunter(h, m.x, m.y, 0.15);
    }
    const byPlayer = kind === 'ping' || kind === 'step' || kind === 'shard';
    if (this.echoRequired && !this.echoHeard && byPlayer
      && dist(m.x, m.y, this.level.exit.x, this.level.exit.y) < 620) {
      this.echoHeard = true;
      this.tryOpenExit(false);
    }
  }

  /** The exit stays shut until the door has heard a doubled sound, not just
   *  the shards. No text explains this: the door hums, something answers. */
  tryOpenExit(withFanfare = false) {
    if (this.exitOpen) return false;
    if (this.shards.length > 0) return false;
    if (this.echoRequired && !this.echoHeard) return false;
    this.exitOpen = true;
    this.audio.gateOpen();
    this.shake = Math.max(this.shake, 6);
    if (withFanfare) this.ui.toast('出口已开启');
    return true;
  }

  alertHunter(h, x, y, delay) {
    const tracking = h.state === 'investigate';
    h.hear(x, y, delay);
    if (tracking || this.alertCd > 0) return;
    this.alertCd = 0.75;
    const pan = clamp((h.x - this.player.x) / 420, -1, 1) * 0.8;
    this.audio.alert(pan);
  }

  resolve(entity, dx, dy) {
    const L = this.level;
    return moveCircle(L.grid, L.w, L.h, L.tile, entity.x, entity.y, entity.r, dx, dy);
  }

  /** Spawn a fan of sonar rays that bounce off walls and leave light trails. */
  spawnRays(x, y) {
    for (let i = 0; i < RAY_COUNT; i++) {
      const a = (i / RAY_COUNT) * Math.PI * 2 + Math.random() * 0.035;
      this.rays.push({
        x,
        y,
        dx: Math.cos(a),
        dy: Math.sin(a),
        age: 0,
        life: RAY_LIFE * (0.85 + Math.random() * 0.25),
        bounce: 0,
        pts: [{ x, y }],
      });
    }
    while (this.rays.length > RAY_COUNT * 4) this.rays.shift();
  }

  /** Advance every ray, reflecting off walls and pruning dead trails. */
  updateRays(dt) {
    const L = this.level;
    if (!L) return;
    const alive = [];
    for (let i = 0; i < this.rays.length; i++) {
      const r = this.rays[i];
      r.age += dt;
      if (r.age > r.life + 1.5) continue;
      if (r.age <= r.life) {
        let move = RAY_SPEED * dt;
        while (move > 0.001) {
          const d = Math.min(6, move);
          move -= d;
          const nx = r.x + r.dx * d;
          const ny = r.y + r.dy * d;
          const hitX = isSolid(L.grid, L.w, L.h, Math.floor(nx / TILE), Math.floor(r.y / TILE));
          const hitY = isSolid(L.grid, L.w, L.h, Math.floor(r.x / TILE), Math.floor(ny / TILE));
          if (hitX) r.dx *= -1;
          if (hitY) r.dy *= -1;
          if (hitX || hitY) {
            r.bounce++;
            this.contacts.push({ x: r.x, y: r.y, t: this.now });
          }
          r.x = hitX ? r.x : nx;
          r.y = hitY ? r.y : ny;
          const last = r.pts[r.pts.length - 1];
          if (Math.abs(r.x - last.x) + Math.abs(r.y - last.y) >= 5) {
            r.pts.push({ x: r.x, y: r.y });
            if (r.pts.length > 14) r.pts.shift();
          }
          if (r.bounce >= 3) {
            r.age = Math.max(r.age, r.life);
            break;
          }
        }
      }
      alive.push(r);
    }
    this.rays = alive;
    if (this.contacts.length > 40) {
      let cut = 0;
      while (cut < this.contacts.length && this.now - this.contacts[cut].t > 1.9) cut++;
      if (cut) this.contacts.splice(0, cut);
      if (this.contacts.length > 600) this.contacts.splice(0, this.contacts.length - 600);
    }
  }

  firePing() {
    if (this.charges < 1) {
      this.audio.deny();
      return;
    }
    this.charges--;
    if (this.chargeTimer <= 0) this.chargeTimer = PING_REGEN;
    const p = this.player;
    this.pings.push({
      x: p.x,
      y: p.y,
      t0: this.now,
      speed: PING_SPEED,
      life: PING_LIFE,
      heard: new Set(),
    });
    this.pingsUsed++;
    this.spawnRays(p.x, p.y);
    this.audio.ping();
    this.echoShards(p.x, p.y);
    this.shake = Math.max(this.shake, 2.4);
    this.flash = 0.85;
    if (!this.pingHintShown) {
      this.pingHintShown = true;
      this.ui.toast('声呐也暴露了你');
    }
    // immediate ripple on the hunters' "attention" for feedback
    for (const h of this.hunters) {
      if (dist(p.x, p.y, h.x, h.y) < WAVE_LISTEN * 0.15) h.hear(p.x, p.y, 0.3);
    }
  }

  /** The shards are not silent. A pulse reaching them is answered by a bell
   *  whose delay is its distance and whose pan is its bearing — navigation by
   *  ear, never by pointer. */
  echoShards(px, py) {
    const reached = [];
    for (const sh of this.shards) {
      const d = dist(px, py, sh.x, sh.y);
      if (d > SHARD_ECHO_RANGE) continue;
      const delay = d / SHARD_ECHO_SPEED;
      const gain = 0.05 * (1 - d / SHARD_ECHO_RANGE) ** 1.4 + 0.006;
      const pan = clamp((sh.x - px) / 420, -1, 1);
      this.audio.shardEcho(pan, gain, delay);
      reached.push({ id: sh.id, d: Math.round(d), delay: +delay.toFixed(3) });
    }
    reached.sort((a, b) => a.d - b.d);
    this.lastShardEchoes = reached.slice(0, 4);
  }

  die() {
    if (this.state !== 'playing') return;
    if (this.debugInvincible) return;
    this.state = 'dead';
    this.deathT = 0;
    this.shake = 18;
    this.flash = 0;
    this.pings = [];
    this.rays = [];
    this.contacts = [];
    this.audio.death();
    this.ui.dismiss();
    this.ui.hideHUD();
  }

  complete() {
    if (this.state !== 'playing') return;
    if (this.worldMode) {
      const time = Math.max(0, this.levelTime);
      const prev = this.progress.worldBest;
      const isRecord = !prev || time < prev.time;
      if (isRecord) this.progress.worldBest = { time, pings: this.pingsUsed };
      this.progress.worldCleared = true;
      this.saveProgress();
      this.state = 'victory';
      this.audio.clear();
      this.ui.dismiss();
      this.ui.showWorldVictory({
        time,
        pings: this.pingsUsed,
        best: this.progress.worldBest,
        isRecord,
        shards: this.collected,
      });
      return;
    }
    this.state = 'complete';
    this.audio.clear();
    const cleared = new Set(this.progress.cleared);
    cleared.add(this.chamberIndex);
    this.progress.cleared = [...cleared];
    this.progress.unlocked = Math.max(this.progress.unlocked, this.chamberIndex + 2);
    this.progress.last = this.chamberIndex;
    const prev = this.progress.best[this.chamberIndex];
    const time = Math.max(0, this.levelTime);
    const isRecord =
      !prev || time < prev.time || (time === prev.time && this.pingsUsed < prev.pings);
    if (isRecord) {
      this.progress.best[this.chamberIndex] = { time, pings: this.pingsUsed };
    }
    this.saveProgress();
    this.ui.dismiss();
    this.ui.showClear({
      chamber: this.chamberIndex,
      time,
      pings: this.pingsUsed,
      best: this.progress.best[this.chamberIndex],
      isRecord,
      last: this.chamberIndex === CHAMBERS.length - 1,
    });
  }

  updateParticles(dt) {
    if (!this.level) return;
    const W = this.level.size.w;
    const H = this.level.size.h;
    for (const p of this.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < 0) p.x += W;
      if (p.x > W) p.x -= W;
      if (p.y < 0) p.y += H;
      if (p.y > H) p.y -= H;
    }
  }

  render() {
    this.renderer.draw(this);
  }

  // Debug hooks used by the headless screenshot script.
  debugPing() {
    if (this.state === 'playing') this.firePing();
  }

  // Deterministic capture: step the world forward without relying on rAF,
  // then leave one ping mid-flight so the sonar shell is visible.
  debugSimulate(seconds, opts = {}) {
    const dt = 1 / 60;
    const steps = Math.max(1, Math.round(seconds / dt));
    let next = opts.every || 0;
    for (let i = 0; i < steps; i++) {
      if (next && this.now >= next) {
        next += opts.every;
        this.pings.push({
          x: this.player.x,
          y: this.player.y,
          t0: this.now,
          speed: PING_SPEED,
          life: PING_LIFE,
          heard: new Set(),
        });
        this.spawnRays(this.player.x, this.player.y);
      }
      this.now += dt;
      this.update(dt);
    }
    if (opts.ping && this.player) {
      const wave = opts.wave ?? 0.45;
      this.pings.push({
        x: this.player.x,
        y: this.player.y,
        t0: this.now - wave,
        speed: PING_SPEED,
        life: PING_LIFE,
        heard: new Set(),
      });
      this.spawnRays(this.player.x, this.player.y);
      if (wave > 0) this.updateRays(wave);
    }
    this.frozen = true;
  }
}

// ---- src/main.js ----

// Surface any runtime error instead of failing to a black screen.
window.addEventListener('error', (e) => {
  document.title = `ERR ${e.message}`;
  const pre = document.createElement('pre');
  pre.id = 'err';
  pre.style.cssText =
    'position:fixed;z-index:99;inset:0 0 auto 0;margin:0;padding:12px;color:#ff8a8a;' +
    'background:#120404;font:12px/1.5 monospace;white-space:pre-wrap';
  pre.textContent = `${e.message}\n${e.filename}:${e.lineno}:${e.colno}`;
  document.body.appendChild(pre);
});

const params = new URLSearchParams(location.search);
if (params.has('static')) document.documentElement.classList.add('no-anim');

const canvas = document.getElementById('game');
const game = new Game(canvas, document.getElementById('ui'));
window.__hush = game;

// Debug / screenshot helpers. None of this is reachable from the UI.
const chamber = params.get('c');
if (chamber !== null) {
  const idx = Number(chamber);
  if (Number.isFinite(idx)) {
    // Let the first frame settle, then jump straight into a chamber.
    setTimeout(() => game.startChamber(Math.max(0, Math.min(7, idx))), 60);
  }
}
const sim = params.get('sim');
if (sim !== null) {
  setTimeout(() => {
    game.debugInvincible = true;
    game.debugSimulate(Number(sim) || 2, {
      wave: Number(params.get('wave') ?? 0.45),
      every: Number(params.get('every') || 0),
      ping: params.has('ping'),
    });
  }, 500);
} else if (params.has('ping')) {
  setInterval(() => game.debugPing(), 700);
}
if (params.has('listen')) {
  game.debugListen = true;
}
const freeze = params.get('freeze');
if (freeze !== null) {
  setTimeout(
    () => {
      game.frozen = true;
    },
    Math.max(0, Number(freeze) || 0),
  );
}

// Experimental: walk the single continuous map.
if (params.has('world')) {
  setTimeout(() => {
    game.startWorld(Number(params.get('world')) || 424242);
  }, 250);
}

// Force one of the end screens for visual checks.
const doc = params.get('doc');
if (doc) {
  setTimeout(() => {
    if (doc === 'dead') {
      game.die();
      game.ui.showDead();
    } else if (doc === 'clear') {
      game.complete();
    } else if (doc === 'victory') {
      game.chamberIndex = 7;
      game.victory();
    } else if (doc === 'pause') {
      game.pause();
    } else if (doc === 'worldwin') {
      game.startWorld();
      game.shards = [];
      game.collected = game.totalShards;
      game.echoHeard = true;
      game.exitOpen = true;
      game.levelTime = 421;
      game.pingsUsed = 37;
      game.complete();
    } else if (doc === 'echo') {
      game.startChamber(5);
      const m = game.skitters[0];
      if (m) {
        game.player.x = m.x + 120;
        game.player.y = m.y;
        game.charges = 3;
        game.firePing();
        game.debugSimulate(1.35, {});
      }
    }
  }, 900);
}
