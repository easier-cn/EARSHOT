<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070a" />
    <meta name="description" content="EARSHOT — 一款用声呐当眼睛的黑暗潜行游戏。每一次脉冲照亮房间，也把猎手引向你。" />
    <title>EARSHOT — 黑暗在听</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304070a'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%237fe3d4'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%237fe3d4' stroke-opacity='.45'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="EARSHOT"></canvas>
    <div id="ui"></div>
    <script type="module" src="src/main.js?v=0.8.21"></script>
    <script>
      // If a cached copy of this page ever runs without the game booting, fetch
      // a fresh document once instead of showing a black screen forever.
      if (!sessionStorage.getItem('hushReload')) {
        setTimeout(function () {
          if (!window.__hush) {
            sessionStorage.setItem('hushReload', '1');
            location.replace(location.pathname + '?fresh=' + Date.now());
          }
        }, 3200);
      }
    </script>
  </body>
</html>
